<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Растения против зомби 3 · 5 уровней</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a2a0a;
    color: #fff;
    user-select: none;
    touch-action: none;
  }

  @media (orientation: portrait) {
    body::before {
      content: '↻ Поверни телефон горизонтально';
      position: fixed;
      inset: 0;
      background: #1a2a0a;
      color: #f7c948;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      z-index: 99999;
      text-align: center;
      padding: 20px;
    }
  }

  /* ================== ЭКРАН ВЫБОРА УРОВНЯ ================== */
  #levelScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #2a4a0a 0%, #0a1a05 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 5000;
  }
  #levelScreen.hidden { display: none; }

  #levelScreen h1 {
    font-size: 30px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #6ee37c;
    text-shadow: 0 0 24px rgba(110,227,124,0.6);
    margin-bottom: 8px;
  }
  #levelScreen .subtitle {
    font-size: 13px;
    letter-spacing: 2px;
    color: #a0a0c0;
    margin-bottom: 26px;
  }

  .total-points {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 26px;
    background: linear-gradient(135deg, #f7c948, #b8924a);
    border: 3px solid #6a4a0a;
    border-radius: 40px;
    color: #1a0a08;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 26px;
    box-shadow: 0 6px 0 #4a3a0a, 0 0 30px rgba(247,201,72,0.4);
  }
  .total-points .icon { font-size: 22px; }
  .total-points .unlock-hint {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.7;
    display: block;
    margin-top: 2px;
  }

  .levels-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }

  .level-card {
    width: 150px;
    height: 190px;
    background: linear-gradient(180deg, #2a4a0a 0%, #1a2a08 100%);
    border: 3px solid #4a8a2a;
    border-radius: 16px;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 6px 0 #1a3a08;
    position: relative;
  }
  .level-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #1a3a08, 0 0 30px rgba(110,227,124,0.4);
  }
  .level-card:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a3a08; }

  .level-card.locked {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(0.7);
  }
  .level-card.locked:hover { transform: none; box-shadow: 0 6px 0 #1a3a08; }

  .level-card .level-num {
    font-size: 40px;
    font-weight: 900;
    color: #f7c948;
    text-shadow: 0 0 16px rgba(247,201,72,0.5);
    line-height: 1;
  }
  .level-card .level-name {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #6ee37c;
    text-align: center;
    line-height: 1.2;
  }
  .level-card .level-info {
    font-size: 10px;
    color: #a0a0c0;
    text-align: center;
    line-height: 1.4;
  }
  .level-card .level-status {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 10px;
  }
  .level-card .level-status.passed {
    background: rgba(110,227,124,0.2);
    color: #6ee37c;
    border: 1px solid #6ee37c;
  }
  .level-card .level-status.new {
    background: rgba(247,201,72,0.2);
    color: #f7c948;
    border: 1px solid #f7c948;
  }
  .level-card .level-status.locked-tag {
    background: rgba(255,255,255,0.1);
    color: #808098;
    border: 1px solid #4a4a5a;
  }

  /* Замок */
  .level-card.locked::after {
    content: '🔒';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    opacity: 0.8;
  }

  /* Кнопка сброса */
  #resetBtn {
    margin-top: 26px;
    padding: 10px 24px;
    background: transparent;
    border: 2px solid #4a4a5a;
    border-radius: 30px;
    color: #808098;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  #resetBtn:hover { border-color: #ff5c5c; color: #ff5c5c; }

  /* ================== ИГРОВОЙ ЭКРАН ================== */
  #game {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
  }
  #game.show { display: flex; }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 8px;
    background: linear-gradient(180deg, #2a1a08 0%, #1a1008 100%);
    border-bottom: 2px solid #0a0505;
    font-size: 11px;
    z-index: 50;
    flex-wrap: nowrap;
    gap: 5px;
  }
  .hud .stat {
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.4);
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid #3a2a10;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .hud .stat .icon { font-size: 13px; }
  .hud .sun-count { color: #f7c948; }
  .hud .wave-info { color: #ff8a8a; }
  .hud .lawn-info { color: #6ee37c; }
  .hud .points-info { color: #a78bfa; }

  /* Кнопка назад */
  .back-btn {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    padding: 4px 14px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #3a2a10;
    border-radius: 20px;
    color: #a0a0c0;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .back-btn:hover { color: #fff; border-color: #6ee37c; }

  /* Панель семян */
  .seeds {
    display: flex; gap: 5px;
    padding: 5px 8px;
    background: linear-gradient(180deg, #1a1008 0%, #0a0805 100%);
    overflow-x: auto;
    border-bottom: 2px solid #0a0505;
    scrollbar-width: none;
    flex-shrink: 0;
    min-height: 86px;
  }
  .seeds::-webkit-scrollbar { display: none; }

  .seed {
    flex-shrink: 0;
    width: 60px;
    height: 76px;
    background: linear-gradient(180deg, #f7c948 0%, #b8924a 100%);
    border: 3px solid #6a4a0a;
    border-radius: 10px;
    padding: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    box-shadow: 0 4px 0 #4a3a0a;
  }
  .seed.selected {
    border-color: #6ee37c;
    box-shadow: 0 0 20px rgba(110, 227, 124, 0.6), 0 4px 0 #4a3a0a;
    transform: translateY(-2px);
  }
  .seed.disabled { opacity: 0.35; cursor: not-allowed; }
  .seed .seed-emoji { font-size: 24px; line-height: 1; }
  .seed .seed-name {
    font-size: 6.5px;
    color: #1a0a08;
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .seed .seed-cost {
    font-size: 10px;
    font-weight: 900;
    color: #1a0a08;
    background: rgba(255,255,255,0.4);
    padding: 1px 5px;
    border-radius: 8px;
  }
  .seed .cooldown-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    border-radius: 8px;
    pointer-events: none;
    display: none;
  }
  .seed .cooldown-overlay.show { display: block; }

  /* Разделитель в панели семян между обычными и гибридами */
  .seeds .divider {
    flex-shrink: 0;
    width: 2px;
    background: #4a8a2a;
    margin: 4px 4px;
    border-radius: 2px;
  }

  /* Поле */
  .field-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #4a2a10 0%, #2a1a08 100%);
  }
  #field { position: absolute; inset: 0; }

  .grid-cell {
    position: absolute;
    border: 1px dashed rgba(255,255,255,0.08);
    box-sizing: border-box;
    transition: background 0.15s;
  }
  .grid-cell.merge-hint {
    background: rgba(167, 139, 250, 0.3) !important;
    border-color: rgba(167, 139, 250, 0.8);
    animation: mergePulse 1s ease-in-out infinite;
  }
  @keyframes mergePulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .plant {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    line-height: 1;
    z-index: 5;
    transition: transform 0.15s;
    animation: plantPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 50%;
  }
  @keyframes plantPop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .plant.hybrid {
    filter: drop-shadow(0 0 12px #a78bfa);
  }
  .plant.shooting { animation: plantShoot 0.2s ease; }
  @keyframes plantShoot {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .plant.merge-selected {
    filter: drop-shadow(0 0 15px #6ee37c);
    transform: scale(1.1);
  }

  .bullet {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, #b6ff6e, #4a8a2a);
    border-radius: 50%;
    box-shadow: 0 0 10px #6ee37c;
    z-index: 3;
    pointer-events: none;
  }

  .zombie {
    position: absolute;
    font-size: 40px;
    line-height: 1;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zombie.hit { filter: brightness(2.5) saturate(0); }
  .zombie.dying { animation: zombieDie 0.6s ease-out forwards; }
  @keyframes zombieDie {
    0% { transform: rotate(0deg); opacity: 1; }
    100% { transform: rotate(90deg) translateY(30px); opacity: 0; }
  }
  .zombie-hp {
    position: absolute;
    height: 4px;
    background: #ff4040;
    border-radius: 2px;
    z-index: 6;
    pointer-events: none;
    transition: width 0.15s;
  }
  .zombie-hp-bg {
    position: absolute;
    height: 4px;
    background: rgba(0,0,0,0.5);
    border-radius: 2px;
    z-index: 5;
    pointer-events: none;
  }

  .sun {
    position: absolute;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle, #ffe066 0%, #f7c948 50%, #b8924a 100%);
    border-radius: 50%;
    box-shadow: 0 0 20px #f7c948, 0 0 40px rgba(247,201,72,0.5);
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .sun.falling { animation: sunFall 10s linear forwards; }
  @keyframes sunFall {
    0% { top: -50px; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { top: 100%; opacity: 0.5; }
  }
  .sun.collected { animation: sunCollect 0.4s ease-out forwards; }
  @keyframes sunCollect {
    to { transform: scale(2) translateY(-100px); opacity: 0; }
  }

  .mower {
    position: absolute;
    left: 2px;
    width: 50px;
    height: 60px;
    z-index: 7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    pointer-events: none;
    filter: drop-shadow(0 0 10px #ff5c5c);
    transition: transform 1.5s linear;
  }
  .mower.working { transform: translateX(100vw); }

  .explosion {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffb800 30%, #ff4040 60%, transparent 80%);
    z-index: 20;
    pointer-events: none;
    animation: explode 0.6s ease-out forwards;
  }
  @keyframes explode {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(20, 10, 5, 0.95);
    border: 3px solid #f7c948;
    border-radius: 14px;
    padding: 18px 32px;
    font-size: 18px;
    font-weight: 800;
    color: #f7c948;
    text-align: center;
    letter-spacing: 2px;
    z-index: 200;
    box-shadow: 0 0 40px rgba(247,201,72,0.5);
    pointer-events: none;
    max-width: 80vw;
  }
  .toast.show { animation: toastPop 2s ease-out forwards; }
  @keyframes toastPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 300;
    padding: 20px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 28px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: #6ee37c;
    text-shadow: 0 0 20px rgba(110,227,124,0.6);
  }
  .overlay h1.lose {
    color: #ff5c5c;
    text-shadow: 0 0 20px rgba(255,92,92,0.6);
  }
  .overlay p {
    font-size: 14px;
    color: #c8c8dc;
    line-height: 1.7;
    max-width: 440px;
    margin-bottom: 20px;
  }
  .overlay .reward {
    font-size: 20px;
    color: #f7c948;
    font-weight: 900;
    letter-spacing: 2px;
    margin: 10px 0 20px;
    text-shadow: 0 0 20px rgba(247,201,72,0.6);
  }
  .overlay button {
    padding: 12px 36px;
    background: linear-gradient(135deg, #6ee37c, #4a8a2a);
    border: none;
    border-radius: 40px;
    color: #0a1a0a;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 5px 0 #2a5a1a;
    transition: all 0.15s;
    margin: 4px;
  }
  .overlay button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #2a5a1a;
  }
  .overlay button.alt {
    background: transparent;
    border: 2px solid #6ee37c;
    color: #6ee37c;
    box-shadow: none;
  }

  .shovel-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 54px;
    height: 54px;
    background: linear-gradient(180deg, #b8924a, #6a4a0a);
    border: 3px solid #4a3a0a;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    z-index: 15;
    box-shadow: 0 4px 0 #2a1a0a;
    transition: all 0.15s;
  }
  .shovel-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a1a0a; }
  .shovel-btn.selected {
    border-color: #ff5c5c;
    box-shadow: 0 0 20px rgba(255,92,92,0.6), 0 4px 0 #2a1a0a;
  }

  /* Индикатор режима слияния */
  .merge-indicator {
    position: absolute;
    top: 8px;
    right: 10px;
    padding: 6px 14px;
    background: linear-gradient(135deg, #a78bfa, #6e4aff);
    border: 2px solid #fff;
    border-radius: 20px;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 20;
    box-shadow: 0 0 20px rgba(167, 139, 250, 0.7);
    display: none;
  }
  .merge-indicator.show { display: block; animation: mergePulse 1.5s ease-in-out infinite; }

  @media (max-width: 600px) {
    .seed { width: 52px; height: 66px; padding: 2px; }
    .seed .seed-emoji { font-size: 20px; }
    .seed .seed-name { font-size: 5.5px; }
    .seed .seed-cost { font-size: 9px; padding: 0 4px; }
    .plant { font-size: 30px; }
    .zombie { font-size: 32px; }
    .hud { font-size: 9px; padding: 3px 5px; }
    .hud .stat { padding: 2px 6px; }
  }
</style>
</head>
<body>

  <!-- ================== ЭКРАН ВЫБОРА УРОВНЯ ================== -->
  <div id="levelScreen">
    <h1>Растения против зомби 3</h1>
    <div class="subtitle">5 уровней · ДЕНЬ</div>

    <div class="total-points">
      <span class="icon">🏆</span>
      <span id="totalPointsDisplay">0</span> очков
      <span class="unlock-hint" id="unlockHint"></span>
    </div>

    <div class="levels-row" id="levelsRow"></div>

    <button id="resetBtn">Сбросить прогресс</button>
  </div>

  <!-- ================== ИГРОВОЙ ЭКРАН ================== -->
  <div id="game">
    <div class="hud">
      <div class="stat sun-count"><span class="icon">☀️</span><span id="sunCount">50</span></div>
      <div class="stat lawn-info"><span class="icon">🚜</span><span id="mowersLeft">4</span></div>
      <div class="stat points-info"><span class="icon">⭐</span><span id="pointsCurrent">0</span></div>
      <div class="stat wave-info"><span class="icon">🌊</span><span id="waveNum">1 / 1</span></div>
    </div>

    <button class="back-btn" id="backBtn">← В меню</button>

    <div class="merge-indicator" id="mergeIndicator">✨ РЕЖИМ СЛИЯНИЯ ✨</div>

    <div class="seeds" id="seedsBar"></div>

    <div class="field-wrap">
      <div id="field"></div>
      <button class="shovel-btn" id="shovelBtn" title="Убрать растение">🔨</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Экран победы/поражения уровня -->
  <div class="overlay" id="endOverlay">
    <h1 id="endTitle">Уровень пройден</h1>
    <p id="endText"></p>
    <div class="reward" id="endReward"></div>
    <button id="nextLevelBtn">Следующий уровень</button>
    <button id="menuBtn" class="alt">В меню</button>
  </div>

  <script>
    // ================== ГЛОБАЛЬНЫЕ НАСТРОЙКИ ==================
    const STORAGE_KEY = 'pvz3_progress_v1';
    const MERGE_UNLOCK_POINTS = 10000;

    // ================== КОНФИГ УРОВНЕЙ ==================
    const LEVELS = [
      {
        id: 1,
        name: 'Лужайка',
        desc: 'Знакомство. Медленные зомби.',
        waves: 8,
        startingSun: 75,
        sunDropInterval: 10000,
        firstWaveDelay: 6000,
        waveInterval: 25000,
        mowersCount: 4,
        zombieTypes: ['normal', 'cone'],
        waveSizeMult: 1.0,
        hpMult: 1.0,
        reward: 500,
      },
      {
        id: 2,
        name: 'Огород',
        desc: 'Быстрые зомби и конусы.',
        waves: 10,
        startingSun: 75,
        sunDropInterval: 10000,
        firstWaveDelay: 6000,
        waveInterval: 25000,
        mowersCount: 4,
        zombieTypes: ['normal', 'cone', 'fast'],
        waveSizeMult: 1.1,
        hpMult: 1.1,
        reward: 1000,
      },
      {
        id: 3,
        name: 'Поле',
        desc: 'Зомби с вёдрами. Держись!',
        waves: 12,
        startingSun: 100,
        sunDropInterval: 9000,
        firstWaveDelay: 6000,
        waveInterval: 23000,
        mowersCount: 4,
        zombieTypes: ['normal', 'cone', 'fast', 'bucket'],
        waveSizeMult: 1.2,
        hpMult: 1.2,
        reward: 2000,
      },
      {
        id: 4,
        name: 'Ферма',
        desc: 'Танки и вёдра. Но чуть легче, чем кажется.',
        waves: 14,
        startingSun: 125,
        sunDropInterval: 8000,
        firstWaveDelay: 7000,
        waveInterval: 22000,

    // ================== РЕНДЕР ЭКРАНА УРОВНЕЙ ==================
    function renderLevelScreen() {
      totalPointsDisplay.textContent = progress.points;

        unlockHint.textContent = '✨ Слияние растений разблокировано!';

      }

      levelsRow.innerHTML = '';
      LEVELS.forEach((lvl, idx) => {
        const card = document.createElement('div');
        card.className = 'level-card';

        const passed = progress.completed['lvl' + lvl.id];
        // Заблокирован, если предыдущий не пройден
        const unlocked = idx === 0 || progress.completed['lvl' + LEVELS[idx - 1].id];

        if (!unlocked) card.classList.add('locked');

        let statusHtml = '';
        if (passed) {
          statusHtml = '<div class="level-status passed">✓ Пройден</div>';
        } else if (unlocked) {
          statusHtml = '<div class="level-status new">Играть</div>';
        } else {

    // ================== РАСЧЁТ ПОЛЯ ==================
    function calcField() {
      const wrap = fieldEl.parentElement;
      fieldRect.width = wrap.clientWidth;
      fieldRect.height = wrap.clientHeight;
      fieldRect.cellW = fieldRect.width / 5;
      fieldRect.cellH = fieldRect.height / 4;
    }

    function cellCenter(col, row) {
      return {
        x: fieldRect.cellW * col + fieldRect.cellW / 2,
        y: fieldRect.cellH * row + fieldRect.cellH / 2
      };
    }

    function buildGrid() {
      fieldEl.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.col = c;
          cell.dataset.row = r;
          cell.style.left = (c * fieldRect.cellW) + 'px';
          cell.style.top = (r * fieldRect.cellH) + 'px';
          cell.style.width = fieldRect.cellW + 'px';
          cell.style.height = fieldRect.cellH + 'px';
          const alt = (r + c) % 2 === 0;
          cell.style.background = alt ? 'rgba(74, 138, 42, 0.25)' : 'rgba(74, 138, 42, 0.15)';
          fieldEl.appendChild(cell);
        }
      }
    }

    // ================== ГАЗОНОКОСИЛКИ ==================
    function buildMowers() {
      state.mowers.forEach(m => m.el.remove());
      state.mowers = [];
      for (let r = 0; r < 4; r++) {
        const centerY = fieldRect.cellH * r + fieldRect.cellH / 2;
        const el = document.createElement('div');
        el.className = 'mower';
        el.textContent = '🚜';
        el.style.left = '2px';
        el.style.top = (centerY - 30) + 'px';
        fieldEl.appendChild(el);
        state.mowers.push({ row: r, el, used: false });
      }
      state.mowersLeft = 4;
      updateMowers();
    }

    function updateMowers() {
      mowersLeftEl.textContent = state.mowersLeft;
    }

    function triggerMower(row) {
      const mower = state.mowers[row];
      if (!mower || mower.used) return false;
      mower.used = true;
      state.mowersLeft--;
      updateMowers();
      mower.el.classList.add('working');
      setTimeout(() => {
        state.zombies.forEach(z => {
          if (z.row === row && !z.dead) {
            z.dead = true;
            z.el.classList.add('dying');
            setTimeout(() => {
              z.el.remove();
              if (z.hpEl) z.hpEl.remove();
              if (z.hpBgEl) z.hpBgEl.remove();
            }, 500);
          }
        });
      }, 800);
      setTimeout(() => {
        mower.el.classList.remove('working');
        mower.el.style.left = '-60px';
      }, 2000);
      showToast('Газонокосилка! 🚜');
      return true;
    }

    // ================== СЕМЕНА UI ==================

    function selectSeed(type, kind) {
      if (!state.running) return;

      // В режиме слияния — тап на семя из панели выбирает «источник»
      if (state.mergeMode) {
        if (state.mergeSourceType === type) {
          state.mergeSourceType = null;
        } else {
          state.mergeSourceType = type;
        }
        updateSeedsUI();
        return;
      }

      state.selectedSeed = state.selectedSeed === type ? null : type;
      state.shovelMode = false;
      updateSeedsUI();
      updateShovel();

    function updateSeedsUI() {
      seedsBar.querySelectorAll('.seed').forEach(c => {
        const type = c.dataset.type;
        const p = PLANT_TYPES[type] || HYBRID_TYPES[type];
        if (!p) return;
        const cdUntil = seedCooldowns[type] || 0;
        const onCd = Date.now() < cdUntil;
        c.classList.toggle('selected',
          state.selectedSeed === type || state.mergeSourceType === type);
        c.classList.toggle('disabled', state.sun < (p.cost || 0) || onCd);
        c.querySelector('.cooldown-overlay').classList.toggle('show', onCd);
      });
    }
    
    // ================== СОЛНЦЕ ==================
    function updateSun() { sunCountEl.textContent = state.sun; }
    function updatePoints() { pointsCurrentEl.textContent = state.levelPoints; }

    function spawnFallingSun() {
      if (!state.running || state.gameOver) return;
      const x = 40 + Math.random() * (fieldRect.width - 80);
      const el = document.createElement('div');
      el.className = 'sun falling';
      el.textContent = '☀️';
      el.style.left = x + 'px';
      el.style.top = '-50px';
      fieldEl.appendChild(el);
      const sun = { id: state.nextSunId++, x, el, collected: false, value: 25 };
      state.suns.push(sun);
      el.addEventListener('click', (e) => { e.stopPropagation(); collectSun(sun); });
    }

    function collectSun(sun) {
      if (sun.collected) return;
      sun.collected = true;
      state.sun += sun.value;
      updateSun();
      sun.el.classList.add('collected');
      setTimeout(() => {
        sun.el.remove();
        const i = state.suns.indexOf(sun);
        if (i >= 0) state.suns.splice(i, 1);
      }, 400);
    }

    function spawnPlantSun(plant, count) {
      count = count || 1;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (!state.running) return;
          const el = document.createElement('div');
          el.className = 'sun';
          el.textContent = '☀️';
          el.style.left = (plant.x - 22 + (i * 15)) + 'px';
          el.style.top = (plant.y + 15) + 'px';
          fieldEl.appendChild(el);
          const sun = { id: state.nextSunId++, x: plant.x, el, collected: false, value: 25 };
          state.suns.push(sun);
          el.addEventListener('click', (e) => { e.stopPropagation(); collectSun(sun); });
        }, i * 200);
      }
    }

    // ================== ПОСАДКА ==================
    function tryPlantAt(col, row) {
      const existing = state.plants.find(p => p.col === col && p.row === row);

      // Если режим слияния и есть источник — сливаем с существующим
      if (state.mergeMode && state.mergeSourceType && existing) {
        return mergePlants(state.mergeSourceType, existing);
      }

      if (existing) return false;
      const type = state.selectedSeed;
      if (!type) return false;
      const p = PLANT_TYPES[type];
      if (!p) return false;
      if (state.sun < p.cost) { showToast('Мало солнца'); return false; }
      if (Date.now() < (seedCooldowns[type] || 0)) { showToast('Перезарядка'); return false; }

      state.sun -= p.cost;
      seedCooldowns[type] = Date.now() + 3000;
      updateSun();
      updateSeedsUI();

      createPlant(type, col, row, false);
      state.selectedSeed = null;
      updateSeedsUI();
      return true;
    }

    function createPlant(type, col, row, isHybrid) {
      const def = isHybrid ? HYBRID_TYPES[type] : PLANT_TYPES[type];
      if (!def) return null;

      const center = cellCenter(col, row);
      const el = document.createElement('div');
      el.className = 'plant' + (isHybrid ? ' hybrid' : '');
      el.textContent = def.emoji;
      el.style.left = (center.x - 25) + 'px';
      el.style.top = (center.y - 25) + 'px';
      el.style.width = '50px';
      el.style.height = '50px';
      fieldEl.appendChild(el);

      const plant = {
        id: state.nextPlantId++,
        col, row, type, isHybrid,
        hp: def.hp,
        maxHp: def.hp,
        el,
        lastShot: Date.now(),
        lastSun: Date.now(),
        x: center.x,
        y: center.y,
        bomb: !!def.deathBomb ? false : !!def.bomb,
        bombTime: def.bomb && !def.deathBomb ? Date.now() + 1200 : 0,
        def
      };
      state.plants.push(plant);
      return plant;
    }

    function removePlant(plant) {
      plant.el.remove();
      const i = state.plants.indexOf(plant);
      if (i >= 0) state.plants.splice(i, 1);
    }

    // ================== СЛИЯНИЕ ==================
    function mergePlants(sourceType, targetPlant) {
      const hybrid = findHybrid(sourceType, targetPlant.type);
      if (!hybrid) {
        showToast('Эти растения не сливаются');
        return false;
      }

      // Убираем целевое растение
      const col = targetPlant.col;
      const row = targetPlant.row;
      removePlant(targetPlant);

      // Создаём гибрид
      const hybridKey = Object.keys(HYBRID_TYPES).find(k => HYBRID_TYPES[k] === hybrid);
      createPlant(hybridKey, col, row, true);

      showToast('✨ ' + hybrid.name + '!');
      state.mergeSourceType = null;
      updateSeedsUI();

      // небольшой бонус очков за открытие гибрида
      state.levelPoints += 50;
      updatePoints();
      return true;
    }

    // ================== ГИБРИДЫ В ПАНЕЛИ ==================
    // После разблокировки слияния — в панели появляются и гибриды

          <div class="cooldown-overlay"></div>
        `;
        el.addEventListener('click', () => selectSeed(key, 'plant'));
        seedsBar.appendChild(el);
      }

      // разделитель
      const div = document.createElement('div');
      div.className = 'divider';
      seedsBar.appendChild(div);

      // гибриды
      for (const key in HYBRID_TYPES) {
        const p = HYBRID_TYPES[key];
        const el = document.createElement('div');
        el.className = 'seed hybrid';
        el.dataset.type = key;
        el.dataset.kind = 'hybrid';
        el.style.background = 'linear-gradient(180deg, #a78bfa 0%, #6e4aff 100%)';
        el.innerHTML = `
          <div class="seed-emoji">${p.emoji}</div>
          <div class="seed-name">${p.name}</div>
          <div class="seed-cost">✨</div>
          <div class="cooldown-overlay"></div>
        `;
        el.addEventListener('click', () => {
          // гибрид можно посадить за 0, если слияние открыто — но его нельзя выбрать как "источник"
          if (state.mergeSourceType) return;
          state.mergeSourceType = key;
          updateSeedsUI();
        });
        seedsBar.appendChild(el);
      }
      updateSeedsUI();
    }

    // ================== ЗОМБИ ==================
    function spawnZombie(type) {
      const zt = ZOMBIE_TYPES[type];
      if (!zt) return;

      const row = Math.floor(Math.random() * 4);
      const centerY = fieldRect.cellH * row + fieldRect.cellH / 2;

      const el = document.createElement('div');
      el.className = 'zombie';
      el.textContent = zt.emoji;
      el.style.left = (fieldRect.width + 10) + 'px';
      el.style.top = (centerY - 25) + 'px';
      el.style.width = '50px';
      el.style.height = '50px';
      fieldEl.appendChild(el);

      if (zt.overlay) {
        const ov = document.createElement('div');
        ov.textContent = zt.overlay;
        ov.style.position = 'absolute';
        ov.style.top = '-8px';
        ov.style.fontSize = '20px';
        el.appendChild(ov);
      }

      const hpBg = document.createElement('div');
      hpBg.className = 'zombie-hp-bg';
      hpBg.style.width = '50px';
      hpBg.style.left = (fieldRect.width + 15) + 'px';
      hpBg.style.top = (centerY + 30) + 'px';
      fieldEl.appendChild(hpBg);

      const hpEl = document.createElement('div');
      hpEl.className = 'zombie-hp';
      hpEl.style.width = '50px';
      hpEl.style.left = (fieldRect.width + 15) + 'px';
      hpEl.style.top = (centerY + 30) + 'px';
      fieldEl.appendChild(hpEl);

      const baseSpeed = fieldRect.cellW / 4.7;
      const finalSpeed = baseSpeed * zt.speedMult;

      state.zombies.push({
        id: state.nextZombieId++,
        x: fieldRect.width + 10,
        row, type,
        hp: Math.round(zt.hp * state.level.hpMult),
        maxHp: Math.round(zt.hp * state.level.hpMult),
        speed: finalSpeed,
        damage: zt.damage,
        el, hpEl, hpBgEl: hpBg,
        eating: false, dead: false, slowedUntil: 0,
        points: zt.points
      });
    }

    function damageZombie(z, dmg, slow) {
      z.hp -= dmg;
      z.el.classList.add('hit');
      setTimeout(() => z.el.classList.remove('hit'), 100);
      if (slow) {
        z.slowedUntil = Date.now() + 3000;
        z.el.style.filter = 'hue-rotate(180deg) brightness(1.2)';
      }
      const ratio = Math.max(0, z.hp / z.maxHp);
      z.hpEl.style.width = (50 * ratio) + 'px';
      if (z.hp <= 0 && !z.dead) {
        z.dead = true;
        z.el.classList.add('dying');
        z.hpEl.remove();
        z.hpBgEl.remove();
        // начисление очков
        state.levelPoints += z.points || 10;
        state.waveZombiesKilled++;
        updatePoints();
        setTimeout(() => {
          z.el.remove();
          const i = state.zombies.indexOf(z);
          if (i >= 0) state.zombies.splice(i, 1);
        }, 600);
      }
    }

    // ================== ПУЛИ ==================
    function spawnBullet(plant, targetRow) {
      const def = plant.def;
      const row = targetRow !== undefined ? targetRow : plant.row;
      const centerY = fieldRect.cellH * row + fieldRect.cellH / 2;
      const el = document.createElement('div');
      el.className = 'bullet';
      if (def.slow) {
        el.style.background = 'radial-gradient(circle at 30% 30%, #aee4ff, #2a7ab8)';
        el.style.boxShadow = '0 0 10px #5ecbff';
      }
      el.style.left = (plant.x - 6) + 'px';
      el.style.top = (centerY - 6) + 'px';
      fieldEl.appendChild(el);
      state.bullets.push({
        id: state.nextBulletId++,
        x: plant.x, y: centerY, row,
        dmg: def.attack || 2,
        slow: !!def.slow,
        speed: def.projectileSpeed || 350,
        el
      });
    }

    // ================== ВЗРЫВ ==================
    function explodePlant(plant) {
      const el = document.createElement('div');
      el.className = 'explosion';
      el.style.left = (plant.x - 100) + 'px';
      el.style.top = (plant.y - 100) + 'px';
      fieldEl.appendChild(el);
      setTimeout(() => el.remove(), 700);

      const def = plant.def;

      // Заморозка поля (для криобомбы)
      if (def.freezeAll) {
        state.zombies.forEach(z => {
          if (!z.dead) {
            z.slowedUntil = Date.now() + 8000;
            z.el.style.filter = 'hue-rotate(180deg) brightness(1.4)';
          }
        });
      }

      // Урон
      state.zombies.forEach(z => {
        if (z.dead) return;
        const dx = Math.abs(z.x - plant.x);
        const dy = Math.abs((fieldRect.cellH * z.row + fieldRect.cellH/2) - plant.y);
        if (dx < fieldRect.cellW * 1.5 && dy < fieldRect.cellH * 1.5) {
          damageZombie(z, 100, def.freezeAll);
        }
      });
    }

    // ================== ИГРОВОЙ ЦИКЛ ==================
    function gameLoop(timestamp) {
      if (!state.running) return;
      if (!state.lastFrameTime) state.lastFrameTime = timestamp;
      const dt = Math.min(50, timestamp - state.lastFrameTime) / 1000;
      state.lastFrameTime = timestamp;
      const now = Date.now();

      // ==== РАСТЕНИЯ ====
      state.plants.forEach(p => {
        const def = p.def;
        if (!def) return;

        // бомба с таймером (не deathBomb)
        if (p.bomb && now > p.bombTime) {
          explodePlant(p);
          removePlant(p);
          return;
        }

        // солнце
        if (def.sunProduction && now - p.lastSun > def.sunProduction) {
          p.lastSun = now;
          spawnPlantSun(p, def.sunTriple ? 3 : 1);
        }

        // стрельба
        if (def.attack && now - p.lastShot > def.fireRate) {
          let hasTarget = false;
          if (def.fiveRows) {
            for (let r = 0; r < 4; r++) {
              if (state.zombies.some(z => z.row === r && z.x > p.x && !z.dead)) {
                hasTarget = true;
                spawnBullet(p, r);
              }
            }
          } else if (def.threeRows) {
            for (let dr = -1; dr <= 1; dr++) {
              const row = p.row + dr;
              if (row < 0 || row >= 4) continue;
              if (state.zombies.some(z => z.row === row && z.x > p.x && !z.dead)) {
                hasTarget = true;
                spawnBullet(p, row);
              }
            }
          } else {
            hasTarget = state.zombies.some(z => z.row === p.row && z.x > p.x && !z.dead);
            if (hasTarget) spawnBullet(p);
          }
          if (hasTarget) {
            p.lastShot = now;
            p.el.classList.add('shooting');
            setTimeout(() => p.el.classList.remove('shooting'), 200);
          }
        }
      });

      // ==== ПУЛИ ====
      state.bullets.forEach(b => {
        b.x += b.speed * dt;
        b.el.style.left = (b.x - 6) + 'px';
        for (const z of state.zombies) {
          if (z.dead || z.row !== b.row) continue;
          if (Math.abs(z.x + 25 - b.x) < 25) {
            damageZombie(z, b.dmg, b.slow);
            b.el.remove();
            const i = state.bullets.indexOf(b);
            if (i >= 0) state.bullets.splice(i, 1);
            return;
          }
        }
        if (b.x > fieldRect.width + 20) {
          b.el.remove();
          const i = state.bullets.indexOf(b);
          if (i >= 0) state.bullets.splice(i, 1);
        }
      });

      // ==== ЗОМБИ ====
      state.zombies.forEach(z => {
        if (z.dead) return;
        const slowFactor = (z.slowedUntil && Date.now() < z.slowedUntil) ? 0.4 : 1;
        const plantHere = state.plants.find(p =>
          p.row === z.row &&
          Math.abs(p.x - z.x) < fieldRect.cellW * 0.7 &&
          p.x < z.x &&
          !(p.bomb && !p.def.deathBomb) // обычная бомба не естся
        );

        if (plantHere) {
          z.eating = true;
          // урон растению
          const dmgPerSec = z.damage * 15;
          plantHere.hp -= dmgPerSec * dt;

          // ледяной орех — замедляет зомби
          if (plantHere.def && plantHere.def.eatSlow) {
            z.slowedUntil = Date.now() + 2000;
            z.el.style.filter = 'hue-rotate(180deg) brightness(1.2)';
          }

          plantHere.el.style.transform = `scale(${0.9 + 0.1 * (plantHere.hp / plantHere.maxHp)})`;

          if (plantHere.hp <= 0) {
            // если у растения deathBomb — взрывается
            if (plantHere.def && plantHere.def.deathBomb) {
              explodePlant(plantHere);
            }
            removePlant(plantHere);
            z.eating = false;
          }
        } else {
          z.eating = false;
          z.x -= z.speed * slowFactor * dt;
          z.el.style.left = (z.x - 25) + 'px';
          z.hpEl.style.left = (z.x - 25) + 'px';
          z.hpBgEl.style.left = (z.x - 25) + 'px';
        }

        // проверка на прорыв
        if (z.x < 0) {
          const mowerWorked = triggerMower(z.row);
          if (!mowerWorked) {
            endGame(false);
            return;
          }
          z.dead = true;
          z.el.remove();
          if (z.hpEl) z.hpEl.remove();
          if (z.hpBgEl) z.hpBgEl.remove();
        }
      });

      state.zombies = state.zombies.filter(z => !z.dead || z.el.parentElement);

      // ==== СОЛНЦЕ С НЕБА ====
      if (now - state.lastSunDrop > state.level.sunDropInterval) {
        state.lastSunDrop = now;
        spawnFallingSun();
      }

      // ==== ВОЛНЫ (система очков угрозы) ====
      updateWaves(now);

      requestAnimationFrame(gameLoop);
    }

    // ================== СИСТЕМА ВОЛН (как в оригинале) ==================
    function updateWaves(now) {
      const lvl = state.level;

      // Первая волна
      if (state.lastWave === 0) {
        state.lastWave = now + lvl.firstWaveDelay;
        return;
      }

      // Проверка: не пора ли запустить следующую волну
      if (now > state.lastWave) {
        // Если все зомби текущей волны мертвы — быстрее запускаем следующую
        const aliveZombies = state.zombies.filter(z => !z.dead).length;
        const waveDone = state.waveSpawned >= state.waveTarget && aliveZombies === 0;

        if (waveDone || now > state.lastWave + 5000) {
          // Если это была последняя волна — победа
          if (state.wave >= state.totalWaves) {
            if (aliveZombies === 0 && state.waveSpawned >= state.waveTarget) {
              endGame(true);
              return;
            }
            // ждём добивания
            state.lastWave = now + 500;
            return;
          }

          // Запускаем новую волну
          state.wave++;
          updateWave();
          startWave();

          // Таймер до следующей волны: 25-31 сек (как в оригинале)
          const nextDelay = 25000 + Math.random() * 6000;
          state.lastWave = now + nextDelay;
        }
      }

      // Спавн зомби внутри текущей волны
      spawnWaveZombies();
    }

    function startWave() {
      const lvl = state.level;
      const waveNum = state.wave;

      // Финальная волна — огромная
      const isFinal = waveNum === state.totalWaves;
      const isBig = waveNum % 5 === 0;

      // Целевой вес волны
      let waveWeight = 2 + waveNum * 1.8;
      if (isBig) waveWeight *= 1.8;
      if (isFinal) waveWeight *= 2.5;
      waveWeight *= lvl.waveSizeMult;

      state.waveTarget = Math.round(waveWeight);
      state.waveSpawned = 0;
      state.waveZombiesKilled = 0;

      if (isFinal) {
        showToast('🎯 ФИНАЛЬНАЯ ВОЛНА!');
      } else if (isBig) {
        showToast('🔥 Большая волна ' + waveNum + '!');
      } else {
        showToast('Волна ' + waveNum);
      }
    }

    function spawnWaveZombies() {
      if (!state.running || state.gameOver) return;
      if (state.waveSpawned >= state.waveTarget) return;

      // Ограничение: не спавним слишком много одновременно
      const aliveZombies = state.zombies.filter(z => !z.dead).length;
      const maxAlive = 8 + state.wave;
      if (aliveZombies >= maxAlive) return;

      // Интервал между зомби в волне
      const now = Date.now();
      if (state._lastZombieSpawn && now - state._lastZombieSpawn < 900) return;
      state._lastZombieSpawn = now;

      // Выбираем тип зомби
      const types = state.level.zombieTypes;
      const type = types[Math.floor(Math.random() * types.length)];
      const zt = ZOMBIE_TYPES[type];
      if (!zt) return;

      // Проверяем, не переполним ли вес волны
      if (state.waveSpawned + zt.weight > state.waveTarget + 2) return;

      spawnZombie(type);
      state.waveSpawned += zt.weight;
    }

    // ================== КЛИКИ ==================
    function handleFieldClick(e) {
      if (!state.running) return;
      const rect = fieldEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const col = Math.floor(x / fieldRect.cellW);
      const row = Math.floor(y / fieldRect.cellH);
      if (col < 0 || col >= 5 || row < 0 || row >= 4) return;

      if (state.shovelMode) {
        const p = state.plants.find(pp => pp.col === col && pp.row === row);
        if (p) { removePlant(p); showToast('Убрано'); }
        state.shovelMode = false;
        updateShovel();
        return;
      }

      // Режим слияния
      if (state.mergeMode) {
        const existing = state.plants.find(pp => pp.col === col && pp.row === row);
        if (existing && state.mergeSourceType) {
          mergePlants(state.mergeSourceType, existing);
          return;
        }
        // тап по пустой клетке в режиме слияния — ничего
        return;
      }

      if (state.selectedSeed) tryPlantAt(col, row);
    }

    function updateShovel() {
      shovelBtn.classList.toggle('selected', state.shovelMode);
    }

    function updateMergeIndicator() {
      if (progress.points >= MERGE_UNLOCK_POINTS) {
        mergeIndicator.classList.add('show');
      } else {
        mergeIndicator.classList.remove('show');
      }
    }

    // ================== ЭКРАНЫ ==================
    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.remove('show');
      void toastEl.offsetWidth;
      toastEl.classList.add('show');
    }

    function endGame(won) {
      if (state.gameOver) return;
      state.gameOver = true;
      state.running = false;

      if (won) {
        // Начисляем очки за уровень
        const reward = state.level.reward;
        const bonus = state.levelPoints;
        progress.points += reward + bonus;
        progress.completed['lvl' + state.level.id] = true;
        saveProgress(progress);

        endTitle.textContent = '🏆 Уровень пройден!';
        endTitle.classList.remove('lose');
        endText.innerHTML = `Ты отбил все ${state.totalWaves} волн!<br>Газонокосилок осталось: ${state.mowersLeft}.`;
        endReward.innerHTML = `+${reward + bonus} очков<br><span style="font-size:13px;color:#a0a0c0;">Всего: ${progress.points}</span>`;

        // Если достигли 10000 — разблокировано слияние
        if (progress.points >= MERGE_UNLOCK_POINTS) {
          endText.innerHTML += '<br><br>✨ <b>Слияние растений разблокировано!</b>';
          rebuildSeedsUIWithHybrids();
        }

        // Кнопка "Следующий уровень"
        if (state.levelIndex < LEVELS.length - 1) {
          nextLevelBtn.style.display = 'inline-block';
          nextLevelBtn.textContent = 'Следующий уровень →';
        } else {
          nextLevelBtn.style.display = 'none';
        }
      } else {
        endTitle.textContent = '💀 Зомби прорвались';
        endTitle.classList.add('lose');
        endText.innerHTML = `Ты дошёл до волны ${state.wave} из ${state.totalWaves}.<br>Очки за уровень: ${state.levelPoints}.<br>Попробуй снова!`;
        endReward.textContent = '';
        nextLevelBtn.style.display = 'none';
      }

      endOverlay.classList.add('show');
      updateMergeIndicator();
    }

    function backToMenu() {
      state.running = false;
      state.gameOver = true;
      gameEl.classList.remove('show');
      levelScreen.classList.remove('hidden');
      endOverlay.classList.remove('show');
      renderLevelScreen();
    }

    // ================== СОБЫТИЯ ==================
    fieldEl.addEventListener('click', handleFieldClick);
    fieldEl.addEventListener('contextmenu', e => e.preventDefault());

    shovelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.shovelMode = !state.shovelMode;
      state.selectedSeed = null;
      state.mergeSourceType = null;
      updateSeedsUI();
      updateShovel();
    });

    backBtn.addEventListener('click', () => {
      if (confirm('Выйти в меню? Прогресс уровня потеряется.')) {
        backToMenu();
      }
    });

    nextLevelBtn.addEventListener('click', () => {
      endOverlay.classList.remove('show');
      if (state.levelIndex < LEVELS.length - 1) {
        startLevel(state.levelIndex + 1);
      }
    });

    menuBtn.addEventListener('click', () => {
      backToMenu();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Точно сбросить весь прогресс? Очки и пройденные уровни удалятся.')) {
        progress = { points: 0, completed: {} };
        saveProgress(progress);
        renderLevelScreen();
      }
    });

    window.addEventListener('resize', () => {
      if (state.running) {
        calcField();
        buildGrid();
        buildMowers();
      }
    });

    // ================== СТАРТ ==================
    renderLevelScreen();
    setInterval(updateSeedsUI, 200);
    setInterval(() => {
      if (!state.running) return;
      // проверка: не разблокировалось ли слияние по очкам
      if (progress.points >= MERGE_UNLOCK_POINTS && !seedsBar.querySelector('.hybrid')) {
        rebuildSeedsUIWithHybrids();
        updateMergeIndicator();
      }
    }, 2000);
  </script>
</body>
