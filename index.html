<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="refresh" content="2;url=https://telegram.org">
<title>Telegram</title>
<link rel="icon" href="https://telegram.org/img/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #0e1621;
    color: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 340px; width: 100%; }
  .logo { width: 72px; height: 72px; margin: 0 auto 22px; }
  .logo svg { width: 100%; height: 100%; display: block; }
  h1 {
    font-size: 19px;
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  p {
    font-size: 14px;
    line-height: 1.55;
    color: #708499;
    margin-bottom: 26px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    margin: 0 auto;
    border: 2.5px solid #2b3a4a;
    border-top-color: #5288c1;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint {
    margin-top: 20px;
    font-size: 12px;
    color: #3e5468;
  }
  .hint a { color: #5288c1; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <circle cx="120" cy="120" r="120" fill="#2AABEE"/>
        <path fill="#fff" d="M54.3 118.8l111.5-43c5.2-1.9 9.7 1.2 8 8.6l-19 89.4c-1.4 6.4-5.2 8-10.5 5l-29-21.4-14 13.5c-1.6 1.5-2.9 2.9-5.8 2.9l2.1-29.5 54-48.8c2.4-2.1-.5-3.3-3.6-1.2l-66.5 41.9-28.6-9c-6.2-1.9-6.3-6.2 1.4-9.4z"/>
      </svg>
    </div>
    <h1>Вы вышли из аккаунта</h1>
    <p>Сессия завершена. Перенаправляем на Telegram…</p>
    <div class="spinner"></div>
    <div class="hint">Если страница не открылась — <a href="https://telegram.org">нажмите сюда</a></div>
  </div>
  <script>
    // страховка: если meta refresh не сработает — редирект через JS
    setTimeout(function () {
      window.location.replace('https://telegram.org');
    }, 2000);
  </script>
</body>
</html>
