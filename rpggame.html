<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D RPG: Путешествие по Мирам</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000; overflow: hidden;
            font-family: 'Courier New', Courier, monospace; color: white;
            touch-action: none; user-select: none; -webkit-user-select: none;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #hud {
            position: absolute; top: 10px; left: 10px; text-shadow: 2px 2px 0 #000;
            pointer-events: none; font-size: 16px; font-weight: bold; z-index: 20;
        }
        .hp { color: #ff3333; margin-bottom: 5px; }
        .gold { color: #ffcc00; margin-bottom: 5px; }
        .quest { color: #00ffcc; font-size: 14px; margin-top: 5px; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 5px; border: 1px solid #00ffcc; }
        .weapon { color: #ffa500; font-size: 14px; margin-top: 5px; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 5px; border: 1px solid #ffa500; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white;
            transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; opacity: 0.7; z-index: 20;
        }

        #message {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            font-size: 20px; color: yellow; text-align: center; text-shadow: 2px 2px 0 #000;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold; white-space: nowrap; z-index: 20;
        }

        #level-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; text-align: center;
            cursor: pointer; padding: 20px; box-sizing: border-box;
        }
        #level-screen h1 { color: #00ffcc; font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 20px #00ffcc; }
        #level-screen p { font-size: 18px; color: white; }

        /* Мобильное управление */
        #mobile-controls {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        
        /* Джойстик */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px;
            width: 130px; height: 130px; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            pointer-events: auto; z-index: 15;
        }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.5); border-radius: 50%;
            pointer-events: none;
        }

        /* Кнопка атаки */
        #btn-attack {
            position: absolute; bottom: 30px; right: 30px;
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(255, 0, 0, 0.4); border: 3px solid red;
            color: white; font-size: 18px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; box-shadow: 0 0 15px red;
            touch-action: none; z-index: 15;
        }
        #btn-attack:active { background: rgba(255, 0, 0, 0.8); }

        #weapon-view {
            position: absolute; bottom: 0; right: 15%; width: 80px; height: 120px;
            background: linear-gradient(to top, #888, #ccc);
            border: 2px solid #fff; border-radius: 5px;
            clip-path: polygon(50% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%);
            display: none; pointer-events: none; transform: rotate(15deg);
            box-shadow: 0 0 10px #fff; z-index: 6;
        }

        @media (pointer: coarse) {
            #mobile-controls { display: block; }
            #weapon-view { right: 25%; width: 60px; height: 90px; }
        }
    </style>
</head>

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
        resizeCanvas();

        function startLevel(lvl) {
            level = lvl;
            player.x = 1.5; player.y = 1.5; player.angle = 0;
            player.healTimer = 0;
            if (lvl === 1) { 
                player.hp = 100; 
                player.damage = 25;
                player.weaponName = "Кулаки";
            }

            map = maps[lvl - 1].map(row => [...row]);
            monsters = [];
            potions = [];
            weapons = [];

            let numMonsters = 10 + (lvl * 2); 
            let spawned = 0;
            let attempts = 0;
            
            while (spawned < numMonsters && attempts < 2000) {
                attempts++;
                let mx = Math.floor(Math.random() * 18) + 1;
                let my = Math.floor(Math.random() * 18) + 1;
                let distToPlayer = Math.hypot(mx - player.x, my - player.y);
                
                if (map[my][mx] === 0 && distToPlayer > 6) {
                    let colors = ["#880000", "#444444", "#4a0080", "#008080", "#ff4400"];
                    monsters.push({ 
                        x: mx + 0.5, y: my + 0.5, 
                        homeX: mx + 0.5, homeY: my + 0.5,
                        hp: 20 + (lvl * 15), maxHp: 20 + (lvl * 15), 
                        attackCd: 0, alive: true,
                        color: colors[lvl-1],
                        aggro: false
                    });
                    spawned++;
                }
            }

            let potionsSpawned = 0;
            while (potionsSpawned < lvl + 2) {
                let px = Math.floor(Math.random() * 18) + 1;
                let py = Math.floor(Math.random() * 18) + 1;
                if (map[py][px] === 0 && Math.hypot(px - player.x, py - player.y) > 2) {
                    potions.push({ x: px + 0.5, y: py + 0.5, alive: true });
                    potionsSpawned++;
                }
            }

            let weaponsToSpawn = (lvl === 5) ? 3 : 1;
            for (let i = 0; i < weaponsToSpawn; i++) {
                let px, py;
                do {
                    px = Math.floor(Math.random() * 18) + 1;
                    py = Math.floor(Math.random() * 18) + 1;
                } while (map[py][px] !== 0 || Math.hypot(px - player.x, py - player.y) < 3);
                
                let dmg = 35 + (lvl * 5); 
                weapons.push({ x: px + 0.5, y: py + 0.5, alive: true, damage: dmg });
            }

            updateUI();
            gameState = "playing";
            document.getElementById('level-screen').style.display = 'none';
            lastTime = performance.now();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = Math.floor(player.hp);
            document.getElementById('gold-val').innerText = player.gold;
            document.getElementById('weapon-text').innerText = `🗡️ Оружие: ${player.weaponName} (Урон: ${player.damage})`;
            
            let aliveMonsters = monsters.filter(m => m.alive).length;
            let totalMonsters = monsters.length;
            document.getElementById('quest-text').innerText = `${levelNames[level-1]}: Убейте монстров (${totalMonsters - aliveMonsters}/${totalMonsters})`;

            if (player.weaponName === "Кулаки") {
                weaponView.style.display = 'none';
            } else {
                weaponView.style.display = 'block';
                let colors = ["#aaa", "#cd7f32", "#c0c0c0", "#00ffff", "#ff4500"];
                weaponView.style.background = `linear-gradient(to top, ${colors[level-1]}, #fff)`;
                weaponView.style.boxShadow = `0 0 15px ${colors[level-1]}`;
            }
        }

        function showMsg(text, color = "yellow") {
            const msg = document.getElementById('message');
            msg.innerText = text; msg.style.color = color; msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, 1000);
        }

        function handleTransition() {
            if (document.pointerLockElement) document.exitPointerLock();
            if (gameState === "levelup") startLevel(level + 1);
            else if (gameState === "gameover" || gameState === "win" || gameState === "menu") {
                if (gameState !== "menu") { player.gold = 0; player.damage = 25; player.weaponName = "Кулаки"; }
                startLevel(1);
            }
        }

        function update(time) {
            if (gameState !== "playing") return;
            
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            if (dt > 0.1) dt = 0.1;

            if (player.hp <= 0) {
                gameState = "gameover";
                if (document.pointerLockElement) document.exitPointerLock();
                document.getElementById('level-title').innerText = "ВЫ ПОГИБЛИ";
                document.getElementById('level-desc').innerText = "Нажмите, чтобы начать заново";
                document.getElementById('level-screen').style.display = 'flex';
                return;
            }

            player.healTimer += dt;
            if (player.healTimer >= 4.0) {
                player.healTimer = 0;
                if (player.hp < player.maxHp) {
                    player.hp = Math.min(player.maxHp, player.hp + 5);
                    updateUI();
                }
            }

            // --- ДВИЖЕНИЕ ---
            let moveX = 0;
            let moveY = 0;
            let rotAmount = 0;

            if (keys.w) moveY += 1;
            if (keys.s) moveY -= 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;
            if (keys.left) rotAmount -= 1;
            if (keys.right) rotAmount += 1;

            // Джойстик
            if (joyActive) {
                let dist = Math.hypot(joyDX, joyDY);
                if (dist > 10) {
                    moveX += joyDX / 50; 
                    moveY -= joyDY / 50; 
                }
            }

            let moveLen = Math.hypot(moveX, moveY);
            if (moveLen > 0) {
                moveX /= moveLen;
                moveY /= moveLen;
            }

            // Применяем поворот ДО движения, чтобы идти туда, куда смотрим
            player.angle += rotAmount * ROT_SPEED * dt;

            let dx = (moveX * Math.cos(player.angle) - moveY * Math.sin(player.angle)) * MOVE_SPEED * dt;
            let dy = (moveX * Math.sin(player.angle) + moveY * Math.cos(player.angle)) * MOVE_SPEED * dt;

            let nextX = player.x + dx;
            let nextY = player.y + dy;

            if (map[Math.floor(player.y)] && map[Math.floor(player.y)][Math.floor(nextX)] === 0) player.x = nextX;
            if (map[Math.floor(nextY)] && map[Math.floor(nextY)][Math.floor(player.x)] === 0) player.y = nextY;

            // АТАКА
            if ((keys.attack || attackRequested || autoAttack) && player.attackTimer <= 0) {
                player.attackTimer = 0.4; 
                attackRequested = false;
                let closestMonster = null;
                let closestAngleDiff = 999;

                for (let m of monsters) {
                    if (m.alive) {
                        let dist = Math.hypot(player.x - m.x, player.y - m.y);
                        let angleToMonster = Math.atan2(m.y - player.y, m.x - player.x) - player.angle;
                        while (angleToMonster > Math.PI) angleToMonster -= Math.PI * 2;
                        while (angleToMonster < -Math.PI) angleToMonster += Math.PI * 2;

                        if (dist < 3.0 && Math.abs(angleToMonster) < 0.6) {
                            if (Math.abs(angleToMonster) < closestAngleDiff) {
                                closestAngleDiff = Math.abs(angleToMonster);
                                closestMonster = m;
                            }
                        }
                    }
                }

                if (closestMonster) {
                    closestMonster.hp -= player.damage; 
                    showMsg("УДАР!", "#ff4444");
                    
                    let pushAngle = Math.atan2(closestMonster.y - player.y, closestMonster.x - player.x);
                    let nextMX = closestMonster.x + Math.cos(pushAngle) * 0.8;
                    let nextMY = closestMonster.y + Math.sin(pushAngle) * 0.8;
                    if (map[Math.floor(nextMY)] && map[Math.floor(nextMY)][Math.floor(nextMX)] === 0) {
                        closestMonster.x = nextMX; closestMonster.y = nextMY;
                    }

                    if (closestMonster.hp <= 0) { 
                        closestMonster.alive = false; 
                        player.gold += 10; 
                        showMsg("+10 ЗОЛОТА", "#ffcc00");
                    }
                    updateUI();
                }
            }

            if (player.attackTimer > 0) player.attackTimer -= dt;

            // МОНСТРЫ
            for (let m of monsters) {
                if (!m.alive) continue;
                if (m.attackCd > 0) m.attackCd -= dt;

                let distToPlayer = Math.hypot(player.x - m.x, player.y - m.y);
                
                if (distToPlayer < 4.0) m.aggro = true;
                else if (distToPlayer > 7.0) m.aggro = false;

                if (m.aggro && distToPlayer > 1.0) {
                    let angleToPlayer = Math.atan2(player.y - m.y, player.x - m.x);
                    let nextMX = m.x + Math.cos(angleToPlayer) * 2.5 * dt;
                    let nextMY = m.y + Math.sin(angleToPlayer) * 2.5 * dt;
                    if (map[Math.floor(nextMY)] && map[Math.floor(nextMY)][Math.floor(nextMX)] === 0) {
                        m.x = nextMX; m.y = nextMY;
                    }
                } else if (!m.aggro) {
                    let distToHome = Math.hypot(m.homeX - m.x, m.homeY - m.y);
                    if (distToHome > 0.5) {
                        let angleToHome = Math.atan2(m.homeY - m.y, m.homeX - m.x);
                        let nextMX = m.x + Math.cos(angleToHome) * 1.5 * dt;
                        let nextMY = m.y + Math.sin(angleToHome) * 1.5 * dt;
                        if (map[Math.floor(nextMY)] && map[Math.floor(nextMY)][Math.floor(nextMX)] === 0) {
                            m.x = nextMX; m.y = nextMY;
                        }
                    }
                }
                
                if (distToPlayer < 1.2 && m.attackCd <= 0 && m.aggro) {
                    let angleToMonster = Math.atan2(m.y - player.y, m.x - player.x) - player.angle;
                    while (angleToMonster > Math.PI) angleToMonster -= Math.PI * 2;
                    while (angleToMonster < -Math.PI) angleToMonster += Math.PI * 2;
                    
                    if (Math.abs(angleToMonster) < FOV / 2 + 0.2) {
                        player.hp -= 5 + (level * 1.5); 
                        m.attackCd = 2.0; 
                        showMsg("МОНСТР АТАКУЕТ!", "#ff3333");
                        updateUI();
                    } else {
                        m.attackCd = 1.0; 
                    }
                }
            }

            // ЗЕЛЬЯ
            for (let p of potions) {
                if (p.alive && Math.hypot(player.x - p.x, player.y - p.y) < 0.6) {
                    p.alive = false;
                    player.hp = Math.min(player.maxHp, player.hp + 40); 
                    showMsg("ЗЕЛЬЕ! +40 HP", "#00ff00");
                    updateUI();
                }
            }

            // ОРУЖИЕ
            for (let w of weapons) {
                if (w.alive && Math.hypot(player.x - w.x, player.y - w.y) < 0.6) {
                    w.alive = false;
                    player.damage = w.damage;
                    player.weaponName = `Меч (+${w.damage})`;
                    showMsg(`ВЫ НАШЛИ МЕЧ! Урон: ${w.damage}`, "#ffa500");
                    updateUI();
                }
            }

            if (monsters.every(m => !m.alive)) {
                if (document.pointerLockElement) document.exitPointerLock();
                if (level < 5) {
                    gameState = "levelup";
                    document.getElementById('level-title').innerText = `${levelNames[level-1]} ПРОЙДЕН!`;
                    document.getElementById('level-desc').innerText = "Нажмите на экран для перехода";
                } else {
                    gameState = "win";
                    document.getElementById('level-title').innerText = "ПОБЕДА!";
                    document.getElementById('level-desc').innerText = `Вы прошли все миры! Золото: ${player.gold}\nНажмите, чтобы начать заново`;
                }
                document.getElementById('level-screen').style.display = 'flex';
            }
        }

        function draw() {
            if (gameState !== "playing") return;

            let skyColors = [
                ["#87CEEB", "#4682B4"], ["#001133", "#000000"], ["#191970", "#000000"], ["#E0FFFF", "#87CEFA"], ["#FF0000", "#8B0000"]
            ];
            let floorColors = [
                ["#006400", "#003300"], ["#8B4513", "#3E2723"], ["#2F4F4F", "#111111"], ["#B0E0E6", "#4682B4"], ["#FF4500", "#1A0000"]
            ];
            let wallColors = [
                [34, 139, 34], [139, 69, 19], [105, 105, 105], [0, 191, 255], [255, 69, 0]
            ];

            let gradSky = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
            gradSky.addColorStop(0, skyColors[level-1][0]); gradSky.addColorStop(1, skyColors[level-1][1]);
            ctx.fillStyle = gradSky; ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            
            let gradFloor = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
            gradFloor.addColorStop(0, floorColors[level-1][0]); gradFloor.addColorStop(1, floorColors[level-1][1]);
            ctx.fillStyle = gradFloor; ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

            const rayAngleStep = FOV / canvas.width;

            for (let x = 0; x < canvas.width; x++) {
                let rayAngle = player.angle - (FOV / 2) + (x * rayAngleStep);
                let dist = 0;
                let hitWall = false;

                while (!hitWall && dist < RENDER_DIST) {
                    dist += 0.05;
                    let testX = player.x + Math.cos(rayAngle) * dist;
                    let testY = player.y + Math.sin(rayAngle) * dist;
                    if (testX < 0 || testX >= map[0].length || testY < 0 || testY >= map.length) {
                        hitWall = true; dist = RENDER_DIST;
                    } else if (map[Math.floor(testY)][Math.floor(testX)] > 0) {
                        hitWall = true;
                        dist = dist * Math.cos(rayAngle - player.angle); 
                    }
                }

                let wallHeight = (canvas.height * 0.8) / dist;
                let drawStart = (canvas.height - wallHeight) / 2;
                
                let shade = Math.max(0.2, 1 - (dist / RENDER_DIST)); 
                let baseCol = wallColors[level-1];
                
                ctx.fillStyle = `rgb(${baseCol[0]*shade}, ${baseCol[1]*shade}, ${baseCol[2]*shade})`;
                ctx.fillRect(x, drawStart, 1, wallHeight);
            }

            let sprites = [];
            monsters.filter(m => m.alive).forEach(m => sprites.push({...m, type: 'monster'}));
            potions.filter(p => p.alive).forEach(p => sprites.push({...p, type: 'potion'}));
            weapons.filter(w => w.alive).forEach(w => sprites.push({...w, type: 'weapon'}));
            sprites.sort((a, b) => Math.hypot(b.x-player.x, b.y-player.y) - Math.hypot(a.x-player.x, a.y-player.y));

            for (let s of sprites) {
                let angleToSprite = Math.atan2(s.y - player.y, s.x - player.x) - player.angle;
                while (angleToSprite > Math.PI) angleToSprite -= Math.PI * 2;
                while (angleToSprite < -Math.PI) angleToSprite += Math.PI * 2;

                if (Math.abs(angleToSprite) < FOV / 2 + 0.2) {
                    let dist = Math.hypot(s.x-player.x, s.y-player.y);
                    let visible = true;
                    let steps = Math.floor(dist / 0.1);
                    for (let i = 1; i < steps; i++) {
                        let cx = player.x + (s.x - player.x) * (i/steps);
                        let cy = player.y + (s.y - player.y) * (i/steps);
                        if (map[Math.floor(cy)][Math.floor(cx)] > 0) { visible = false; break; }
                    }
                    if (!visible) continue;

                    let screenX = (canvas.width / 2) + (Math.tan(angleToSprite) / Math.tan(FOV / 2)) * (canvas.width / 2);
                    let spriteHeight = (canvas.height * 0.8) / dist;
                    let spriteWidth = spriteHeight * 0.6;
                    let drawStartY = (canvas.height - spriteHeight) / 2;

                    if (s.type === 'monster') {
                        ctx.fillStyle = s.aggro ? "#ff0000" : s.color; 
                        ctx.fillRect(screenX - spriteWidth/2, drawStartY, spriteWidth, spriteHeight);
                        
                        ctx.fillStyle = "#ffff00";
                        ctx.fillRect(screenX - spriteWidth/4, drawStartY + spriteHeight/4, spriteWidth/8, spriteWidth/8);
                        ctx.fillRect(screenX + spriteWidth/8, drawStartY + spriteHeight/4, spriteWidth/8, spriteWidth/8);
                        
                        ctx.fillStyle = "red";
                        ctx.fillRect(screenX - spriteWidth/2, drawStartY - 10, spriteWidth, 5);
                        ctx.fillStyle = "green";
                        ctx.fillRect(screenX - spriteWidth/2, drawStartY - 10, spriteWidth * (s.hp / s.maxHp), 5);
                    } else if (s.type === 'potion') {
                        ctx.fillStyle = "#00ff00";
                        ctx.fillRect(screenX - spriteWidth/4, drawStartY + spriteHeight/3, spriteWidth/2, spriteHeight/6);
                        ctx.fillRect(screenX - spriteWidth/12, drawStartY + spriteHeight/4, spriteWidth/6, spriteHeight/3);
                    } else if (s.type === 'weapon') {
                        ctx.fillStyle = "#ffa500";
                        ctx.beginPath();
                        ctx.moveTo(screenX, drawStartY + spriteHeight/4);
                        ctx.lineTo(screenX + spriteWidth/4, drawStartY + spriteHeight/2);
                        ctx.lineTo(screenX, drawStartY + spriteHeight * 0.75);
                        ctx.lineTo(screenX - spriteWidth/4, drawStartY + spriteHeight/2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = "#fff";
                        ctx.fillRect(screenX - 2, drawStartY + spriteHeight/2 - 2, 4, 4);
                    }
                }
            }
        }

        // --- УПРАВЛЕНИЕ ---
        window.addEventListener('keydown', e => {
            if (e.key === 'w' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'ц') keys.w = true;
            if (e.key === 's' || e.key === 'ArrowDown' || e.key.toLowerCase() === 'ы') keys.s = true;
            if (e.key === 'a' || e.key.toLowerCase() === 'ф') keys.a = true;
            if (e.key === 'd' || e.key.toLowerCase() === 'в') keys.d = true;
            if (e.key === 'ArrowLeft') keys.left = true; 
            if (e.key === 'ArrowRight') keys.right = true; 
            if (e.key === ' ') { keys.attack = true; e.preventDefault(); }
            if ((e.key === ' ' || e.key === 'Enter') && gameState !== "playing") handleTransition();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'w' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'ц') keys.w = false;
            if (e.key === 's' || e.key === 'ArrowDown' || e.key.toLowerCase() === 'ы') keys.s = false;
            if (e.key === 'a' || e.key.toLowerCase() === 'ф') keys.a = false;
            if (e.key === 'd' || e.key.toLowerCase() === 'в') keys.d = false;
            if (e.key === 'ArrowLeft') keys.left = false; 
            if (e.key === 'ArrowRight') keys.right = false; 
            if (e.key === ' ') keys.attack = false;
        });

        canvas.addEventListener('mousemove', e => {
            if (document.pointerLockElement === canvas) {
                player.angle += e.movementX * 0.002;
            }
        });
        canvas.addEventListener('click', () => {
            if (gameState === "playing" && !('ontouchstart' in window)) {
                canvas.requestPointerLock();
                attackRequested = true;
            }
        });

        // --- МОБИЛЬНОЕ УПРАВЛЕНИЕ ---
        const zoneLeft = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        const btnAttack = document.getElementById('btn-attack');

        // Джойстик
        function handleJoyStart(e) {
            e.preventDefault(); e.stopPropagation();
            joyActive = true;
            joyStartX = e.touches[0].clientX; joyStartY = e.touches[0].clientY;
        }
        function handleJoyMove(e) {
            e.preventDefault(); e.stopPropagation();
            if (!joyActive) return;
            joyDX = e.touches[0].clientX - joyStartX; joyDY = e.touches[0].clientY - joyStartY;
            let dist = Math.hypot(joyDX, joyDY);
            if (dist > 50) { joyDX = (joyDX / dist) * 50; joyDY = (joyDY / dist) * 50; }
            knob.style.transform = `translate(${joyDX}px, ${joyDY}px)`;
        }
        function handleJoyEnd(e) {
            e.preventDefault(); e.stopPropagation();
            joyActive = false; joyDX = 0; joyDY = 0;
            knob.style.transform = `translate(0px, 0px)`;
        }

        zoneLeft.addEventListener('touchstart', handleJoyStart, {passive: false});
        zoneLeft.addEventListener('touchmove', handleJoyMove, {passive: false});
        zoneLeft.addEventListener('touchend', handleJoyEnd);

        // Камера (поворот по свайпу на фоне)
        canvas.addEventListener('touchstart', e => {
            if (e.target.id === 'joystick-zone' || e.target.id === 'joystick-knob' || e.target.id === 'btn-attack') return;
            lookActive = true;
            lookLastX = e.touches[0].clientX;
        }, {passive: false});

        canvas.addEventListener('touchmove', e => {
            if (e.target.id === 'joystick-zone' || e.target.id === 'joystick-knob' || e.target.id === 'btn-attack') return;
            if (!lookActive) return;
            e.preventDefault();

            let currentX = e.touches[0].clientX;
            let deltaX = currentX - lookLastX;
            player.angle += deltaX * 0.005; 
            lookLastX = currentX;
        }, {passive: false});

        canvas.addEventListener('touchend', e => {
            lookActive = false;
        });

        // Атака
        btnAttack.addEventListener('touchstart', e => { 
            e.preventDefault(); e.stopPropagation(); 
            autoAttack = true; 
        });
        btnAttack.addEventListener('touchend', e => { 
            e.preventDefault(); e.stopPropagation(); 
            autoAttack = false; 
        });
        btnAttack.addEventListener('touchcancel', e => { 
            autoAttack = false; 
        });

        document.getElementById('level-screen').addEventListener('click', handleTransition);
        
        document.body.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
        }, { once: true });

        function gameLoop(time) {
            update(time);
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('level-title').innerText = "3D RPG: 5 Миров";
        document.getElementById('level-desc').innerText = "Кликните, чтобы играть\n(WASD + Мышь / Тач)";
        document.getElementById('level-screen').style.display = 'flex';
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
