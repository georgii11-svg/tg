<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Жми сюда</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0a0a14 70%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    user-select: none;
    position: relative;
  }

  #start {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .icon {
    font-size: 90px;
    margin-bottom: 22px;
    animation: bounce 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 42, 106, 0.5));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }
  h1 {
    font-size: 24px; font-weight: 700; margin-bottom: 12px;
    background: linear-gradient(90deg, #ff2a6a, #ff8aa8, #ffb800);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 0.5px;
  }
  .sub { font-size: 14px; color: #8a8aa0; margin-bottom: 36px; max-width: 320px; line-height: 1.6; }
  .btn {
    padding: 20px 52px; font-size: 20px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #ff2a6a, #ff5c8a);
    border: none; border-radius: 60px; cursor: pointer; font-family: inherit;
    letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 8px 0 #a01040, 0 14px 40px rgba(255, 42, 106, 0.5);
    transition: all 0.1s ease;
    animation: pulseBtn 1.8s ease-in-out infinite;
  }
  @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .btn:active { transform: translateY(6px) scale(1.02); box-shadow: 0 2px 0 #a01040, 0 6px 20px rgba(255, 42, 106, 0.4); }

  #fakScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
    z-index: 100;
  }
  #fakScreen.show { display: block; }

  .fak-symbol {
    position: absolute;
    user-select: none;
    pointer-events: none;
    will-change: transform;
    line-height: 1;
  }

  .fak-symbol.out { animation: flyOut 1.2s ease-out forwards; }
  @keyframes flyOut {
    0% { transform: translate(0, 0) scale(0.2) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(var(--sc)) rotate(var(--rot)); opacity: 0; }
  }

  .fak-symbol.fall { animation: fallDown linear forwards; }
  @keyframes fallDown {
    0% { transform: translateY(-140px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .fak-symbol.pulse { animation: bigPulse 0.6s ease-out forwards; }
  @keyframes bigPulse {
    0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(8); opacity: 0; }
  }

  #stopBtn {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 300; padding: 14px 36px; background: #1a1a26;
    border: 2px solid #ff2a6a; border-radius: 12px; color: #ff5c8a;
    font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 0 30px rgba(255, 42, 106, 0.5);
  }
  #stopBtn:active { transform: translateX(-50%) scale(0.95); }

  .flash {
    position: fixed; inset: 0; background: #ff2a6a; opacity: 0;
    pointer-events: none; z-index: 250;
    animation: flashPulse 0.3s ease;
  }
  @keyframes flashPulse { 0% { opacity: 0; } 30% { opacity: 0.5; } 100% { opacity: 0; } }

  body.shaking { animation: bodyShake 0.08s infinite; }
  @keyframes bodyShake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, -2px); }
    100% { transform: translate(2px, 2px); }
  }

  #fakCenter {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200; pointer-events: none;
    animation: centerGrow 0.4s ease-out;
  }
  @keyframes centerGrow {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <div id="start">
    <div class="icon">👇</div>
    <h1>Тут спрятан секрет</h1>
    <div class="sub">Нажми на кнопку ниже. Обещаем — тебе понравится.</div>
    <button class="btn" id="startBtn">Жми сюда</button>
  </div>

  <div id="fakScreen">
    <button id="stopBtn">Стоп</button>
  </div>

  <script>
    const start = document.getElementById('start');
    const fakScreen = document.getElementById('fakScreen');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    // ================= SVG кривого хуя =================
    // нарисован максимально неуклюже: дрожащие линии, разные толщины, кривые
    const DICK_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- яйца (2 кривых овала снизу) -->
          <path d="M 60 250 C 40 250, 35 280, 50 295 C 65 310, 90 300, 90 280 C 92 265, 80 250, 60 250 Z" stroke-width="5"/>
          <path d="M 140 250 C 160 248, 168 275, 155 293 C 140 310, 112 305, 110 283 C 108 267, 122 250, 140 250 Z" stroke-width="6"/>

          <!-- ствол — кривая, изогнутая, толщина плавает -->
          <path d="M 85 250 C 80 220, 78 195, 82 170 C 87 145, 95 130, 105 110 C 113 92, 118 78, 116 60 C 114 45, 122 36, 132 38 C 142 40, 148 52, 145 68 C 142 88, 133 105, 122 122 C 111 140, 103 158, 100 180 C 96 205, 100 230, 105 252" stroke-width="7"/>

          <!-- головка — кривая шляпка, поплыла в сторону -->
          <path d="M 112 62 C 100 52, 90 40, 100 28 C 110 16, 130 14, 145 22 C 158 30, 162 46, 152 60 C 144 72, 128 75, 116 68" stroke-width="6"/>

          <!-- уретра — маленькая кривая линия, съехала -->
          <path d="M 128 30 C 132 36, 134 42, 132 48" stroke-width="3" stroke-dasharray="3 4"/>

          <!-- случайные волоски (палка-палка) -->
          <path d="M 70 260 L 62 268" stroke-width="4"/>
          <path d="M 145 262 L 154 270" stroke-width="4"/>
          <path d="M 78 272 L 72 280" stroke-width="3"/>
          <path d="M 152 276 L 158 284" stroke-width="3"/>

          <!-- обводка-потёк (мокрый след) -->
          <path d="M 130 40 C 138 50, 142 62, 138 72" stroke-width="2" opacity="0.5"/>
        </g>
      </svg>
    `;

    function makeDick(sizePx, color) {
      const div = document.createElement('div');
      div.style.width = sizePx + 'px';
      div.style.height = (sizePx * 1.6) + 'px';
      div.style.color = color;
      div.style.filter = `drop-shadow(0 0 8px ${color}) drop-shadow(0 0 16px ${color})`;
      div.innerHTML = DICK_SVG;
      return div;
    }

    const COLORS = ['#ff2a6a', '#ff5c8a', '#ffb800', '#ff0040', '#ff8aa8', '#ffd700', '#fff', '#ff5050'];
    function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    // аудио
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function noiseBurst(dur) {
      if (!audioCtx) return;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.4;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 900; filter.Q.value = 1.5;
      src.connect(filter).connect(gain).connect(audioCtx.destination);
      src.start(); src.stop(audioCtx.currentTime + dur);
    }
    function beepFast() {
      if (!audioCtx) return;
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(500 + Math.random() * 900, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }, i * 90);
      }
    }

    let spawnInterval = null;
    let audioInterval = null;

    function spawnOut() {
      const el = makeDick(40 + Math.random() * 80, randomColor());
      el.className = 'fak-symbol out';
      el.style.left = '50%';
      el.style.top = '50%';

      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 400;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const sc = 0.8 + Math.random() * 1.5;
      const rot = -360 + Math.random() * 720;

      el.style.setProperty('--tx', tx + 'px');
      el.style.setProperty('--ty', ty + 'px');
      el.style.setProperty('--sc', sc);
      el.style.setProperty('--rot', rot + 'deg');

      fakScreen.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    function spawnFall() {
      const size = 40 + Math.random() * 90;
      const el = makeDick(size, randomColor());
      el.className = 'fak-symbol fall';
      el.style.left = (Math.random() * 100) + '%';
      el.style.top = '-140px';
      const dur = 1.5 + Math.random() * 2.5;
      el.style.animationDuration = dur + 's';
      fakScreen.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 300);
    }

    function spawnPulse() {
      const size = 80 + Math.random() * 60;
      const el = makeDick(size, randomColor());
      el.className = 'fak-symbol pulse';
      el.style.left = '50%';
      el.style.top = '50%';
      fakScreen.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function startFak() {
      initAudio();
      start.style.display = 'none';
      fakScreen.classList.add('show');
      document.body.classList.add('shaking');

      const f = document.createElement('div');
      f.className = 'flash';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 400);

      noiseBurst(0.5);
      beepFast();

      // по центру большой кривой хуй
      const center = makeDick(200, '#ff2a6a');
      center.id = 'fakCenter';
      fakScreen.appendChild(center);

      spawnInterval = setInterval(() => {
        spawnOut();
        if (Math.random() < 0.7) spawnFall();
        if (Math.random() < 0.35) spawnPulse();
      }, 90);

      audioInterval = setInterval(() => {
        noiseBurst(0.25);
        beepFast();
      }, 700);

      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200, 50, 300]);
    }

    function stopFak() {
      clearInterval(spawnInterval);
      clearInterval(audioInterval);
      spawnInterval = audioInterval = null;
      document.body.classList.remove('shaking');

      const all = fakScreen.querySelectorAll('.fak-symbol, #fakCenter');
      all.forEach(el => el.remove());

      fakScreen.classList.remove('show');
      start.style.display = 'flex';
    }

    startBtn.addEventListener('click', startFak);
    stopBtn.addEventListener('click', (e) => { e.stopPropagation(); stopFak(); });
  </script>
</body>
</html>
