<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PvZ Prototype</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#1a2a1a;font-family:Arial,sans-serif;
            overflow:hidden;height:100%;touch-action:manipulation;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  #topbar{display:flex;align-items:center;justify-content:space-between;
          padding:4px 6px;background:#0d1a0d;gap:4px;flex-wrap:nowrap;z-index:30;}
  #cards{display:flex;gap:4px;overflow-x:auto;flex:1;padding:2px 0;}
  .card{flex:0 0 auto;width:56px;height:76px;background:#d4b483;border:2px solid #6b4f2a;
        border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
        cursor:pointer;user-select:none;font-size:9px;color:#000;position:relative;transition:.1s;}
  .card.selected{border-color:#ffdd00;box-shadow:0 0 12px #ffdd00;}
  .card.disabled{filter:grayscale(1) brightness(.55);cursor:not-allowed;}
  .card .icon{font-size:22px;line-height:1;}
  .card .cost{background:#fff8;padding:0 3px;border-radius:3px;margin-top:1px;font-weight:bold;font-size:10px;}
  .card .cd{position:absolute;bottom:0;left:0;width:100%;background:#000a;height:0;transition:height .1s;}
  #rightHud{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
  #sunCounter{font-size:13px;color:#fff;font-weight:bold;background:#0008;
              padding:4px 6px;border-radius:8px;white-space:nowrap;}
  .hudBtn{color:#fff;border:none;border-radius:8px;padding:7px 8px;
          font-size:13px;font-weight:bold;cursor:pointer;line-height:1;}
  #cancelBtn{background:#c62828;}
  #cancelBtn:active{background:#8e0000;}
  #pauseBtn{background:#1565c0;}
  #pauseBtn:active{background:#0d47a1;}
  #pauseBtn.paused{background:#f9a825;}
  #canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  canvas{display:block;background:#7cb342;touch-action:none;}
  #msg{position:absolute;top:42%;width:100%;text-align:center;font-size:30px;color:#fff;
       text-shadow:2px 2px 8px #000;pointer-events:none;z-index:20;opacity:0;transition:.3s;
       padding:0 10px;}
  #pauseOverlay{position:absolute;inset:0;background:#000a;display:none;
                align-items:center;justify-content:center;z-index:25;pointer-events:none;}
  #pauseOverlay.show{display:flex;}
  #pauseOverlay div{color:#fff;font-size:40px;font-weight:bold;text-shadow:2px 2px 8px #000;}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <div id="cards"></div>
    <div id="rightHud">
      <div id="sunCounter">☀ 75</div>
      <button id="pauseBtn" class="hudBtn">⏸</button>
      <button id="cancelBtn" class="hudBtn">✖</button>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="msg"></div>
    <div id="pauseOverlay"><div>ПАУЗА</div></div>
  </div>
</div>

<script>
/* =========================================================
   PvZ — ПРОТОТИП (мобильная версия + пауза + новые зомби)
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const CELL_W = 80, CELL_H = 100;
const COLS = 9, ROWS = 5;
const GRID_X = 100, GRID_Y = 60;
const BASE_W = GRID_X + COLS*CELL_W + 20;
const BASE_H = GRID_Y + ROWS*CELL_H + 20;
canvas.width = BASE_W;
canvas.height = BASE_H;

function fitCanvas(){
  const wrap = document.getElementById('canvasWrap');
  const availW = wrap.clientWidth;
  const availH = wrap.clientHeight;
  const scale = Math.min(availW/BASE_W, availH/BASE_H);
  canvas.style.width  = (BASE_W*scale) + 'px';
  canvas.style.height = (BASE_H*scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,200));

/* ---------- БАЛАНС ---------- */
const CONFIG = {
  sunStart: 75,
  sunFromSkyInterval: 7,
  sunflowerProduceInterval: 24,
  sunflowerFirstProduce: 5,
  peaShootInterval: 1.4,
  peaDamage: 20,
  peaSpeed: 300,
  snowDamage: 20,
  snowSlowDuration: 3,
  snowSlowFactor: 0.5,
  zombieHP: 270,
  zombieSpeed: CELL_W / 4.7,
  zombieDamage: 100,
  coneZombieHP: 570,
  bucketZombieHP: 1370,        // ведро 1100 + тело 270
  zomboniHP: 1160,             // зомби на катке
  zomboniSpeed: CELL_W / 4,    // 4 сек/клетка
  cherryDamage: 1800,
  wallnutHP: 4000,
  firstWaveDelay: 40,
  waveInterval: 40,
};

const PLANTS = [
  {id:'sunflower', name:'Подсолнух', cost:50,  cd:7.5,  hp:300, icon:'🌻', key:'1'},
  {id:'peashooter',name:'Горохострел',cost:100,cd:7.5,  hp:300, icon:'🌱', key:'2'},
  {id:'snowpea',   name:'Снежок',     cost:175,cd:7.5,  hp:300, icon:'❄️', key:'3'},
  {id:'wallnut',   name:'Орех',       cost:50, cd:30,   hp:4000,icon:'🥜', key:'4'},
  {id:'cherry',    name:'Вишня',      cost:150,cd:50,   hp:300, icon:'🍒', key:'5'},
];

let sun = CONFIG.sunStart;
let selectedPlant = null;
let cooldowns = {};
let plants = [], zombies = [], projectiles = [], suns = [], particles = [];
let skySunTimer = CONFIG.sunFromSkyInterval;
let gameTime = 0, waveTimer = 0, waveNum = 0, gameOver = false;
let paused = false;

PLANTS.forEach(p => cooldowns[p.id] = 0);

const cardsEl = document.getElementById('cards');
const sunEl = document.getElementById('sunCounter');
const msgEl = document.getElementById('msg');
const cancelBtn = document.getElementById('cancelBtn');
const pauseBtn = document.getElementById('pauseBtn');
const pauseOverlay = document.getElementById('pauseOverlay');

function buildCards(){
  cardsEl.innerHTML = '';
  PLANTS.forEach(p=>{
    const d = document.createElement('div');
    d.className='card'; d.dataset.id=p.id;
    d.innerHTML = `<div class="icon">${p.icon}</div><div>${p.name}</div>
                   <div class="cost">${p.cost}☀</div><div class="cd"></div>`;
    d.addEventListener('click', ()=>{
      if(paused || gameOver) return;
      if(cooldowns[p.id]>0 || sun<p.cost) return;
      selectedPlant = (selectedPlant===p.id)?null:p.id;
      refreshCards();
    });
    cardsEl.appendChild(d);
  });
}
function refreshCards(){
  document.querySelectorAll('.card').forEach(el=>{
    const p = PLANTS.find(x=>x.id===el.dataset.id);
    el.classList.toggle('selected', selectedPlant===p.id);
    el.classList.toggle('disabled', cooldowns[p.id]>0 || sun<p.cost);
    el.querySelector('.cd').style.height = (cooldowns[p.id]/p.cd*100)+'%';
  });
}
buildCards();

cancelBtn.addEventListener('click', ()=>{
  selectedPlant = null;
  refreshCards();
});

pauseBtn.addEventListener('click', ()=>{
  if(gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '▶' : '⏸';
  pauseBtn.classList.toggle('paused', paused);
  pauseOverlay.classList.toggle('show', paused);
});

function showMsg(txt, ms=1500){
  msgEl.textContent = txt; msgEl.style.opacity=1;
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(()=>msgEl.style.opacity=0, ms);
}
function cellCenter(r,c){ return {x: GRID_X + c*CELL_W + CELL_W/2, y: GRID_Y + r*CELL_H + CELL_H/2}; }
function posToCell(x,y){
  const c = Math.floor((x-GRID_X)/CELL_W);
  const r = Math.floor((y-GRID_Y)/CELL_H);
  if(r<0||r>=ROWS||c<0||c>=COLS) return null;
  return {r,c};
}
function plantAt(r,c){ return plants.find(p=>p.r===r&&p.c===c&&p.alive); }

function spawnSkySun(){
  const x = GRID_X + 30 + Math.random()*(COLS*CELL_W-60);
  const targetY = GRID_Y + 40 + Math.random()*(ROWS*CELL_H-80);
  suns.push({x, y:-30, targetY, vy:40, value:25, life:12, collected:false});
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;
  if(!gameOver && !paused) update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  gameTime += dt;

  for(const p of PLANTS){
    if(cooldowns[p.id]>0){ cooldowns[p.id]-=dt; if(cooldowns[p.id]<0) cooldowns[p.id]=0; }
  }
  refreshCards();

  skySunTimer -= dt;
  if(skySunTimer<=0){ skySunTimer = CONFIG.sunFromSkyInterval; spawnSkySun(); }

  for(let i=suns.length-1;i>=0;i--){
    const s = suns[i];
    if(s.collected){ suns.splice(i,1); continue; }
    if(s.y < s.targetY){
      s.y += s.vy*dt;
      if(s.y>s.targetY) s.y=s.targetY;
    } else {
      s.life -= dt;
      if(s.life<=0) suns.splice(i,1);
    }
  }

  for(const p of plants){
    if(!p.alive) continue;
    if(p.id==='sunflower'){
      p.timer -= dt;
      if(p.timer<=0){
        p.timer = CONFIG.sunflowerProduceInterval;
        const c = cellCenter(p.r,p.c);
        suns.push({x:c.x, y:c.y, targetY:c.y, vy:0, value:25, life:10, collected:false});
      }
    }
    if(p.id==='peashooter' || p.id==='snowpea'){
      const enemy = zombies.find(z=>z.r===p.r && z.x > cellCenter(p.r,p.c).x - 20 && z.alive);
      p.timer -= dt;
      if(enemy && p.timer<=0){
        p.timer = CONFIG.peaShootInterval;
        const c = cellCenter(p.r,p.c);
        projectiles.push({
          x:c.x+20, y:c.y-10, r:p.r, vx:CONFIG.peaSpeed,
          damage: CONFIG.peaDamage,
          slow: p.id==='snowpea',
          color: p.id==='snowpea' ? '#4fc3f7' : '#66bb6a'
        });
      }
    }
    if(p.id==='cherry'){
      p.fuse -= dt;
      if(p.fuse<=0){
        for(const z of zombies){
          if(!z.alive) continue;
          if(Math.abs(z.r-p.r)<=1 && Math.abs(z.cellCol-p.c)<=1){
            z.hp -= CONFIG.cherryDamage;
            if(z.hp<=0) killZombie(z);
          }
        }
        for(let i=0;i<30;i++){
          particles.push({
            x:cellCenter(p.r,p.c).x, y:cellCenter(p.r,p.c).y,
            vx:(Math.random()-.5)*400, vy:(Math.random()-.5)*400,
            life:0.6, color:'#ff5722'
          });
        }
        p.alive = false;
      }
    }
  }
  plants = plants.filter(p=>p.alive);

  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    pr.x += pr.vx*dt;
    const hit = zombies.find(z=>z.alive && z.r===pr.r && Math.abs(z.x-pr.x)<28);
    if(hit){
      hit.hp -= pr.damage;
      if(pr.slow){ hit.slow = CONFIG.snowSlowDuration; }
      if(hit.hp<=0) killZombie(hit);
      projectiles.splice(i,1); continue;
    }
    if(pr.x > canvas.width) projectiles.splice(i,1);
  }

  for(const z of zombies){
    if(!z.alive) continue;
    let speed = CONFIG.zombieSpeed;
    if(z.slow>0){ speed *= CONFIG.snowSlowFactor; z.slow -= dt; }

    const cell = posToCell(z.x - 20, z.r*CELL_H + GRID_Y + CELL_H/2);
    let target = null;
    if(cell) target = plantAt(z.r, cell.c);

    if(target){
      if(z.isZomboni){
        // Каток давит растение мгновенно
        target.hp = 0;
        target.alive = false;
      } else {
        target.hp -= CONFIG.zombieDamage * dt;
        if(target.hp<=0){ target.alive=false; }
      }
    } else {
      z.x -= speed*dt;
    }

    if(z.x < GRID_X - 30){ triggerGameOver(); }
  }
  zombies = zombies.filter(z=>z.alive);

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life<=0) particles.splice(i,1);
  }

  // ---------- Волны ----------
  waveTimer += dt;
  const nextWaveAt = (waveNum === 0) ? CONFIG.firstWaveDelay : CONFIG.waveInterval;
  if(waveTimer > nextWaveAt){
    waveTimer = 0;
    waveNum++;
    spawnWave(waveNum);
  }
}

function spawnWave(n){
  // 1-я волна: ровно 1 обычный зомби, без конусов
  if(n === 1){
    zombies.push(makeZombie(Math.floor(Math.random()*ROWS), 'normal'));
    showMsg('ВОЛНА 1', 1200);
    return;
  }

  const count = 1 + Math.floor(n*0.5);
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      if(gameOver) return;
      const r = Math.floor(Math.random()*ROWS);
      let type = 'normal';

      // Приоритет: zomboni > bucket > cone
      const roll = Math.random();
      if(n >= 6 && roll < 0.15)       type = 'zomboni';
      else if(n >= 5 && roll < 0.30)  type = 'bucket';
      else if(n >= 4 && roll < 0.55)  type = 'cone';

      zombies.push(makeZombie(r, type));
    }, i*1200);
  }
  showMsg('ВОЛНА '+n, 1200);
}

function makeZombie(r, type){
  let hp = CONFIG.zombieHP;
  let speed = CONFIG.zombieSpeed;
  let isCone = false, isBucket = false, isZomboni = false;

  if(type === 'cone')    { hp = CONFIG.coneZombieHP;   isCone = true; }
  if(type === 'bucket')  { hp = CONFIG.bucketZombieHP; isBucket = true; }
  if(type === 'zomboni') { hp = CONFIG.zomboniHP; speed = CONFIG.zomboniSpeed; isZomboni = true; }

  return {
    r, x: canvas.width + 20,
    hp, maxHp: hp, speed, slow: 0, alive: true,
    cellCol: COLS-1, isCone, isBucket, isZomboni, type
  };
}

function killZombie(z){
  z.alive = false;
  for(let i=0;i<8;i++){
    particles.push({
      x:z.x, y:z.r*CELL_H+GRID_Y+CELL_H/2,
      vx:(Math.random()-.5)*200, vy:(Math.random()-.5)*200,
      life:0.5, color:'#8d6e63'
    });
  }
}

function triggerGameOver(){
  gameOver = true;
  showMsg('ЗОМБИ СЪЕЛИ ТВОИ МОЗГИ 🧟', 5000);
}

/* ---------- Тап по канвасу ---------- */
function handleTap(clientX, clientY){
  if(gameOver || paused) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (clientX - rect.left) * scaleX;
  const my = (clientY - rect.top)  * scaleY;

  for(let i=suns.length-1;i>=0;i--){
    const s = suns[i];
    if(Math.hypot(s.x-mx, s.y-my) < 34 && !s.collected){
      s.collected = true;
      sun += s.value;
      sunEl.textContent = '☀ '+sun;
      refreshCards();
      return;
    }
  }

  if(selectedPlant){
    const cell = posToCell(mx, my);
    if(cell && !plantAt(cell.r, cell.c)){
      const def = PLANTS.find(p=>p.id===selectedPlant);
      if(sun >= def.cost && cooldowns[def.id]<=0){
        plants.push({
          id:def.id, r:cell.r, c:cell.c, hp:def.hp, maxHp:def.hp,
          alive:true,
          timer: def.id==='sunflower' ? CONFIG.sunflowerFirstProduce : 0,
          fuse: def.id==='cherry' ? 1.0 : 0
        });
        sun -= def.cost;
        cooldowns[def.id] = def.cd;
        sunEl.textContent = '☀ '+sun;
        selectedPlant = null;
        refreshCards();
      }
    }
  }
}

canvas.addEventListener('click', e=>{
  handleTap(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  handleTap(t.clientX, t.clientY);
}, {passive:false});

/* ---------- Отрисовка ---------- */
function render(){
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      ctx.fillStyle = ((r+c)%2===0) ? '#8bc34a' : '#7cb342';
      ctx.fillRect(GRID_X+c*CELL_W, GRID_Y+r*CELL_H, CELL_W, CELL_H);
    }
  }
  ctx.strokeStyle = '#33691e';
  ctx.lineWidth = 3;
  ctx.strokeRect(GRID_X, GRID_Y, COLS*CELL_W, ROWS*CELL_H);

  for(let r=0;r<ROWS;r++){
    ctx.fillStyle = '#555';
    ctx.fillRect(GRID_X-60, GRID_Y+r*CELL_H+30, 50, 40);
    ctx.fillStyle = '#888';
    ctx.fillRect(GRID_X-55, GRID_Y+r*CELL_H+35, 40, 10);
  }

  for(const p of plants){
    const c = cellCenter(p.r,p.c);
    const def = PLANTS.find(x=>x.id===p.id);
    ctx.font = '40px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.icon, c.x, c.y);
    if(p.hp < p.maxHp){
      ctx.fillStyle = '#0008';
      ctx.fillRect(c.x-25, c.y+30, 50, 5);
      ctx.fillStyle = '#e53935';
      ctx.fillRect(c.x-25, c.y+30, 50*(p.hp/p.maxHp), 5);
    }
    if(p.id==='cherry' && Math.floor(p.fuse*10)%2===0){
      ctx.fillStyle='#ff000066';
      ctx.beginPath(); ctx.arc(c.x,c.y,35,0,Math.PI*2); ctx.fill();
    }
  }

  for(const pr of projectiles){
    ctx.fillStyle = pr.color;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0006'; ctx.stroke();
  }

  for(const z of zombies){
    const y = GRID_Y + z.r*CELL_H + CELL_H/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';

    if(z.slow>0){
      ctx.fillStyle='#4fc3f7';
      ctx.beginPath(); ctx.arc(z.x, y, 28, 0, Math.PI*2); ctx.fill();
    }

    // Зомби на катке — рисуем машинку
    if(z.isZomboni){
      ctx.font = '42px serif';
      ctx.fillText('🚜', z.x-8, y);
      ctx.font = '28px serif';
      ctx.fillText('🧟', z.x+18, y-8);
    } else {
      // Обычный / конус / ведро
      ctx.font = '42px serif';
      let icon = '🧟';
      if(z.isCone)   icon = '🧟‍♂️';
      if(z.isBucket) icon = '🧟‍♂️';
      ctx.fillText(icon, z.x, y);

      // Аксессуары
      if(z.isCone){
        ctx.font = '20px serif';
        ctx.fillText('🔺', z.x, y-30);
      }
      if(z.isBucket){
        ctx.font = '22px serif';
        ctx.fillText('🪣', z.x, y-32);
      }
    }

    // HP бар
    ctx.fillStyle='#0008';
    ctx.fillRect(z.x-22, y-38, 44, 5);
    ctx.fillStyle = z.hp/z.maxHp>0.5?'#4caf50':'#e53935';
    ctx.fillRect(z.x-22, y-38, 44*(z.hp/z.maxHp), 5);
  }

  for(const s of suns){
    const pulse = 1 + Math.sin(gameTime*6)*0.08;
    ctx.fillStyle='#ffeb3b';
    ctx.beginPath(); ctx.arc(s.x, s.y, 22*pulse, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fbc02d'; ctx.lineWidth=3; ctx.stroke();
    ctx.font='16px serif'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('☀', s.x, s.y);
  }

  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life*1.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-3, p.y-3, 6, 6);
    ctx.globalAlpha = 1;
  }
}

/* ---------- Клавиатура для ПК ---------- */
document.addEventListener('keydown', e=>{
  if(e.key===' ' || e.key==='p' || e.key==='P'){
    if(!gameOver){
      paused = !paused;
      pauseBtn.textContent = paused ? '▶' : '⏸';
      pauseBtn.classList.toggle('paused', paused);
      pauseOverlay.classList.toggle('show', paused);
    }
    return;
  }
  const p = PLANTS.find(x=>x.key===e.key);
  if(p && cooldowns[p.id]<=0 && sun>=p.cost){
    selectedPlant = p.id; refreshCards();
  }
  if(e.key==='Escape'){ selectedPlant=null; refreshCards(); }
});

setTimeout(fitCanvas, 50);
</script>
</body>
</html>
