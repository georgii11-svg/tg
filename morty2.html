<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рик и Морти: Гиперкуб</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #1a4d2e 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, #2d1a4d 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #0a0e1a 0%, #000 80%);
    background-attachment: fixed;
    color: #e8f5e9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .game {
    max-width: 520px;
    width: 100%;
    background: rgba(10, 15, 25, 0.88);
    border: 2px solid #6ee37c;
    border-radius: 18px;
    padding: 22px 20px 18px;
    box-shadow: 0 0 40px rgba(110, 227, 124, 0.25), 0 20px 60px rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #6ee37c;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px dashed #2a4a3a;
    gap: 10px;
    flex-wrap: wrap;
  }
  .hud .inv { color: #f7c948; font-size: 12px; text-transform: none; letter-spacing: 0; }
  .hud .ep { color: #8a7ad6; }
  .scene-title {
    font-size: 13px;
    color: #6ee37c;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .scene-text {
    font-size: 15px;
    line-height: 1.65;
    color: #d8e8dc;
    margin-bottom: 20px;
    min-height: 100px;
    white-space: pre-wrap;
  }
  .scene-text .rick { color: #6ee37c; font-weight: 600; }
  .scene-text .morty { color: #f7c948; font-weight: 600; }
  .scene-text .you { color: #5eb3ff; font-weight: 600; }
  .scene-text .sys { color: #8a7ad6; font-style: italic; }
  .scene-text .danger { color: #ff5c5c; font-weight: 600; }
  .scene-text .new { color: #ff9f43; font-weight: 600; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    background: #14202e;
    border: 1px solid #1e3a4a;
    border-radius: 10px;
    color: #c8dcdc;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .choice:hover, .choice:active {
    background: #1c2e40;
    border-color: #6ee37c;
    color: #e8f5e9;
    transform: translateX(3px);
  }
  .choice .arrow { color: #6ee37c; margin-right: 8px; }
  .choice .risk { color: #ff5c5c; }
  .choice .smart { color: #6ee37c; }
  .end-screen {
    text-align: center;
    padding: 12px 0;
  }
  .end-screen .final { font-size: 42px; margin-bottom: 10px; }
  .end-screen .verdict {
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 700;
  }
  .verdict.bad { color: #ff5c5c; }
  .verdict.good { color: #6ee37c; }
  .verdict.weird { color: #f7c948; }
  .verdict.neutral { color: #8a7ad6; }
  .end-screen .desc {
    font-size: 14px;
    color: #a8b8bc;
    line-height: 1.65;
    margin-bottom: 20px;
  }
  .replay {
    display: inline-block;
    padding: 11px 22px;
    background: #14202e;
    color: #6ee37c;
    border: 1px solid #6ee37c;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    margin: 4px;
  }
  .replay:hover { background: #1c2e40; box-shadow: 0 0 20px rgba(110,227,124,0.3); }
  .fade { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="game">

<span class="rick">РИК:</span> Подъём, <span class="rick">свежий</span>. У нас проблема. Большая. Точнее — <span class="danger">вселенского масштаба</span>. Ну, как всегда.

        text: `<span class="rick">РИК:</span> План такой. Мы идём к <span class="new">Кзарну</span> — это инженер, который делает <span class="smart">стабилизаторы</span> для гиперкубов. Он живёт на планете <span class="new">Мортелл-9</span>. Скучная дыра. Жара сорок два градуса. Пыль. И у него <span class="danger">плохой характер</span>.

    const content = document.getElementById('content');
    const invVal = document.getElementById('invVal');
    const chapterLabel = document.getElementById('chapterLabel');
    const epLabel = document.getElementById('epLabel');

    function renderInv() {
      invVal.textContent = state.inv.length ? state.inv.join(', ') : 'пусто';
    }

    function renderScene(id) {
      const s = scenes[id];
      if (!s) return;

      if (s.chapter) chapterLabel.textContent = s.chapter;

      if (s.end) {
        state.flags.ended = true;
        content.innerHTML = `
          <div class="end-screen fade">
            <div class="final">${s.icon}</div>
            <div class="verdict ${s.verdict}">${s.title}</div>
            <div class="desc">${s.desc}</div>
            <button class="replay" onclick="restart()">Начать заново</button>
          </div>
        `;
        return;
      }

      state.steps++;

      const available = s.choices.filter(c => !c.need || state.inv.includes(c.need));

      let choicesHtml = available.map((c) => {
        const cls = c.risk ? 'risk' : c.smart ? 'smart' : '';
        return `<button class="choice" onclick="choose('${c.next}', '${(c.pickup || '').replace(/'/g, "\\'")}')">
          <span class="arrow">▸</span><span class="${cls}">${c.text}</span>
        </button>`;
      }).join('');

      content.innerHTML = `
        <div class="fade">
          <div class="scene-text">${s.text}</div>
          <div class="choices">${choicesHtml}</div>
        </div>
      `;
    }

    function choose(next, pickup) {
      if (pickup && !state.inv.includes(pickup)) {
        state.inv.push(pickup);
        renderInv();
      }
      renderScene(next);
    }

    function restart() {
      state.inv = [];
      state.flags = {};
      state.steps = 0;
      renderScene('start');
      renderInv();
    }

    renderScene('start');
    renderInv();
  </script>
