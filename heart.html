<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ты лучший (ая)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #2a0d3a 0%, #0a0a14 60%, #000 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    user-select: none;
    position: relative;
  }

  /* звёздное небо */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* центральная надпись */
  #message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    text-align: center;
    padding: 0 20px;
    width: 100%;
    animation: appear 1.5s ease-out;
  }
  @keyframes appear {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  #message h1 {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    background: linear-gradient(135deg, #ff6b9d 0%, #ffb800 50%, #ff6b9d 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
    text-shadow: 0 0 40px rgba(255, 107, 157, 0.5);
    animation: shine 3s linear infinite;
  }
  @keyframes shine {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  #message .sub {
    font-size: 18px;
    color: #d0d0e0;
    letter-spacing: 2px;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeIn 1.5s ease-out 0.8s forwards;
  }
  #message .hearts-row {
    font-size: 36px;
    margin-top: 24px;
    opacity: 0;
    animation: fadeIn 1.5s ease-out 1.2s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* падающие сердечки */
  .heart {
    position: fixed;
    top: -60px;
    z-index: 10;
    pointer-events: none;
    animation: fall linear forwards;
    filter: drop-shadow(0 0 10px currentColor);
  }
  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg) scale(0.5);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(110vh) rotate(360deg) scale(1);
      opacity: 0;
    }
  }

  /* вспышки-салют */
  .firework {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
  }
  .firework-burst {
    position: fixed;
    pointer-events: none;
    z-index: 20;
  }
  .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* вспышка на весь экран */
  .big-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    opacity: 0;
    animation: bigFlash 0.5s ease-out forwards;
  }
  @keyframes bigFlash {
    0% { opacity: 0; }
    40% { opacity: 0.7; }
    100% { opacity: 0; }
  }

  /* кнопка сердечек */
  #heartBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    padding: 16px 40px;
    background: linear-gradient(135deg, #ff6b9d, #ff4a7a);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 0 #a82a4a, 0 14px 30px rgba(255, 74, 122, 0.4);
    transition: all 0.1s ease;
    animation: pulseBtn 2s ease-in-out infinite;
  }
  @keyframes pulseBtn {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.06); }
  }
  #heartBtn:active {
    transform: translateX(-50%) translateY(5px) scale(1.02);
    box-shadow: 0 3px 0 #a82a4a, 0 6px 15px rgba(255, 74, 122, 0.4);
  }

  @media (max-width: 520px) {
    #message h1 { font-size: 40px; }
    #message .sub { font-size: 15px; }
    #message .hearts-row { font-size: 28px; }
  }
</style>
</head>
<body>

  <div id="stars"></div>

  <div id="message">
    <h1>Ты лучший (ая)</h1>
    <div class="sub">и это чистая правда</div>
    <div class="hearts-row">❤️ 💖 💕 💗 ❤️</div>
  </div>

  <button id="heartBtn">Ещё сердечек</button>

  <script>
    // ================== ЗВЁЗДЫ ==================
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      if (Math.random() < 0.3) {
        s.style.width = '3px';
        s.style.height = '3px';
      }
      starsEl.appendChild(s);
    }

    // ================== ЦВЕТА ==================
    const COLORS = ['#ff6b9d', '#ff4a7a', '#ffb800', '#ff8fb0', '#ffdd60', '#ff5c9d', '#ffe066', '#ff8fab'];
    const HEART_SHAPES = ['❤️', '💖', '💕', '💗', '💝', '💓', '💞'];

    // ================== ПАДАЮЩИЕ СЕРДЕЧКИ ==================
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = HEART_SHAPES[Math.floor(Math.random() * HEART_SHAPES.length)];
      h.style.left = Math.random() * 100 + '%';
      const size = 18 + Math.random() * 30;
      h.style.fontSize = size + 'px';
      h.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const dur = 3 + Math.random() * 4;
      h.style.animationDuration = dur + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), dur * 1000 + 200);
    }

    // ================== САЛЮТ ==================
    function spawnFirework(x, y) {
      const burst = document.createElement('div');
      burst.className = 'firework-burst';
      burst.style.left = x + '%';
      burst.style.top = y + '%';
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const particleCount = 16 + Math.floor(Math.random() * 12);

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.background = color;
        p.style.boxShadow = '0 0 10px ' + color + ', 0 0 20px ' + color;
        burst.appendChild(p);

        const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.3;
        const dist = 60 + Math.random() * 100;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)',
          fill: 'forwards'
        });
      }

      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 1800);
    }

    function randomFirework() {
      const x = 15 + Math.random() * 70;
      const y = 15 + Math.random() * 50;
      spawnFirework(x, y);
    }

    // ================== ВСПЫШКА ==================
    function bigFlash() {
      const f = document.createElement('div');
      f.className = 'big-flash';
      f.style.background = 'radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, rgba(255,107,157,0.5) 40%, transparent 70%)';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 600);
    }

    // ================== СТАРТОВЫЙ САЛЮТ ==================
    function startShow() {
      // Первые сердечки
      for (let i = 0; i < 12; i++) {
        setTimeout(spawnHeart, i * 150);
      }

      // Салюты
      setTimeout(() => { randomFirework(); spawnFirework(50, 30); }, 400);
      setTimeout(() => spawnFirework(25, 40), 900);
      setTimeout(() => spawnFirework(75, 35), 1400);
      setTimeout(() => randomFirework(), 1900);
      setTimeout(() => spawnFirework(50, 20), 2400);
      setTimeout(() => randomFirework(), 2900);
    }

    // ================== ФОНОВЫЙ ПОТОК ==================
    // сердечки падают постоянно
    setInterval(spawnHeart, 350);

    // салют каждые 1.5 секунды
    setInterval(randomFirework, 1500);

    // вспышка раз в 6 секунд
    setInterval(bigFlash, 6000);

    // при первом открытии — большой салют
    window.addEventListener('load', () => {
      setTimeout(startShow, 300);
    });

    // на тап по экрану — салют прямо там
    document.addEventListener('click', (e) => {
      // если это не кнопка
      if (e.target.id === 'heartBtn') return;
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      spawnFirework(x, y);
      // ещё 5 сердечек вокруг
      for (let i = 0; i < 5; i++) setTimeout(spawnHeart, i * 80);
    });

    // кнопка
    document.getElementById('heartBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      // залп из 30 сердечек
      for (let i = 0; i < 30; i++) {
        setTimeout(spawnHeart, i * 60);
      }
      // тройной салют
      spawnFirework(25, 25);
      spawnFirework(50, 35);
      spawnFirework(75, 25);
      bigFlash();
    });
  </script>
</body>
</html>
