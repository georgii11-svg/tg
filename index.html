<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 4.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#map{position:fixed;inset:9px 9px auto auto;width:112px;height:84px;border:2px solid #ffffff99;border-radius:8px;z-index:3}
#hud{position:fixed;top:8px;left:9px;z-index:3;pointer-events:none;text-shadow:1px 2px #000;font-weight:bold}
#title{color:#85ff91;font-size:19px}
#stats{font-size:12px;line-height:1.6;margin-top:4px}
#hint{font-size:12px;max-width:225px;margin-top:3px}
#joy{position:fixed;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#ffffff25;border:3px solid #ffffff77;z-index:5;touch-action:none}
#knob{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:#ffffffbb;border:3px solid white;pointer-events:none}
.btn{position:fixed;right:12px;z-index:5;width:91px;min-height:46px;border:2px solid #ffffff77;border-radius:13px;background:#202c38ed;color:white;font-size:11px;font-weight:bold;touch-action:manipulation}
#use{bottom:15px}
#action{bottom:68px;background:#853c42ed}
#shopBtn{bottom:121px;background:#247447ed}
#job{bottom:174px;background:#8c7130ed}
#toast{position:fixed;top:40%;left:5%;width:90%;text-align:center;font-size:19px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none;z-index:4}
#panel{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);max-height:80vh;overflow:auto;background:#17232a;border:2px solid #91ffa0;border-radius:18px;padding:16px}
#panel h2{margin:0;color:#91ffa0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff12;border-radius:10px;padding:9px;margin:7px 0}
.item button,#close{background:#287b43;color:white;border:0;border-radius:8px;padding:9px;font-weight:bold}
#close{width:100%;margin-top:8px;background:#495660}
@media(max-height:480px){
#joy{width:105px;height:105px;bottom:8px;left:8px}
#knob{left:25px;top:25px;width:49px;height:49px}
.btn{min-height:39px;right:8px}
#use{bottom:7px}#action{bottom:51px}#shopBtn{bottom:95px}#job{bottom:139px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="map"></canvas>

<div id="hud">
  <div id="title">GOB CITY 4.0</div>
  <div id="stats"></div>
  <div id="hint">Двигай джойстик. Подходи к жёлтым кругам!</div>
</div>

<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="use">В / ВЫЙТИ</button>
<button class="btn" id="action">ДЕЙСТВИЕ</button>
<button class="btn" id="shopBtn">МАГАЗИН</button>
<button class="btn" id="job">ЗАДАНИЕ</button>

<div id="panel">
  <h2 id="panelTitle">GOB CITY</h2>
  <p id="panelText"></p>
  <div id="items"></div>
  <button id="close">ЗАКРЫТЬ</button>
</div>

<script>
(()=>{
"use strict";

const $=id=>document.getElementById(id);
const cv=$("game"),ctx=cv.getContext("2d");
const map=$("map"),mc=map.getContext("2d");
let W=innerWidth,H=innerHeight,D=1;

function resize(){
  W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(W*D);cv.height=Math.floor(H*D);
  ctx.setTransform(D,0,0,D,0,0);
  map.width=224;map.height=168;
}
addEventListener("resize",resize);resize();

const world={w:3200,h:2400};
let seed=5172;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const player={
  x:400,y:100,angle:0,speed:180,hp:100,maxHp:100,
  money:180,gun:false,ammo:0,damage:20
};
let car=null;
let wanted=0,crime=0;
let arrested=false,prisonEscapes=0;
let toastTimer=0,mission=null,missionIndex=0;
let delivery=null,deliveryTarget=null;
let panelOpen=false,gameOver=false;
let invulnerable=0,attackCooldown=0;
const cam={x:0,y:0};
const joy={x:0,y:0,active:false};
const keys={};
const buildings=[],cars=[],people=[],cops=[],bullets=[];
const roadsX=[],roadsY=[];
const prison={x:2600,y:200,w:400,h:250,gateX:2800,gateY:450};
const colors=["#59616b","#77675c","#4c6971","#6c687c","#686b52"];

for(let x=100;x<world.w;x+=400)roadsX.push(x);
for(let y=100;y<world.h;y+=400)roadsY.push(y);

function inPrison(x,y){
  return x>prison.x-35&&x<prison.x+prison.w+35&&
         y>prison.y-35&&y<prison.y+prison.h+35;
}
for(let bx=150;bx<world.w-70;bx+=400){
  for(let by=150;by<world.h-70;by+=400){
    for(let i=0;i<3;i++){
      const b={
        x:bx+rand()*125,y:by+rand()*125,
        w:65+rand()*100,h:65+rand()*100,
        c:colors[Math.floor(rand()*colors.length)]
      };
      if(!inPrison(b.x+b.w/2,b.y+b.h/2))buildings.push(b);
    }
  }
}
function blocked(x,y,r=9){
  if(x<r||y<r||x>world.w-r||y>world.h-r)return true;
  if(inPrison(x,y)&&!arrested)return false;
  for(const b of buildings){
    if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
  }
  return false;
}
function moveObj(o,dx,dy,r=9){
  if(!blocked(o.x+dx,o.y,r))o.x+=dx;
  if(!blocked(o.x,o.y+dy,r))o.y+=dy;
}
function roadPoint(){
  const vertical=rand()<.5;
  if(vertical){
    return {x:roadsX[Math.floor(rand()*roadsX.length)]+(rand()-.5)*90,
      y:100+rand()*(world.h-200)};
  }
  return {x:100+rand()*(world.w-200),
    y:roadsY[Math.floor(rand()*roadsY.length)]+(rand()-.5)*90};
}
function makeCar(x,y,police=false){
  return {x,y,angle:rand()*Math.PI*2,speed:0,police,hp:100};
}
for(let i=0;i<24;i++){
  const p=roadPoint(),c=makeCar(p.x,p.y);
  c.color=["#b94141","#4178b9","#d3b74c","#e0e0e0","#343b43"][i%5];
  cars.push(c);
}
for(let i=0;i<34;i++){
  const p=roadPoint();
  people.push({
    x:p.x,y:p.y,hp:50,alive:true,
    c:["#f0b68b","#e8d5a5","#8ed0bd","#e4a2b6"][i%4],
    angle:rand()*Math.PI*2,kind:"civilian",cool:rand()*3
  });
}
function addGang(x,y){
  people.push({x,y,hp:60,alive:true,c:"#d44b40",angle:rand()*6.28,
    kind:"gang",cool:0});
}
for(let i=0;i<12;i++){
  const p=roadPoint();addGang(p.x,p.y);
}
function notify(text,time=2.5){
  $("toast").textContent=text;toastTimer=time;
}
function setHint(text){$("hint").textContent=text}
function addWanted(amount){
  wanted=clamp(wanted+amount,0,5);
  crime+=amount;
}
function starText(){
  const n=Math.ceil(wanted);
  return "★".repeat(n)+"☆".repeat(5-n);
}
function updateHUD(){
  $("stats").innerHTML=
    "❤ "+Math.ceil(player.hp)+"/"+player.maxHp+
    "<br>💵 $"+Math.floor(player.money)+
    "<br>🔫 "+(player.gun?player.ammo:"нет")+
    "<br>🚨 "+starText()+
    "<br>🎯 "+(mission?mission.label:"нет задания");
}

function makeMission(index){
  const types=[
    {type:"gang",label:"Победи 10 бандитов",need:10,reward:500},
    {type:"civilian",label:"Победи 5 прохожих",need:5,reward:650},
    {type:"police",label:"Победи 4 полицейских",need:4,reward:900},
    {type:"buy",label:"Купи аптечку в магазине",need:1,reward:450},
    {type:"delivery",label:"Доставь посылку",need:1,reward:800}
  ];
  const t=types[index%types.length];
  const p=roadPoint();
  return {...t,x:p.x,y:p.y,progress:0,started:false};
}
mission=makeMission(0);

function completeMission(){
  if(!mission)return;
  player.money+=mission.reward;
  notify("ЗАДАНИЕ ВЫПОЛНЕНО! +$"+mission.reward,3);
  missionIndex++;
  mission=makeMission(missionIndex);
}
function missionProgress(type){
  if(!mission||!mission.started||mission.type!==type)return;
  mission.progress++;
  if(mission.progress>=mission.need)completeMission();
}
function showPanel(title,text,items){
  panelOpen=true;
  $("panel").style.display="block";
  $("panelTitle").textContent=title;
  $("panelText").textContent=text;
  $("items").innerHTML="";
  for(const item of items){
    const row=document.createElement("div");row.className="item";
    const label=document.createElement("span");label.textContent=item.name+" — $"+item.price;
    const button=document.createElement("button");button.textContent="КУПИТЬ";
    button.onclick=()=>{
      if(player.money<item.price){notify("Не хватает денег!");return}
      if(item.id==="med"){
        if(player.hp>=player.maxHp){notify("Здоровье уже полное!");return}
        player.money-=item.price;player.hp=Math.min(player.maxHp,player.hp+50);
      }else if(item.id==="gun"){
        player.money-=item.price;player.gun=true;player.ammo+=12;
      }else if(item.id==="ammo"){
        if(!player.gun){notify("Сначала купи оружие!");return}
        player.money-=item.price;player.ammo+=12;
      }else if(item.id==="food"){
        player.money-=item.price;player.hp=Math.min(player.maxHp,player.hp+15);
      }
      if(mission&&mission.started&&mission.type==="buy")missionProgress("buy");
      notify("Покупка успешна!");
      updateHUD();openShop();
    };
    row.append(label,button);$("items").append(row);
  }
  const close=document.createElement("button");
  close.textContent="ЗАКРЫТЬ";close.id="dynamicClose";
  close.style.cssText="width:100%;padding:10px;margin-top:8px;background:#495660;color:white;border:0;border-radius:8px";
  close.onclick=closePanel;
  $("items").append(close);
}
function closePanel(){
  panelOpen=false;$("panel").style.display="none";
}
function openShop(){
  showPanel("МАГАЗИН","Покупки за игровые деньги.",[
    {id:"med",name:"Аптечка (+50 HP)",price:80},
    {id:"food",name:"Еда (+15 HP)",price:25},
    {id:"gun",name:"Пистолет (+12 патронов)",price:250},
    {id:"ammo",name:"Патроны (+12)",price:90}
  ]);
}
$("close").onclick=closePanel;
$("shopBtn").onclick=()=>{if(!panelOpen)openShop()};
$("job").onclick=()=>{
  if(!mission){mission=makeMission(missionIndex)}
  const d=distance(player,mission);
  if(!mission.started){
    if(d<115){
      mission.started=true;
      notify("ЗАДАНИЕ НАЧАТО: "+mission.label,3);
    }else notify("Подойди к жёлтому кругу!",2);
  }else{
    notify(mission.label+" ("+mission.progress+"/"+mission.need+")",2);
  }
};
$("action").onclick=()=>action();
$("use").onclick=()=>useVehicle();

function nearestPerson(max=75){
  let best=null,bd=max;
  for(const p of people){
    if(!p.alive)continue;
    const d=distance(player,p);
    if(d<bd){bd=d;best=p}
  }
  for(const c of cops){
    if(!c.alive)continue;
    const d=distance(player,c);
    if(d<bd){bd=d;best=c}
  }
  return best;
}
function action(){
  if(panelOpen)return;
  if(arrested){tryEscape();return}
  if(player.gun&&player.ammo>0){
    let target=nearestPerson(270);
    if(target){
      const d=distance(player,target);
      if(d>0){
        bullets.push({x:player.x,y:player.y,
          vx:(target.x-player.x)/d*520,
          vy:(target.y-player.y)/d*520,life:.5});
        player.ammo--;addWanted(.65);
      }else hitTarget(target);
    }else notify("Нет цели поблизости!");
    return;
  }
  const target=nearestPerson(48);
  if(target){hitTarget(target);return}
  notify("Подойди ближе к человеку или купи оружие!");
}
function hitTarget(target){
  if(!target||!target.alive)return;
  target.hp-=player.damage;
  addWanted(target.kind==="cop"?1.3:.75);
  if(target.hp<=0){
    target.alive=false;
    if(target.kind==="gang")missionProgress("gang");
    else if(target.kind==="civilian")missionProgress("civilian");
    else if(target.kind==="cop")missionProgress("police");
    if(target.kind==="gang")player.money+=15;
    if(target.kind==="civilian")player.money+=5;
    notify(target.kind==="cop"?"Полицейский выведен из строя!":"Цель побеждена!");
  }
}
function useVehicle(){
  if(arrested){tryEscape();return}
  if(car){car=null;notify("Ты вышел из машины");return}
  let nearest=null,bd=65;
  for(const c of cars){
    const d=distance(player,c);
    if(d<bd){bd=d;nearest=c}
  }
  if(nearest){car=nearest;notify("Ты сел в машину!");return}
  if(inPrison(player.x,player.y)){
    tryEscape();return;
  }
  notify("Подойди к машине!");
}

function addCop(){
  const a=rand()*Math.PI*2;
  cops.push({
    x:clamp(player.x+Math.cos(a)*500,30,world.w-30),
    y:clamp(player.y+Math.sin(a)*500,30,world.h-30),
    hp:70,alive:true,kind:"cop",angle:0,cool:1
  });
}
let copTimer=0;
function arrestPlayer(){
  if(arrested)return;
  arrested=true;car=null;
  player.money=Math.max(0,player.money-100);
  player.x=prison.x+prison.w/2;player.y=prison.y+prison.h/2;
  player.hp=Math.max(40,player.hp);
  wanted=Math.max(0,wanted-1);
  prisonEscapes=0;
  notify("ТЕБЯ АРЕСТОВАЛИ! Потеряно $100",3);
}
function tryEscape(){
  if(!arrested)return;
  const gate={x:prison.gateX,y:prison.gateY};
  if(distance(player,gate)<95){
    arrested=false;prisonEscapes++;
    player.x=gate.x;player.y=gate.y+45;
    wanted=clamp(wanted+.7,0,5);
    addWanted(0);
    notify("ПОБЕГ УДАЛСЯ! Розыск вырос на 0.7",3);
    for(let i=0;i<2+prisonEscapes;i++)addCop();
  }else{
    notify(prisonEscapes>0?"Тюрьма усилена! Найди ворота.":"Найди ворота и нажми В / ВЫЙТИ");
  }
}
function update(dt){
  if(panelOpen||gameOver)return;
  if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$("toast").textContent=""}
  if(invulnerable>0)invulnerable-=dt;
  if(attackCooldown>0)attackCooldown-=dt;

  let ix=joy.x,iy=joy.y;
  if(keys.ArrowLeft||keys.a)ix-=1;
  if(keys.ArrowRight||keys.d)ix+=1;
  if(keys.ArrowUp||keys.w)iy-=1;
  if(keys.ArrowDown||keys.s)iy+=1;
  const len=Math.hypot(ix,iy);
  if(len>1){ix/=len;iy/=len}
  const speed=car?270:player.speed;
  const obj=car||player;
  if(len>.05){
    obj.angle=Math.atan2(iy,ix);
    moveObj(obj,ix*speed*dt,iy*speed*dt,car?17:9);
  }
  if(car){player.x=car.x;player.y=car.y;player.angle=car.angle}

  if(mission&&distance(player,mission)<38&&!mission.started){
    setHint("Жёлтый круг: нажми ЗАДАНИЕ");
  }else if(arrested){
    setHint("ТЮРЬМА: доберись до ворот и нажми В / ВЫЙТИ");
  }else if(player.gun){
    setHint("ДЕЙСТВИЕ — стрелять. В / ВЫЙТИ — машина");
  }else{
    setHint("Джойстик — движение. ДЕЙСТВИЕ — удар");
  }

  copTimer-=dt;
  if(wanted>.2&&copTimer<=0){
    addCop();copTimer=Math.max(1.6,6-wanted);
  }
  for(const p of people){
    if(!p.alive)continue;
    p.cool-=dt;
    if(p.kind==="gang"&&wanted>0&&distance(player,p)<350){
      const d=distance(player,p)||1;
      moveObj(p,(player.x-p.x)/d*38*dt,(player.y-p.y)/d*38*dt,8);
    }else if(p.cool<=0){
      p.angle+=(rand()-.5)*2;p.cool=1+rand()*3;
    }
    if(p.kind==="gang"&&distance(player,p)<26&&p.cool<=0){
      if(invulnerable<=0){player.hp-=5;invulnerable=.8}
    }
  }
  for(const c of cops){
    if(!c.alive)continue;
    const d=distance(player,c)||1;
    if(wanted>.1&&!arrested){
      moveObj(c,(player.x-c.x)/d*(70+wanted*12)*dt,
        (player.y-c.y)/d*(70+wanted*12)*dt,9);
      if(d<24&&invulnerable<=0){
        player.hp-=10;invulnerable=1;
        if(player.hp<=0)arrestPlayer();
      }
      if(d<20&&rand()<.01)arrestPlayer();
    }
  }
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const p of people){
      if(p.alive&&Math.hypot(p.x-b.x,p.y-b.y)<13){hitTarget(p);b.life=0;break}
    }
    for(const c of cops){
      if(c.alive&&Math.hypot(c.x-b.x,c.y-b.y)<13){hitTarget(c);b.life=0;break}
    }
  }
  for(let i=bullets.length-1;i>=0;i--)if(bullets[i].life<=0)bullets.splice(i,1);

  if(player.hp<=0){arrestPlayer();player.hp=45}
  if(wanted===0&&cops.length&&rand()<dt*.06){
    const c=cops.shift();
    if(c)c.alive=false;
  }
  for(let i=cops.length-1;i>=0;i--){
    if(!cops[i].alive)cops.splice(i,1);
  }
  wanted=Math.max(0,wanted-dt*.004);
  cam.x=clamp(player.x-W/2,0,world.w-W);
  cam.y=clamp(player.y-H/2,0,world.h-H);
  updateHUD();
}

function drawRoads(){
  ctx.fillStyle="#263a2c";ctx.fillRect(0,0,world.w,world.h);
  for(let x=100;x<world.w;x+=400){
    ctx.fillStyle="#555b5b";ctx.fillRect(x-44,0,88,world.h);
    ctx.fillStyle="#d6cfa0";
    for(let y=0;y<world.h;y+=65)ctx.fillRect(x-2,y,4,30);
  }
  for(let y=100;y<world.h;y+=400){
    ctx.fillStyle="#555b5b";ctx.fillRect(0,y-44,world.w,88);
    ctx.fillStyle="#d6cfa0";
    for(let x=0;x<world.w;x+=65)ctx.fillRect(x,y-2,30,4);
  }
  for(const b of buildings){
    ctx.fillStyle="#0006";ctx.fillRect(b.x+6,b.y+7,b.w,b.h);
    ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="#ffffff15";ctx.fillRect(b.x+6,b.y+6,b.w-12,8);
    ctx.strokeStyle="#ffffff20";ctx.strokeRect(b.x,b.y,b.w,b.h);
  }
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
  ctx.fillStyle="#0008";ctx.fillRect(-18,-9,40,22);
  ctx.fillStyle=c.police?"#e6e9ed":c.color;
  ctx.fillRect(-20,-10,40,20);
  ctx.fillStyle="#253946";ctx.fillRect(-8,-8,15,16);
  ctx.fillStyle="#17191b";ctx.fillRect(-14,-12,9,4);ctx.fillRect(8,-12,9,4);
  ctx.fillRect(-14,8,9,4);ctx.fillRect(8,8,9,4);
  if(c.police){ctx.fillStyle="#e74a4a";ctx.fillRect(-4,-12,8,4)}
  ctx.restore();
}
function drawPerson(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
  ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(2,4,10,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(0,0,p.kind==="cop"?10:8,0,Math.PI*2);ctx.fill();
  if(p.kind==="cop"){
    ctx.fillStyle="#1b3555";ctx.fillRect(-8,-5,16,10);
    ctx.fillStyle="#a7e9ff";ctx.fillRect(-5,-9,10,4);
  }
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(-cam.x,-cam.y);
  drawRoads();

  ctx.fillStyle="#5a6a5c";ctx.fillRect(prison.x,prison.y,prison.w,prison.h);
  ctx.fillStyle="#252a2d";ctx.fillRect(prison.x+25,prison.y+25,prison.w-50,prison.h-50);
  ctx.strokeStyle="#c7cbd0";ctx.lineWidth=5;
  for(let x=prison.x;x<prison.x+prison.w;x+=22){
    ctx.beginPath();ctx.moveTo(x,prison.y);ctx.lineTo(x,prison.y+prison.h);ctx.stroke();
  }
  ctx.fillStyle="#d5b64b";ctx.fillRect(prison.gateX-35,prison.gateY-4,70,9);
  ctx.fillStyle="white";ctx.font="bold 15px Arial";ctx.fillText("ТЮРЬМА",prison.x+145,prison.y+130);

  if(mission){
    const pulse=10+Math.sin(Date.now()/180)*4;
    ctx.beginPath();ctx.arc(mission.x,mission.y,pulse+8,0,Math.PI*2);
    ctx.strokeStyle="#ffe64d";ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle="#ffe64d";ctx.beginPath();ctx.arc(mission.x,mission.y,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="white";ctx.font="bold 13px Arial";
    ctx.fillText("ЗАДАНИЕ",mission.x-30,mission.y-24);
  }
  if(deliveryTarget){
    ctx.fillStyle="#4ce5ff";ctx.beginPath();ctx.arc(deliveryTarget.x,deliveryTarget.y,15,0,Math.PI*2);ctx.fill();
  }
  for(const c of cars)drawCar(c);
  for(const p of people)if(p.alive)drawPerson(p);
  for(const c of cops)if(c.alive)drawPerson({...c,c:"#e8eef5"});
  for(const b of bullets){
    ctx.fillStyle="#ffe65c";ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
  }
  if(!car){
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);
    ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(2,5,13,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=invulnerable>0?"#fff":"#73ff8d";
    ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#163b26";ctx.fillRect(1,-4,8,8);
    ctx.restore();
  }
  ctx.restore();
  drawMap();
}
function drawMap(){
  mc.clearRect(0,0,224,168);
  mc.fillStyle="#263a2c";mc.fillRect(0,0,224,168);
  mc.fillStyle="#555b5b";
  for(let x=100;x<world.w;x+=400)mc.fillRect(x/world.w*224-3,0,6,168);
  for(let y=100;y<world.h;y+=400)mc.fillRect(0,y/world.h*168-3,224,6);
  if(mission){
    mc.fillStyle="#ffe64d";mc.beginPath();
    mc.arc(mission.x/world.w*224,mission.y/world.h*168,3.5,0,Math.PI*2);mc.fill();
  }
  mc.fillStyle="#ff4545";
  for(const c of cops)if(c.alive)mc.fillRect(c.x/world.w*224-2,c.y/world.h*168-2,4,4);
  mc.fillStyle="#76ff91";mc.beginPath();
  mc.arc(player.x/world.w*224,player.y/world.h*168,4,0,Math.PI*2);mc.fill();
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.04);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const joyEl=$("joy"),knob=$("knob");
function setJoy(e){
  const r=joyEl.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const max=r.width*.32,l=Math.hypot(x,y);
  if(l>max){x=x/l*max;y=y/l*max}
  joy.x=x/max;joy.y=y/max;
  knob.style.left=(r.width/2-27+x)+"px";
  knob.style.top=(r.height/2-27+y)+"px";
}
function resetJoy(){
  joy.x=0;joy.y=0;joy.active=false;
  knob.style.left="36px";knob.style.top="36px";
}
joyEl.addEventListener("pointerdown",e=>{
  e.preventDefault();joy.active=true;joyEl.setPointerCapture(e.pointerId);setJoy(e);
});
joyEl.addEventListener("pointermove",e=>{
  if(joy.active)setJoy(e);
});
joyEl.addEventListener("pointerup",resetJoy);
joyEl.addEventListener("pointercancel",resetJoy);

addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key===" "){e.preventDefault();action()}
  if(e.key.toLowerCase()==="e")useVehicle();
  if(e.key.toLowerCase()==="m")openShop();
  if(e.key.toLowerCase()==="q")$("job").click();
});
addEventListener("keyup",e=>{keys[e.key]=false});
addEventListener("contextmenu",e=>e.preventDefault());

updateHUD();
notify("Добро пожаловать в GOB CITY 4.0!",3);
})();
</script>
