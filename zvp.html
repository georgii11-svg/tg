<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plants vs Zombies</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #2a1a08; color: #fff; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  #game { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .hud {
    background: linear-gradient(180deg, #4a2a08 0%, #2a1a05 100%);
    border-bottom: 3px solid #1a0a02;
    padding: 6px 10px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-shrink: 0;
    font-size: 13px; font-weight: 800;
  }
  .sun-counter {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(180deg, #f7c948, #b8924a);
    border: 3px solid #6a4a0a;
    border-radius: 12px;
    padding: 6px 14px;
    color: #1a0a08;
    font-size: 18px;
    min-width: 100px;
    justify-content: center;
    box-shadow: 0 3px 0 #4a3a0a;
  }
  .wave-info {
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid #6a4a0a;
    color: #ffd24a;
    letter-spacing: 1px;
  }
  .mowers-info { color: #6ee37c; letter-spacing: 1px; font-size: 12px; }

  .seeds {
    background: linear-gradient(180deg, #3a2a08 0%, #1a1008 100%);
    border-bottom: 3px solid #1a0a02;
    padding: 8px 10px;
    display: flex; gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .seeds::-webkit-scrollbar { display: none; }

  .seed {
    flex-shrink: 0;
    width: 70px; height: 90px;
    background: linear-gradient(180deg, #f7c948 0%, #b8924a 100%);
    border: 3px solid #6a4a0a;
    border-radius: 10px;
    padding: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.15s;
    position: relative; box-shadow: 0 4px 0 #4a3a0a; user-select: none;
  }
  .seed.selected {
    border-color: #6ee37c;
    box-shadow: 0 0 18px rgba(110,227,124,0.8), 0 4px 0 #4a3a0a;
    transform: translateY(-3px);
  }
  .seed.disabled { opacity: 0.4; cursor: not-allowed; }
  .seed .seed-emoji { font-size: 32px; line-height: 1; }
  .seed .seed-name {
    font-size: 8px; color: #1a0a08; font-weight: 900;
    text-align: center; text-transform: uppercase;
    letter-spacing: 0.2px; line-height: 1.1;
  }
  .seed .seed-cost {
    font-size: 12px; font-weight: 900; color: #1a0a08;
    background: rgba(255,255,255,0.5);
    padding: 1px 6px; border-radius: 8px;
  }
  .seed .cooldown-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.7);
    border-radius: 8px; pointer-events: none; display: none;
  }
  .seed .cooldown-overlay.show { display: block; }

  .field-wrap {
    flex: 1; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #5a3a10 0%, #2a1a08 100%);
  }
  #field { position: absolute; inset: 0; }

  .grid-cell { position: absolute; box-sizing: border-box; }

  .plant {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; line-height: 1; z-index: 5;
    pointer-events: none;
    animation: plantPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes plantPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  .bullet {
    position: absolute; width: 14px; height: 14px;
    background: radial-gradient(circle at 30% 30%, #b6ff6e, #4a8a2a);
    border-radius: 50%; box-shadow: 0 0 10px #6ee37c;
    z-index: 3; pointer-events: none;
  }

  .zombie {
    position: absolute; font-size: 44px; line-height: 1;
    z-index: 4; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .zombie.hit { filter: brightness(2.5) saturate(0); }
  .zombie.dying { animation: zombieDie 0.6s ease-out forwards; }
  @keyframes zombieDie {
    0% { transform: rotate(0deg); opacity: 1; }
    100% { transform: rotate(90deg) translateY(30px); opacity: 0; }
  }

  .zombie-hp {
    position: absolute; height: 5px; background: #ff4040;
    border-radius: 3px; z-index: 6; pointer-events: none;
    transition: width 0.15s;
  }
  .zombie-hp-bg {
    position: absolute; height: 5px; background: rgba(0,0,0,0.5);
    border-radius: 3px; z-index: 5; pointer-events: none;
  }

  .sun {
    position: absolute; width: 54px; height: 54px;
    background: radial-gradient(circle, #ffe066 0%, #f7c948 50%, #b8924a 100%);
    border-radius: 50%;
    box-shadow: 0 0 24px #f7c948, 0 0 48px rgba(247,201,72,0.6);
    cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    animation: sunPulse 1.5s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .sun.falling { animation: sunFall 10s linear forwards; }
  @keyframes sunFall {
    0% { top: -60px; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { top: 100%; opacity: 0.3; }
  }
  .sun.collected { animation: sunCollect 0.4s ease-out forwards; }
  @keyframes sunCollect { to { transform: scale(2) translateY(-100px); opacity: 0; } }

  .mower {
    position: absolute; left: -20px;
    width: 60px; height: 70px; z-index: 7;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; pointer-events: none;
    filter: drop-shadow(0 0 12px #ff5c5c);
    transition: transform 1.5s linear;
  }
  .mower.working { transform: translateX(120vw); }

  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(20, 10, 5, 0.95);
    border: 3px solid #ffd24a; border-radius: 14px;
    padding: 18px 32px; font-size: 18px; font-weight: 900;
    color: #ffd24a; text-align: center;
    z-index: 200; pointer-events: none;
    max-width: 80vw; letter-spacing: 2px;
  }
  .toast.show { animation: toastPop 2s ease-out forwards; }
  @keyframes toastPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 300;
    padding: 20px; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 30px; color: #6ee37c; margin-bottom: 14px; letter-spacing: 2px; }
  .overlay h1.lose { color: #ff5c8a; }
  .overlay p { font-size: 14px; color: #c8c8dc; line-height: 1.6; max-width: 420px; margin-bottom: 22px; }
  .overlay button {
    padding: 14px 40px;
    background: linear-gradient(135deg, #6ee37c, #4a8a2a);
    border: none; border-radius: 40px;
    color: #0a1a0a; font-family: inherit;
    font-size: 15px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 5px 0 #2a5a1a;
  }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a5a1a; }

  .shovel-btn {
    position: fixed; bottom: 12px; right: 12px;
    width: 64px; height: 64px;
    background: linear-gradient(180deg, #b8924a, #6a4a0a);
    border: 3px solid #4a3a0a; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; cursor: pointer; z-index: 15;
    box-shadow: 0 4px 0 #2a1a0a;
  }
  .shovel-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a1a0a; }
  .shovel-btn.selected {
    border-color: #ff5c5c;
    box-shadow: 0 0 20px rgba(255,92,92,0.8), 0 4px 0 #2a1a0a;
  }
</style>
</head>
<body>

  <div id="game">
    <div class="hud">
      <div class="sun-counter">
        <span>☀️</span>
        <span id="sunCount">150</span>
      </div>
      <div class="mowers-info">🚜 <span id="mowersLeft">5</span></div>
      <div class="wave-info">ВОЛНА <span id="waveNum">1</span></div>
    </div>

    <div class="seeds" id="seedsBar"></div>

    <div class="field-wrap">
      <div id="field"></div>
      <button class="shovel-btn" id="shovelBtn" type="button">🔨</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay show" id="startOverlay">
    <h1>Plants vs Zombies</h1>
    <p>Сажай растения на газон, собирай солнце, не пусти зомби к дому. Продержись 10 волн и победи!</p>
    <p style="font-size:12px;color:#8a8a9a;">Управление: тапни по семени в панели → тапни по клетке газона. Кнопка 🔨 убирает растение.</p>
    <button id="startBtn" type="button">Играть</button>
  </div>

  <div class="overlay" id="endOverlay">
    <h1 id="endTitle">🏆 Победа!</h1>
    <p id="endText"></p>
    <button id="restartBtn" type="button">Играть снова</button>
  </div>

  <script>
    var COLS = 9;
    var ROWS = 5;

    var state = {
      sun: 150,
      wave: 0,
      totalWaves: 10,
      running: false,
      gameOver: false,
      selectedSeed: null,
      shovelMode: false,
      plants: [],
      zombies: [],
      bullets: [],
      suns: [],
      mowers: [],
      mowersLeft: 5,
      lastTime: 0,
      nextPlantId: 1,
      nextZombieId: 1,
      nextBulletId: 1,
      nextSunId: 1,
      lastSunDrop: 0,
      lastWave: 0,
      waveSpawned: 0,
      waveTarget: 0,
      firstPlaced: false,
      fieldW: 0,
      fieldH: 0,
      cellW: 0,
      cellH: 0
    };

    var PLANT_TYPES = {
      peashooter: {
        name: 'Горохострел', emoji: '🌱', cost: 100, hp: 300,
        attack: 20, fireRate: 1400, projectileSpeed: 350
      },
      sunflower: {
        name: 'Подсолнух', emoji: '🌻', cost: 50, hp: 300,
        sunProduction: 15000, sunValue: 25
      },
      wallnut: {
        name: 'Орех', emoji: '🥜', cost: 50, hp: 4000
      },
      snowpea: {
        name: 'Снежок', emoji: '❄️', cost: 175, hp: 300,
        attack: 20, fireRate: 1400, projectileSpeed: 350, slow: true
      },
      cherrybomb: {
        name: 'Вишня', emoji: '🍒', cost: 150, hp: 1,
        bomb: true, damage: 1800
      },
      repeater: {
        name: 'Повтор', emoji: '🌿', cost: 200, hp: 300,
        attack: 20, fireRate: 1400, projectileSpeed: 350, double: true
      }
    };

    var ZOMBIE_TYPES = {
      normal: { name: 'Обычный', emoji: '🧟', hp: 270, speed: 4.7, damage: 100, coins: 10 },
      cone: { name: 'Конус', emoji: '🧟', overlay: '🔺', hp: 640, speed: 4.7, damage: 100, coins: 25 },
      bucket: { name: 'Ведро', emoji: '🧟', overlay: '🪣', hp: 1370, speed: 4.7, damage: 100, coins: 50 },
      flag: { name: 'Флаг', emoji: '🧟‍♂️', overlay: '🚩', hp: 270, speed: 2.35, damage: 100, coins: 20 },
      newspaper: { name: 'Газетчик', emoji: '🧟‍♂️', overlay: '📰', hp: 670, speed: 4.7, damage: 100, coins: 35 },
      tank: { name: 'Танк', emoji: '🧟‍♀️', overlay: '🛡️', hp: 2700, speed: 7.0, damage: 200, coins: 100 }
    };

    var fieldEl = document.getElementById('field');
    var seedsBar = document.getElementById('seedsBar');
    var sunCountEl = document.getElementById('sunCount');
    var waveNumEl = document.getElementById('waveNum');
    var mowersLeftEl = document.getElementById('mowersLeft');
    var toastEl = document.getElementById('toast');
    var startOverlay = document.getElementById('startOverlay');
    var endOverlay = document.getElementById('endOverlay');
    var endTitle = document.getElementById('endTitle');
    var endText = document.getElementById('endText');
    var shovelBtn = document.getElementById('shovelBtn');

    var seedCooldowns = {};

    function calcField() {
      var wrap = fieldEl.parentElement;
      var rect = wrap.getBoundingClientRect();
      state.fieldW = rect.width;
      state.fieldH = rect.height;
      state.cellW = state.fieldW / COLS;
      state.cellH = state.fieldH / ROWS;
    }

    function cellCenter(col, row) {
      return {
        x: col * state.cellW + state.cellW / 2,
        y: row * state.cellH + state.cellH / 2
      };
    }

    function buildGrid() {
      fieldEl.innerHTML = '';
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.col = c;
          cell.dataset.row = r;
          cell.style.left = (c * state.cellW) + 'px';
          cell.style.top = (r * state.cellH) + 'px';
          cell.style.width = state.cellW + 'px';
          cell.style.height = state.cellH + 'px';
          var alt = (r + c) % 2 === 0;
          cell.style.background = alt ? 'rgba(74, 138, 42, 0.3)' : 'rgba(74, 138, 42, 0.15)';
          cell.style.border = '1px dashed rgba(255,255,255,0.08)';
          fieldEl.appendChild(cell);
        }
      }
    }

    function buildMowers() {
      state.mowers.forEach(function(m) { if (m.el) m.el.remove(); });
      state.mowers = [];
      for (var r = 0; r < ROWS; r++) {
        var cy = state.cellH * r + state.cellH / 2;
        var el = document.createElement('div');
        el.className = 'mower';
        el.textContent = '🚜';
        el.style.left = '2px';
        el.style.top = (cy - 35) + 'px';
        fieldEl.appendChild(el);
        state.mowers.push({ row: r, el: el, used: false });
      }
      state.mowersLeft = 5;
      updateMowers();
    }

    function updateMowers() { mowersLeftEl.textContent = state.mowersLeft; }

    function triggerMower(row) {
      var m = state.mowers[row];
      if (!m || m.used) return false;
      m.used = true;
      state.mowersLeft--;
      updateMowers();
      m.el.classList.add('working');
      setTimeout(function() {
        state.zombies.forEach(function(z) {
          if (z.row === row && !z.dead) {
            z.dead = true;
            z.el.classList.add('dying');
            setTimeout(function() {
              z.el.remove();
              if (z.hpEl) z.hpEl.remove();
              if (z.hpBgEl) z.hpBgEl.remove();
            }, 500);
          }
        });
      }, 800);
      setTimeout(function() {
        m.el.classList.remove('working');
        m.el.style.left = '-80px';
      }, 2000);
      showToast('🚜 Газонокосилка!');
      return true;
    }

    function buildSeedsUI() {
      seedsBar.innerHTML = '';
      for (var key in PLANT_TYPES) {
        (function(k) {
          var p = PLANT_TYPES[k];
          var el = document.createElement('div');
          el.className = 'seed';
          el.dataset.type = k;
          el.innerHTML = '<div class="seed-emoji">' + p.emoji + '</div>' +
                        '<div class="seed-name">' + p.name + '</div>' +
                        '<div class="seed-cost">☀️' + p.cost + '</div>' +
                        '<div class="cooldown-overlay"></div>';
          el.addEventListener('click', function() { selectSeed(k); });
          seedsBar.appendChild(el);
        })(key);
      }
      updateSeedsUI();
    }

    function selectSeed(type) {
      if (!state.running) return;
      state.selectedSeed = state.selectedSeed === type ? null : type;
      state.shovelMode = false;
      updateSeedsUI();
      updateShovel();
    }

    function updateSeedsUI() {
      var cells = seedsBar.querySelectorAll('.seed');
      cells.forEach(function(c) {
        var type = c.dataset.type;
        var p = PLANT_TYPES[type];
        var cdUntil = seedCooldowns[type] || 0;
        var onCd = Date.now() < cdUntil;
        if (state.selectedSeed === type) c.classList.add('selected');
        else c.classList.remove('selected');
        if (state.sun < p.cost || onCd) c.classList.add('disabled');
        else c.classList.remove('disabled');
        var overlay = c.querySelector('.cooldown-overlay');
        if (onCd) overlay.classList.add('show');
        else overlay.classList.remove('show');
      });
    }

    function tryPlantAt(col, row) {
      if (state.plants.find(function(p) { return p.col === col && p.row === row; })) return false;
      var type = state.selectedSeed;
      if (!type) return false;
      var p = PLANT_TYPES[type];
      if (state.sun < p.cost) { showToast('Мало солнца'); return false; }
      if (Date.now() < (seedCooldowns[type] || 0)) { showToast('Перезарядка'); return false; }

      state.sun -= p.cost;
      seedCooldowns[type] = Date.now() + 3000;
      updateSun();
      updateSeedsUI();

      var center = cellCenter(col, row);
      var el = document.createElement('div');
      el.className = 'plant';
      el.textContent = p.emoji;
      el.style.left = (center.x - 28) + 'px';
      el.style.top = (center.y - 28) + 'px';
      el.style.width = '56px';
      el.style.height = '56px';
      fieldEl.appendChild(el);

      var plant = {
        id: state.nextPlantId++,
        col: col, row: row, type: type,
        hp: p.hp, maxHp: p.hp,
        el: el,
        lastShot: Date.now(),
        lastSun: Date.now(),
        x: center.x, y: center.y,
        bomb: !!p.bomb,
        bombTime: p.bomb ? Date.now() + 1200 : 0,
        def: p
      };
      state.plants.push(plant);
      state.selectedSeed = null;
      updateSeedsUI();
      if (!state.firstPlaced) {
        state.firstPlaced = true;
        showToast('🌱 Волна через 30 сек!');
      }
      return true;
    }

    function removePlant(plant) {
      plant.el.remove();
      var i = state.plants.indexOf(plant);
      if (i >= 0) state.plants.splice(i, 1);
    }

    function updateSun() { sunCountEl.textContent = state.sun; }

    function spawnFallingSun() {
      if (!state.running || state.gameOver) return;
      var x = 40 + Math.random() * (state.fieldW - 80);
      var el = document.createElement('div');
      el.className = 'sun falling';
      el.textContent = '☀️';
      el.style.left = x + 'px';
      el.style.top = '-60px';
      fieldEl.appendChild(el);
      var sun = { id: state.nextSunId++, el: el, collected: false, value: 25 };
      state.suns.push(sun);
      el.addEventListener('click', function(e) { e.stopPropagation(); collectSun(sun); });
    }

    function collectSun(sun) {
      if (sun.collected) return;
      sun.collected = true;
      state.sun += sun.value;
      updateSun();
      updateSeedsUI();
      sun.el.classList.add('collected');
      setTimeout(function() {
        sun.el.remove();
        var i = state.suns.indexOf(sun);
        if (i >= 0) state.suns.splice(i, 1);
      }, 400);
    }

    function spawnPlantSun(plant) {
      var el = document.createElement('div');
      el.className = 'sun';
      el.textContent = '☀️';
      el.style.left = (plant.x - 27) + 'px';
      el.style.top = (plant.y + 20) + 'px';
      fieldEl.appendChild(el);
      var sun = { id: state.nextSunId++, el: el, collected: false, value: 25 };
      state.suns.push(sun);
      el.addEventListener('click', function(e) { e.stopPropagation(); collectSun(sun); });
    }

    function spawnZombie(type) {
      var zt = ZOMBIE_TYPES[type];
      if (!zt) return;
      var row = Math.floor(Math.random() * ROWS);
      var cy = state.cellH * row + state.cellH / 2;

      var el = document.createElement('div');
      el.className = 'zombie';
      el.textContent = zt.emoji;
      el.style.left = (state.fieldW + 20) + 'px';
      el.style.top = (cy - 28) + 'px';
      el.style.width = '56px';
      el.style.height = '56px';
      fieldEl.appendChild(el);

      if (zt.overlay) {
        var ov = document.createElement('div');
        ov.textContent = zt.overlay;
        ov.style.position = 'absolute';
        ov.style.top = '-8px';
        ov.style.fontSize = '22px';
        el.appendChild(ov);
      }

      var hpBg = document.createElement('div');
      hpBg.className = 'zombie-hp-bg';
      hpBg.style.width = '50px';
      hpBg.style.left = (state.fieldW + 25) + 'px';
      hpBg.style.top = (cy + 34) + 'px';
      fieldEl.appendChild(hpBg);

      var hpEl = document.createElement('div');
      hpEl.className = 'zombie-hp';
      hpEl.style.width = '50px';
      hpEl.style.left = (state.fieldW + 25) + 'px';
      hpEl.style.top = (cy + 34) + 'px';
      fieldEl.appendChild(hpEl);

      var speedPxPerSec = state.cellW / zt.speed;

      state.zombies.push({
        id: state.nextZombieId++,
        x: state.fieldW + 20,
        row: row,
        type: type,
        hp: zt.hp, maxHp: zt.hp,
        speed: speedPxPerSec,
        damage: zt.damage,
        el: el, hpEl: hpEl, hpBgEl: hpBg,
        eating: false, dead: false, slowUntil: 0,
        def: zt
      });
    }

    function damageZombie(z, dmg, slow) {
      z.hp -= dmg;
      z.el.classList.add('hit');
      setTimeout(function() { z.el.classList.remove('hit'); }, 100);
      if (slow) {
        z.slowUntil = Date.now() + 3000;
        z.el.style.filter = 'hue-rotate(180deg) brightness(1.2)';
      }
      var ratio = Math.max(0, z.hp / z.maxHp);
      z.hpEl.style.width = (50 * ratio) + 'px';
      if (z.hp <= 0 && !z.dead) {
        z.dead = true;
        z.el.classList.add('dying');
        z.hpEl.remove();
        z.hpBgEl.remove();
        setTimeout(function() {
          z.el.remove();
          var i = state.zombies.indexOf(z);
          if (i >= 0) state.zombies.splice(i, 1);
        }, 600);
      }
    }

    function spawnBullet(plant) {
      var p = plant.def;
      var el = document.createElement('div');
      el.className = 'bullet';
      if (p.slow) {
        el.style.background = 'radial-gradient(circle at 30% 30%, #aee4ff, #2a7ab8)';
        el.style.boxShadow = '0 0 10px #5ecbff';
      }
      el.style.left = (plant.x - 7) + 'px';
      el.style.top = (plant.y - 7) + 'px';
      fieldEl.appendChild(el);
      state.bullets.push({
        id: state.nextBulletId++,
        x: plant.x, y: plant.y, row: plant.row,
        dmg: p.attack, slow: !!p.slow,
        speed: p.projectileSpeed || 350, el: el
      });
    }

    function explodeCherry(plant) {
      var p = plant.def;
      var el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.width = '240px';
      el.style.height = '240px';
      el.style.borderRadius = '50%';
      el.style.background = 'radial-gradient(circle, #fff 0%, #ffb800 30%, #ff4040 60%, transparent 80%)';
      el.style.left = (plant.x - 120) + 'px';
      el.style.top = (plant.y - 120) + 'px';
      el.style.zIndex = '20';
      el.style.pointerEvents = 'none';
      fieldEl.appendChild(el);
      setTimeout(function() { el.remove(); }, 700);

      var toKill = [];
      state.zombies.forEach(function(z) {
        if (z.dead) return;
        var dx = Math.abs(z.x - plant.x);
        var dy = Math.abs((state.cellH * z.row + state.cellH/2) - plant.y);
        if (dx < state.cellW * 1.5 && dy < state.cellH * 1.5) {
          toKill.push(z);
        }
      });
      toKill.forEach(function(z) { damageZombie(z, p.damage, false); });
      removePlant(plant);
    }

    function gameLoop(timestamp) {
      if (!state.running) return;
      if (!state.lastTime) state.lastTime = timestamp;
      var dt = Math.min(50, timestamp - state.lastTime) / 1000;
      state.lastTime = timestamp;
      var now = Date.now();

      state.plants.forEach(function(p) {
        var def = p.def;
        if (!def) return;
        if (p.bomb && now > p.bombTime) {
          explodeCherry(p);
          return;
        }
        if (def.sunProduction && now - p.lastSun > def.sunProduction) {
          p.lastSun = now;
          spawnPlantSun(p);
        }
        if (def.attack && now - p.lastShot > def.fireRate) {
          var hasTarget = state.zombies.some(function(z) {
            return z.row === p.row && z.x > p.x && !z.dead;
          });
          if (hasTarget) {
            p.lastShot = now;
            spawnBullet(p);
            if (def.double) setTimeout(function() { spawnBullet(p); }, 150);
          }
        }
      });

      state.bullets.forEach(function(b) {
        b.x += b.speed * dt;
        b.el.style.left = (b.x - 7) + 'px';
        for (var i = 0; i < state.zombies.length; i++) {
          var z = state.zombies[i];
          if (z.dead || z.row !== b.row) continue;
          if (Math.abs(z.x + 28 - b.x) < 30) {
            damageZombie(z, b.dmg, b.slow);
            b.el.remove();
            var idx = state.bullets.indexOf(b);
            if (idx >= 0) state.bullets.splice(idx, 1);
            return;
          }
        }
        if (b.x > state.fieldW + 30) {
          b.el.remove();
          var idx = state.bullets.indexOf(b);
          if (idx >= 0) state.bullets.splice(idx, 1);
        }
      });

      state.zombies.forEach(function(z) {
        if (z.dead) return;
        var slowFactor = (z.slowUntil && Date.now() < z.slowUntil) ? 0.5 : 1;
        var plantHere = state.plants.find(function(p) {
          return p.row === z.row &&
                 Math.abs(p.x - z.x) < state.cellW * 0.6 &&
                 p.x < z.x + state.cellW * 0.4;
        });
        if (plantHere) {
          z.eating = true;
          plantHere.hp -= z.damage * dt;
          plantHere.el.style.transform = 'scale(' + (0.9 + 0.1 * (plantHere.hp / plantHere.maxHp)) + ')';
          if (plantHere.hp <= 0) {
            removePlant(plantHere);
            z.eating = false;
          }
        } else {
          z.eating = false;
          z.x -= z.speed * slowFactor * dt;
          z.el.style.left = (z.x - 28) + 'px';
          z.hpEl.style.left = (z.x - 25) + 'px';
          z.hpBgEl.style.left = (z.x - 25) + 'px';
        }
        if (z.x < 0) {
          var worked = triggerMower(z.row);
          if (!worked) endGame(false);
          z.dead = true;
          z.el.remove();
          if (z.hpEl) z.hpEl.remove();
          if (z.hpBgEl) z.hpBgEl.remove();
        }
      });

      state.zombies = state.zombies.filter(function(z) {
        return !z.dead || z.el.parentElement;
      });

      // солнце каждые 5 секунд (было 10)
      if (now - state.lastSunDrop > 5000) {
        state.lastSunDrop = now;
        spawnFallingSun();
      }

      updateWaves(now);
      requestAnimationFrame(gameLoop);
    }

    function updateWaves(now) {
      // первая волна через 30 сек после первого растения (было 10)
      if (state.lastWave === 0) {
        if (!state.firstPlaced) return;
        state.lastWave = now + 30000;
        return;
      }
      if (now > state.lastWave) {
        var aliveZombies = state.zombies.filter(function(z) { return !z.dead; }).length;
        if (state.wave >= state.totalWaves) {
          if (aliveZombies === 0) { endGame(true); return; }
          state.lastWave = now + 1000;
          return;
        }
        state.wave++;
        waveNumEl.textContent = state.wave;
        startWave();
        state.lastWave = now + 25000;
      }
    }

    function startWave() {
      var w = state.wave;
      var count;
      if (w === 1) count = 1;
      else if (w === 2) count = 2;
      else if (w === 3) count = 3;
      else if (w === 4) count = 5;
      else if (w === 5) count = 7;
      else if (w === 6) count = 9;
      else if (w === 7) count = 11;
      else if (w === 8) count = 14;
      else if (w === 9) count = 17;
      else count = 22;

      var isBig = w % 5 === 0;
      if (isBig) count = Math.floor(count * 1.3);

      state.waveTarget = count;
      state.waveSpawned = 0;

      showToast(isBig ? '🔥 БОЛЬШАЯ ВОЛНА ' + w + '!' : 'Волна ' + w);
      spawnWaveZombies();
    }

    function spawnWaveZombies() {
      if (!state.running || state.gameOver) return;
      if (state.waveSpawned >= state.waveTarget) return;
      var alive = state.zombies.filter(function(z) { return !z.dead; }).length;
      var maxAlive = 8 + state.wave;
      if (alive >= maxAlive) return;
      var now = Date.now();
      if (state._lastSpawn && now - state._lastSpawn < 2000) return;
      state._lastSpawn = now;

      var w = state.wave;
      var pool;
      if (w === 1) pool = ['normal'];
      else if (w === 2) pool = ['normal', 'cone'];
      else if (w === 3) pool = ['normal', 'cone', 'flag'];
      else if (w === 4) pool = ['normal', 'cone', 'flag', 'newspaper'];
      else if (w === 5) pool = ['normal', 'cone', 'flag', 'newspaper', 'bucket'];
      else if (w < 10) pool = ['normal', 'cone', 'flag', 'newspaper', 'bucket'];
      else pool = ['normal', 'cone', 'flag', 'newspaper', 'bucket', 'tank'];

      var type = pool[Math.floor(Math.random() * pool.length)];
      spawnZombie(type);
      state.waveSpawned++;
      setTimeout(spawnWaveZombies, 2000);
    }

    function handleFieldClick(e) {
      if (!state.running) return;
      var rect = fieldEl.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var col = Math.floor(x / state.cellW);
      var row = Math.floor(y / state.cellH);
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
      if (state.shovelMode) {
        var p = state.plants.find(function(pp) { return pp.col === col && pp.row === row; });
        if (p) { removePlant(p); showToast('Убрано'); }
        state.shovelMode = false;
        updateShovel();
        return;
      }
      if (state.selectedSeed) tryPlantAt(col, row);
    }

    function updateShovel() {
      if (state.shovelMode) shovelBtn.classList.add('selected');
      else shovelBtn.classList.remove('selected');
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.remove('show');
      void toastEl.offsetWidth;
      toastEl.classList.add('show');
    }

    function endGame(won) {
      if (state.gameOver) return;
      state.gameOver = true;
      state.running = false;
      if (won) {
        endTitle.textContent = '🏆 Победа!';
        endTitle.classList.remove('lose');
        endText.innerHTML = 'Ты отбил все 10 волн! Зомби не прорвались.<br>Газонокосилок осталось: ' + state.mowersLeft + '.';
      } else {
        endTitle.textContent = '💀 Поражение';
        endTitle.classList.add('lose');
        endText.innerHTML = 'Зомби съели твои мозги.<br>Ты дошёл до волны ' + state.wave + ' из 10.';
      }
      endOverlay.classList.add('show');
    }

    function startGame() {
      state.sun = 150;
      state.wave = 0;
      state.running = true;
      state.gameOver = false;
      state.selectedSeed = null;
      state.shovelMode = false;
      state.firstPlaced = false;
      state.waveSpawned = 0;
      state.waveTarget = 0;

      state.plants.forEach(function(p) { p.el.remove(); });
      state.zombies.forEach(function(z) {
        z.el.remove();
        if (z.hpEl) z.hpEl.remove();
        if (z.hpBgEl) z.hpBgEl.remove();
      });
      state.bullets.forEach(function(b) { b.el.remove(); });
      state.suns.forEach(function(s) { s.el.remove(); });
      state.mowers.forEach(function(m) { if (m.el) m.el.remove(); });
      state.plants = [];
      state.zombies = [];
      state.bullets = [];
      state.suns = [];
      state.mowers = [];

      state.lastSunDrop = 0;
      state.lastWave = 0;
      state.lastTime = 0;
      state._lastSpawn = 0;
      seedCooldowns = {};

      updateSun();
      waveNumEl.textContent = 1;
      startOverlay.classList.remove('show');
      endOverlay.classList.remove('show');

      setTimeout(function() {
        calcField();
        buildGrid();
        buildMowers();
        buildSeedsUI();
        updateShovel();
        requestAnimationFrame(gameLoop);
      }, 50);
    }

    fieldEl.addEventListener('click', handleFieldClick);
    fieldEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', function() {
      endOverlay.classList.remove('show');
      startGame();
    });

    shovelBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      state.shovelMode = !state.shovelMode;
      state.selectedSeed = null;
      updateSeedsUI();
      updateShovel();
    });

    window.addEventListener('resize', function() {
      if (state.running) {
        calcField();
        buildGrid();
        buildMowers();
      }
    });

    setInterval(function() { if (state.running) updateSeedsUI(); }, 200);
  </script>
</body>
</html>
