<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рик против тебя · Ролевой бой</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Courier New", "Consolas", monospace;
    background: radial-gradient(circle at 20% 10%, #0d3a2a 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, #3a1a0d 0%, transparent 45%), #000;
    background-attachment: fixed;
    color: #d8d8e0;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 10px; min-height: 100vh; overflow-x: hidden;
  }
  .game {
    max-width: 600px; width: 100%;
    background: rgba(8, 8, 18, 0.92);
    border: 1px solid #6ee37c;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 0 50px rgba(110, 227, 124, 0.2), 0 20px 60px rgba(0,0,0,0.7);
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #6ee37c; padding-bottom: 12px;
    border-bottom: 1px dashed #1e3a2a; margin-bottom: 16px; gap: 10px; flex-wrap: wrap;
  }
  .hud .hp-you { color: #5ecbff; }
  .hud .hp-rick { color: #ff5c8a; }
  .hud .turn { color: #8a7ad6; }
  .hud .state { color: #f7c948; }
  .scene-title { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #8a7ad6; margin-bottom: 10px; }
  .scene { font-size: 14.5px; line-height: 1.75; color: #c8c8dc; margin-bottom: 18px; white-space: pre-wrap; }
  .scene .rick { color: #6ee37c; font-weight: 700; }
  .scene .you { color: #5ecbff; font-weight: 700; }
  .scene .sys { color: #8a7ad6; font-style: italic; }
  .scene .danger { color: #ff4040; font-weight: 600; }
  .scene .action { color: #b8b8d0; font-style: italic; }
  .scene .good { color: #6ee37c; font-weight: 600; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .choice {
    display: block; width: 100%; text-align: left;
    padding: 13px 16px; background: #0e1018;
    border: 1px solid #24243a; border-radius: 10px;
    color: #c8c8dc; font-family: inherit; font-size: 14px;
    line-height: 1.5; cursor: pointer; transition: all 0.15s ease;
  }
  .choice:hover, .choice:active {
    background: #182028; border-color: #6ee37c; color: #fff;
    transform: translateX(3px); box-shadow: 0 0 18px rgba(110,227,124,0.25);
  }
  .choice .arrow { color: #6ee37c; margin-right: 10px; }
  .custom { display: flex; gap: 8px; margin-bottom: 8px; }
  .custom input {
    flex: 1; padding: 13px 15px; background: #0a0a14;
    border: 1px solid #2a2a48; border-radius: 10px;
    color: #e8e8f0; font-family: inherit; font-size: 13.5px;
    outline: none; transition: border-color 0.15s;
  }
  .custom input:focus { border-color: #6ee37c; box-shadow: 0 0 14px rgba(110,227,124,0.3); }
  .custom input::placeholder { color: #4a4a6a; }
  .custom button {
    padding: 0 20px; background: linear-gradient(135deg, #6e4aff, #6ee37c);
    border: none; border-radius: 10px; color: #0a0a14;
    font-family: inherit; font-size: 17px; cursor: pointer; font-weight: 700;
    transition: all 0.15s;
  }
  .custom button:hover { box-shadow: 0 0 24px rgba(110,227,124,0.6); }
  .custom button:active { transform: scale(0.95); }
  .hint { font-size: 10.5px; color: #5a5a7a; text-align: center; margin-bottom: 8px; letter-spacing: 0.5px; line-height: 1.55; }
  .fade { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-8px,3px); }
    30% { transform: translate(8px,-3px); }
    50% { transform: translate(-6px,-3px); }
    70% { transform: translate(6px,3px); }
  }
  .shake-hard { animation: shakeHard 0.7s ease; }
  @keyframes shakeHard {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    10% { transform: translate(-14px,6px) rotate(-1deg); }
    30% { transform: translate(14px,-6px) rotate(1deg); }
    50% { transform: translate(-10px,-6px) rotate(-0.6deg); }
    70% { transform: translate(10px,6px) rotate(0.6deg); }
  }
  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.12s; }
  .end-box { text-align: center; padding: 22px 10px; }
  .end-box .icon { font-size: 60px; margin-bottom: 12px; }
  .end-box .verdict { font-size: 20px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 14px; font-weight: 700; }
  .verdict.win { color: #5ecbff; text-shadow: 0 0 24px #2a8aff; }
  .verdict.lose { color: #ff2a6a; text-shadow: 0 0 24px #ff2a6a; }
  .verdict.epic { color: #f7c948; text-shadow: 0 0 24px #f7c948, 0 0 60px #ff2a6a; animation: rage 1s infinite; }
  @keyframes rage { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }
  .end-box .desc { font-size: 14px; color: #a8a8bc; line-height: 1.85; margin-bottom: 22px; }
  .replay {
    display: inline-block; padding: 12px 26px;
    background: transparent; color: #6ee37c;
    border: 1px solid #6ee37c; border-radius: 10px;
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer; transition: all 0.15s;
  }
  .replay:hover { background: rgba(110,227,124,0.15); box-shadow: 0 0 20px rgba(110,227,124,0.4); }
  .status { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; font-size: 10px; letter-spacing: 1px; }
  .status .badge {
    padding: 4px 8px; border-radius: 4px;
    background: #0e1018; border: 1px solid #24243a; color: #4a4a6a;
    text-transform: uppercase;
  }
  .status .badge.on {
    background: rgba(110,227,124,0.12); border-color: #6ee37c; color: #6ee37c;
    box-shadow: 0 0 8px rgba(110,227,124,0.35);
  }
  .status .badge.danger { background: rgba(255, 64, 64, 0.12); border-color: #ff4040; color: #ff4040; }
</style>
</head>
<body>

  <div class="game" id="game">
    <div class="hud">
      <span class="hp-you">Ты: <span id="youHp">100</span>%</span>
      <span class="hp-rick">Рик: <span id="rickHp">100</span>%</span>
      <span class="turn">Ход <span id="turnNum">1</span></span>
      <span class="state" id="stateLabel">в бою</span>
    </div>

    <div class="status" id="statusBar">
      <span class="badge" data-flag="hasPortalGun">Портальная пушка</span>
      <span class="badge" data-flag="mindLink">Связь с разумом</span>
      <span class="badge" data-flag="bleeding">Кровотечение</span>
      <span class="badge" data-flag="onToaster">На тостере</span>
      <span class="badge" data-flag="worldBlenders">Мир блендеров</span>
      <span class="badge" data-flag="rickUnderControl">Рик под контролем</span>
    </div>

    <div class="scene-title" id="sceneTitle">Сцена 1</div>
    <div class="scene" id="scene"></div>
    <div class="choices" id="choices"></div>

    <div class="custom">
      <input type="text" id="customInput" placeholder="Опиши, что ты делаешь...">
      <button id="customBtn">⚡</button>
    </div>
    <div class="hint">Пиши свободно: «телепортируюсь», «хватаю пушку», «беру его под контроль», «убиваю его» · игра распознаёт действия</div>
  </div>

  <div class="flash" id="flash"></div>

  <script>
    // ================== СОСТОЯНИЕ ==================
    const state = {
      youHp: 100,
      rickHp: 100,
      turn: 1,
      log: [],
      flags: {
        hasPortalGun: false,
        mindLink: false,
        bleeding: false,
        onToaster: false,
        worldBlenders: false,
        rickUnderControl: false
      },
      currentScene: 'start',
      over: false
    };

    const youHpEl = document.getElementById('youHp');
    const rickHpEl = document.getElementById('rickHp');
    const turnNumEl = document.getElementById('turnNum');
    const stateLabelEl = document.getElementById('stateLabel');
    const sceneEl = document.getElementById('scene');
    const sceneTitleEl = document.getElementById('sceneTitle');
    const choicesEl = document.getElementById('choices');
    const customInput = document.getElementById('customInput');
    const customBtn = document.getElementById('customBtn');
    const flash = document.getElementById('flash');
    const gameEl = document.getElementById('game');
    const statusBar = document.getElementById('statusBar');

    // ================== СЦЕНЫ ==================
    const scenes = {
      start: {
        title: 'Сцена 1 · Кухня',
        text: `<span class="sys">[ Ты на своей кухне. Свет мигает. Кофе ещё горячий. ]</span>

Прямо в воздухе разворачивается <span class="danger">зелёный портал</span>. Из него, шатаясь, выходит Рик — с фляжкой в руке, в тапочках, с портальной пушкой на поясе.

<span class="rick">РИК:</span> О, отлично. Ты дома. Неважно, кто ты. Важно, что я <span class="danger">не в настроении</span>.

Он щёлкает кнопкой на поясе. Из портала за его спиной высовывается щупальце с лампочками и тихо гудит.`,
        choices: [
          { text: 'Спросить, чего он хочет', next: 'askRick' },
          { text: 'Резко броситься в атаку', next: 'attackFirst' },
          { text: 'Оставаться спокойным и наблюдать', next: 'watchRick' }
        ]
      },

      askRick: {
        title: 'Сцена 2 · Разговор',
        text: `<span class="you">Ты:</span> Чего ты хочешь?

<span class="rick">РИК:</span> Хочу. Много чего. Хочу, чтобы Морти не трогал мою лабораторию. Хочу, чтобы Джерри исчез. Хочу, чтобы ты перестал задавать <span class="danger">глупые вопросы</span>.

Он делает шаг к тебе. Под его ногами открывается едва заметная рябь — портал готовится.

<span class="rick">РИК:</span> Знаешь, что я делаю с теми, кто задаёт глупые вопросы?

Он не ждёт ответа. Он <span class="danger">щёлкает пальцами</span>.`,
        choices: [
          { text: 'Отпрыгнуть в сторону', next: 'portalFloor' },
          { text: 'Успеть схватить его за руку', next: 'grabRick' },
          { text: 'Прыгнуть в портал первым', next: 'intoBlenderWorld' }
        ]
      },

      watchRick: {
        title: 'Сцена 2 · Наблюдение',
        text: `Ты стоишь на месте. Рик смотрит на тебя внимательно. Он ждёт реакции.

<span class="rick">РИК:</span> Хм. Не паникуешь. Это уже интереснее, чем 90% тех, кто тут стоял.

Он делает глоток из фляжки, вытирает рот рукавом.

<span class="rick">РИК:</span> Но мне всё равно <span class="danger">скучно</span>.

Он поднимает портальную пушку и целится тебе под ноги.`,
        choices: [
          { text: 'Успеть схватить пушку', next: 'grabGun' },
          { text: 'Прыгнуть в портал первым', next: 'intoBlenderWorld' },
          { text: 'Стоять и смотреть, что будет', next: 'portalFloor' }
        ]
      },

      attackFirst: {
        title: 'Сцена 2 · Удар',
        text: `Ты бросаешься вперёд. Кулак летит в лицо Рика.

Но он <span class="danger">уже не там</span>. Он стоит в полуметре в стороне — как будто телепортировался. Ты пролетаешь сквозь пустоту и врезаешься в шкаф.

<span class="rick">РИК:</span> Медленно. Очень медленно. Ты думал, что я не увижу твой замах за <span class="danger">полторы секунды</span>?

Он щёлкает — под тобой разворачивается портал.`,
        choices: [
          { text: 'Успеть зацепиться за край шкафа', next: 'grabShelf' },
          { text: 'Прыгнуть в портал — посмотрим, что там', next: 'intoBlenderWorld' },
          { text: 'Телепортироваться самому', next: 'selfTeleport' }
        ]
      },

      grabShelf: {
        title: 'Сцена 3 · Край шкафа',
        text: `Ты хватаешься за край шкафа. Ноги уже <span class="danger">внутри портала</span>. Ты чувствуешь, как снизу тянет жаром — оттуда, из мира блендеров.

<span class="rick">РИК:</span> Ого. Цепкий. <span class="sys">(смотрит с интересом)</span>

Он не торопится. Он наливает себе кофе из твоей чашки.

<span class="rick">РИК:</span> Продержишься долго — я тебя выпущу. Может быть. Пятьдесят на пятьдесят. Скорее нет.`,
        choices: [
          { text: 'Подтянуться и вылезти', next: 'outOfPortal' },
          { text: 'Отпустить руки и упасть в портал', next: 'intoBlenderWorld' },
          { text: 'Крикнуть Рику, что сдаёшься', next: 'surrender' }
        ]
      },

      grabGun: {
        title: 'Сцена 3 · Захват',
        text: `Ты бросаешься вперёд и <span class="good">хватаешь портальную пушку</span> — прямо за ствол. Рик не ожидал. Он дёргает рукой, но ты держишь крепко.

<span class="rick">РИК:</span> Отпусти. Это моё. Ты не знаешь, как оно работает.

Он пытается вырвать пушку. Ты чувствуешь, как корпус нагревается — пушка <span class="danger">перегревается</span>.`,
        choices: [
          { text: 'Стрелять из пушки в Рика', next: 'shootRick' },
          { text: 'Открыть портал в мир блендеров и бросить туда Рика', next: 'throwRick' },
          { text: 'Развернуть пушку и выстрелить в потолок', next: 'shootCeiling' }
        ],
        onEnter: function() { state.flags.hasPortalGun = true; updateStatus(); }
      },

      grabRick: {
        title: 'Сцена 3 · Рука',
        text: `Ты хватаешь Рика за руку. Он замирает. На секунду — всего на секунду — его лицо становится <span class="danger">серьёзным</span>.

<span class="rick">РИК:</span> Ох. Ты правда думаешь, что удержишь меня?

Он не вырывается. Он просто <span class="danger">щёлкает пальцами второй руки</span>. Под вами обоими разворачивается портал. Вы <span class="danger">оба</span> падаете.`,
        choices: [
          { text: 'Держаться за Рика — упадём вместе', next: 'intoBlenderWorld' },
          { text: 'Отпустить и отпрыгнуть в сторону', next: 'outOfPortal' },
          { text: 'Использовать его фляжку как якорь', next: 'blenderWithRick' }
        ]
      },

      portalFloor: {
        title: 'Сцена 3 · Портал под ногами',
        text: `Портал разворачивается <span class="danger">прямо под твоими ногами</span>. Ты проваливаешься.

Летишь. Секунду. Две. Десять.

Вокруг — <span class="danger">оранжевое небо</span>. Внизу — гигантские блендеры размером с дом. Они жужжат и перемалывают скалы. Один блендер смотрит на тебя с интересом.

Ты успеваешь ухватиться за <span class="good">летающий тостер</span>. Он держит. Пока что.

<span class="rick">РИК:</span> <span class="sys">(голос доносится откуда-то сверху, из портала)</span> Кричи, если хочешь. Мне отсюда хорошо слышно.`,
        choices: [
          { text: 'Осмотреться — может, тут есть выход', next: 'toasterLook' },
          { text: 'Попробовать открыть свой портал', next: 'selfPortal' },
          { text: 'Взломать управление тостером — пусть летит', next: 'hackToaster' },
          { text: 'Телепатически связаться с Риком', next: 'mindLinkRick' }
        ],
        onEnter: function() {
          state.flags.worldBlenders = true;
          state.flags.onToaster = true;
          updateStatus();
        }
      },

      toasterLook: {
        title: 'Сцена 4 · Внутри мира блендеров',
        text: `Ты осматриваешься. Мир блендеров — это <span class="danger">гигантская кухня</span> размером с планету. Блендеры снуют повсюду. Между ними — обломки прошлых жертв: куски металла, порванная одежда, чей-то ботинок.

Вдалеке — <span class="good">светящаяся арка</span>. Она похожа на дверь. За ней — что-то другое.

<span class="rick">РИК:</span> <span class="sys">(из портала)</span> Не ходи к арке. Это ловушка. Хотя, знаешь, мне всё равно. Иди.`,
        choices: [
          { text: 'Лететь к арке', next: 'archEnding' },
          { text: 'Развернуть тостер и лететь вверх, к порталу Рика', next: 'flyUp' },
          { text: 'Спрыгнуть с тостера на блендер — попробовать его объехать', next: 'rideBlender' }
        ]
      },

      selfPortal: {
        title: 'Сцена 4 · Свой портал',
        text: `Ты пытаешься <span class="good">открыть портал</span> сам. У тебя нет пушки — но у тебя есть <span class="you">разум и телепатия</span>. Ты концентрируешься. Мир вокруг дрожит.

В воздухе — <span class="danger">трещина</span>. Она маленькая, но она есть. Через неё видно твою кухню. Рик сидит на табуретке и пьёт кофе.

<span class="rick">РИК:</span> <span class="sys">(замечает трещину)</span> Ох. Ты умеешь <span class="danger">рвать пространство</span>? Это уже интересно.`,
        choices: [
          { text: 'Расширить трещину и вылезти', next: 'escapeSuccess' },
          { text: 'Швырнуть трещину в Рика — пусть почувствует', next: 'tearRick' },
          { text: 'Прыгнуть в трещину, но появиться за спиной Рика', next: 'behindRick' }
        ]
      },

      hackToaster: {
        title: 'Сцена 4 · Взлом',
        text: `Ты кладёшь ладонь на корпус тостера. Ты чувствуешь его схемы, его <span class="good">механизмы</span>. Ты — хакер. Ты умеешь взламывать любое устройство.

Тостер <span class="good">подчиняется</span>. Он разворачивается и летит вверх — прямо к порталу, из которого ты выпал. Внутри портала видно Рика, он смотрит на тебя с удивлением.

<span class="rick">РИК:</span> Как ты...? Это же <span class="danger">тостер из мира блендеров</span>. У него нет процессора.`,
        choices: [
          { text: 'Влететь в портал и выпасть на Рика', next: 'crashIntoRick' },
          { text: 'Взломать портал изнутри — пусть схлопнется', next: 'collapsePortal' },
          { text: 'Сделать тостер оружием — направить его в блендер, чтобы устроить обвал', next: 'blenderChaos' }
        ]
      },

      mindLinkRick: {
        title: 'Сцена 4 · Связь',
        text: `Ты закрываешь глаза. Ты ищешь его разум. Находишь легко — он <span class="good">звенит</span>, как колокол, из любого измерения. Ты входишь.

Ты видишь его мысли: он <span class="danger">скучает</span>. Он не хочет тебя убивать. Ему просто нечего делать. Он одинок. Он этого не признаёт даже себе.

<span class="rick">РИК:</span> <span class="sys">(резко, в твоей голове)</span> Какого чёрта ты делаешь в моей голове?! Убери свои пальцы из моей психики!

Но он не закрывается. Он <span class="good">позволяет</span> тебе остаться. Ему интересно.`,
        choices: [
          { text: 'Ударить его по самому больному — по Дайан', next: 'hitDian' },
          { text: 'Успокоить его — сказать, что ты не враг', next: 'calmRick' },
          { text: 'Захватить контроль над его телом — пока он не сопротивляется', next: 'controlRick' }
        ],
        onEnter: function() { state.flags.mindLink = true; updateStatus(); }
      },

      hitDian: {

    // ================== UI ==================
    function updateStatus() {
      const badges = statusBar.querySelectorAll('.badge');
      badges.forEach(b => {
        const flag = b.dataset.flag;
        if (state.flags[flag]) {
          b.classList.add('on');
          if (flag === 'bleeding') {
            b.classList.remove('on');
            b.classList.add('danger');
          }
        } else {
          b.classList.remove('on');
          b.classList.remove('danger');
        }
      });
    }

    function updateHud() {
      youHpEl.textContent = Math.max(0, state.youHp);
      rickHpEl.textContent = Math.max(0, state.rickHp);
      turnNumEl.textContent = state.turn;
    }

    function renderScene(sceneKey) {
      const s = scenes[sceneKey];
      if (!s) return;
      state.currentScene = sceneKey;
      sceneTitleEl.textContent = s.title;

      // концовки
      if (sceneKey.endsWith('Ending') || sceneKey === 'shootRickWin') {
        const titles = {
          mercyEnding: { verdict: 'epic', title: 'ПОБЕДА · МИЛОСЕРДИЕ' },
          talkEnding: { verdict: 'win', title: 'ПОБЕДА · ПОНИМАНИЕ' },
          controlEnding: { verdict: 'win', title: 'ПОБЕДА · КОНТРОЛЬ' },
          shootRickWin: { verdict: 'win', title: 'ПОБЕДА · ВЫСТРЕЛ' },
          breakEnding: { verdict: 'lose', title: 'ПОБЕДА · СЛОМАН' },
          truceEnding: { verdict: 'epic', title: 'НИЧЬЯ' },
          macaroniEnding: { verdict: 'win', title: 'ПОБЕДА · МАКАРОНЫ' },
          visionsEnding: { verdict: 'epic', title: 'ПОБЕДА · ВИДЕНИЯ' },
          killEnding: { verdict: 'win', title: 'ПОБЕДА · УБИЙСТВО' },
          killBrokenEnding: { verdict: 'lose', title: 'ПОРАЖЕНИЕ · ТЫ СТАЛ ИМ' }
        };
        const t = titles[sceneKey] || { verdict: 'win', title: 'КОНЦОВКА' };
        state.over = true;
        sceneTitleEl.textContent = s.title;
        sceneEl.innerHTML = `
          <div class="end-box fade">
            <div class="icon">${t.verdict === 'lose' ? '💀' : '🏆'}</div>
            <div class="verdict ${t.verdict}">${t.title}</div>
            <div class="desc">${s.text}</div>
            <button class="replay" onclick="restart()">Начать заново</button>
          </div>
        `;
        choicesEl.innerHTML = '';
        return;
      }

      // обычная сцена
      sceneEl.innerHTML = s.text;
      sceneEl.scrollTop = sceneEl.scrollHeight;

      if (s.choices && s.choices.length) {
        choicesEl.innerHTML = s.choices.map(c =>
          `<button class="choice" data-next="${c.next}" data-text="${c.text.replace(/"/g, '&quot;')}">
            <span class="arrow">▸</span>${c.text}
          </button>`
        ).join('');

        choicesEl.querySelectorAll('.choice').forEach(btn => {
          btn.addEventListener('click', () => {
            state.turn++;
            updateHud();
            goTo(btn.dataset.next, btn.dataset.text);
          });
        });
      } else {
        choicesEl.innerHTML = '';
      }

      if (s.onEnter) s.onEnter();
      updateStatus();
    }

    function goTo(key, chosenText) {
      if (chosenText) {
        const prev = sceneEl.innerHTML;
        sceneEl.innerHTML = prev + `\n\n<span class="you">▸ Ты:</span> <span class="action">${chosenText}</span>`;
      }
      setTimeout(() => renderScene(key), 250);
    }

    // ================== КЛАССИФИКАЦИЯ СВОБОДНОГО ВВОДА ==================
    function classify(text) {
      const t = text.toLowerCase();

      // УБИЙСТВО — приоритет №1
      if (/(убить|убива|убью|убей|добить|добива|приконч|прикончить|казн|уничтож|раздав|задуш|зарез|приреж|поконч|кончить|смерт|лишить жизн|мочить|замоч|вал|валю|рубану|порублю|казню|пришибу|грохну|завалю)/.test(t)) {
        return 'kill';
      }
      // телепорт / портал / пространство
      if (/(телепорт|портал|трещин|разрыв|простран|скачок|прыг|уйти|убега|ускользн|выйти|сбежа|спрят|скрыть)/.test(t)) {
        return 'portal';
      }
      // контроль / подчинение / разум
      if (/(контрол|подчин|захват|управл|взять под|внуш|подчинить|заставить|слом|телепат|разум|мысл|сознани|гипноз|внутренн)/.test(t)) {
        return 'mind';
      }
      // пушка / оружие / схватить
      if (/(пушк|портальн пушк|схватить|выхват|отобрать|забрать|оружи|ствол|фляжк|бутылк)/.test(t)) {
        return 'grab';
      }
      // взлом / хакнуть
      if (/(взлам|хакн|хак|взлом|подчин устройств|перепрограмм|тостер|блендер|механизм|систем)/.test(t)) {
        return 'hack';
      }
      // удар / атака
      if (/(удар|бью|бей|атак|пинаю|пну|ломаю|рву|кулаком|ногой|плечом|головой|врезать|заехать)/.test(t)) {
        return 'attack';
      }
      // успокоить / поговорить
      if (/(успоко|поговор|разговор|не враг|мир|подруж|предлож|обнять|обнима)/.test(t)) {
        return 'calm';
      }
      return 'unknown';
    }

    // ================== ОБРАБОТКА СВОБОДНОГО ВВОДА ==================
    function handleFreeInput(text) {
      const intent = classify(text);
      const cur = state.currentScene;

      state.turn++;
      updateHud();

      const isBlenderWorld = ['toasterLook', 'selfPortal', 'hackToaster', 'mindLinkRick', 'runFromBlender', 'rideBlender', 'flyUp', 'archEnding', 'mindBlender'].includes(cur);
      const isBroken = ['breakRick', 'hitDian', 'grabGunFromFloor', 'crashIntoRick', 'releaseRick', 'rickLeaves'].includes(cur);

      // === УБИЙСТВО ===
      if (intent === 'kill') {
        if (isBroken || state.rickHp <= 0) {
          return goTo('killBrokenEnding', text);
        }
        if (cur === 'escapeSuccess' || cur === 'outOfPortal' || cur === 'mercyEnding') {
          return goTo('killEnding', text);
        }
        return goTo('killEnding', text);
      }

      // === МИР БЛЕНДЕРОВ ===
      if (isBlenderWorld) {
        if (intent === 'portal') return goTo('selfPortal', text);
        if (intent === 'hack') return goTo('hackToaster', text);
        if (intent === 'mind') return goTo('mindLinkRick', text);
        if (intent === 'attack') return goTo('runFromBlender', text);
        if (intent === 'grab') return goTo('selfPortal', text);
        if (intent === 'calm') return goTo('mindLinkRick', text);
        return goTo('toasterLook', text);
      }

      // === КУХНЯ ===
      if (intent === 'mind') return goTo('mindLinkRick', text);
      if (intent === 'grab') return goTo('grabGun', text);
      if (intent === 'hack') return goTo('hackToaster', text);
      if (intent === 'portal') return goTo('selfTeleport', text);
      if (intent === 'calm') return goTo('calmRick', text);
      if (intent === 'attack') {
        if (cur === 'start') return goTo('attackFirst', text);
        return goTo('attackRick2', text);
      }

      goTo('unknownFree', text);
    }
