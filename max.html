<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="refresh" content="2;url=https://max.ru">
<title>MAX</title>
<link rel="icon" href="https://max.ru/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 340px; width: 100%; }
  .logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 22px;
    background: linear-gradient(135deg, #3B7BFF 0%, #5B4BFF 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(59, 123, 255, 0.25);
  }
  .logo span {
    color: #fff;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #1a1a1a;
  }
  p {
    font-size: 14px;
    line-height: 1.55;
    color: #6b7280;
    margin-bottom: 28px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border: 3px solid #e5e7eb;
    border-top-color: #3B7BFF;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint {
    margin-top: 22px;
    font-size: 12px;
    color: #9ca3af;
  }
  .hint a { color: #3B7BFF; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span>M</span></div>
    <h1>Вы вышли из аккаунта</h1>
    <p>Сессия завершена. Перенаправляем в MAX…</p>
    <div class="spinner"></div>
    <div class="hint">Если страница не открылась — <a href="https://max.ru">нажмите сюда</a></div>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace('https://max.ru');
    }, 2000);
  </script>
</body>
</html>
