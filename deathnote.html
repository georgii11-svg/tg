
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIMINATION SYSTEM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    padding: 25px 15px;
}

.app {
    max-width: 720px;
    margin: auto;
    text-align: center;
}

h1 {
    color: #ff3030;
    letter-spacing: 4px;
    font-size: 29px;
    margin-bottom: 35px;
}

.field {
    text-align: left;
    margin-bottom: 16px;
    width: 100%;
}

.field label {
    display: block;
    color: #aaa;
    margin-bottom: 7px;
    font-size: 13px;
    letter-spacing: 1px;
}

.input-box {
    display: block;
    width: 100%;
    min-height: 59px;
    padding: 17px;
    background-color: #202020;
    color: #ffffff;
    border: 2px solid #444;
    border-radius: 10px;
    font-size: 17px;
    outline: none;
    font-family: Arial, sans-serif;
    text-align: left;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
    pointer-events: auto;
}

.input-box:focus {
    border-color: #ff3030;
    background-color: #202020;
    color: #ffffff;
}

.input-box:empty::before {
    content: attr(data-placeholder);
    color: #888888;
    pointer-events: none;
}

.input-box.multiline {
    min-height: 90px;
}

.main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 40px 0;
}

.eliminate {
    width: 220px;
    height: 220px;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle, #ff4545, #900000);
    color: white;
    font-size: 27px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 35px #ff000055;
    transition: .15s;
}

.eliminate:active {
    transform: scale(.94);
}

.counter {
    background: #202020;
    padding: 18px;
    border-radius: 12px;
    min-width: 105px;
}

.counter small {
    color: #aaa;
    font-size: 11px;
}

.number {
    color: #ff3030;
    font-size: 40px;
    font-weight: bold;
    margin-top: 8px;
}

.timerBox {
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
}

.timer {
    color: #ff3030;
    font-size: 45px;
    font-weight: bold;
    margin: 10px;
}

.status {
    color: #aaa;
}

.history {
    background: #1b1b1b;
    border-radius: 12px;
    padding: 20px;
    text-align: left;
    margin-top: 30px;
}

.history h3 {
    color: #ff3030;
    letter-spacing: 2px;
}

.entry {
    padding: 14px 0;
    border-bottom: 1px solid #333;
    overflow-wrap: anywhere;
}

.entry strong {
    color: white;
}

.entry span {
    color: #999;
    font-size: 13px;
}

.entry div {
    margin-top: 6px;
    color: #999;
    font-size: 14px;
}

@media(max-width: 450px) {
    .eliminate {
        width: 180px;
        height: 180px;
        font-size: 22px;
    }

    .main {
        gap: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>ELIMINATION SYSTEM</h1>

    <div class="field">
        <label for="name">ИМЯ ПЕРСОНАЖА</label>
        <div id="name"
             class="input-box"
             contenteditable="true"
             role="textbox"
             aria-label="Имя персонажа"
             data-placeholder="Введите имя..."
             spellcheck="false"></div>
    </div>

    <div class="field">
        <label for="reason">ПРИЧИНА ВЫБЫТИЯ</label>
        <div id="reason"
             class="input-box"
             contenteditable="true"
             role="textbox"
             aria-label="Причина выбытия"
             data-placeholder="Введите причину..."
             spellcheck="false"></div>
    </div>

    <div class="field">
        <label for="details">ОБСТОЯТЕЛЬСТВА ВЫБЫТИЯ</label>
        <div id="details"
             class="input-box multiline"
             contenteditable="true"
             role="textbox"
             aria-label="Обстоятельства выбытия"
             aria-multiline="true"
             data-placeholder="Опишите обстоятельства..."
             spellcheck="false"></div>
    </div>

    <div class="main">

        <button type="button" class="eliminate" id="eliminate">
            УСТРАНИТЬ
        </button>

        <div class="counter">
            <small>ЗАВЕРШЕНО</small>
            <div class="number" id="count">0</div>
        </div>

    </div>

    <div class="timerBox">
        <div class="status" id="status">
            СИСТЕМА ОЖИДАЕТ
        </div>

        <div class="timer" id="timer">00:00</div>

        <div class="status" id="timerInfo">
            Таймер не запущен
        </div>
    </div>

    <div class="history">
        <h3>ЖУРНАЛ СОБЫТИЙ</h3>

        <div id="list" style="color:#777">
            Записей пока нет...
        </div>
    </div>

</div>

<script>

let count = 0;
let history = [];
let activeTimers = [];
let timerId = 0;
let currentRecord = null;

const nameInput = document.getElementById("name");
const reasonInput = document.getElementById("reason");
const detailsInput = document.getElementById("details");

const counter = document.getElementById("count");
const list = document.getElementById("list");
const timerDisplay = document.getElementById("timer");

const statusDisplay = document.getElementById("status");
const timerInfo = document.getElementById("timerInfo");

// Чтение текста из редактируемых блоков
function getText(element) {
    return element.innerText.replace(/\u00a0/g, " ").trim();
}

// Ограничение длины текста
function limitText(element, maxLength, multiline) {

    element.addEventListener("input", function() {

        let text = getText(element);

        if (!multiline) {
            text = text.replace(/[\r\n]+/g, " ");
        }

        if (text.length > maxLength) {
            text = text.slice(0, maxLength);
            element.textContent = text;
            placeCursorAtEnd(element);
        }
    });

    // Вставка только обычного текста
    element.addEventListener("paste", function(event) {

        event.preventDefault();

        const pasted = (event.clipboardData || window.clipboardData)
            .getData("text");

        const selection = window.getSelection();

        if (!selection.rangeCount) return;

        const range = selection.getRangeAt(0);

        if (!element.contains(range.commonAncestorContainer)) return;

        range.deleteContents();

        const text = multiline
            ? pasted
            : pasted.replace(/[\r\n]+/g, " ");

        const current = getText(element);
        const available = maxLength - current.length;
        const safeText = text.slice(0, Math.max(0, available));

        const textNode = document.createTextNode(safeText);
        range.insertNode(textNode);

        range.setStartAfter(textNode);
        range.collapse(true);

        selection.removeAllRanges();
        selection.addRange(range);

        element.dispatchEvent(new Event("input", {
            bubbles: true
        }));
    });
}

function placeCursorAtEnd(element) {
    const selection = window.getSelection();
    const range = document.createRange();

    range.selectNodeContents(element);
    range.collapse(false);

    selection.removeAllRanges();
    selection.addRange(range);
}

limitText(nameInput, 40, false);
limitText(reasonInput, 150, false);
limitText(detailsInput, 300, true);

document.getElementById("eliminate").addEventListener(
    "click",
    startTimer
);

function startTimer() {

    const name = getText(nameInput);
    const reason = getText(reasonInput);
    const details = getText(detailsInput);

    if (!name) {
        statusDisplay.textContent = "ВВЕДИ ИМЯ";
        return;
    }

    let duration = 40;

    if (reason || details) {
        duration = 400;
    }

    const record = {
        id: ++timerId,
        name: name,
        reason: reason,
        details: details,
        remaining: duration,
        finished: false,
        interval: null
    };

    history.unshift(record);
    activeTimers.push(record);
    currentRecord = record;

    // Очистка полей
    nameInput.textContent = "";
    reasonInput.textContent = "";
    detailsInput.textContent = "";

    updateHistory();
    updateCount();

    statusDisplay.textContent = "ОБРАТНЫЙ ОТСЧЁТ";
    timerInfo.textContent = "Запись: " + record.name;

    renderTimer(record);

    record.interval = setInterval(() => {

        record.remaining--;

        if (record.remaining <= 0) {

            record.remaining = 0;
            record.finished = true;

            clearInterval(record.interval);

            activeTimers = activeTimers.filter(
                item => item.id !== record.id
            );

            count++;

            updateCount();
            updateHistory();

            if (currentRecord === record) {
                statusDisplay.textContent = "ТАЙМЕР ЗАВЕРШЁН";
                timerDisplay.textContent = "00:00";
                timerInfo.textContent = "Запись завершена";
            }

            return;
        }

        updateHistory();

        if (currentRecord === record) {
            renderTimer(record);
        }

    }, 1000);
}

function renderTimer(record) {
    timerDisplay.textContent = formatTime(record.remaining);
}

function formatTime(seconds) {

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    return String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0");
}

function updateCount() {
    counter.textContent = count;
}

function updateHistory() {

    list.replaceChildren();

    if (history.length === 0) {
        list.textContent = "Записей пока нет...";
        return;
    }

    history.forEach(record => {

        const entry = document.createElement("div");
        entry.className = "entry";

        const title = document.createElement("strong");
        title.textContent = record.name;

        const state = document.createElement("span");

        state.textContent = record.finished
            ? " — ЗАВЕРШЕНО"
            : " — " + formatTime(record.remaining);

        entry.appendChild(title);
        entry.appendChild(state);

        if (record.reason) {
            const reason = document.createElement("div");
            reason.textContent = "Причина: " + record.reason;
            entry.appendChild(reason);
        }

        if (record.details) {
            const details = document.createElement("div");
            details.textContent =
                "Обстоятельства: " + record.details;
            entry.appendChild(details);
        }

        list.appendChild(entry);

    });

}

</script>

</body>
</html>
