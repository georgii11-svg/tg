<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Жми сюда</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0a0a14 70%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    user-select: none;
    position: relative;
  }

  #start {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .icon {
    font-size: 90px;
    margin-bottom: 22px;
    animation: bounce 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 42, 106, 0.5));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ff2a6a, #ff8aa8, #ffb800);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.5px;
  }
  .sub {
    font-size: 14px;
    color: #8a8aa0;
    margin-bottom: 36px;
    max-width: 320px;
    line-height: 1.6;
  }
  .btn {
    padding: 20px 52px;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff2a6a, #ff5c8a);
    border: none;
    border-radius: 60px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 8px 0 #a01040, 0 14px 40px rgba(255, 42, 106, 0.5);
    transition: all 0.1s ease;
    animation: pulseBtn 1.8s ease-in-out infinite;
  }
  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .btn:active {
    transform: translateY(6px) scale(1.02);
    box-shadow: 0 2px 0 #a01040, 0 6px 20px rgba(255, 42, 106, 0.4);
  }

  #fakScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
    z-index: 100;
  }
  #fakScreen.show { display: block; }

  .dick {
    position: absolute;
    user-select: none;
    pointer-events: none;
    will-change: transform;
    line-height: 0;
  }

  .dick.out { animation: flyOut 1.2s ease-out forwards; }
  @keyframes flyOut {
    0% { transform: translate(0, 0) scale(0.2) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(var(--sc)) rotate(var(--rot)); opacity: 0; }
  }

  .dick.fall { animation: fallDown linear forwards; }
  @keyframes fallDown {
    0% { transform: translateY(-160px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .dick.pulse { animation: bigPulse 0.7s ease-out forwards; }
  @keyframes bigPulse {
    0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(6); opacity: 0; }
  }

  #stopBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    padding: 14px 36px;
    background: #1a1a26;
    border: 2px solid #ff2a6a;
    border-radius: 12px;
    color: #ff5c8a;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255, 42, 106, 0.5);
  }
  #stopBtn:active { transform: translateX(-50%) scale(0.95); }

  .flash {
    position: fixed;
    inset: 0;
    background: #ff2a6a;
    opacity: 0;
    pointer-events: none;
    z-index: 250;
    animation: flashPulse 0.3s ease;
  }
  @keyframes flashPulse {
    0% { opacity: 0; }
    30% { opacity: 0.5; }
    100% { opacity: 0; }
  }

  body.shaking { animation: bodyShake 0.08s infinite; }
  @keyframes bodyShake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, -2px); }
    100% { transform: translate(2px, 2px); }
  }

  #centerDick {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    pointer-events: none;
    animation: centerGrow 0.4s ease-out;
  }
  @keyframes centerGrow {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <div id="start">
    <div class="icon">👇</div>
    <h1>Тут спрятан секрет</h1>
    <div class="sub">Нажми на кнопку ниже. Обещаем — тебе понравится.</div>
    <button class="btn" id="startBtn">Жми сюда</button>
  </div>

  <div id="fakScreen">
    <button id="stopBtn">Стоп</button>
  </div>

  <script>
    const start = document.getElementById('start');
    const fakScreen = document.getElementById('fakScreen');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    // SVG кривого хуя — нарочно неаккуратный
    const DICK_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">' +
        '<g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M 62 262 C 42 262, 36 292, 52 308 C 68 322, 94 312, 94 290 C 96 273, 82 262, 62 262 Z" stroke-width="5"/>' +
          '<path d="M 142 260 C 162 258, 170 288, 156 306 C 140 324, 112 318, 110 294 C 108 278, 122 260, 142 260 Z" stroke-width="6"/>' +
          '<path d="M 88 262 C 82 230, 78 202, 84 176 C 90 150, 98 132, 108 112 C 116 92, 120 78, 118 60 C 116 44, 124 34, 134 37 C 145 40, 151 52, 148 68 C 145 90, 135 108, 124 126 C 112 144, 104 162, 101 184 C 97 208, 102 234, 108 262" stroke-width="7"/>' +
          '<path d="M 114 62 C 101 52, 91 40, 101 27 C 112 14, 132 12, 147 21 C 161 30, 164 47, 154 61 C 145 74, 129 77, 117 69" stroke-width="6"/>' +
          '<path d="M 130 30 C 134 36, 136 42, 134 48" stroke-width="3" stroke-dasharray="3 4"/>' +
          '<path d="M 72 272 L 63 280" stroke-width="4"/>' +
          '<path d="M 147 274 L 156 282" stroke-width="4"/>' +
          '<path d="M 80 286 L 73 294" stroke-width="3"/>' +
          '<path d="M 154 288 L 160 296" stroke-width="3"/>' +
        '</g>' +
      '</svg>';

    function makeDick(sizePx, color) {
      const wrap = document.createElement('div');
      wrap.className = 'dick';
      wrap.style.width = sizePx + 'px';
      wrap.style.height = Math.round(sizePx * 1.7) + 'px';
      wrap.style.color = color;
      wrap.style.filter = 'drop-shadow(0 0 8px ' + color + ') drop-shadow(0 0 16px ' + color + ')';
      wrap.innerHTML = DICK_SVG;
      return wrap;
    }

    const COLORS = ['#ff2a6a', '#ff5c8a', '#ffb800', '#ff0040', '#ff8aa8', '#ffd700', '#ffffff', '#ff5050'];
    function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    // звук
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function noiseBurst(dur) {
      if (!audioCtx) return;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.4;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 900;
      filter.Q.value = 1.5;
      src.connect(filter).connect(gain).connect(audioCtx.destination);
      src.start();
      src.stop(audioCtx.currentTime + dur);
    }
    function beepFast() {
      if (!audioCtx) return;
      for (let i = 0; i < 6; i++) {
        setTimeout(function() {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(500 + Math.random() * 900, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        }, i * 90);
      }
    }

    let spawnInterval = null;
    let audioInterval = null;

    function spawnOut() {
      const el = makeDick(40 + Math.random() * 80, randomColor());
      el.classList.add('out');
      el.style.left = '50%';
      el.style.top = '50%';
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 400;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const sc = 0.8 + Math.random() * 1.5;
      const rot = -360 + Math.random() * 720;
      el.style.setProperty('--tx', tx + 'px');
      el.style.setProperty('--ty', ty + 'px');
      el.style.setProperty('--sc', sc);
      el.style.setProperty('--rot', rot + 'deg');
      fakScreen.appendChild(el);
      setTimeout(function() { el.remove(); }, 1400);
    }

    function spawnFall() {
      const el = makeDick(40 + Math.random() * 90, randomColor());
      el.classList.add('fall');
      el.style.left = (Math.random() * 100) + '%';
      el.style.top = '-160px';
      const dur = 1.5 + Math.random() * 2.5;
      el.style.animationDuration = dur + 's';
      fakScreen.appendChild(el);
      setTimeout(function() { el.remove(); }, dur * 1000 + 300);
    }

    function spawnPulse() {
      const el = makeDick(80 + Math.random() * 60, randomColor());
      el.classList.add('pulse');
      el.style.left = '50%';
      el.style.top = '50%';
      fakScreen.appendChild(el);
      setTimeout(function() { el.remove(); }, 800);
    }

    function startFak() {
      initAudio();
      start.style.display = 'none';
      fakScreen.classList.add('show');
      document.body.classList.add('shaking');

      const f = document.createElement('div');
      f.className = 'flash';
      document.body.appendChild(f);
      setTimeout(function() { f.remove(); }, 400);

      noiseBurst(0.5);
      beepFast();

      // по центру большой хуй
      const center = makeDick(220, '#ff2a6a');
      center.id = 'centerDick';
      fakScreen.appendChild(center);

      spawnInterval = setInterval(function() {
        spawnOut();
        if (Math.random() < 0.7) spawnFall();
        if (Math.random() < 0.35) spawnPulse();
      }, 90);

      audioInterval = setInterval(function() {
        noiseBurst(0.25);
        beepFast();
      }, 700);

      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200, 50, 300]);
    }

    function stopFak() {
      clearInterval(spawnInterval);
      clearInterval(audioInterval);
      spawnInterval = null;
      audioInterval = null;
      document.body.classList.remove('shaking');

      const all = fakScreen.querySelectorAll('.dick, #centerDick');
      all.forEach(function(el) { el.remove(); });

      fakScreen.classList.remove('show');
      start.style.display = 'flex';
    }

    startBtn.addEventListener('click', startFak);
    stopBtn.addEventListener('click', function(e) { e.stopPropagation(); stopFak(); });
  </script>
</body>
</html>
