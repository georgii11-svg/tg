
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 4.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:8px;left:9px;z-index:2;pointer-events:none;text-shadow:1px 2px #000;font-weight:bold}
#title{color:#85ff91;font-size:19px}
#stats{font-size:12px;line-height:1.6;margin-top:4px}
#hint{font-size:12px;max-width:235px;margin-top:3px}
#map{position:fixed;right:9px;top:9px;width:112px;height:84px;border:2px solid #ffffff99;border-radius:8px;z-index:2}
#joy{position:fixed;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#ffffff25;border:3px solid #ffffff77;z-index:5;touch-action:none}
#knob{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:#ffffffbb;border:3px solid white;pointer-events:none}
.btn{position:fixed;right:12px;z-index:5;width:91px;min-height:46px;border:2px solid #ffffff77;border-radius:13px;background:#202c38ed;color:white;font-size:11px;font-weight:bold;touch-action:none}
#use{bottom:15px}#action{bottom:68px;background:#853c42ed}
#shopBtn{bottom:121px;background:#247447ed}#job{bottom:174px;background:#8c7130ed}
#toast{position:fixed;top:42%;left:5%;width:90%;text-align:center;font-size:19px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none;z-index:4}
#panel{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);max-height:80vh;overflow:auto;background:#17232a;border:2px solid #91ffa0;border-radius:18px;padding:16px}
#panel h2{margin:0;color:#91ffa0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff12;border-radius:10px;padding:9px;margin:7px 0}
.item button,#close{background:#287b43;color:white;border:0;border-radius:8px;padding:9px;font-weight:bold}
#close{width:100%;margin-top:8px;background:#495660}
</style>
</head>
<body>
<canvas id="game"></canvas><canvas id="map"></canvas>
<div id="hud"><div id="title">GOB CITY 4.0</div><div id="stats"></div><div id="hint"></div></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="use">В / ВЫЙТИ</button>
<button class="btn" id="action">ДЕЙСТВИЕ</button>
<button class="btn" id="shopBtn">МАГАЗИН</button>
<button class="btn" id="job">ЗАДАНИЕ</button>
<div id="panel"><h2 id="panelTitle">GOB CITY</h2><p id="panelText"></p><div id="items"></div><button id="close">ЗАКРЫТЬ</button></div>
<script>
(()=>{
'use strict';

const cv=document.querySelector('#game'),ctx=cv.getContext('2d');
const map=document.querySelector('#map'),mc=map.getContext('2d');
const $=id=>document.getElementById(id);

let W,H,D;
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 cv.width=W*D;cv.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
 map.width=224;map.height=168;
}
addEventListener('resize',resize);resize();

const world={w:3200,h:2400};
let seed=5172;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

const player={
 x:400,y:100,angle:0,speed:180,hp:100,maxHp:100,
 money:180,food:0,gun:false,ammo:0
};

let car=null;
let wanted=0;
let crime=0;
let wantedMeter=0;
let arrests=0;
let arrested=false;
let won=false;
let cam={x:0,y:0};
let joy={x:0,y:0,active:false};
let lastToast='';
let toastTimer=0;
let missionIndex=0;
let currentMission=null;
let missionCooldown=0;
let gangKills=0;
let civilianKills=0;
let policeKills=0;
let copsSpawned=0;
let deliveryTarget=null;

const keys={};
const buildings=[],cars=[],people=[],cops=[],gang=[];
const roadsX=[],roadsY=[];

for(let x=100;x<world.w;x+=400)roadsX.push(x);
for(let y=100;y<world.h;y+=400)roadsY.push(y);

const prison={x:2600,y:200,w:400,h:250,gateX:2800,gateY:450};

function inPrison(x,y){
 return x>prison.x-35&&x<prison.x+prison.w+35&&
 y>prison.y-35&&y<prison.y+prison.h+35;
}

for(let bx=150;bx<world.w-70;bx+=400){
 for(let by=150;by<world.h-70;by+=400){
  for(let i=0;i<3;i++){
   const b={
    x:bx+rand()*125,y:by+rand()*125,
    w:65+rand()*100,h:65+rand()*100,
    c:['#59616b','#77675c','#4c6971','#6c687c'][Math.floor(rand()*4)]
   };
   if(!inPrison(b.x+b.w/2,b.y+b.h/2))buildings.push(b);
  }
 }
}

function blocked(x,y,r=8){
 if(x<r||y<r||x>world.w-r||y>world.h-r)return true;

 // В тюрьме можно двигаться по двору, но нельзя пройти сквозь стены.
 if(arrested){
  const inside=x>prison.x+12&&x<prison.x+prison.w-12&&
   y>prison.y+12&&y<prison.y+prison.h-12;
  const gatePass=Math.abs(x-prison.gateX)<34&&
   y>prison.gateY-12&&y<prison.gateY+42;
  if(!inside&&!gatePass)return true;
  return false;
 }

 if(inPrison(x,y))return false;
 for(const b of buildings){
  if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
 }
 return false;
}

function moveObj(o,dx,dy,r=9){
 if(!blocked(o.x+dx,o.y,r))o.x+=dx;
 if(!blocked(o.x,o.y+dy,r))o.y+=dy;
}

function roadPoint(){
 const horizontal=rand()>.45;
 if(horizontal){
  const y=roadsY[Math.floor(rand()*roadsY.length)]+(rand()>.5?23:-23);
  return {x:120+rand()*(world.w-240),y,angle:rand()>.5?0:Math.PI};
 }
 const x=roadsX[Math.floor(rand()*roadsX.length)]+(rand()>.5?23:-23);
 return {x,y:120+rand()*(world.h-240),angle:rand()>.5?Math.PI/2:-Math.PI/2};
}

const carColors=['#e74c3c','#3498db','#f1c40f','#eee','#9b59b6','#27ae60'];

for(let i=0;i<32;i++){
 const p=roadPoint();
 cars.push({...p,color:carColors[i%carColors.length],speed:0,boost:0,police:false});
}

function freePoint(){
 for(let i=0;i<200;i++){
  const p=roadPoint();
  if(!blocked(p.x,p.y,12)&&!inPrison(p.x,p.y))return p;
 }
 return {x:600,y:100};
}

for(let i=0;i<45;i++){
 const p=freePoint();
 people.push({
  ...p,alive:true,angle:rand()*6.28,turn:2+rand()*4,
  panic:0,color:carColors[i%carColors.length],civilian:true
 });
}

const store={x:500,y:100};
const job={x:2800,y:1900};

const missionSpots=[
 {x:900,y:100},
 {x:1300,y:500},
 {x:1700,y:900},
 {x:2100,y:1300},
 {x:500,y:1700},
 {x:2500,y:2100},
 {x:900,y:2100}
];

const missionTypes=[
 {type:'gang',name:'РАЗОБРАТЬСЯ С БАНДОЙ',desc:'Победи 10 вооружённых бандитов.',goal:10,reward:1200},
 {type:'civilians',name:'ХАОС В ГОРОДЕ',desc:'Выполни игровое задание: победи 5 гражданских.',goal:5,reward:900},
 {type:'police',name:'ПРОТИВ ПОЛИЦИИ',desc:'Победи 4 полицейских.',goal:4,reward:1700},
 {type:'shop',name:'ПОКУПКА',desc:'Купи любой предмет в магазине.',goal:1,reward:650},
 {type:'delivery',name:'КУРЬЕРСКАЯ ДОСТАВКА',desc:'Доберись до жёлтого маркера.',goal:1,reward:1100},
 {type:'gang',name:'БОЛЬШАЯ РАЗБОРКА',desc:'Победи 10 бандитов.',goal:10,reward:1800},
 {type:'police',name:'ОПАСНЫЙ РАЙОН',desc:'Победи 4 полицейских.',goal:4,reward:2200}
];

function say(t){
 $('toast').textContent=t;
 lastToast=t;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>{
  if($('toast').textContent===lastToast)$('toast').textContent='';
 },2400);
}

function stars(){
 const whole=Math.floor(wanted);
 const partial=wanted-whole>=0.35;
 const filled='★'.repeat(whole);
 const half=partial?'◐':'';
 const empty='☆'.repeat(Math.max(0,5-whole-(partial?1:0)));
 return filled+half+empty;
}

function setWantedFromCrime(){
 const thresholds=[0,9,23,43,69,100];
 let level=0;
 for(let i=1;i<thresholds.length;i++){
  if(crime>=thresholds[i])level=i;
 }
 wanted=Math.max(wanted,level);
 wanted=clamp(wanted,0,5);
}

function addCrime(n){
 if(won)return;
 crime+=n;
 setWantedFromCrime();
 if(wanted>=5){
  wanted=5;won=true;arrested=false;car=null;
  say('🏆 ПЯТЬ ЗВЁЗД! ТЫ ПРОШЁЛ GOB CITY!');
 }
}

function updateWantedAfterEscape(){
 wanted=clamp(wanted+0.7,0,5);
 crime=Math.max(crime,wanted*18);
 say('ПОБЕГ УДАЛСЯ! Розыск вырос на 0,7 звезды. Уходи от полиции!');
 for(let i=0;i<Math.min(5,2+arrests);i++)spawnCop();
}

function enterExit(){
 if(arrested||won)return;

 if(car){
  player.x=car.x+Math.cos(car.angle+Math.PI/2)*28;
  player.y=car.y+Math.sin(car.angle+Math.PI/2)*28;
  car.speed=0;car=null;
  say('Вышел из машины');
  return;
 }

 let best=null,d=52;
 for(const c of cars){
  if(c.police||c.owner)continue;
  const n=dist(c,player);
  if(n<d){d=n;best=c}
 }
 if(best){
  car=best;player.x=car.x;player.y=car.y;
  addCrime(2);
  say('Машина угнана! Розыск может вырасти.');
 }else say('Подойди ближе к машине');
}

function openPanel(title,description,items=[]){
 $('panelTitle').textContent=title;
 $('panelText').textContent=description;
 $('items').innerHTML='';
 $('panel').style.display='block';

 for(const item of items){
  const row=document.createElement('div');
  row.className='item';
  const label=document.createElement('span');
  label.textContent=item.name+' — $'+item.price;
  const btn=document.createElement('button');
  btn.textContent='КУПИТЬ';
  btn.onclick=()=>{
   if(player.money<item.price){say('Не хватает денег!');return}
   if(item.buy()===false)return;
   player.money-=item.price;
   if(currentMission&&currentMission.type==='shop'){
    completeMission();
   }
   say('Покупка совершена');
   openShop();
  };
  row.append(label,btn);
  $('items').append(row);
 }
}

function openShop(){
 if(dist(player,store)>100&&(!car||dist(car,store)>100)){
  say('Подойди к зелёному магазину');
  return;
 }
 openPanel('🏪 GOB MART','Покупай вещи за заработанные деньги',[
  {name:'🍔 Еда (+30 HP)',price:45,buy(){player.hp=Math.min(player.maxHp,player.hp+30)}},
  {name:'🩹 Аптечка (+50 HP)',price:90,buy(){player.hp=Math.min(player.maxHp,player.hp+50)}},
  {name:'🔫 Игровой бластер',price:220,buy(){player.gun=true;player.ammo+=5}},
  {name:'📦 5 зарядов',price:75,buy(){
   if(!player.gun){say('Сначала купи бластер');return false}
   player.ammo+=5;
  }},
  {name:'🚗 Турбо машины',price:100,buy(){
   if(!car){say('Сначала сядь в машину');return false}
   car.boost=15;
  }}
 ]);
}

$('close').onclick=()=>$('panel').style.display='none';
$('shopBtn').addEventListener('pointerdown',e=>{e.preventDefault();openShop()});
$('use').addEventListener('pointerdown',e=>{e.preventDefault();enterExit()});

function startMission(){
 if(won||arrested)return;
 if(currentMission){
  say('Сначала закончи текущее задание!');
  return;
 }
 if(missionIndex>=missionTypes.length){
  missionIndex=0;
 }
 const base=missionTypes[missionIndex];
 const spot=missionSpots[missionIndex%missionSpots.length];
 currentMission={
  ...base,x:spot.x,y:spot.y,progress:0,
  started:false
 };
 gangKills=0;civilianKills=0;policeKills=0;
 if(currentMission.type==='delivery'){
  deliveryTarget=freePoint();
  currentMission.x=deliveryTarget.x;
  currentMission.y=deliveryTarget.y;
 }
 say('Новое задание: '+currentMission.name);
 $('panel').style.display='none';
}

$('job').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!currentMission){
  startMission();
  return;
 }
 const t=car||player;
 if(dist(t,currentMission)<80){
  if(currentMission.type==='delivery'){
   completeMission();
  }else if(!currentMission.started){
   currentMission.started=true;
   if(currentMission.type==='gang')spawnGang(10);
   say('Миссия началась! '+currentMission.desc);
  }else{
   say(currentMission.desc);
  }
 }else{
  say('Доберись до жёлтого маркера задания!');
 }
});

function spawnGang(n){
 for(let i=0;i<n;i++){
  let p;
  for(let k=0;k<100;k++){
   const a=rand()*Math.PI*2;
   const r=70+rand()*140;
   const q={x:currentMission.x+Math.cos(a)*r,y:currentMission.y+Math.sin(a)*r};
   if(!blocked(q.x,q.y,9)&&!inPrison(q.x,q.y)){p=q;break}
  }
  if(!p)p=freePoint();
  gang.push({
   ...p,alive:true,angle:rand()*6.28,color:'#c94a45',
   speed:55+rand()*20,turn:1+rand()*3,hostile:true
  });
 }
}

function completeMission(){
 if(!currentMission)return;
 const reward=currentMission.reward;
 player.money+=reward;
 missionIndex++;
 say('МИССИЯ ВЫПОЛНЕНА! +$'+reward);
 currentMission=null;
 deliveryTarget=null;
 gangKills=0;civilianKills=0;policeKills=0;
}

function action(){
 if($('panel').style.display==='block'){
  $('panel').style.display='none';
  return;
 }
 if(won)return;

 if(arrested){
  const nearGate=Math.abs(player.x-prison.gateX)<40&&
   Math.abs(player.y-prison.gateY)<48;
  if(nearGate){
   arrested=false;
   player.x=prison.gateX;
   player.y=prison.gateY+45;
   updateWantedAfterEscape();
  }else{
   say('Ищи ворота внизу двора. Второй побег сложнее!');
  }
  return;
 }

 if(!player.gun){say('Купи игровой бластер в магазине');return}
 if(player.ammo<=0){say('Заряды закончились');return}

 player.ammo--;
 const origin=car||player;
 let target=null,best=260;

 const targets=[
  ...people.filter(p=>p.alive),
  ...gang.filter(p=>p.alive),
  ...cops.filter(c=>c.alive)
 ];

 for(const p of targets){
  const d=dist(origin,p);
  if(d<best){best=d;target=p}
 }
 if(!target){say('Рядом нет цели');return}

 target.alive=false;

 if(cops.includes(target)){
  policeKills++;
  addCrime(7);
  if(currentMission&&currentMission.type==='police'&&currentMission.started){
   currentMission.progress++;
   if(currentMission.progress>=currentMission.goal)completeMission();
  }
  say('Полицейский побеждён! Розыск растёт.');
 }else if(gang.includes(target)){
  gangKills++;
  addCrime(4);
  if(currentMission&&currentMission.type==='gang'&&currentMission.started){
   currentMission.progress++;
   if(currentMission.progress>=currentMission.goal)completeMission();
  }
  say('Бандит побеждён!');
 }else{
  civilianKills++;
  addCrime(5);
  if(currentMission&&currentMission.type==='civilians'&&currentMission.started){
   currentMission.progress++;
   if(currentMission.progress>=currentMission.goal)completeMission();
  }
  say('Гражданский побеждён! Розыск растёт.');
 }
}

$('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});

addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if(e.repeat)return;
 if(k==='e')enterExit();
 if(k==='f')openShop();
 if(k===' ')action();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function moveJoy(e){
 const r=$('joy').getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 const max=r.width*.31,l=Math.hypot(dx,dy);
 if(l>max){dx=dx/l*max;dy=dy/l*max}
 joy.x=dx/max;joy.y=dy/max;
 $('knob').style.transform=`translate(${dx}px,${dy}px)`;
}

$('joy').addEventListener('pointerdown',e=>{
 joy.active=true;
 $('joy').setPointerCapture(e.pointerId);
 moveJoy(e);
});
$('joy').addEventListener('pointermove',e=>{if(joy.active)moveJoy(e)});
function stopJoy(){
 joy.active=false;joy.x=joy.y=0;
 $('knob').style.transform='translate(0,0)';
}
$('joy').addEventListener('pointerup',stopJoy);
$('joy').addEventListener('pointercancel',stopJoy);

function waypointAround(c,target){
 const dx=target.x-c.x,dy=target.y-c.y,len=Math.hypot(dx,dy)||1;
 const ax=c.x+dx/len*30,ay=c.y+dy/len*30;
 if(!blocked(ax,ay,10))return {x:target.x,y:target.y};
 const b=buildings.find(b=>ax+10>b.x&&ax-10<b.x+b.w&&ay+10>b.y&&ay-10<b.y+b.h);
 if(!b)return {x:target.x,y:target.y};
 const pad=22;
 const options=[
  {x:b.x-pad,y:b.y-pad},{x:b.x+b.w+pad,y:b.y-pad},
  {x:b.x-pad,y:b.y+b.h+pad},{x:b.x+b.w+pad,y:b.y+b.h+pad},
  {x:b.x+b.w/2,y:b.y-pad},{x:b.x+b.w/2,y:b.y+b.h+pad},
  {x:b.x-pad,y:b.y+b.h/2},{x:b.x+b.w+pad,y:b.y+b.h/2}
 ].filter(p=>!blocked(p.x,p.y,9));
 options.sort((a,b)=>dist(a,c)+dist(a,target)-dist(b,c)-dist(b,target));
 return options[0]||{x:c.x,y:c.y};
}

function spawnCop(){
 const p=roadPoint();
 const vehicle={
  x:p.x,y:p.y,angle:p.angle,color:'#234e7c',
  speed:0,boost:0,police:true
 };
 const c={
  ...p,alive:true,mode:'car',speed:235,
  vehicle,replan:0,wp:null
 };
 vehicle.owner=c;
 cops.push(c);
 cars.push(vehicle);
 copsSpawned++;
}

function arrest(){
 if(arrested||won)return;
 arrests++;
 arrested=true;
 car=null;

 // После ареста снимается одна звезда.
 wanted=Math.max(0,wanted-1);
 crime=Math.max(0,crime-22);
 if(arrests===1)wanted=Math.min(wanted,2);
 player.hp=player.maxHp;
 player.money=Math.max(0,player.money-(arrests===1?60:100));

 // После второго ареста тюремный двор становится больше.
 if(arrests>=2){
  prison.w=560;
  prison.h=380;
  prison.x=2520;
  prison.y=150;
  prison.gateX=2800;
  prison.gateY=530;
  player.speed=145;
 }else{
  prison.w=400;
  prison.h=250;
  prison.x=2600;
  prison.y=200;
  prison.gateX=2800;
  prison.gateY=450;
  player.speed=180;
 }

 player.x=prison.x+prison.w/2;
 player.y=prison.y+prison.h/2;

 for(const c of cops){
  if(c.vehicle)c.vehicle.speed=0;
  c.alive=false;
 }
 say(arrests>=2?
  'ПОВТОРНЫЙ АРЕСТ! Тюрьма больше, побег сложнее.':
  'ТЕБЯ АРЕСТОВАЛИ! Найди ворота и сбеги.');
}

function update(dt){
 if(won)return;

 if(arrested){
  let ix=joy.x,iy=joy.y;
  if(keys.w||keys.arrowup)iy-=1;
  if(keys.s||keys.arrowdown)iy+=1;
  if(keys.a||keys.arrowleft)ix-=1;
  if(keys.d||keys.arrowright)ix+=1;
  let l=Math.hypot(ix,iy);
  if(l>1){ix/=l;iy/=l}
  moveObj(player,ix*player.speed*.7*dt,iy*player.speed*.7*dt,9);
  if(Math.abs(player.x-prison.gateX)<40&&Math.abs(player.y-prison.gateY)<48){
   $('hint').textContent='ВОРОТА РЯДОМ! Нажми ДЕЙСТВИЕ, чтобы сбежать.';
  }else{
   $('hint').textContent='ТЮРЬМА: найди ворота внизу ограды. Джойстик — движение.';
  }
  cleanupCops();
  return;
 }

 let ix=joy.x,iy=joy.y;
 if(keys.w||keys.arrowup)iy-=1;
 if(keys.s||keys.arrowdown)iy+=1;
 if(keys.a||keys.arrowleft)ix-=1;
 if(keys.d||keys.arrowright)ix+=1;

 let l=Math.hypot(ix,iy);
 if(l>1){ix/=l;iy/=l}

 if(car){
  if(l>.05){
   car.angle=Math.atan2(iy,ix);
   car.speed=220*(car.boost>0?1.4:1);
  }else car.speed*=.9;

  const nx=car.x+Math.cos(car.angle)*car.speed*dt;
  const ny=car.y+Math.sin(car.angle)*car.speed*dt;
  if(!blocked(nx,ny,15)){car.x=nx;car.y=ny}else car.speed=0;
  player.x=car.x;player.y=car.y;
  if(car.boost>0)car.boost-=dt;
 }else if(l>.05){
  player.angle=Math.atan2(iy,ix);
  moveObj(player,ix*player.speed*dt,iy*player.speed*dt,9);
 }

 for(const p of people)if(p.alive){
  if(wanted>0&&dist(p,player)<90){
   p.angle=Math.atan2(p.y-player.y,p.x-player.x);
   p.panic=2;
  }
  p.panic=Math.max(0,p.panic-dt);
  if(p.panic>0){
   moveObj(p,Math.cos(p.angle)*90*dt,Math.sin(p.angle)*90*dt,7);
  }else{
   p.turn-=dt;
   if(p.turn<=0){p.angle=rand()*Math.PI*2;p.turn=2+rand()*4}
   moveObj(p,Math.cos(p.angle)*17*dt,Math.sin(p.angle)*17*dt,7);
  }
 }

 // Бандиты двигаются к игроку, когда тот рядом.
 for(const g of gang)if(g.alive){
  const target=car||player;
  if(dist(g,target)<250){
   const a=Math.atan2(target.y-g.y,target.x-g.x);
   moveObj(g,Math.cos(a)*g.speed*dt,Math.sin(a)*g.speed*dt,8);
   if(dist(g,target)<20&&player.hp>0){
    player.hp=Math.max(0,player.hp-10*dt);
   }
  }else{
   g.turn-=dt;
   if(g.turn<=0){g.angle=rand()*Math.PI*2;g.turn=1+rand()*3}
   moveObj(g,Math.cos(g.angle)*15*dt,Math.sin(g.angle)*15*dt,8);
  }
 }

 // Полиция появляется при розыске. Высокий розыск вызывает больше патрулей.
 const aliveCops=cops.filter(c=>c.alive).length;
 const desired=wanted>0?Math.min(8,Math.ceil(wanted)+1+arrests):0;
 if(aliveCops<desired&&rand()<dt*.55)spawnCop();

 for(const c of cops)if(c.alive){
  const target=car||player;
  const d=dist(c,target);

  if(c.mode==='car'){
   const v=c.vehicle;
   c.replan-=dt;
   if(c.replan<=0){c.wp=waypointAround(v,target);c.replan=.35}
   const a=Math.atan2(c.wp.y-v.y,c.wp.x-v.x);
   v.angle=a;
   const speed=280+wanted*16+arrests*8;
   const nx=v.x+Math.cos(a)*speed*dt;
   const ny=v.y+Math.sin(a)*speed*dt;

   if(!blocked(nx,ny,15)){v.x=nx;v.y=ny}
   else{
    c.replan=0;
    const side=a+Math.PI/2;
    if(!blocked(v.x+Math.cos(side)*85*dt,v.y+Math.sin(side)*85*dt,15)){
     v.x+=Math.cos(side)*85*dt;
     v.y+=Math.sin(side)*85*dt;
    }
   }
   c.x=v.x;c.y=v.y;

   if(d<80){
    c.mode='foot';
    c.x=v.x+25;c.y=v.y+18;
    if(!blocked(c.x,c.y,8)){
     v.x=-500;v.y=-500;
    }else{
     c.x=v.x-25;c.y=v.y-18;
    }
    say('Полицейский выходит из машины!');
   }
  }else{
   c.replan-=dt;
   if(c.replan<=0){c.wp=waypointAround(c,target);c.replan=.25}
   const a=Math.atan2(c.wp.y-c.y,c.wp.x-c.x);
   moveObj(c,Math.cos(a)*(145+wanted*14+arrests*5)*dt,
    Math.sin(a)*(145+wanted*14+arrests*5)*dt,8);
   if(dist(c,target)<23){arrest();return}
  }
 }

 cleanupCops();

 if(player.hp<=0){
  arrest();
  return;
 }
}

function cleanupCops(){
 for(let i=cops.length-1;i>=0;i--){
  const c=cops[i];
  if(!c.alive){
   if(c.vehicle){
    const k=cars.indexOf(c.vehicle);
    if(k>=0)cars.splice(k,1);
   }
   cops.splice(i,1);
  }
 }
}

function drawPerson(p){
 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.rotate(p.angle||0);
 ctx.fillStyle='#0007';
 ctx.beginPath();ctx.ellipse(2,5,10,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f4c79b';
 ctx.beginPath();ctx.arc(0,-4,6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=p.color||'#54d96d';
 ctx.fillRect(-7,1,14,13);
 ctx.fillStyle='#252d36';
 ctx.fillRect(-6,12,5,7);ctx.fillRect(2,12,5,7);
 ctx.restore();
}

function drawCar(c){
 ctx.save();
 ctx.translate(c.x,c.y);
 ctx.rotate(c.angle);
 ctx.fillStyle='#0007';ctx.fillRect(-18,-10,40,24);
 ctx.fillStyle=c.police?'#234e7c':c.color;
 ctx.fillRect(-20,-9,40,18);
 ctx.fillStyle='#18242e';ctx.fillRect(-7,-7,14,14);
 if(c.police){
  ctx.fillStyle='#ff4141';ctx.fillRect(-4,-11,7,4);
  ctx.fillStyle='#59a7ff';ctx.fillRect(3,-11,7,4);
 }else{
  ctx.fillStyle='#fff3ad';
  ctx.fillRect(16,-7,4,5);ctx.fillRect(16,2,4,5);
 }
 ctx.fillStyle='#222';
 ctx.fillRect(-13,-12,9,4);ctx.fillRect(7,-12,9,4);
 ctx.fillRect(-13,8,9,4);ctx.fillRect(7,8,9,4);
 ctx.restore();
}

function drawMissionMarker(m){
 if(!m)return;
 const pulse=25+Math.sin(Date.now()/180)*5;
 ctx.strokeStyle='#ffe34d';
 ctx.lineWidth=5;
 ctx.beginPath();ctx.arc(m.x,m.y,pulse,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#ffe34d';
 ctx.font='bold 14px Arial';
 ctx.fillText('МИССИЯ',m.x-30,m.y-37);
 ctx.fillStyle='#fff';
 ctx.font='bold 11px Arial';
 if(m.type==='gang')ctx.fillText('БАНДА',m.x-19,m.y+4);
 else if(m.type==='police')ctx.fillText('ПОЛИЦИЯ',m.x-27,m.y+4);
 else if(m.type==='civilians')ctx.fillText('ЦЕЛИ',m.x-16,m.y+4);
 else if(m.type==='shop')ctx.fillText('ПОКУПКА',m.x-26,m.y+4);
 else ctx.fillText('ДОСТАВКА',m.x-29,m.y+4);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const target=car||player;
 cam.x=clamp(target.x-W/2,0,world.w-W);
 cam.y=clamp(target.y-H/2,0,world.h-H);

 ctx.save();
 ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#34483d';ctx.fillRect(0,0,world.w,world.h);
 ctx.fillStyle='#343a40';
 for(const x of roadsX)ctx.fillRect(x-48,0,96,world.h);
 for(const y of roadsY)ctx.fillRect(0,y-48,world.w,96);

 ctx.strokeStyle='#c6b779';ctx.lineWidth=2;ctx.setLineDash([20,18]);
 for(const x of roadsX){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(const y of roadsY){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 ctx.setLineDash([]);

 for(const b of buildings){
  ctx.fillStyle='#0005';ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
  ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#252f38';
  for(let x=b.x+12;x<b.x+b.w-8;x+=22)
   for(let y=b.y+20;y<b.y+b.h-8;y+=24)ctx.fillRect(x,y,8,7);
 }

 // Тюрьма увеличивается после повторного ареста.
 ctx.fillStyle='#6c777a';ctx.fillRect(prison.x,prison.y,prison.w,prison.h);
 ctx.fillStyle='#48545a';
 ctx.fillRect(prison.x+25,prison.y+25,prison.w-50,prison.h-50);
 ctx.strokeStyle='#d7dce0';ctx.lineWidth=5;
 ctx.strokeRect(prison.x,prison.y,prison.w,prison.h);
 ctx.strokeStyle='#6c777a';ctx.lineWidth=9;
 ctx.beginPath();
 ctx.moveTo(prison.gateX-24,prison.gateY);
 ctx.lineTo(prison.gateX+24,prison.gateY);
 ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold 17px Arial';
 ctx.fillText('ТЮРЬМА',prison.x+135,prison.y+18);
 ctx.fillStyle='#252d33';
 ctx.fillRect(prison.x+100,prison.y+75,Math.min(200,prison.w-150),90);
 ctx.fillStyle='#aab8c0';
 ctx.fillRect(prison.x+115,prison.y+85,Math.min(170,prison.w-180),5);

 ctx.fillStyle='#4cfa85';ctx.fillRect(store.x-20,store.y-20,40,40);
 ctx.fillStyle='#143b25';ctx.font='bold 22px Arial';
 ctx.fillText('$',store.x-7,store.y+8);
 ctx.fillStyle='#fff';ctx.font='bold 13px Arial';
 ctx.fillText('МАГАЗИН',store.x-35,store.y-28);

 drawMissionMarker(currentMission);
 // Старый жёлтый маркер доставки остаётся видимым, если нет активной миссии.
 if(!currentMission){
  ctx.strokeStyle='#ffe34d';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(job.x,job.y,25+Math.sin(Date.now()/180)*5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#ffe34d';ctx.font='bold 16px Arial';
  ctx.fillText('$35',job.x-17,job.y-37);
 }

 for(const p of people)if(p.alive)drawPerson(p);
 for(const g of gang)if(g.alive)drawPerson(g);
 for(const c of cars)if(c.x>-100&&c.y>-100)drawCar(c);
 for(const c of cops)if(c.alive&&c.mode==='foot')drawPerson({...c,color:'#65a9ff'});

 if(!car)drawPerson({...player,color:'#54ff79'});
 else{
  ctx.fillStyle='#ffd2a0';ctx.beginPath();
  ctx.arc(car.x,car.y,5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();

 mc.clearRect(0,0,224,168);
 mc.fillStyle='#34483d';mc.fillRect(0,0,224,168);
 mc.fillStyle='#343a40';
 for(const x of roadsX)mc.fillRect(x/world.w*224-3,0,6,168);
 for(const y of roadsY)mc.fillRect(0,y/world.h*168-3,224,6);
 mc.fillStyle='#68727a';
 for(const b of buildings)mc.fillRect(
  b.x/world.w*224,b.y/world.h*168,
  b.w/world.w*224,b.h/world.h*168
 );
 mc.fillStyle='#aab1b8';
 mc.fillRect(prison.x/world.w*224,prison.y/world.h*168,
  prison.w/world.w*224,prison.h/world.h*168);
 mc.fillStyle='#4cfa85';
 mc.fillRect(store.x/world.w*224-3,store.y/world.h*168-3,6,6);

 if(currentMission){
  mc.fillStyle='#ffe34d';
  mc.beginPath();
  mc.arc(currentMission.x/world.w*224,currentMission.y/world.h*168,4,0,Math.PI*2);
  mc.fill();
 }else{
  mc.fillStyle='#ffe34d';
  mc.fillRect(job.x/world.w*224-3,job.y/world.h*168-3,6,6);
 }

 mc.fillStyle='#ff9e9e';
 for(const p of people)if(p.alive)mc.fillRect(p.x/world.w*224-1,p.y/world.h*168-1,2,2);
 mc.fillStyle='#d85d5d';
 for(const g of gang)if(g.alive)mc.fillRect(g.x/world.w*224-2,g.y/world.h*168-2,4,4);
 mc.fillStyle='#60b4ff';
 for(const c of cops)if(c.alive)mc.fillRect(c.x/world.w*224-2,c.y/world.h*168-2,4,4);
 mc.fillStyle='white';mc.beginPath();
 mc.arc(target.x/world.w*224,target.y/world.h*168,4,0,Math.PI*2);
 mc.fill();

 $('stats').innerHTML=
  `💵 $${player.money} · ❤️ ${Math.ceil(player.hp)} · 🔫 ${player.ammo}<br>`+
  `🚨 <span style="color:#ffce62">${stars()}</span> · ${car?'🚗 Машина':'🚶 Пешком'}`;

 if(won){
  $('hint').textContent='🏆 ПОБЕДА! Пять звёзд розыска достигнуты.';
 }else if(arrested){
  $('hint').textContent='ТЮРЬМА: найди ворота и нажми ДЕЙСТВИЕ.';
 }else if(currentMission){
  const progress=currentMission.progress||0;
  $('hint').textContent=
   currentMission.name+' — '+progress+'/'+currentMission.goal+
   '. Нажми ЗАДАНИЕ у жёлтого круга.';
 }else{
  $('hint').textContent='Зелёный — магазин. Жёлтый — миссия. E — машина, F — магазин, пробел — действие.';
 }
 requestAnimationFrame(draw);
}

let last=performance.now();
function loop(now){
 const dt=Math.min((now-last)/1000,.035);
 last=now;
 update(dt);
 requestAnimationFrame(loop);
}
requestAnimationFrame(draw);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
