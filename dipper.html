<!DOCTYPE html>
<html lang="ru">
<head>

<title>Гравити Фолз · Дневник Диппера</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0510; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #1a0a20; touch-action: none; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 8px 12px; font-size: 12px; font-weight: 700; z-index: 10; pointer-events: none; gap: 5px; flex-wrap: wrap; }
  .hud .stat { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px; border: 1px solid #3a1a4a; }
  .hud .hp { color: #ff5c8a; }
  .hud .pages { color: #5ecbff; }
  .hud .coins { color: #ffd24a; }
  .hud .loc { color: #6ee37c; }
  .quest-panel { position: fixed; top: 60px; left: 12px; background: rgba(0,0,0,0.75); border: 2px solid #ffd24a; border-radius: 12px; padding: 10px 14px; max-width: 260px; font-size: 12px; z-index: 10; pointer-events: none; }
  .quest-panel .q-title { color: #ffd24a; font-weight: 800; margin-bottom: 4px; letter-spacing: 1px; }
  .quest-panel .q-text { color: #d8d8e8; line-height: 1.4; }
  .weapon-bar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px 10px; background: rgba(10, 5, 16, 0.85); border: 2px solid #3a1a4a; border-radius: 16px; z-index: 15; max-width: 95vw; overflow-x: auto; scrollbar-width: none; }
  .weapon-bar::-webkit-scrollbar { display: none; }
  .weapon { flex-shrink: 0; width: 52px; height: 52px; background: linear-gradient(180deg, #2a1030 0%, #1a0a20 100%); border: 2px solid #3a1a4a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; position: relative; touch-action: manipulation; }
  .weapon.selected { border-color: #ffd24a; box-shadow: 0 0 16px rgba(255,210,74,0.8); transform: translateY(-3px); }
  .weapon.locked { opacity: 0.3; }
  .weapon.locked::after { content: '🔒'; position: absolute; font-size: 18px; }
  .joystick { position: fixed; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,210,74,0.08); border: 3px solid rgba(255,210,74,0.5); display: none; pointer-events: none; z-index: 30; transform: translate(-50%, -50%); }
  .joystick .knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65px; height: 65px; border-radius: 50%; background: rgba(255,210,74,0.6); border: 3px solid #ffd24a; box-shadow: 0 0 25px rgba(255,210,74,0.9); }
  .shoot-btn { position: fixed; bottom: 90px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ff5c8a, #8a2a4a); border: 3px solid #ffd24a; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 20; box-shadow: 0 0 30px rgba(255,92,138,0.6); touch-action: manipulation; cursor: pointer; }
  .shoot-btn:active { transform: scale(0.92); }
  .interact-btn { position: fixed; bottom: 90px; right: 110px; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #5ecbff, #2a5a8a); border: 3px solid #ffd24a; display: none; align-items: center; justify-content: center; font-size: 26px; z-index: 20; box-shadow: 0 0 30px rgba(94,203,255,0.6); touch-action: manipulation; cursor: pointer; }
  .interact-btn.show { display: flex; }
  .interact-btn:active { transform: scale(0.92); }
  .dialog-box { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 5, 20, 0.97); border-top: 4px solid #ffd24a; padding: 20px 24px 26px; z-index: 100; display: none; max-height: 45vh; overflow-y: auto; }
  .dialog-box.show { display: block; }
  .dialog-box .speaker { color: #ffd24a; font-weight: 900; font-size: 16px; letter-spacing: 2px; margin-bottom: 8px; }
  .dialog-box .text { color: #e8e8f0; font-size: 15px; line-height: 1.6; margin-bottom: 16px; }
  .dialog-box .choices { display: flex; flex-direction: column; gap: 8px; }
  .dialog-box .choice { padding: 12px 16px; background: linear-gradient(180deg, #2a1030 0%, #1a0a20 100%); border: 2px solid #3a1a4a; border-radius: 10px; color: #e8e8f0; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer; touch-action: manipulation; }
  .dialog-box .choice:active { border-color: #ffd24a; }
  .toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(20, 5, 15, 0.95); border: 3px solid #ffd24a; border-radius: 14px; padding: 16px 30px; font-size: 15px; font-weight: 800; color: #ffd24a; text-align: center; z-index: 200; pointer-events: none; max-width: 80vw; }
  .toast.show { animation: toastPop 2s ease-out forwards; }
  @keyframes toastPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 85% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 300; padding: 20px; text-align: center; }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 26px; color: #ffd24a; margin-bottom: 14px; letter-spacing: 2px; }
  .overlay h1.lose { color: #ff5c8a; }
  .overlay p { font-size: 14px; color: #c8c8dc; line-height: 1.6; max-width: 440px; margin-bottom: 20px; }
  .overlay button { padding: 14px 36px; background: linear-gradient(135deg, #ffd24a, #ff5c8a); border: none; border-radius: 40px; color: #1a0a08; font-family: inherit; font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin: 4px; touch-action: manipulation; }
</style>
</head>

        ],
        exits: [
          { x: 3, y: 2, to: 0, spawnX: 3, spawnY: 14, label: '🚪 В Хижину' },
          { x: 22, y: 15, to: 3, spawnX: 2, spawnY: 2, label: '🌲 В лес' }
        ],
        enemies: ['gnome'],

      },
      // 3. Тёмный лес

        walls: [

        walls: [
          { x1: 1, y1: 1, x2: 23, y2: 1 },

        ],

        npcs: [],

      },
      // 5. Пещера
      {
        name: 'Пещера',
        floorColor: '#1a0a05',
        wallColor: '#4a2a10',
        walls: [
          { x1: 1, y1: 1, x2: 23, y2: 1 },
          { x1: 1, y1: 1, x2: 1, y2: 16 },
          { x1: 23, y1: 1, x2: 23, y2: 16 },

    // ============================================================

      mabel: { name: 'Мэйбл', emoji: '👱‍♀️', color: '#ff8ac4', x: 12, y: 10, location: 0,
        dialog: { text: 'Диппер! В лесу спрятаны 3 страницы Дневника. Собери их — и найдёшь логово Гидеона!',

    // ============================================================

    var state = {

    function getLocation() { return LOCATIONS[state.location]; }

    function findSafeStart(locId, spawnX, spawnY) {
      var loc = LOCATIONS[locId];
      var map = makeMap(loc.walls);
      // если клетка свободна — используем
      if (map[spawnY] && map[spawnY][spawnX] === 0) {
        return { x: spawnX, y: spawnY };
      }
      // иначе ищем ближайшую свободную
      for (var r = 1; r < 15; r++) {
        for (var dy = -r; dy <= r; dy++) {
          for (var dx = -r; dx <= r; dx++) {
            var x = spawnX + dx;
            var y = spawnY + dy;
            if (map[y] && map[y][x] === 0) return { x: x, y: y };
          }
        }
      }
      return { x: 2, y: 2 };
    }

    function makeMap(walls) {
      var map = [];
      for (var y = 0; y < MAP_ROWS; y++) {
        var row = [];
        for (var x = 0; x < MAP_COLS; x++) {
          row.push(0);
        }
        map.push(row);
      }
      // обрамление
      for (var x = 0; x < MAP_COLS; x++) { map[0][x] = 1; map[MAP_ROWS-1][x] = 1; }
      for (var y = 0; y < MAP_ROWS; y++) { map[y][0] = 1; map[y][MAP_COLS-1] = 1; }
      // стены
      for (var i = 0; i < walls.length; i++) {
        var w = walls[i];
        for (var yy = w.y1; yy <= w.y2; yy++) {
          for (var xx = w.x1; xx <= w.x2; xx++) {
            if (map[yy] && map[yy][xx] !== undefined) map[yy][xx] = 1;
          }
        }
      }
      return map;
    }

    // ============================================================
    // ПЕРЕХОД МЕЖДУ ЛОКАЦИЯМИ
    // ============================================================
    function changeLocation(to, spawnX, spawnY) {
      state.location = to;
      var loc = getLocation();
      state.map = makeMap(loc.walls);
      var safe = findSafeStart(to, spawnX, spawnY);
      state.player.x = safe.x * TILE + TILE / 2;
      state.player.y = safe.y * TILE + TILE / 2;
      state.enemies = [];
      state.bullets = [];
      state.pickups = [];
      state.particles = [];
      state.enemyTimer = 0;
      // камера сразу на игрока
      state.cam.x = state.player.x - W / 2;
      state.cam.y = state.player.y - H / 2;
      showToast('📍 ' + loc.name);
      updateHud();
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      resize();
      state.location = 0;
      var loc = getLocation();
      state.map = makeMap(loc.walls);
      state.player.x = loc.spawn.x * TILE + TILE / 2;
      state.player.y = loc.spawn.y * TILE + TILE / 2;
      state.player.hp = state.player.maxHp;
      state.cam.x = state.player.x - W / 2;
      state.cam.y = state.player.y - H / 2;
      state.enemies = [];
      state.bullets = [];
      state.pickups = [];
      state.particles = [];
      state.pages = 0;
      state.coins = 0;
      state.player.level = 1;
      state.player.xp = 0;
      state.player.xpNext = 50;
      state.player.damageBonus = 0;
      state.selected = 0;
      state.unlocked = [true, false, false, false, false];
      state.running = true;
      state.gameOver = false;
      state.lastTime = performance.now();
      state.enemyTimer = 20;
      state.nearestNpc = null;
      state.dialogOpen = false;
      state.quest = 'Поговори с Мэйбл в Хижине';
      state.gideonDefeated = false;
      state.chestsOpened = {};
      // страницы в лесу, озере, пещере
      spawnPages();
      buildWeapons();
      updateHud();
      requestAnimationFrame(loop);
    }

    function spawnPages() {
      // 3 страницы в разных локациях
      state.pickups.push({ type: 'page', x: 12 * TILE + TILE/2, y: 5 * TILE + TILE/2, radius: 18, collected: false, location: 3 });
      state.pickups.push({ type: 'page', x: 18 * TILE + TILE/2, y: 12 * TILE + TILE/2, radius: 18, collected: false, location: 4 });
      state.pickups.push({ type: 'page', x: 10 * TILE + TILE/2, y: 13 * TILE + TILE/2, radius: 18, collected: false, location: 5 });
    }

    function buildWeapons() {
      var bar = document.getElementById('weaponBar');
      bar.innerHTML = '';
      for (var i = 0; i < WEAPONS.length; i++) {
        (function(idx) {
          var w = WEAPONS[idx];
          var el = document.createElement('div');
          el.className = 'weapon';
          if (!state.unlocked[idx]) el.classList.add('locked');
          if (idx === state.selected) el.classList.add('selected');
          el.textContent = w.emoji;
          el.onclick = function(ev) {
            ev.stopPropagation();
            if (!state.unlocked[idx]) return;
            state.selected = idx;
            buildWeapons();
          };
          bar.appendChild(el);
        })(i);
      }
    }

    function updateHud() {
      document.getElementById('hpVal').textContent = Math.max(0, Math.round(state.player.hp));
      document.getElementById('pagesVal').textContent = state.pages + ' / ' + state.totalPages;
      document.getElementById('coinsVal').textContent = state.coins;
      document.getElementById('locVal').textContent = getLocation().name;
      document.getElementById('questText').textContent = state.quest;
    }

    function isWallAt(px, py) {
      var x = Math.floor(px / TILE);
      var y = Math.floor(py / TILE);
      if (y < 0 || y >= state.map.length) return true;
      if (x < 0 || x >= state.map[0].length) return true;
      return state.map[y][x] === 1;
    }

    function canMoveTo(nx, ny, r) {
      var pts = [
        [nx - r, ny - r], [nx + r, ny - r],
        [nx - r, ny + r], [nx + r, ny + r],
        [nx, ny - r], [nx, ny + r],
        [nx - r, ny], [nx + r, ny]
      ];
      for (var i = 0; i < pts.length; i++) {
        if (isWallAt(pts[i][0], pts[i][1])) return false;
      }
      return true;
    }

    // ============================================================
    // СПАВН ВРАГОВ (РЕДКО)
    // ============================================================
    function spawnEnemy(type) {
      var et = ENEMY_TYPES[type];
      var tries = 0, ex = 0, ey = 0;
      while (tries < 60) {
        ex = (1 + Math.random() * (MAP_COLS - 2)) * TILE;
        ey = (1 + Math.random() * (MAP_ROWS - 2)) * TILE;
        var tx = Math.floor(ex / TILE);
        var ty = Math.floor(ey / TILE);
        if (state.map[ty] && state.map[ty][tx] === 0) {
          var d = Math.hypot(ex - state.player.x, ey - state.player.y);
          if (d > 250) break;
        }
        tries++;
      }
      state.enemies.push({
        type: type, x: ex, y: ey,
        hp: et.hp, maxHp: et.hp,
        speed: et.speed, damage: et.damage,
        radius: et.radius, xp: et.xp, coins: et.coins,
        slowUntil: 0, boss: !!et.boss, dead: false
      });
    }

    function spawnPickupAt(x, y, type) {
      state.pickups.push({ type: type, x: x, y: y, radius: 18, collected: false, location: state.location });
    }

    // ============================================================
    // ИГРОВОЙ ЦИКЛ
    // ============================================================
    function loop(now) {
      if (!state.running) return;
      var dt = Math.min(50, now - state.lastTime) / 1000;
      state.lastTime = now;
      if (!state.dialogOpen) update(dt, now);

      var mapW = MAP_COLS * TILE;
      var mapH = MAP_ROWS * TILE;
      var targetCamX = state.player.x - W / 2;
      var targetCamY = state.player.y - H / 2;
      if (mapW > W) targetCamX = Math.max(0, Math.min(mapW - W, targetCamX));
      else targetCamX = (mapW - W) / 2;
      if (mapH > H) targetCamY = Math.max(0, Math.min(mapH - H, targetCamY));
      else targetCamY = (mapH - H) / 2;
      state.cam.x += (targetCamX - state.cam.x) * 0.15;
      state.cam.y += (targetCamY - state.cam.y) * 0.15;

      draw();
      requestAnimationFrame(loop);
    }

    function update(dt, now) {
      var p = state.player;
      var dx = 0, dy = 0;
      if (state.keys.w) dy -= 1;
      if (state.keys.s) dy += 1;
      if (state.keys.a) dx -= 1;
      if (state.keys.d) dx += 1;
      if (state.joy.active) { dx += state.joy.dx; dy += state.joy.dy; }
      var len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }

      var nx = p.x + dx * p.speed * dt;
      var ny = p.y + dy * p.speed * dt;
      if (canMoveTo(nx, p.y, p.radius)) p.x = nx;
      if (canMoveTo(p.x, ny, p.radius)) p.y = ny;

      // цель для стрельбы
      var nearest = null, best = Infinity;
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0) continue;
        var d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < best) { best = d; nearest = e; }
      }
      if (nearest && best < 500) p.angle = Math.atan2(nearest.y - p.y, nearest.x - p.x);

      var w = WEAPONS[state.selected];
      if (nearest && best < 500 && now - state.lastShot > w.cooldown) {
        shoot(nearest, w);
        state.lastShot = now;
      }

      // пули
      for (var i = state.bullets.length - 1; i >= 0; i--) {
        var b = state.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (isWallAt(b.x, b.y)) b.life = 0;
        for (var j = 0; j < state.enemies.length; j++) {
          var e = state.enemies[j];
          if (e.hp <= 0) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
            e.hp -= b.damage + p.damageBonus;
            if (b.slow) e.slowUntil = now + 2000;
            b.life = 0;
            break;
          }
        }
        if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) b.life = 0;
      }
      state.bullets = state.bullets.filter(function(b) { return b.life > 0; });

      // враги
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0) continue;
        var ddx = p.x - e.x;
        var ddy = p.y - e.y;
        var dd = Math.hypot(ddx, ddy);
        var slow = (e.slowUntil > now) ? 0.5 : 1;
        if (dd > p.radius + e.radius - 4) {
          var enx = e.x + (ddx / dd) * e.speed * slow * dt;
          var eny = e.y + (ddy / dd) * e.speed * slow * dt;
          if (canMoveTo(enx, e.y, e.radius)) e.x = enx;
          if (canMoveTo(e.x, eny, e.radius)) e.y = eny;
        } else {
          p.hp -= e.damage * dt;
          if (p.hp <= 0) { p.hp = 0; updateHud(); endGame(false); return; }
        }
      }

      // смерть врагов
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0 && !e.dead) {
          e.dead = true;
          state.coins += e.coins;
          addXp(e.xp);
          if (Math.random() < 0.7) spawnPickupAt(e.x, e.y, 'coin');
          if (e.boss && e.type === 'gideon') {
            setTimeout(function() { endGame(true); }, 500);
          }
          updateHud();
        }
      }
      state.enemies = state.enemies.filter(function(e) { return !e.dead; });

      // пикапы (только текущей локации)
      for (var i = 0; i < state.pickups.length; i++) {
        var pk = state.pickups[i];
        if (pk.collected) continue;
        if (pk.location !== state.location) continue;
        if (Math.hypot(pk.x - p.x, pk.y - p.y) < p.radius + pk.radius) {
          pk.collected = true;
          if (pk.type === 'page') {
            state.pages++;
            showToast('📖 Страница ' + state.pages + ' / ' + state.totalPages);
            if (state.pages >= state.totalPages) {
              state.quest = 'Все страницы собраны! Иди в дом Гидеона (юго-восток карты)';
              showToast('🎯 Иди в дом Гидеона!');
            }
          } else if (pk.type === 'heal') {
            p.hp = Math.min(p.maxHp, p.hp + 30);
            showToast('🍦 +30 HP');
          } else if (pk.type === 'coin') {
            state.coins += 20;
          }
          updateHud();
        }
      }
      // убираем собранные пикапы
      state.pickups = state.pickups.filter(function(pk) {
        if (pk.collected) {
          pk.el && pk.el.remove && pk.el.remove();
          return false;
        }
        return true;
      });

      // переходы между локациями
      var cx = Math.floor(p.x / TILE);
      var cy = Math.floor(p.y / TILE);
      var loc = getLocation();
      for (var i = 0; i < loc.exits.length; i++) {
        var ex = loc.exits[i];
        if (cx === ex.x && cy === ex.y) {
          if (!state._doorCooldown || now - state._doorCooldown > 1500) {
            state._doorCooldown = now;
            // проверка: если это дом Гидеона — надо иметь 3 страницы
            if (ex.to === 7 && state.pages < state.totalPages) {
              showToast('🔒 Нужно 3 страницы Дневника');
              // отталкиваем игрока
              p.x -= dx * 10;
              p.y -= dy * 10;
            } else {
              changeLocation(ex.to, ex.spawnX, ex.spawnY);
              // если это дом Гидеона — спавним босса
              if (ex.to === 7 && !state.gideonDefeated) {
                setTimeout(function() { spawnGideon(); }, 1000);
              }
            }
          }
        }
      }

      // частицы
      for (var i = 0; i < state.particles.length; i++) {
        var pt = state.particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
      }
      state.particles = state.particles.filter(function(pt) { return pt.life > 0; });

      // NPC
      state.nearestNpc = null;
      var bestNpcDist = 80;
      for (var key in NPCS) {
        var npc = NPCS[key];
        if (npc.location !== state.location) continue;
        var nx2 = npc.x * TILE + TILE / 2;
        var ny2 = npc.y * TILE + TILE / 2;
        var d2 = Math.hypot(nx2 - p.x, ny2 - p.y);
        if (d2 < bestNpcDist) {
          bestNpcDist = d2;
          state.nearestNpc = npc;
        }
      }
      var ib = document.getElementById('interactBtn');
      if (state.nearestNpc && !state.dialogOpen) ib.classList.add('show');
      else ib.classList.remove('show');

      // редкий спавн врагов вне Хижины
      var loc2 = getLocation();
      if (loc2.enemies.length > 0) {
        state.enemyTimer -= dt;
        if (state.enemyTimer <= 0) {
          state.enemyTimer = 40 + Math.random() * 20;
          var type = loc2.enemies[Math.floor(Math.random() * loc2.enemies.length)];
          spawnEnemy(type);
        }
      }
    }

    function addXp(amount) {
      var p = state.player;
      p.xp += amount;
      while (p.xp >= p.xpNext) {
        p.xp -= p.xpNext;
        p.level++;
        p.xpNext = Math.floor(p.xpNext * 1.5);
        p.maxHp += 20;
        p.hp = p.maxHp;
        p.damageBonus += 5;
        showToast('⬆️ УРОВЕНЬ ' + p.level + '!');
      }
      updateHud();
    }

    function shoot(target, w) {
      var p = state.player;
      var angle = Math.atan2(target.y - p.y, target.x - p.x);
      var speed = w.short ? 300 : 600;
      state.bullets.push({
        x: p.x, y: p.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage: w.damage, radius: w.size,
        color: w.color, slow: w.slow,
        life: w.short ? 0.3 : 1.5
      });
    }

    function spawnGideon() {
      var et = ENEMY_TYPES['gideon'];
      state.enemies.push({
        type: 'gideon', x: state.player.x + 150, y: state.player.y,
        hp: et.hp, maxHp: et.hp,
        speed: et.speed, damage: et.damage,
        radius: et.radius, xp: et.xp, coins: et.coins,
        slowUntil: 0, boss: true, dead: false
      });
      showToast('⚔️ ГИДЕОН!');
      state.quest = 'Победи Гидеона!';
      updateHud();
    }

    // ============================================================
    // ОТРИСОВКА
    // ============================================================
    function draw() {
      var loc = getLocation();
      ctx.fillStyle = loc.floorColor;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(-Math.round(state.cam.x), -Math.round(state.cam.y));

      // карта
      for (var y = 0; y < state.map.length; y++) {
        for (var x = 0; x < state.map[y].length; x++) {
          var px = x * TILE;
          var py = y * TILE;
          if (px + TILE < state.cam.x || px > state.cam.x + W) continue;
          if (py + TILE < state.cam.y || py > state.cam.y + H) continue;
          var v = state.map[y][x];
          if (v === 1) {
            ctx.fillStyle = loc.wallColor;
            ctx.fillRect(px, py, TILE, TILE);
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = 2;
            ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
          } else {
            if ((x + y) % 2 === 0) {
              ctx.fillStyle = 'rgba(255,255,255,0.03)';
              ctx.fillRect(px, py, TILE, TILE);
            }
          }
        }
      }

      // указатели переходов
      var loc = getLocation();
      for (var i = 0; i < loc.exits.length; i++) {
        var ex = loc.exits[i];
        var exX = ex.x * TILE + TILE / 2;
        var exY = ex.y * TILE + TILE / 2;
        ctx.fillStyle = 'rgba(255,210,74,0.3)';
        ctx.fillRect(ex.x * TILE + 5, ex.y * TILE + 5, TILE - 10, TILE - 10);
        ctx.strokeStyle = '#ffd24a';
        ctx.lineWidth = 3;
        ctx.strokeRect(ex.x * TILE + 5, ex.y * TILE + 5, TILE - 10, TILE - 10);
        ctx.font = 'bold 10px sans-serif';
        ctx.fillStyle = '#ffd24a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ex.label, exX, exY + 25);
      }

      // NPC
      for (var key in NPCS) {
        var npc = NPCS[key];
        if (npc.location !== state.location) continue;
        var nx = npc.x * TILE + TILE / 2;
        var ny = npc.y * TILE + TILE / 2;
        var bob = Math.sin(performance.now() / 300) * 3;
        ctx.font = '42px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(npc.emoji, nx, ny + bob);
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = npc.color;
        ctx.fillText(npc.name, nx, ny + 40);
        if (state.nearestNpc === npc) {
          ctx.font = '20px sans-serif';
          ctx.fillStyle = '#ffd24a';
          ctx.fillText('💬', nx, ny - 40);
        }
      }

      // пикапы
      for (var i = 0; i < state.pickups.length; i++) {
        var pk = state.pickups[i];
        if (pk.location !== state.location) continue;
        var bob = Math.sin(performance.now() / 200) * 3;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (pk.type === 'page') { ctx.font = '32px serif'; ctx.fillText('📖', pk.x, pk.y + bob); }
        else if (pk.type === 'heal') { ctx.font = '28px serif'; ctx.fillText('🍦', pk.x, pk.y + bob); }
        else if (pk.type === 'coin') { ctx.font = '22px serif'; ctx.fillText('🪙', pk.x, pk.y + bob); }
      }

      // враги
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        var et = ENEMY_TYPES[e.type];
        ctx.font = (e.radius * 2.2) + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(et.emoji, e.x, e.y);
        if (e.hp < e.maxHp) {
          var w = e.radius * 2;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(e.x - w/2, e.y - e.radius - 14, w, 6);
          ctx.fillStyle = e.boss ? '#ff2a6a' : '#6ee37c';
          ctx.fillRect(e.x - w/2, e.y - e.radius - 14, w * (e.hp / e.maxHp), 6);
        }
      }

      // пули
      for (var i = 0; i < state.bullets.length; i++) {
        var b = state.bullets[i];
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // игрок
      var p = state.player;
      ctx.font = '42px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧢', p.x, p.y);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = WEAPONS[state.selected].color;
      ctx.fillRect(10, -3, 22, 6);
      ctx.restore();

      ctx.restore();

      drawMinimap();
    }

    function drawMinimap() {
      var mmSize = 110;
      var cell = mmSize / Math.max(MAP_COLS, MAP_ROWS);
      var mmX = W - mmSize - 20;
      var mmY = 60;

      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(mmX - 4, mmY - 4, mmSize + 8, mmSize + 8);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 2;
      ctx.strokeRect(mmX - 4, mmY - 4, mmSize + 8, mmSize + 8);

      for (var y = 0; y < state.map.length; y++) {
        for (var x = 0; x < state.map[y].length; x++) {
          var v = state.map[y][x];
          ctx.fillStyle = v === 1 ? '#6a3a8a' : 'rgba(255,255,255,0.1)';
          ctx.fillRect(mmX + x * cell, mmY + y * cell, cell, cell);
        }
      }
      // NPC на миникарте
      for (var key in NPCS) {
        var npc = NPCS[key];
        if (npc.location !== state.location) continue;
        ctx.fillStyle = npc.color;
        ctx.fillRect(mmX + npc.x * cell - 1, mmY + npc.y * cell - 1, 3, 3);
      }
      // игрок
      ctx.fillStyle = '#5ecbff';
      ctx.fillRect(mmX + (state.player.x / TILE) * cell - 1, mmY + (state.player.y / TILE) * cell - 1, 3, 3);
      // враги
      ctx.fillStyle = '#ff5c8a';
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        ctx.fillRect(mmX + (e.x / TILE) * cell - 1, mmY + (e.y / TILE) * cell - 1, 2, 2);
      }
    }

    // ============================================================
    // ДИАЛОГИ
    // ============================================================
    function openDialog(npc) {
      state.dialogOpen = true;
      document.getElementById('dlgSpeaker').textContent = npc.name;
      document.getElementById('dlgText').textContent = npc.dialog.text;
      var choicesEl = document.getElementById('dlgChoices');
      choicesEl.innerHTML = '';
      npc.dialog.choices.forEach(function(ch) {
        var btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = ch.text;
        btn.onclick = function() { handleChoice(ch.action, npc); };
        choicesEl.appendChild(btn);
      });
      document.getElementById('dialogBox').classList.add('show');
    }

    function handleChoice(action, npc) {
      if (action === 'heal') {
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 40);
        showToast('❤️ +40 HP');
        updateHud();
        closeDialog();
      } else if (action === 'buy') {
        if (state.coins >= 100) {
          state.coins -= 100;
          for (var i = 0; i < state.unlocked.length; i++) {
            if (!state.unlocked[i]) {
              state.unlocked[i] = true;
              showToast('🔫 Куплено: ' + WEAPONS[i].name);
              buildWeapons();
              break;
            }
          }
          updateHud();
        } else {
          showToast('🪙 Мало монет');
        }
        closeDialog();
      } else {
        if (npc.name === 'Мэйбл' && state.quest === 'Поговори с Мэйбл в Хижине') {
          state.quest = 'Найди 3 страницы Дневника в лесу, у озера и в пещере';
          updateHud();
        }
        closeDialog();
      }
    }

    function closeDialog() {
      state.dialogOpen = false;
      document.getElementById('dialogBox').classList.remove('show');
    }

    function endGame(won) {
      if (state.gameOver) return;
      state.gameOver = true;
      state.running = false;
      var o = document.getElementById('overlay');
      var t = document.getElementById('overlayTitle');
      var x = document.getElementById('overlayText');
      if (won) {
        t.textContent = '🏆 Победа!';
        t.classList.remove('lose');
        x.innerHTML = 'Ты победил Гидеона и спас Гравити Фолз!<br>Уровень: ' + state.player.level + ' · Монеты: ' + state.coins;
      } else {
        t.textContent = '💀 Поражение';
        t.classList.add('lose');
        x.innerHTML = 'Монстры одолели Диппера.<br>Страниц: ' + state.pages + ' / ' + state.totalPages;
      }
      o.classList.add('show');
    }

    function showToast(text) {
      var el = document.getElementById('toast');
      el.textContent = text;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }

    // ============================================================
    // УПРАВЛЕНИЕ
    // ============================================================
    document.addEventListener('keydown', function(e) {
      var k = e.key.toLowerCase();
      if (k === 'w' || k === 'ц' || k === 'arrowup') state.keys.w = 1;
      if (k === 'a' || k === 'ф' || k === 'arrowleft') state.keys.a = 1;
      if (k === 's' || k === 'ы' || k === 'arrowdown') state.keys.s = 1;
      if (k === 'd' || k === 'в' || k === 'arrowright') state.keys.d = 1;
    });
    document.addEventListener('keyup', function(e) {
      var k = e.key.toLowerCase();
      if (k === 'w' || k === 'ц' || k === 'arrowup') state.keys.w = 0;
      if (k === 'a' || k === 'ф' || k === 'arrowleft') state.keys.a = 0;
      if (k === 's' || k === 'ы' || k === 'arrowdown') state.keys.s = 0;
      if (k === 'd' || k === 'в' || k === 'arrowright') state.keys.d = 0;
    });

    var joystick = document.getElementById('joystick');
    var knob = document.getElementById('knob');
    var joyId = null;

    function startJoy(x, y, id) {
      state.joy.active = true;
      state.joy.cx = x;
      state.joy.cy = y;
      state.joy.dx = 0;
      state.joy.dy = 0;
      joyId = id;
      joystick.style.left = x + 'px';
      joystick.style.top = y + 'px';
      joystick.style.display = 'block';
      knob.style.transform = 'translate(-50%, -50%)';
    }
    function moveJoy(x, y) {
      if (!state.joy.active) return;
      var dx = x - state.joy.cx;
      var dy = y - state.joy.cy;
      var len = Math.hypot(dx, dy);
      var maxLen = 55;
      var kx = len > maxLen ? (dx / len) * maxLen : dx;
      var ky = len > maxLen ? (dy / len) * maxLen : dy;
      knob.style.transform = 'translate(calc(-50% + ' + kx + 'px), calc(-50% + ' + ky + 'px))';
      state.joy.dx = kx / maxLen;
      state.joy.dy = ky / maxLen;
    }
    function endJoy() {
      state.joy.active = false;
      state.joy.dx = 0;
      state.joy.dy = 0;
      joystick.style.display = 'none';
      joyId = null;
    }

    document.addEventListener('touchstart', function(e) {
      if (state.dialogOpen) return;
      if (e.target.closest && (e.target.closest('.weapon-bar') || e.target.closest('.shoot-btn') || e.target.closest('.interact-btn') || e.target.closest('.dialog-box') || e.target.closest('.overlay'))) return;
      var t = e.changedTouches[0];
      startJoy(t.clientX, t.clientY, t.identifier);
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (!state.joy.active) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier === joyId) { moveJoy(t.clientX, t.clientY); break; }
      }
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', function(e) {
      if (!state.joy.active) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyId) { endJoy(); break; }
      }
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchcancel', function() { endJoy(); }, { passive: false });

    var mouseDown = false;
    document.addEventListener('mousedown', function(e) {
      if (state.dialogOpen) return;
      if (e.target.closest && (e.target.closest('.weapon-bar') || e.target.closest('.shoot-btn') || e.target.closest('.interact-btn') || e.target.closest('.dialog-box') || e.target.closest('.overlay'))) return;
      mouseDown = true;
      startJoy(e.clientX, e.clientY, 'mouse');
    });
    document.addEventListener('mousemove', function(e) {
      if (!mouseDown) return;
      moveJoy(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', function() {
      if (mouseDown) { endJoy(); mouseDown = false; }
    });

    document.getElementById('shootBtn').onclick = function(e) {
      e.stopPropagation();
      var nearest = null, best = Infinity;
      for (var i = 0; i < state.enemies.length; i++) {
        var en = state.enemies[i];
        if (en.hp <= 0) continue;
        var d = Math.hypot(en.x - state.player.x, en.y - state.player.y);
        if (d < best) { best = d; nearest = en; }
      }
      if (nearest) shoot(nearest, WEAPONS[state.selected]);
    };

    document.getElementById('interactBtn').onclick = function(e) {
      e.stopPropagation();
      if (state.nearestNpc) openDialog(state.nearestNpc);
    };

    document.getElementById('restartBtn').onclick = function() {
      document.getElementById('overlay').classList.remove('show');
      init();
    };

    init();
  </script>
</body>
</html>
