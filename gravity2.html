<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Гравити Фолз</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0510; color: #fff; user-select: none; touch-action: none; }
  #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #1a0a20; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 8px 12px;
    font-size: 13px; font-weight: 700;
    z-index: 10;
    pointer-events: none;
    gap: 6px;
  }
  .hud .stat {
    background: rgba(0,0,0,0.6);
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid #3a1a4a;
  }
  .hud .hp { color: #ff5c8a; }
  .hud .pages { color: #5ecbff; }
  .hud .loc { color: #a78bfa; }

  .weapon-bar {
    position: fixed; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 6px;
    padding: 6px 10px;
    background: rgba(10, 5, 16, 0.85);
    border: 2px solid #3a1a4a;
    border-radius: 16px;
    z-index: 10;
    max-width: 95vw;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .weapon-bar::-webkit-scrollbar { display: none; }
  .weapon {
    flex-shrink: 0;
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #2a1030 0%, #1a0a20 100%);
    border: 2px solid #3a1a4a;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    cursor: pointer;
    position: relative;
    touch-action: manipulation;
  }
  .weapon.selected {
    border-color: #ffd24a;
    box-shadow: 0 0 16px rgba(255,210,74,0.8);
    transform: translateY(-3px);
  }
  .weapon.locked { opacity: 0.3; }
  .weapon.locked::after { content: '🔒'; position: absolute; font-size: 18px; }

  .joystick {
    position: fixed;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,210,74,0.08);
    border: 2px solid rgba(255,210,74,0.4);
    display: none;
    pointer-events: none;
    z-index: 20;
  }
  .joystick .knob {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255,210,74,0.5);
    border: 2px solid #ffd24a;
  }

  .shoot-btn {
    position: fixed;
    bottom: 80px; right: 20px;
    width: 78px; height: 78px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5c8a, #8a2a4a);
    border: 3px solid #ffd24a;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    z-index: 20;
    box-shadow: 0 0 30px rgba(255,92,138,0.6);
    touch-action: manipulation;
  }
  .shoot-btn:active { transform: scale(0.92); }

  .toast {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(20, 5, 15, 0.95);
    border: 3px solid #ffd24a;
    border-radius: 14px;
    padding: 16px 30px;
    font-size: 15px; font-weight: 800;
    color: #ffd24a;
    text-align: center;
    z-index: 200;
    pointer-events: none;
    max-width: 80vw;
  }
  .toast.show { animation: toastPop 2s ease-out forwards; }
  @keyframes toastPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 300;
    padding: 20px; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 28px; color: #ffd24a; margin-bottom: 16px; }
  .overlay h1.lose { color: #ff5c8a; }
  .overlay p { font-size: 14px; color: #c8c8dc; line-height: 1.6; max-width: 420px; margin-bottom: 20px; }
  .overlay button {
    padding: 14px 36px;
    background: linear-gradient(135deg, #ffd24a, #ff5c8a);
    border: none; border-radius: 40px;
    color: #1a0a08;
    font-family: inherit; font-size: 14px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; margin: 4px;
    touch-action: manipulation;
  }
</style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="stat hp"><span>❤️</span> <span id="hpVal">100</span></div>
    <div class="stat pages"><span>📖</span> <span id="pagesVal">0 / 5</span></div>
    <div class="stat loc"><span>📍</span> <span id="locVal">Хижина</span></div>
  </div>

  <div class="weapon-bar" id="weaponBar"></div>

  <div class="joystick" id="joystick"><div class="knob" id="knob"></div></div>

  <button class="shoot-btn" id="shootBtn" type="button">💥</button>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay">
    <h1 id="overlayTitle">🏆 Победа!</h1>
    <p id="overlayText"></p>
    <button id="restartBtn" type="button">Играть снова</button>
  </div>

  <script>
    // ============================================
    // ИГРА · ГРАВИТИ ФОЛЗ
    // ============================================
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);

    var WEAPONS = [
      { name: 'Бластер', emoji: '🔫', damage: 25, cooldown: 400, color: '#5ecbff', size: 5 },
      { name: 'Грави', emoji: '🌀', damage: 15, cooldown: 700, color: '#a78bfa', size: 10 },
      { name: 'Огонь', emoji: '🔥', damage: 8, cooldown: 100, color: '#ff8000', size: 6, short: true },
      { name: 'Лёд', emoji: '❄️', damage: 20, cooldown: 600, color: '#5ecbff', size: 7, slow: true },
      { name: 'Ракета', emoji: '🚀', damage: 60, cooldown: 1200, color: '#ff5c8a', size: 12, explode: true }
    ];

    var ENEMY_TYPES = {
      gnome: { emoji: '👺', hp: 40, speed: 70, damage: 8, coins: 15, radius: 16 },
      vampire: { emoji: '🧛', hp: 80, speed: 90, damage: 12, coins: 30, radius: 18 },
      zombie: { emoji: '🧟‍♀️', hp: 120, speed: 60, damage: 15, coins: 50, radius: 20 },
      mummy: { emoji: '🧟', hp: 200, speed: 50, damage: 20, coins: 80, radius: 22 },
      water: { emoji: '🐙', hp: 350, speed: 55, damage: 25, coins: 130, radius: 26 },
      multibear: { emoji: '🐻', hp: 600, speed: 40, damage: 30, coins: 200, radius: 30 },
      gideon: { emoji: '🧙', hp: 800, speed: 50, damage: 25, coins: 300, radius: 28, boss: true },
      bill: { emoji: '👁️', hp: 3000, speed: 60, damage: 40, coins: 1000, radius: 36, boss: true }
    };

    var state = {
      player: { x: 0, y: 0, hp: 100, maxHp: 100, radius: 18, speed: 200, angle: 0 },
      enemies: [], bullets: [], pickups: [], particles: [],
      pages: 0, totalPages: 5,
      selected: 0,
      unlocked: [true, false, false, false, false],
      keys: { w: 0, a: 0, s: 0, d: 0 },
      joy: { active: false, cx: 0, cy: 0, dx: 0, dy: 0 },
      running: true, gameOver: false,
      lastTime: 0, lastShot: 0,
      location: 0,
      locations: [
        { name: 'Хижина', bg: '#2a1040', wall: '#4a2a6a' },
        { name: 'Лес', bg: '#0a2a0a', wall: '#1a5a1a' },
        { name: 'Озеро', bg: '#0a1a3a', wall: '#1a3a6a' },
        { name: 'Подземелье', bg: '#1a0a05', wall: '#3a1a0a' },
        { name: 'Билл', bg: '#2a0000', wall: '#ff4040' }
      ],
      waveTimer: 0, waveCount: 0
    };

    function init() {
      resize();
      state.player.x = W / 2;
      state.player.y = H / 2;
      state.player.hp = state.player.maxHp;
      state.enemies = [];
      state.bullets = [];
      state.pickups = [];
      state.particles = [];
      state.pages = 0;
      state.selected = 0;
      state.unlocked = [true, false, false, false, false];
      state.location = 0;
      state.running = true;
      state.gameOver = false;
      state.lastTime = performance.now();
      state.waveTimer = 0;
      state.waveCount = 0;
      buildWeapons();
      updateHud();
      spawnPage();
      requestAnimationFrame(loop);
    }

    function buildWeapons() {
      var bar = document.getElementById('weaponBar');
      bar.innerHTML = '';
      for (var i = 0; i < WEAPONS.length; i++) {
        (function(idx) {
          var w = WEAPONS[idx];
          var el = document.createElement('div');
          el.className = 'weapon';
          if (!state.unlocked[idx]) el.classList.add('locked');
          if (idx === state.selected) el.classList.add('selected');
          el.textContent = w.emoji;
          el.onclick = function() {
            if (!state.unlocked[idx]) return;
            state.selected = idx;
            buildWeapons();
          };
          bar.appendChild(el);
        })(i);
      }
    }

    function updateHud() {
      document.getElementById('hpVal').textContent = Math.max(0, Math.round(state.player.hp));
      document.getElementById('pagesVal').textContent = state.pages + ' / ' + state.totalPages;
      document.getElementById('locVal').textContent = state.locations[state.location].name;
    }

    function spawnEnemy(type) {
      var et = ENEMY_TYPES[type];
      var x, y;
      var side = Math.floor(Math.random() * 4);
      if (side === 0) { x = -50; y = Math.random() * H; }
      else if (side === 1) { x = W + 50; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = -50; }
      else { x = Math.random() * W; y = H + 50; }
      state.enemies.push({
        type: type, x: x, y: y,
        hp: et.hp, maxHp: et.hp,
        speed: et.speed, damage: et.damage,
        radius: et.radius, coins: et.coins,
        slowUntil: 0, boss: !!et.boss, dead: false
      });
    }

    function spawnPage() {
      state.pickups.push({
        type: 'page',
        x: 80 + Math.random() * (W - 160),
        y: 100 + Math.random() * (H - 200),
        radius: 20, collected: false
      });
    }

    function spawnHeal() {
      state.pickups.push({
        type: 'heal',
        x: 80 + Math.random() * (W - 160),
        y: 100 + Math.random() * (H - 200),
        radius: 18, collected: false
      });
    }

    function spawnCoin(x, y) {
      state.pickups.push({ type: 'coin', x: x, y: y, radius: 14, collected: false });
    }

    function loop(now) {
      if (!state.running) return;
      var dt = Math.min(50, now - state.lastTime) / 1000;
      state.lastTime = now;
      update(dt, now);
      draw();
      requestAnimationFrame(loop);
    }

    function update(dt, now) {
      var p = state.player;
      var dx = 0, dy = 0;
      if (state.keys.w) dy -= 1;
      if (state.keys.s) dy += 1;
      if (state.keys.a) dx -= 1;
      if (state.keys.d) dx += 1;
      if (state.joy.active) { dx += state.joy.dx; dy += state.joy.dy; }
      var len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      p.x += dx * p.speed * dt;
      p.y += dy * p.speed * dt;
      p.x = Math.max(p.radius, Math.min(W - p.radius, p.x));
      p.y = Math.max(p.radius, Math.min(H - p.radius, p.y));

      // цель
      var nearest = null, best = Infinity;
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0) continue;
        var d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < best) { best = d; nearest = e; }
      }
      if (nearest) p.angle = Math.atan2(nearest.y - p.y, nearest.x - p.x);

      // стрельба
      var w = WEAPONS[state.selected];
      if (nearest && now - state.lastShot > w.cooldown) {
        shoot(nearest, w);
        state.lastShot = now;
      }

      // пули
      for (var i = state.bullets.length - 1; i >= 0; i--) {
        var b = state.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        for (var j = 0; j < state.enemies.length; j++) {
          var e = state.enemies[j];
          if (e.hp <= 0) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
            e.hp -= b.damage;
            if (b.slow) e.slowUntil = now + 2000;
            b.life = 0;
            break;
          }
        }
        if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) b.life = 0;
      }
      state.bullets = state.bullets.filter(function(b) { return b.life > 0; });

      // враги двигаются к игроку
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0) continue;
        var dx2 = p.x - e.x;
        var dy2 = p.y - e.y;
        var d2 = Math.hypot(dx2, dy2);
        var slow = (e.slowUntil > now) ? 0.4 : 1;
        if (d2 > p.radius + e.radius - 4) {
          e.x += (dx2 / d2) * e.speed * slow * dt;
          e.y += (dy2 / d2) * e.speed * slow * dt;
        } else {
          p.hp -= e.damage * dt;
          if (p.hp <= 0) { p.hp = 0; updateHud(); endGame(false); return; }
        }
      }

      // смерть врагов
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0 && !e.dead) {
          e.dead = true;
          if (Math.random() < 0.5) spawnCoin(e.x, e.y);
          if (e.boss && e.type === 'bill') setTimeout(function() { endGame(true); }, 100);
        }
      }
      state.enemies = state.enemies.filter(function(e) { return !e.dead; });

      // пикапы
      for (var i = 0; i < state.pickups.length; i++) {
        var pk = state.pickups[i];
        if (pk.collected) continue;
        if (Math.hypot(pk.x - p.x, pk.y - p.y) < p.radius + pk.radius) {
          pk.collected = true;
          if (pk.type === 'page') {
            state.pages++;
            unlockWeapon();
            showToast('📖 Страница ' + state.pages + ' / ' + state.totalPages);
            updateHud();
            if (state.pages < state.totalPages) {
              setTimeout(spawnPage, 500);
            } else {
              setTimeout(spawnBoss, 1500);
            }
          } else if (pk.type === 'heal') {
            p.hp = Math.min(p.maxHp, p.hp + 30);
            showToast('🍦 +30 HP');
            updateHud();
          } else if (pk.type === 'coin') {
            showToast('🪙 +20');
          }
        }
      }
      state.pickups = state.pickups.filter(function(pk) { return !pk.collected; });

      // частицы
      for (var i = 0; i < state.particles.length; i++) {
        var pt = state.particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
      }
      state.particles = state.particles.filter(function(pt) { return pt.life > 0; });

      // волны
      state.waveTimer -= dt;
      if (state.waveTimer <= 0) {
        state.waveTimer = 3 + Math.random() * 2;
        state.waveCount++;
        var count = Math.min(3, 1 + Math.floor(state.waveCount / 5));
        for (var i = 0; i < count; i++) {
          var loc = state.location;
          var pool;
          if (loc === 0) pool = ['gnome', 'vampire'];
          else if (loc === 1) pool = ['gnome', 'vampire', 'zombie'];
          else if (loc === 2) pool = ['zombie', 'mummy', 'water'];
          else pool = ['mummy', 'water', 'multibear'];
          spawnEnemy(pool[Math.floor(Math.random() * pool.length)]);
        }
        if (Math.random() < 0.15) spawnHeal();
      }
    }

    function shoot(target, w) {
      var p = state.player;
      var angle = Math.atan2(target.y - p.y, target.x - p.x);
      var speed = w.short ? 300 : 600;
      state.bullets.push({
        x: p.x, y: p.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage: w.damage, radius: w.size,
        color: w.color, slow: w.slow, explode: w.explode,
        life: w.short ? 0.3 : 1.5
      });
    }

    function unlockWeapon() {
      for (var i = 0; i < state.unlocked.length; i++) {
        if (!state.unlocked[i]) {
          state.unlocked[i] = true;
          showToast('🔫 Новое: ' + WEAPONS[i].name);
          buildWeapons();
          return;
        }
      }
    }

    function spawnBoss() {
      var loc = state.location;
      var type = 'gideon';
      if (loc === 3) type = 'multibear';
      else if (loc === 4) type = 'bill';
      var et = ENEMY_TYPES[type];
      state.enemies.push({
        type: type, x: W / 2, y: 80,
        hp: et.hp, maxHp: et.hp,
        speed: et.speed, damage: et.damage,
        radius: et.radius, coins: et.coins,
        slowUntil: 0, boss: true, dead: false
      });
      showToast('⚔️ БОСС: ' + type);
    }

    function draw() {
      var loc = state.locations[state.location];
      ctx.fillStyle = loc.bg;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = loc.wall;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.3;
      for (var x = 0; x < W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (var y = 0; y < H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // пикапы
      for (var i = 0; i < state.pickups.length; i++) {
        var pk = state.pickups[i];
        var bob = Math.sin(performance.now() / 200) * 3;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (pk.type === 'page') { ctx.font = '32px serif'; ctx.fillText('📖', pk.x, pk.y + bob); }
        else if (pk.type === 'heal') { ctx.font = '28px serif'; ctx.fillText('🍦', pk.x, pk.y + bob); }
        else if (pk.type === 'coin') { ctx.font = '22px serif'; ctx.fillText('🪙', pk.x, pk.y + bob); }
      }

      // враги
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        var et = ENEMY_TYPES[e.type];
        ctx.font = (e.radius * 2.2) + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(et.emoji, e.x, e.y);
        if (e.hp < e.maxHp) {
          var w = e.radius * 2;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(e.x - w/2, e.y - e.radius - 14, w, 6);
          ctx.fillStyle = e.boss ? '#ff2a6a' : '#6ee37c';
          ctx.fillRect(e.x - w/2, e.y - e.radius - 14, w * (e.hp / e.maxHp), 6);
        }
      }

      // пули
      for (var i = 0; i < state.bullets.length; i++) {
        var b = state.bullets[i];
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // игрок
      var p = state.player;
      ctx.font = '42px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧢', p.x, p.y);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = WEAPONS[state.selected].color;
      ctx.fillRect(10, -3, 22, 6);
      ctx.restore();
    }

    function endGame(won) {
      if (state.gameOver) return;
      state.gameOver = true;
      state.running = false;
      var o = document.getElementById('overlay');
      var t = document.getElementById('overlayTitle');
      var x = document.getElementById('overlayText');
      if (won) {
        t.textContent = '🏆 Победа!';
        t.classList.remove('lose');
        x.textContent = 'Ты собрал все страницы Дневника №3 и уничтожил Билла Шифра!';
      } else {
        t.textContent = '💀 Поражение';
        t.classList.add('lose');
        x.textContent = 'Монстры одолели Диппера. Страниц собрано: ' + state.pages + ' из ' + state.totalPages;
      }
      o.classList.add('show');
    }

    function showToast(text) {
      var el = document.getElementById('toast');
      el.textContent = text;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }

    // ============ УПРАВЛЕНИЕ ============
    document.addEventListener('keydown', function(e) {
      var k = e.key.toLowerCase();
      if (k === 'w' || k === 'ц') state.keys.w = 1;
      if (k === 'a' || k === 'ф') state.keys.a = 1;
      if (k === 's' || k === 'ы') state.keys.s = 1;
      if (k === 'd' || k === 'в') state.keys.d = 1;
    });
    document.addEventListener('keyup', function(e) {
      var k = e.key.toLowerCase();
      if (k === 'w' || k === 'ц') state.keys.w = 0;
      if (k === 'a' || k === 'ф') state.keys.a = 0;
      if (k === 's' || k === 'ы') state.keys.s = 0;
      if (k === 'd' || k === 'в') state.keys.d = 0;
    });

    var joystick = document.getElementById('joystick');
    var knob = document.getElementById('knob');

    function startJoy(x, y) {
      state.joy.active = true;
      state.joy.cx = x;
      state.joy.cy = y;
      state.joy.dx = 0;
      state.joy.dy = 0;
      joystick.style.left = (x - 60) + 'px';
      joystick.style.top = (y - 60) + 'px';
      joystick.style.display = 'block';
      knob.style.transform = 'translate(-50%, -50%)';
    }

    function moveJoy(x, y) {
      if (!state.joy.active) return;
      var dx = x - state.joy.cx;
      var dy = y - state.joy.cy;
      var len = Math.hypot(dx, dy);
      var maxLen = 50;
      var kx = len > maxLen ? (dx / len) * maxLen : dx;
      var ky = len > maxLen ? (dy / len) * maxLen : dy;
      knob.style.transform = 'translate(calc(-50% + ' + kx + 'px), calc(-50% + ' + ky + 'px))';
      state.joy.dx = kx / maxLen;
      state.joy.dy = ky / maxLen;
    }

    function endJoy() {
      state.joy.active = false;
      state.joy.dx = 0;
      state.joy.dy = 0;
      joystick.style.display = 'none';
    }

    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      var t = e.changedTouches[0];
      startJoy(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      var t = e.changedTouches[0];
      moveJoy(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchend', function(e) { e.preventDefault(); endJoy(); }, { passive: false });

    canvas.addEventListener('mousedown', function(e) { startJoy(e.clientX, e.clientY); });
    canvas.addEventListener('mousemove', function(e) { if (state.joy.active) moveJoy(e.clientX, e.clientY); });
    canvas.addEventListener('mouseup', endJoy);
    canvas.addEventListener('mouseleave', endJoy);

    document.getElementById('shootBtn').onclick = function() {
      var nearest = null, best = Infinity;
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.hp <= 0) continue;
        var d = Math.hypot(e.x - state.player.x, e.y - state.player.y);
        if (d < best) { best = d; nearest = e; }
      }
      if (nearest) shoot(nearest, WEAPONS[state.selected]);
    };

    document.getElementById('restartBtn').onclick = function() {
      document.getElementById('overlay').classList.remove('show');
      init();
    };

    // ============ СТАРТ ============
    init();
  </script>
</body>
</html>
