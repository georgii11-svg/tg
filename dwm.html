
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DOCTOR VS IRON MAN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030509;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
#stage{
 position:absolute;inset:0;margin:auto;
 width:min(100vw,56.25vh);
 height:min(100vh,177.78vw);
 overflow:hidden;background:#080c17;
}
canvas{width:100%;height:100%;display:block}
#top{
 position:absolute;top:3%;width:100%;
 text-align:center;letter-spacing:5px;
 font-size:12px;color:#a7d8ff;
 text-shadow:0 0 15px #168bff;
 pointer-events:none;
}
#sound{
 position:absolute;top:6%;right:5%;
 background:#101c2c;color:white;
 border:1px solid #4389bd;border-radius:20px;
 padding:9px 13px;font-size:10px;
 z-index:5;
}
#progress{
 position:absolute;bottom:0;left:0;
 height:3px;background:#48cfff;width:0;
}
#replay{
 display:none;position:absolute;
 top:50%;left:50%;transform:translate(-50%,-50%);
 padding:14px 25px;background:#111c2d;
 border:1px solid #50dfff;border-radius:30px;
 color:white;z-index:8;
}
#start{
 position:absolute;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;background:#030711;
 text-align:center;
}
#start h1{
 font-size:35px;letter-spacing:3px;
 text-shadow:0 0 25px #3bbaff;
}
#start p{color:#9aabc0;font-size:12px;letter-spacing:2px}
#start button{
 background:#112a40;border:1px solid #55cfff;
 color:white;padding:16px 30px;
 border-radius:30px;font-weight:bold;
}
</style>
</head>
<body>
<div id="stage">
 <canvas id="c" width="540" height="960"></canvas>
 <div id="top">DOCTOR WHO × MARVEL</div>
 <button id="sound" onclick="toggleSound()">ЗВУК: ВЫКЛ</button>
 <div id="progress"></div>
 <button id="replay" onclick="restart()">↻ ПОВТОРИТЬ</button>

 <div id="start">
  <h1>THE DOCTOR<br>VS<br>IRON MAN</h1>
  <p>ONE TIME LORD. ONE AVENGER.</p>
  <br>
  <button onclick="begin()">НАЧАТЬ БИТВУ</button>
  <p style="margin-top:18px">ВКЛЮЧИ ЗВУК ДЛЯ ПОЛНОГО ЭФФЕКТА</p>
 </div>
</div>

<script>
const c=document.querySelector("#c");
const ctx=c.getContext("2d");
const W=540,H=960;
const duration=55;

let start=0,time=0,particles=[],rings=[];
let sound=false,audio=null,started=false,finished=false;
let shake=0,flash=0,lastEvent=-1;
let spoken=new Set();

const $=id=>document.getElementById(id);

const events=[
 [0, "Приветствую тебя, Железный человек."],
 [5, "А ты кто такой?"],
 [9, "Я путешественник во времени. И, честно говоря, у меня сегодня очень плохой день."],
 [15, "Пятница, сканируй его."],
 [19, "Сканирование завершено. Неизвестная технология."],
 [23, "О, это будет интересно!"],
 [31, "Ты слишком медленный, Доктор!"],
 [37, "Медленный? Я вообще-то просто даю тебе фору!"],
 [43, "Тони, у тебя проблема с реактором."],
 [49, "Что?!"],
 [52, "Allons-y!"]
];

function speak(text){
 if(!sound||!window.speechSynthesis)return;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(text);
 u.lang="ru-RU";
 u.rate=1.08;
 u.pitch=.9;
 u.volume=1;
 let voices=speechSynthesis.getVoices();
 let v=voices.find(x=>x.lang==="ru-RU");
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}

function audioInit(){
 if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
 if(audio.state==="suspended")audio.resume();
}

function tone(freq,duration,type="sawtooth",volume=.07,endFreq=null){
 if(!sound)return;
 audioInit();
 let o=audio.createOscillator();
 let g=audio.createGain();
 o.type=type;
 o.frequency.setValueAtTime(freq,audio.currentTime);
 if(endFreq)o.frequency.exponentialRampToValueAtTime(
  endFreq,audio.currentTime+duration);
 g.gain.setValueAtTime(volume,audio.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 o.connect(g);g.connect(audio.destination);
 o.start();o.stop(audio.currentTime+duration);
}

function sfx(type){
 if(!sound)return;
 if(type==="repulsor"){
  tone(150,.3,"sawtooth",.12,900);
  tone(500,.2,"sine",.07,100);
 }
 if(type==="sonic"){
  tone(800,.5,"sine",.07,1800);
  tone(1300,.3,"triangle",.04,500);
 }
 if(type==="impact"){
  tone(100,.45,"sawtooth",.14,35);
  tone(65,.3,"triangle",.1,30);
 }
 if(type==="fly"){
  tone(90,.8,"sawtooth",.05,400);
 }
 if(type==="clash"){
  tone(300,.7,"sawtooth",.1,80);
  tone(1200,.5,"sine",.06,200);
 }
 if(type==="alarm"){
  tone(800,.2,"square",.04,400);
  setTimeout(()=>tone(800,.2,"square",.04,400),220);
 }
}

function toggleSound(){
 sound=!sound;
 $("sound").textContent=sound?"ЗВУК: ВКЛ":"ЗВУК: ВЫКЛ";
 if(sound){
  audioInit();
  tone(440,.2,"sine");
 }
}

function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function line(x,y,x2,y2,color,width=5){
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
}

function background(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#071329");
 g.addColorStop(.5,"#101b2d");
 g.addColorStop(1,"#080b13");
 rect(0,0,W,H,g);

 // city skyline
 for(let i=0;i<12;i++){
  let x=i*49;
  let h=180+(i*71%210);
  rect(x,H*.69-h,42,h,"#0a101d");
  for(let j=0;j<4;j++){
   for(let k=0;k<5;k++){
    if((i+j+k)%3===0)
     rect(x+7+j*9,H*.69-h+15+k*23,3,5,
      "#6a583b");
   }
  }
 }
 // distant lights
 for(let i=0;i<20;i++){
  circle((i*83)%W,500+(i*53)%250,2,"#4d7a9d");
 }
 // ground
 rect(0,H*.69,W,H*.31,"#080d16");
 for(let i=0;i<9;i++){
  line(i*75,H*.7,i*75+25,H,"#192638",2);
 }
 // moon
 circle(420,155,45,"#a7bdd2");
}

function particle(x,y,color,power=7){
 let a=Math.random()*Math.PI*2;
 let v=Math.random()*power;
 particles.push({
  x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
  life:35+Math.random()*35,color,
  size:1+Math.random()*4
 });
}
function burst(x,y,color,n=50,power=8){
 for(let i=0;i<n;i++)particle(x,y,color,power);
}
function ring(x,y,color){
 rings.push({x,y,r:5,life:40,color});
}

function effects(){
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx;p.y+=p.vy;
  p.vy+=.04;p.life--;
  ctx.globalAlpha=Math.max(0,p.life/70);
  ctx.shadowBlur=12;ctx.shadowColor=p.color;
  circle(p.x,p.y,p.size,p.color);
  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;

 for(let i=rings.length-1;i>=0;i--){
  let r=rings[i];r.r+=5;r.life--;
  ctx.globalAlpha=r.life/40;
  ctx.strokeStyle=r.color;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();
  if(r.life<=0)rings.splice(i,1);
 }
 ctx.globalAlpha=1;
}

// 10th Doctor
function doctor(x,y,s=1,pose="stand"){
 ctx.save();
 ctx.translate(x,y);ctx.scale(s,s);

 let run=Math.sin(time*15)*7;
 let lean=pose==="dodge"?-25:pose==="jump"?-12:0;

 // Coat
 ctx.fillStyle="#242c3d";
 ctx.beginPath();
 ctx.moveTo(-24,-88);
 ctx.lineTo(24,-88);
 ctx.lineTo(43,20+lean);
 ctx.lineTo(18,5+lean);
 ctx.lineTo(0,-35);
 ctx.lineTo(-25,20+lean);
 ctx.lineTo(-44,10+lean);
 ctx.fill();

 // shirt
 rect(-13,-85,26,75,"#e0d5c5");
 // tie
 ctx.fillStyle="#8e393e";
 ctx.beginPath();
 ctx.moveTo(-5,-82);ctx.lineTo(5,-82);
 ctx.lineTo(7,-25);ctx.lineTo(0,-18);
 ctx.lineTo(-7,-25);ctx.fill();

 // head
 circle(0,-118+lean,22,"#d9ad8f");
 // hair
 ctx.fillStyle="#503c32";
 ctx.beginPath();
 ctx.arc(0,-128+lean,23,Math.PI,Math.PI*2);
 ctx.fill();
 for(let i=0;i<5;i++)
  circle(-17+i*8,-139+lean-Math.sin(i)*5,8,"#503c32");

 circle(-8,-118+lean,2,"#292929");
 circle(8,-118+lean,2,"#292929");

 // arms
 let armX=pose==="dodge"?-12:pose==="sonic"?28:40;
 line(20,-69,armX,-47+lean,"#d9ad8f",10);
 line(-20,-69,-35+run,-35,"#d9ad8f",10);

 if(pose==="sonic"||pose==="stand"){
  ctx.save();
  ctx.shadowColor="#51eaff";ctx.shadowBlur=25;
  line(armX,-47+lean,armX+30,-60+lean,"#50dfff",5);
  circle(armX+30,-60+lean,5,"#d9ffff");
  ctx.restore();
 }

 // legs
 if(pose==="dodge"){
  line(-13,10,-43,37,"#202a3c",12);
  line(13,10,39,23,"#202a3c",12);
 }else if(pose==="jump"){
  line(-13,10,-35,-10,"#202a3c",12);
  line(13,10,38,-12,"#202a3c",12);
 }else{
  line(-14,10,-20+run,60,"#202a3c",12);
  line(14,10,20-run,60,"#202a3c",12);
 }
 line(-20,60,-34,60,"#181b24",13);
 line(20,60,34,60,"#181b24",13);

 ctx.restore();
}

// Iron Man
function ironman(x,y,s=1,pose="fly"){
 ctx.save();
 ctx.translate(x,y);ctx.scale(s,s);

 let bob=Math.sin(time*8)*5;
 let tilt=pose==="dodge"?-30:pose==="attack"?15:0;
 ctx.rotate(tilt*Math.PI/180);

 // legs
 line(-12,40,-22,80,"#9c2823",17);
 line(12,40,22,80,"#9c2823",17);
 // boots
 circle(-22,81,9,"#d44b36");
 circle(22,81,9,"#d44b36");

 // body armor
 ctx.fillStyle="#a92e24";
 ctx.beginPath();
 ctx.moveTo(-28,-75);ctx.lineTo(28,-75);
 ctx.lineTo(35,40);ctx.lineTo(0,55);
 ctx.lineTo(-35,40);ctx.fill();

 // gold chest plate
 ctx.fillStyle="#c88c37";
 ctx.beginPath();
 ctx.moveTo(-19,-68);ctx.lineTo(19,-68);
 ctx.lineTo(25,30);ctx.lineTo(0,40);
 ctx.lineTo(-25,30);ctx.fill();

 // arc reactor
 ctx.save();
 ctx.shadowColor="#8beaff";ctx.shadowBlur=30;
 circle(0,-15,15,"#d4f8ff");
 circle(0,-15,8,"#4edbff");
 ctx.restore();

 // shoulders
 circle(-32,-65,15,"#c88a34");
 circle(32,-65,15,"#c88a34");

 // arms
 line(-30,-60,-45,-20,"#a52c25",17);
 line(30,-60,45,-20,"#a52c25",17);
 circle(-45,-20,11,"#c58a36");
 circle(45,-20,11,"#c58a36");

 // palm glow
 ctx.save();
 ctx.shadowColor="#5deaff";ctx.shadowBlur=25;
 circle(-45,-20,6,"#d6ffff");
 circle(45,-20,6,"#d6ffff");
 ctx.restore();

 // helmet
 ctx.fillStyle="#b62f25";
 ctx.beginPath();
 ctx.moveTo(-25,-115);ctx.lineTo(-20,-145);
 ctx.lineTo(0,-155);ctx.lineTo(20,-145);
 ctx.lineTo(25,-115);ctx.lineTo(18,-85);
 ctx.lineTo(-18,-85);ctx.fill();

 // faceplate
 ctx.fillStyle="#c99a42";
 ctx.beginPath();
 ctx.moveTo(-19,-133);ctx.lineTo(19,-133);
 ctx.lineTo(14,-95);ctx.lineTo(0,-87);
 ctx.lineTo(-14,-95);ctx.fill();

 // eyes
 ctx.save();
 ctx.shadowColor="#b5faff";ctx.shadowBlur=15;
 rect(-14,-122,10,4,"#dfffff");
 rect(4,-122,10,4,"#dfffff");
 ctx.restore();

 // jet flames
 if(pose==="fly"||pose==="attack"){
  ctx.save();
  ctx.shadowColor="#46cfff";ctx.shadowBlur=20;
  ctx.fillStyle="#4fcfff";
  ctx.beginPath();
  ctx.moveTo(-22,82);ctx.lineTo(-15,82);
  ctx.lineTo(-20,120+Math.random()*12);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(15,82);ctx.lineTo(22,82);
  ctx.lineTo(20,120+Math.random()*12);ctx.fill();
  ctx.restore();
 }
 ctx.restore();
}

function repulsor(x1,y1,x2,y2){
 ctx.save();
 ctx.strokeStyle="#46dfff";
 ctx.lineWidth=11;
 ctx.shadowColor="#39cfff";ctx.shadowBlur=30;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.strokeStyle="#ffffff";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.restore();
}

function sonicBeam(x1,y1,x2,y2){
 ctx.save();
 ctx.strokeStyle="#69efff";ctx.lineWidth=7;
 ctx.shadowColor="#54eaff";ctx.shadowBlur=30;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.strokeStyle="white";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.restore();
}

// Animated timeline
function action(){
 let ground=H*.75;
 let dX=140,iX=410;
 let dY=ground,iY=ground;

 if(time<5){
  tardis(270,ground+5,.85);
  doctor(270,ground,.9,"stand");
  return;
 }

 if(time<10){
  dX=140;iX=410;
  doctor(dX,dY,.9,"stand");
  ironman(iX,iY-80,.9,"fly");
  return;
 }

 if(time<15){
  dX=140;iX=410;
  doctor(dX,dY,.9,"stand");
  ironman(iX,iY-80,.9,"fly");
  return;
 }

 // First repulsor attack
 if(time>=15&&time<20){
  dX=140;
  let attackX=410;
  doctor(dX,dY,.9,"dodge");
  ironman(attackX,ground-160,.9,"attack");
  let progress=(time-15)/5;
  repulsor(attackX-40,ground-210,
   attackX-40-progress*260,ground-210);
  if(time<17.5){
   // Doctor leans out of the way
   burst(dX+30,ground-150,"#4bdfff",1,2);
  }
  return;
 }

 // Doctor runs under flying Iron Man
 if(time>=20&&time<25){
  let p=(time-20)/5;
  dX=140+p*140;
  iX=410-p*100;
  doctor(dX,ground,.9,"jump");
  ironman(iX,ground-180-Math.sin(p*Math.PI)*90,.9,"fly");
  return;
 }

 // Iron Man dives
 if(time>=25&&time<31){
  let p=(time-25)/6;
  dX=280+Math.sin(p*5)*40;
  iX=400-p*160;
  doctor(dX,ground,.9,"dodge");
  ironman(iX,ground-160+p*90,.9,"attack");
  if(time>27){
   repulsor(iX-40,ground-220,dX+20,ground-100);
  }
  return;
 }

 // Sonic attack
 if(time>=31&&time<37){
  doctor(160,ground,.9,"sonic");
  ironman(400,ground-180,.9,"dodge");
  sonicBeam(230,ground-100,370,ground-240);
  return;
 }

 // Iron Man flies behind Doctor
 if(time>=37&&time<43){
  let p=(time-37)/6;
  doctor(140+p*80,ground,.9,"dodge");
  ironman(400-p*220,ground-200-Math.sin(p*Math.PI)*100,.9,"fly");
  if(time>39){
   repulsor(350,ground-220,170,ground-160);
  }
  return;
 }

 // Final clash
 if(time>=43&&time<50){
  doctor(180,ground,.9,"sonic");
  ironman(370,ground-160,.9,"attack");
  let pulse=Math.sin(time*9)*20;
  sonicBeam(235,ground-100,270+pulse,ground-180);
  repulsor(330,ground-190,270+pulse,ground-180);
  return;
 }

 // End
 if(time>=50){
  doctor(170,ground,.9,"stand");
  ironman(400,ground-220,.9,"fly");
 }
}

function eventEffects(){
 const checks=[
  [15,"repulsor",()=>burst(410,H*.55,"#55dfff",60)],
  [20,"fly",()=>burst(270,H*.65,"#55dfff",35)],
  [25,"impact",()=>burst(400,H*.65,"#55dfff",50)],
  [31,"sonic",()=>burst(260,H*.55,"#a4faff",65)],
  [37,"fly",()=>burst(340,H*.5,"#55dfff",45)],
  [43,"clash",()=>{burst(270,H*.55,"#ffffff",100);ring(270,H*.55,"#55dfff") }],
  [50,"impact",()=>burst(270,H*.55,"#ffffff",120)]
 ];
 checks.forEach(([at,sfxName,fn])=>{
  if(Math.abs(time-at)<.08){
   sfx(sfxName);fn();shake=15;flash=.7;
  }
 });
}

function updateVoice(){
 let index=-1;
 for(let i=0;i<events.length;i++){
  if(time>=events[i][0])index=i;
 }
 if(index!==lastEvent&&index>=0){
  lastEvent=index;
  speak(events[index][1]);
 }
}

function draw(){
 ctx.save();
 if(shake>.1){
  ctx.translate((Math.random()-.5)*shake,
   (Math.random()-.5)*shake);
  shake*=.88;
 }
 background();
 action();
 effects();
 ctx.restore();

 if(flash>.01){
  ctx.fillStyle=`rgba(255,255,255,${flash})`;
  ctx.fillRect(0,0,W,H);
  flash*=.8;
 }
}

function begin(){
 $("start").style.display="none";
 if(sound)audioInit();
 start=performance.now();
 started=true;
 lastEvent=-1;
 requestAnimationFrame(loop);
}

function loop(now){
 if(!started)return;
 time=(now-start)/1000;
 if(time>=duration){
  time=duration;
  draw();
  finished=true;
  $("replay").style.display="block";
  return;
 }
 updateVoice();
 eventEffects();
 draw();
 $("progress").style.width=(time/duration*100)+"%";
 requestAnimationFrame(loop);
}

function restart(){
 if(window.speechSynthesis)speechSynthesis.cancel();
 particles=[];rings=[];
 shake=0;flash=0;
 lastEvent=-1;
 finished=false;
 start=performance.now();
 started=true;
 $("replay").style.display="none";
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
