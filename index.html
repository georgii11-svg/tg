
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 5.0</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#10151b;color:white;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;z-index:2;background:#111d;padding:10px 13px;border:1px solid #ffffff30;border-radius:12px;line-height:1.55;font-size:14px;pointer-events:none}
#mission{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(340px,56vw);background:#111e;border:2px solid #ffd83d;border-radius:12px;padding:10px;text-align:center;font-size:13px;z-index:2;pointer-events:none}
#notice{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:#111e;border-radius:12px;padding:12px 16px;max-width:90vw;text-align:center;z-index:3;display:none}
#controls{position:fixed;bottom:16px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:4px;pointer-events:auto}
.ctrl{background:#182638d9;border:1px solid #ffffff66;border-radius:12px;color:white;font-weight:bold;font-size:17px;touch-action:none;user-select:none;min-width:48px;min-height:43px}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.actions{display:grid;grid-template-columns:repeat(2,65px);gap:7px;pointer-events:auto}
.actions .ctrl{height:49px;font-size:12px}
#help{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffffff99;text-align:center;pointer-events:none;width:55%}
@media(min-width:850px){#controls{opacity:.7}.ctrl{opacity:.8}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="mission"></div>
<div id="notice"></div>
<div id="controls">
 <div class="pad">
  <button class="ctrl up" data-key="ArrowUp">▲</button>
  <button class="ctrl left" data-key="ArrowLeft">◀</button>
  <button class="ctrl down" data-key="ArrowDown">▼</button>
  <button class="ctrl right" data-key="ArrowRight">▶</button>
 </div>
 <div class="actions">
  <button class="ctrl" id="act">ДЕЙСТВИЕ</button>
  <button class="ctrl" id="car">МАШИНА</button>
  <button class="ctrl" id="shop">МАГАЗИН</button>
  <button class="ctrl" id="shoot">БЛАСТЕР</button>
 </div>
</div>
<div id="help">WASD / стрелки — ходьба · E — машина · F — магазин · Пробел — бластер</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const hud=document.getElementById('hud'),missionUI=document.getElementById('mission'),notice=document.getElementById('notice');
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
const W=2600,H=2000,road=150,block=300,spacing=450;
const buildings=[];
for(let x=100;x<W-100;x+=spacing)for(let y=100;y<H-100;y+=spacing){
 buildings.push({x:x+40,y:y+40,w:210,h:200,color:['#626a78','#806d60','#596f68','#76647c'][Math.floor(Math.random()*4)]});
}
const player={x:300,y:300,r:13,hp:100,money:0,ammo:12,speed:190,car:false};
let heat=0,crime=0,arrests=0,prisonLevel=1,inPrison=false,prisonX=2150,prisonY=1600;
let prisonSwitch=false,won=false,dead=false;
let last=0,fireCooldown=0,spawnTimer=0,noticeTimer=0;
const keys={},bullets=[],enemyBullets=[],people=[],enemies=[],cops=[],cars=[];
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function say(t){notice.textContent=t;notice.style.display='block';noticeTimer=3.1}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearRoad(){
 let vertical=Math.random()<.5;
 return vertical?{x:rand(100,W-100),y:Math.round(rand(0,H)/spacing)*spacing+rand(-40,40)}:
 {x:Math.round(rand(0,W)/spacing)*spacing+rand(-40,40),y:rand(100,H-100)};
}
function blocked(x,y,r=12){
 if(x<r||y<r||x>W-r||y>H-r)return true;
 for(const b of buildings)if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
 if(inPrison&&player===arguments[2]){}
 return false;
}
function solid(x,y,r=12){
 if(x<r||y<r||x>W-r||y>H-r)return true;
 for(const b of buildings)if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
 if(inPrison){
  const p=prisonBounds(),inside=x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h;
  if(!inside)return false;
  const gateX=p.x+p.w/2,atGate=Math.abs(x-gateX)<45&&y>p.y+p.h-25;
  if(!atGate&&(!prisonSwitch||prisonLevel<2||y<p.y+p.h-15))return true;
 }
 return false;
}
function prisonBounds(){let s=prisonLevel===1?240:340;return{x:prisonX-s/2,y:prisonY-s/2,w:s,h:s}}
function makePerson(x,y){return{x,y,r:11,hp:1,alive:true,dx:rand(-1,1),dy:rand(-1,1),t:rand(1,4),kind:'person'}}
for(let i=0;i<65;i++){let p=nearRoad();people.push(makePerson(p.x,p.y))}
for(let i=0;i<18;i++){let p=nearRoad();cars.push({x:p.x,y:p.y,a:Math.random()*6.28,s:rand(35,65),color:['#e9b840','#58b4d1','#d45c57','#dedede'][i%4],r:17})}
const circles=[
 {x:500,y:550,id:0,name:'БОЕВАЯ ЗОНА'},
 {x:1350,y:500,id:1,name:'ГОРОДСКОЕ ДЕЛО'},
 {x:1950,y:900,id:2,name:'ПОЛИЦЕЙСКАЯ ЗОНА'},
 {x:650,y:1450,id:3,name:'МАГАЗИННЫЙ ЗАКАЗ'},
 {x:1900,y:1450,id:4,name:'БОЛЬШАЯ ОПЕРАЦИЯ'}
];
const missionDefs=[
 {name:'ОТРЯД ПРОТИВНИКОВ',desc:'Победи 10 вооружённых противников в жёлтой зоне.',type:'enemies',goal:10,reward:1200},
 {name:'ГОРОДСКОЙ ХАОС',desc:'Победи 5 обычных игровых персонажей.',type:'people',goal:5,reward:1000},
 {name:'РОЗЫСК',desc:'Одержи верх в противостоянии с 4 полицейскими.',type:'cops',goal:4,reward:1600},
 {name:'ПОКУПКА',desc:'Купи любое улучшение в магазине.',type:'buy',goal:1,reward:800},
 {name:'ФИНАЛЬНАЯ ОПЕРАЦИЯ',desc:'Победи 6 противников и 3 полицейских.',type:'final',goal:9,reward:3000}
];
const circleMissions=circles.map((_,i)=>({...missionDefs[i],started:false,done:false,progress:0}));
function spawnEnemies(circle,n){
 for(let i=0;i<n;i++){
  let a=rand(0,6.28),r=rand(30,105);
  enemies.push({x:circle.x+Math.cos(a)*r,y:circle.y+Math.sin(a)*r,r:12,hp:2,alive:true,fire:rand(.4,2),kind:'enemy',speed:rand(45,70)});
 }
}
function activateMission(i){
 let m=circleMissions[i],z=circles[i];
 if(m.done){say('Это задание уже выполнено!');return}
 if(m.started){say(m.desc+' Прогресс: '+m.progress+'/'+m.goal);return}
 m.started=true;m.progress=0;
 if(m.type==='enemies')spawnEnemies(z,10);
 if(m.type==='final')spawnEnemies(z,6);
 if(m.type==='cops'){heat=Math.max(heat,1.2);for(let j=0;j<4;j++)spawnCop(z.x+rand(-100,100),z.y+rand(-100,100))}
 say('МИССИЯ: '+m.name+' — '+m.desc);
}
function currentMission(type){
 return circleMissions.find(m=>m.started&&!m.done&&(m.type===type||(m.type==='final'&&(type==='enemies'||type==='cops'))));
}
function addProgress(type){
 let m=currentMission(type);if(!m)return;
 m.progress++;
 if(m.type==='final'&&type==='enemies'){}
 if(m.progress>=m.goal)completeMission(m);
}
function completeMission(m){
 m.done=true;player.money+=m.reward;
 say('МИССИЯ ВЫПОЛНЕНА! +$'+m.reward);
}
function spawnCop(x=rand(0,W),y=rand(0,H)){
 cops.push({x,y,r:13,hp:3,alive:true,fire:rand(.3,1.2),speed:105+heat*19,foot:Math.random()<.3,kind:'cop'});
}
function stars(){return '★'.repeat(Math.floor(heat))+(heat%1>=.5?'◐':'')+'☆'.repeat(5-Math.ceil(heat))}
function addHeat(n){heat=clamp(heat+n,0,5);crime+=n*100}
function moveEntity(e,dx,dy,dt){
 let nx=clamp(e.x+dx*dt,15,W-15),ny=clamp(e.y+dy*dt,15,H-15);
 if(!solid(nx,e.y,e.r))e.x=nx;
 if(!solid(e.x,ny,e.r))e.y=ny;
}
function nearest(arr,e,max=Infinity){
 let best=null,bd=max;
 for(const a of arr){if(!a.alive)continue;let d=dist(a,e);if(d<bd){best=a;bd=d}}
 return best;
}
function shoot(){
 if(fireCooldown>0)return;
 if(player.ammo<=0){say('Нет зарядов! Купи боезапас в магазине.');return}
 player.ammo--;fireCooldown=.28;
 let target=nearest([...enemies,...cops,...people],player,600);
 let a=target?Math.atan2(target.y-player.y,target.x-player.x):0;
 bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,life:1.1});
}
function attack(){
 if(dead||won)return;
 if(inPrison){
  let p=prisonBounds(),gateX=p.x+p.w/2,gateY=p.y+p.h;
  if(prisonLevel>=2&&!prisonSwitch&&dist(player,{x:p.x+30,y:p.y+30})<55){
   prisonSwitch=true;say('ЩЁЛК! Переключатель активирован. Теперь ищи ворота.');return;
  }
  if(Math.abs(player.x-gateX)<58&&Math.abs(player.y-gateY)<75&&(prisonLevel===1||prisonSwitch)){
   inPrison=false;heat=clamp(heat+.7,0,5);crime+=70;
   player.x=gateX;player.y=gateY+45;
   say('ПОБЕГ! +0,7 звезды. Полиция снова в погоне!');
   if(heat>0){spawnCop(player.x+100,player.y);spawnCop(player.x-100,player.y)}
   return;
  }
  say(prisonLevel>=2&&!prisonSwitch?'Найди переключатель во внутреннем дворе!':'Найди ворота тюрьмы!');
  return;
 }
 let target=nearest([...enemies,...people,...cops],player,55);
 if(target){
  target.hp--;
  if(target.hp<=0){
   target.alive=false;
   if(target.kind==='enemy'){addProgress('enemies');addProgress('final')}
   if(target.kind==='person'){addProgress('people');addHeat(.12)}
   if(target.kind==='cop'){addProgress('cops');addProgress('final');addHeat(.25)}
  }
 }else{
  const z=circles.find(q=>dist(player,q)<65);
  if(z){activateMission(z.id);return}
  say('Подойди к цели поближе!');
 }
}
function arrest(){
 if(inPrison||dead)return;
 arrests++;heat=Math.max(0,heat-1);crime=0;
 inPrison=true;prisonSwitch=false;
 player.x=prisonX;player.y=prisonY;
 player.money=Math.max(0,player.money-100);
 cops.forEach(c=>c.alive=false);
 if(arrests>=2)prisonLevel=2;
 say('АРЕСТ! −1 звезда, −$100. '+(prisonLevel>=2?'Тюрьма расширена! Найди переключатель, затем ворота.':'Ищи ворота и нажми ДЕЙСТВИЕ.'));
}
function shopMenu(){
 let s=prompt('МАГАЗИН GOB CITY\\n1 — Аптечка $150\\n2 — +12 зарядов $120\\n3 — Скорость +15% $350\\n4 — Бластер улучшен $500\\n5 — Выйти');
 if(s==='1'&&player.money>=150){player.money-=150;player.hp=Math.min(100,player.hp+45);say('Аптечка куплена!')}
 else if(s==='2'&&player.money>=120){player.money-=120;player.ammo+=12;say('Заряды куплены!')}
 else if(s==='3'&&player.money>=350){player.money-=350;player.speed*=1.15;say('Скорость увеличена!')}
 else if(s==='4'&&player.money>=500){player.money-=500;player.ammo+=10;say('Бластер улучшен!')}
 else if(s!=='5'&&s!==null){say('Не хватает денег или неверный выбор.');return}
 if(s==='1'||s==='2'||s==='3'||s==='4')addProgress('buy');
}
function toggleCar(){
 if(player.car){player.car=false;say('Ты вышел из машины.');return}
 let car=nearest(cars,player,45);
 if(car){player.car=car;say('Машина заведена! E — выйти.')}
 else say('Подойди к машине поближе.');
}
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.repeat)return;
 if(e.key.toLowerCase()==='e')toggleCar();
 if(e.key.toLowerCase()==='f')shopMenu();
 if(e.key===' ')shoot();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(b=>{
 let k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k.toLowerCase()]=true});
 for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[k.toLowerCase()]=false);
});
document.getElementById('act').onclick=attack;
document.getElementById('car').onclick=toggleCar;
document.getElementById('shop').onclick=shopMenu;
document.getElementById('shoot').onclick=shoot;
function update(dt){
 if(dead||won)return;
 fireCooldown=Math.max(0,fireCooldown-dt);
 if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)notice.style.display='none'}
 let dx=0,dy=0;
 if(keys.w||keys.arrowup)dy--;
 if(keys.s||keys.arrowdown)dy++;
 if(keys.a||keys.arrowleft)dx--;
 if(keys.d||keys.arrowright)dx++;
 let len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
 let speed=player.car?player.car.s:player.speed;
 if(player.car){player.x=player.car.x;player.y=player.car.y;player.car.x+=dx*speed*dt;player.car.y+=dy*speed*dt;player.car.x=clamp(player.car.x,15,W-15);player.car.y=clamp(player.car.y,15,H-15)}
 else moveEntity(player,dx*speed,dy*speed,dt);
 if(keys[' '])shoot();
 for(const p of people){
  if(!p.alive)continue;
  p.t-=dt;
  if(p.t<=0){p.dx=rand(-1,1);p.dy=rand(-1,1);p.t=rand(1,3)}
  if(dist(p,player)<130){let a=Math.atan2(p.y-player.y,p.x-player.x);p.dx=Math.cos(a);p.dy=Math.sin(a)}
  let l=Math.hypot(p.dx,p.dy)||1;p.x=clamp(p.x+p.dx/l*32*dt,15,W-15);p.y=clamp(p.y+p.dy/l*32*dt,15,H-15);
 }
 for(const e of enemies){
  if(!e.alive)continue;
  let d=dist(e,player),a=Math.atan2(player.y-e.y,player.x-e.x);
  if(d>90)moveEntity(e,Math.cos(a)*e.speed,Math.sin(a)*e.speed,dt);
  e.fire-=dt;
  if(d<360&&e.fire<=0){enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,life:2,kind:'enemy'});e.fire=rand(1.3,2.2)}
 }
 for(const cop of cops){
  if(!cop.alive)continue;
  cop.speed=105+heat*22;
  let d=dist(cop,player),a=Math.atan2(player.y-cop.y,player.x-cop.x);
  if(d>28)moveEntity(cop,Math.cos(a)*cop.speed,Math.sin(a)*cop.speed,dt);
  cop.fire-=dt;
  if(d<300&&cop.fire<=0){enemyBullets.push({x:cop.x,y:cop.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,life:1.6,kind:'cop'});cop.fire=rand(.7,1.3)}
  if(!inPrison&&d<24&&heat>=.5){arrest();break}
 }
 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0||b.x<0||b.y<0||b.x>W||b.y>H){bullets.splice(i,1);continue}
  let t=nearest([...enemies,...cops,...people],b,20);
  if(t){t.hp--;bullets.splice(i,1);if(t.hp<=0){t.alive=false;if(t.kind==='enemy'){addProgress('enemies');addProgress('final')}if(t.kind==='person'){addProgress('people');addHeat(.12)}if(t.kind==='cop'){addProgress('cops');addProgress('final');addHeat(.25)}}}
 }
 for(let i=enemyBullets.length-1;i>=0;i--){
  let b=enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0||dist(b,player)<player.r+5){if(dist(b,player)<player.r+5)player.hp-=b.kind==='cop'?9:6;enemyBullets.splice(i,1);continue}
 }
 if(player.hp<=0){player.hp=0;dead=true;say('ТЫ ПРОИГРАЛ! Обнови страницу, чтобы начать заново.')}
 if(heat>0&&!inPrison){
  spawnTimer-=dt;
  let desired=Math.min(3+Math.floor(heat*2),12);
  if(spawnTimer<=0&&cops.filter(c=>c.alive).length<desired){spawnCop(player.x+rand(-400,400),player.y+rand(-400,400));spawnTimer=Math.max(.8,3-heat*.35)}
 }
 if(heat>=5&&!won){won=true;say('ПЯТЬ ЗВЁЗД! ТЫ СТАЛ ЛЕГЕНДОЙ GOB CITY!')}
 if(people.filter(p=>p.alive).length<35){let p=nearRoad();people.push(makePerson(p.x,p.y))}
 if(enemies.filter(e=>e.alive).length<1){/* новые противники появятся со следующей миссией */}
 hud.innerHTML='<b>GOB CITY 5.0</b><br>💵 $'+player.money+'<br>❤️ '+Math.ceil(player.hp)+' HP<br>🔋 Заряды: '+player.ammo+'<br>⭐ '+stars()+'<br>🚨 Розыск: '+heat.toFixed(1)+'/5<br>🚓 Аресты: '+arrests;
 let active=circleMissions.find(m=>m.started&&!m.done);
 missionUI.innerHTML=active?'<b>🟡 '+active.name+'</b><br>'+active.desc+'<br><b>Прогресс: '+active.progress+'/'+active.goal+' · Награда $'+active.reward+'</b>':'<b>🟡 МИССИИ</b><br>Подойди к жёлтому кругу и нажми ДЕЙСТВИЕ.';
}
function draw(){
 let sw=innerWidth,sh=innerHeight;
 let camX=clamp(player.x-sw/2,0,W-sw),camY=clamp(player.y-sh/2,0,H-sh);
 ctx.clearRect(0,0,sw,sh);ctx.save();ctx.translate(-camX,-camY);
 ctx.fillStyle='#303a3d';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#3d4648';
 for(let x=0;x<W;x+=spacing){ctx.fillRect(x-road/2,0,road,H)}
 for(let y=0;y<H;y+=spacing){ctx.fillRect(0,y-road/2,W,road)}
 ctx.strokeStyle='#a9a9a044';ctx.lineWidth=2;ctx.setLineDash([18,18]);
 for(let x=0;x<W;x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=spacing){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.setLineDash([]);
 for(const b of buildings){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffffff20';ctx.fillRect(b.x+10,b.y+10,b.w-20,8);ctx.fillStyle='#242c35';for(let x=b.x+20;x<b.x+b.w-15;x+=35)for(let y=b.y+35;y<b.y+b.h-15;y+=40)ctx.fillRect(x,y,15,18)}
 for(const z of circles){ctx.beginPath();ctx.arc(z.x,z.y,100,0,Math.PI*2);ctx.fillStyle='#ffd83d18';ctx.fill();ctx.strokeStyle='#ffd83d';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#ffe98b';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(z.name,z.x,z.y-112);let m=circleMissions[z.id];ctx.fillStyle=m.done?'#68e58b':'#fff';ctx.fillText(m.done?'✓ ГОТОВО':m.started?m.progress+'/'+m.goal:'НАЖМИ ДЕЙСТВИЕ',z.x,z.y+125)}
 let p=prisonBounds();ctx.fillStyle='#9da5aa';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#252d33';ctx.lineWidth=7;ctx.strokeRect(p.x,p.y,p.w,p.h);
 ctx.strokeStyle='#3e474f';ctx.lineWidth=3;
 for(let x=p.x+12;x<p.x+p.w;x+=18){ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x,p.y+p.h);ctx.stroke()}
 ctx.fillStyle='#f4d35e';ctx.fillRect(p.x+p.w/2-38,p.y+p.h-10,76,15);
 ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('ТЮРЬМА · УРОВЕНЬ '+prisonLevel,prisonX,prisonY-p.h/2-12);
 if(prisonLevel>=2&&!prisonSwitch){ctx.fillStyle='#67f4ff';ctx.beginPath();ctx.arc(p.x+30,p.y+30,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('ПЕРЕКЛЮЧАТЕЛЬ',p.x+100,p.y+25)}
 for(const car of cars){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);ctx.fillStyle=car.color;ctx.fillRect(-20,-10,40,20);ctx.fillStyle='#1b2832';ctx.fillRect(-7,-8,14,16);ctx.restore()}
 for(const p of people)if(p.alive){ctx.fillStyle='#d8c1a2';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#293a4a';ctx.fillRect(p.x-7,p.y+5,14,9)}
 for(const e of enemies)if(e.alive){ctx.fillStyle='#ed744d';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b1b1b';ctx.fillRect(e.x-7,e.y-3,14,5);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText('!',e.x,e.y-17)}
 for(const cop of cops)if(cop.alive){ctx.fillStyle='#56a9ff';ctx.beginPath();ctx.arc(cop.x,cop.y,cop.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7f3ff';ctx.fillRect(cop.x-7,cop.y-3,14,6)}
 for(const b of bullets){ctx.fillStyle='#f8e16a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}
 for(const b of enemyBullets){ctx.fillStyle=b.kind==='cop'?'#7db9ff':'#ff8a66';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#5ef08c';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('ТЫ',player.x,player.y-21);
 ctx.restore();
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
say('Добро пожаловать в GOB CITY 5.0!');
requestAnimationFrame(loop);
})();
</script>
