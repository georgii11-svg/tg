<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Круг · Квадрат · Треугольник</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a14 60%, #000 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }

  .title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #6e4aff;
    opacity: 0;
    animation: fadeIn 1s ease-out 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .stage {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  .shape-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    opacity: 0;
    animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .shape-wrap:nth-child(1) { animation-delay: 0.3s; }
  .shape-wrap:nth-child(2) { animation-delay: 0.9s; }
  .shape-wrap:nth-child(3) { animation-delay: 1.5s; }

  @keyframes popIn {
    0% { opacity: 0; transform: translateY(30px) scale(0.7); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .shape-wrap svg {
    width: 140px;
    height: 140px;
    filter: drop-shadow(0 0 20px currentColor);
  }

  /* круг */
  .circle svg { color: #5ecbff; }
  .circle .shape-name { color: #5ecbff; }

  /* квадрат */
  .square svg { color: #ff6b9d; }
  .square .shape-name { color: #ff6b9d; }

  /* треугольник */
  .triangle svg { color: #f7c948; }
  .triangle .shape-name { color: #f7c948; }

  /* рисование фигуры — через stroke-dasharray/dashoffset */
  .shape-path {
    fill: none;
    stroke: currentColor;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 1.6s ease-out forwards;
  }

  /* Для круга длина обводки — 2πr = 2 * 3.14 * 60 = 377 */
  .circle .shape-path {
    stroke-dasharray: 377;
    stroke-dashoffset: 377;
    animation-delay: 0.6s;
  }
  /* Квадрат: 4 стороны по 120 = 480 */
  .square .shape-path {
    stroke-dasharray: 480;
    stroke-dashoffset: 480;
    animation-delay: 1.2s;
  }
  /* Треугольник: периметр примерно 3*140 = 420 */
  .triangle .shape-path {
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
    animation-delay: 1.8s;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  /* заливка появляется после обводки */
  .shape-fill {
    opacity: 0;
    animation: fillIn 0.8s ease-out forwards;
  }
  .circle .shape-fill { animation-delay: 2.1s; }
  .square .shape-fill { animation-delay: 2.7s; }
  .triangle .shape-fill { animation-delay: 3.3s; }

  @keyframes fillIn {
    to { opacity: 0.15; }
  }

  .shape-name {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0;
    animation: fadeIn 0.5s ease-out 3.5s forwards;
  }

  /* концовка */
  .final-message {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a4a5a;
    opacity: 0;
    animation: fadeIn 1s ease-out 4s forwards;
  }

  /* вращение фона */
  .bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(110, 74, 255, 0.08) 0%, transparent 60%);
    z-index: -1;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* адаптив */
  @media (max-width: 600px) {
    .stage {
      flex-direction: column;
      gap: 24px;
    }
    .shape-wrap svg {
      width: 110px;
      height: 110px;
    }
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="title">Геометрия</div>

  <div class="stage">

    <!-- КРУГ -->
    <div class="shape-wrap circle">
      <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <!-- заливка -->
        <circle class="shape-fill" cx="70" cy="70" r="60" fill="currentColor"/>
        <!-- обводка -->
        <circle class="shape-path" cx="70" cy="70" r="60"/>
      </svg>
      <div class="shape-name">Круг</div>
    </div>

    <!-- КВАДРАТ -->
    <div class="shape-wrap square">
      <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <!-- заливка -->
        <rect class="shape-fill" x="10" y="10" width="120" height="120" fill="currentColor"/>
        <!-- обводка -->
        <rect class="shape-path" x="10" y="10" width="120" height="120" rx="0"/>
      </svg>
      <div class="shape-name">Квадрат</div>
    </div>

    <!-- ТРЕУГОЛЬНИК -->
    <div class="shape-wrap triangle">
      <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <!-- заливка -->
        <polygon class="shape-fill" points="70,10 130,130 10,130" fill="currentColor"/>
        <!-- обводка -->
        <polygon class="shape-path" points="70,10 130,130 10,130"/>
      </svg>
      <div class="shape-name">Треугольник</div>
    </div>

  </div>

  <div class="final-message">три фигуры · одна форма</div>

</body>
</html>
