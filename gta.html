<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mini GTA: Deliveries</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: 'Arial', sans-serif; color: white; touch-action: none; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 20; text-shadow: 2px 2px 0 #000; }
        .stars { color: #ffcc00; font-size: 24px; letter-spacing: 2px; }
        .stats { font-size: 18px; font-weight: bold; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; display: inline-block;}
        
        #quest-box { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: 2px solid #ffcc00; padding: 10px; border-radius: 5px; font-weight: bold; z-index: 20; pointer-events: none; display: none; }
        
        #message { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); font-size: 26px; color: #00ffcc; text-align: center; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold; white-space: nowrap; z-index: 20; }

        /* Мобильное управление */
        #mobile-controls { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; z-index: 15; touch-action: none; }
        #joystick-knob { position: absolute; top: 45px; left: 45px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; pointer-events: none; }
        
        #btn-car { position: absolute; bottom: 40px; right: 40px; width: 90px; height: 90px; border-radius: 50%; background: rgba(0, 150, 255, 0.4); border: 3px solid #00aaff; color: white; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; pointer-events: auto; z-index: 15; touch-action: none; }

        @media (pointer: coarse) { #mobile-controls { display: block; } }
    </style>
</head>
<body>

    <div id="hud">
        <div class="stars" id="wanted-level"></div>
        <div class="stats">💵 $<span id="money">0</span></div>
        <div class="stats">❤️ <span id="health">100</span></div>
    </div>
    
    <div id="quest-box">📦 Доставка:<br><span id="quest-text">Ищем заказ...</span></div>
    <div id="message"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-car">🚗</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let WIDTH = window.innerWidth;
        let HEIGHT = window.innerHeight;
        function resize() { WIDTH = canvas.width = window.innerWidth; HEIGHT = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const WORLD_SIZE = 4000;
        let camera = { x: 0, y: 0, angle: 0 };
        
        // Генерация зданий
        let buildings = [];
        for (let i = 0; i < 80; i++) {
            let w = 150 + Math.random() * 250;
            let h = 150 + Math.random() * 250;
            buildings.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, w: w, h: h, color: `hsl(${Math.random() * 360}, 15%, 25%)` });
        }
        
        let roads = [];
        for(let i=0; i<WORLD_SIZE; i+=400) {
            roads.push({x: i, y: 0, w: 100, h: WORLD_SIZE}); 
            roads.push({x: 0, y: i, w: WORLD_SIZE, h: 100}); 
        }

        // --- СУЩНОСТИ ---
        let player = { x: WORLD_SIZE/2, y: WORLD_SIZE/2, angle: 0, speed: 0, hp: 100, money: 0, inCar: false };
        
        let cars = [];
        for(let i=0; i<20; i++) {
            let isPolice = i < 3; // Первые 3 машины - копы
            cars.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, angle: Math.random()*Math.PI*2, speed: 0, color: isPolice ? "#0000ff" : `hsl(${Math.random()*360}, 80%, 50%)`, isPlayer: false, isPolice: isPolice });
        }
        
        let npcs = [];
        for(let i=0; i<40; i++) npcs.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, angle: Math.random()*Math.PI*2, speed: 1.5, color: `hsl(${Math.random()*360}, 70%, 50%)`, alive: true });

        let particles = []; // Следы шин и дым
        let wantedLevel = 0;

        // Миссия
        let quest = { active: false, type: "", targetX: 0, targetY: 0, reward: 0 };

        // --- УПРАВЛЕНИЕ ---
        const keys = { w: false, a: false, s: false, d: false };
        let joyActive = false, joyStartX = 0, joyStartY = 0, joyDX = 0, joyDY = 0;

        window.addEventListener('keydown', e => {
            if (e.key === 'w' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'ц') keys.w = true;
            if (e.key === 's' || e.key === 'ArrowDown' || e.key.toLowerCase() === 'ы') keys.s = true;
            if (e.key === 'a' || e.key === 'ArrowLeft' || e.key.toLowerCase() === 'ф') keys.a = true;
            if (e.key === 'd' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'в') keys.d = true;
            if (e.key === 'e' || e.key.toLowerCase() === 'у') enterExitCar();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'w' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'ц') keys.w = false;
            if (e.key === 's' || e.key === 'ArrowDown' || e.key.toLowerCase() === 'ы') keys.s = false;
            if (e.key === 'a' || e.key === 'ArrowLeft' || e.key.toLowerCase() === 'ф') keys.a = false;
            if (e.key === 'd' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'в') keys.d = false;
        });

        const zoneLeft = document.getElementById('joystick-zone'); const knob = document.getElementById('joystick-knob'); const btnCar = document.getElementById('btn-car');
        zoneLeft.addEventListener('pointerdown', e => { e.preventDefault(); joyActive = true; joyStartX = e.clientX; joyStartY = e.clientY; zoneLeft.setPointerCapture(e.pointerId); });
        zoneLeft.addEventListener('pointermove', e => {
            if (!joyActive) return; joyDX = e.clientX - joyStartX; joyDY = e.clientY - joyStartY;
            let dist = Math.hypot(joyDX, joyDY);
            if (dist > 50) { joyDX = (joyDX / dist) * 50; joyDY = (joyDY / dist) * 50; }
            knob.style.transform = `translate(${joyDX}px, ${joyDY}px)`;
        });
        zoneLeft.addEventListener('pointerup', () => { joyActive = false; joyDX = 0; joyDY = 0; knob.style.transform = `translate(0px, 0px)`; });
        btnCar.addEventListener('pointerdown', e => { e.preventDefault(); enterExitCar(); });

        // --- ЛОГИКА ---
        function showMsg(text, color = "#00ffcc") {
            const msg = document.getElementById('message');
            msg.innerText = text; msg.style.color = color; msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, 2000);
        }

        function updateUI() {
            document.getElementById('money').innerText = player.money;
            document.getElementById('health').innerText = Math.max(0, Math.floor(player.hp));
            let stars = "";
            for(let i=0; i<wantedLevel; i++) stars += "★";
            document.getElementById('wanted-level').innerText = stars;
        }

        function enterExitCar() {
            if (player.inCar) {
                player.inCar = false;
                cars[0].isPlayer = false;
                player.x -= 50;
                showMsg("Вы вышли из машины");
            } else {
                let closestCar = null; let minDist = 120;
                for (let c of cars) {
                    if (c.isPolice) continue; // Копов не угоняем
                    let d = Math.hypot(player.x - c.x, player.y - c.y);
                    if (d < minDist) { minDist = d; closestCar = c; }
                }
                if (closestCar) {
                    player.inCar = true; closestCar.isPlayer = true;
                    cars = cars.filter(c => c !== closestCar);
                    cars.unshift(closestCar);
                    player.x = closestCar.x; player.y = closestCar.y;
                    showMsg("Угнали тачку! 🚗");
                } else { showMsg("Нет машины рядом", "#ff0000"); }
            }
        }

        function spawnQuest() {
            if (quest.active) return;
            quest.active = true;
            quest.type = "pickup";
            quest.targetX = Math.random() * WORLD_SIZE;
            quest.targetY = Math.random() * WORLD_SIZE;
            quest.reward = 500;
            document.getElementById('quest-box').style.display = 'block';
            document.getElementById('quest-text').innerText = "Заберите посылку";
            showMsg("НОВЫЙ ЗАКАЗ! Езжайте к желтому маркеру", "#ffcc00");
        }

        function update() {
            let moveX = 0, moveY = 0;
            if (keys.w) moveY -= 1; if (keys.s) moveY += 1; if (keys.a) moveX -= 1; if (keys.d) moveX += 1;
            if (joyActive) { if (Math.hypot(joyDX, joyDY) > 10) { moveX = joyDX / 50; moveY = joyDY / 50; } }
            let moveLen = Math.hypot(moveX, moveY);
            if (moveLen > 1) { moveX /= moveLen; moveY /= moveLen; }

            // Физика
            if (!player.inCar) {
                // Пешком
                player.x += moveX * 4;
                player.y += moveY * 4;
                if (moveLen > 0) player.angle = Math.atan2(moveY, moveX);
                
                // Проверка миссии пешком
                if (quest.active && quest.type === "pickup") {
                     if (Math.hypot(player.x - quest.targetX, player.y - quest.targetY) < 50) {
                         quest.type = "dropoff";
                         quest.targetX = Math.random() * WORLD_SIZE;
                         quest.targetY = Math.random() * WORLD_SIZE;
                         document.getElementById('quest-text').innerText = "Доставьте посылку";
                         showMsg("Посылка у вас! Везите в красный маркер", "#ff0000");
                     }
                }

            } else {
                // На машине
                let car = cars[0];
                
                // Разгон/торможение
                if (keys.w || (joyActive && joyDY < -10)) car.speed = Math.min(car.speed + 0.3, 12);
                else if (keys.s || (joyActive && joyDY > 10)) car.speed = Math.max(car.speed - 0.4, -5);
                else car.speed *= 0.98; // Трение
                
                // Поворот
                let turn = 0;
                if (keys.a || (joyActive && joyDX < -10)) turn = -1;
                if (keys.d || (joyActive && joyDX > 10)) turn = 1;
                
                if (Math.abs(car.speed) > 0.5) {
                    car.angle += turn * 0.04 * (car.speed / Math.abs(car.speed)); // Задний ход меняет поворот
                }
                
                car.x += Math.cos(car.angle) * car.speed;
                car.y += Math.sin(car.angle) * car.speed;
                
                player.x = car.x; player.y = car.y; player.angle = car.angle;
                
                // Дым/следы от шин при резком повороте
                if (turn !== 0 && Math.abs(car.speed) > 6) {
                    particles.push({ x: car.x - Math.cos(car.angle)*20, y: car.y - Math.sin(car.angle)*20, life: 30, color: "gray", size: 20 });
                }

                // Сбивание НПС
                for(let n of npcs) {
                    if (n.alive && Math.hypot(car.x - n.x, car.y - n.y) < 30) {
                        n.alive = false; player.money += 50; 
                        if (wantedLevel < 3) { wantedLevel++; showMsg("РОЗЫСК! ⭐", "#ff0000"); }
                    }
                }
                
                // Проверка миссии на машине
                if (quest.active) {
                    let distToTarget = Math.hypot(player.x - quest.targetX, player.y - quest.targetY);
                    if (distToTarget < 80) {
                        if (quest.type === "pickup") {
                            quest.type = "dropoff";
                            quest.targetX = Math.random() * WORLD_SIZE;
                            quest.targetY = Math.random() * WORLD_SIZE;
                            document.getElementById('quest-text').innerText = "Доставьте посылку";
                            showMsg("ВЫ ЗАБРАЛИ ЗАКАЗ! ВЕЗИТЕ К КРАСНОМУ", "#ffcc00");
                        } else if (quest.type === "dropoff") {
                            player.money += quest.reward;
                            showMsg(`ЗАКАЗ ДОСТАВЛЕН! +$${quest.reward}`, "#00ff00");
                            quest.active = false;
                            document.getElementById('quest-box').style.display = 'none';
                            setTimeout(spawnQuest, 5000); // Новый заказ через 5 сек
                        }
                    }
                }
            }
            
            // Ограничение мира и коллизии со зданиями
            player.x = Math.max(50, Math.min(WORLD_SIZE - 50, player.x));
            player.y = Math.max(50, Math.min(WORLD_SIZE - 50, player.y));
            
            let radius = player.inCar ? 30 : 15;
            for (let b of buildings) {
                if (player.x + radius > b.x && player.x - radius < b.x + b.w && player.y + radius > b.y && player.y - radius < b.y + b.h) {
                    if (player.inCar) { cars[0].speed *= -0.5; } // Отскок при ударе
                    if (player.x < b.x + b.w/2) player.x = b.x - radius; else player.x = b.x + b.w + radius;
                    if (player.y < b.y + b.h/2) player.y = b.y - radius; else player.y = b.y + b.h + radius;
                    if (player.inCar) { cars[0].x = player.x; cars[0].y = player.y; }
                }
            }

            // Частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.life--; p.size += 0.5;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Копы (движение к игроку)
            for (let c of cars) {
                if (!c.isPolice || c.isPlayer) continue;
                let dist = Math.hypot(player.x - c.x, player.y - c.y);
                if (dist < 1500) { // Агримся
                    c.angle = Math.atan2(player.y - c.y, player.x - c.x);
                    c.speed = Math.min(c.speed + 0.1, 9);
                    c.x += Math.cos(c.angle) * c.speed;
                    c.y += Math.sin(c.angle) * c.speed;
                    
                    // Если догнал - бьет
                    if (dist < 60) { player.hp -= 0.5; updateUI(); if (player.hp <= 0) gameOver(); }
                }
            }

            // Камера (вид от третьего лица сверху)
            let camDist = player.inCar ? 300 : 200;
            let targetCamX = player.x - Math.cos(player.angle) * camDist;
            let targetCamY = player.y - Math.sin(player.angle) * camDist;
            
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            // Старт квеста (если нет)
            if (!quest.active && Math.random() < 0.01) spawnQuest();
        }

        function gameOver() {
            showMsg("ВАС УБИЛИ", "#ff0000");
            setTimeout(() => {
                player.hp = 100; player.money = 0; wantedLevel = 0;
                player.x = WORLD_SIZE/2; player.y = WORLD_SIZE/2; player.inCar = false;
                for (let n of npcs) n.alive = true;
                quest.active = false; document.getElementById('quest-box').style.display = 'none';
                updateUI();
            }, 3000);
        }

        function draw() {
            ctx.fillStyle = "#222"; // Фон
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.save();
            // Камера
            ctx.translate(WIDTH/2, HEIGHT/2);
            ctx.rotate(-player.angle - Math.PI/2); // Поворачиваем мир вокруг игрока
            ctx.translate(-camera.x - player.x, -camera.y - player.y);

            // Дороги
            ctx.fillStyle = "#111";
            for(let r of roads) ctx.fillRect(r.x, r.y, r.w, r.h);
            
            // Здания
            for (let b of buildings) {
                // Тень
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(b.x + 10, b.y + 10, b.w, b.h);
                // Тело
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                // Крыша
                ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.strokeRect(b.x, b.y, b.w, b.h);
            }

            // Маркер квеста
            if (quest.active) {
                ctx.fillStyle = quest.type === "pickup" ? "rgba(255, 204, 0, 0.5)" : "rgba(255, 0, 0, 0.5)";
                ctx.beginPath();
                ctx.arc(quest.targetX, quest.targetY, 60, 0, Math.PI*2);
                ctx.fill();
                // Внутренний круг
                ctx.fillStyle = quest.type === "pickup" ? "#ffcc00" : "#ff0000";
                ctx.beginPath(); ctx.arc(quest.targetX, quest.targetY, 20, 0, Math.PI*2); ctx.fill();
            }

            // Частицы (дым)
            for (let p of particles) {
                ctx.fillStyle = `rgba(150, 150, 150, ${p.life/30})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            }

            // NPC
            for (let n of npcs) {
                if (!n.alive) continue;
                ctx.fillStyle = n.color;
                ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, Math.PI*2); ctx.fill();
            }

            // Машины
            for (let c of cars) {
                if (c.isPlayer) continue;
                drawCar(c);
            }
            
            // Игрок
            if (player.inCar) {
                drawCar(cars[0]);
            } else {
                // Пешком (вид сверху)
                ctx.fillStyle = "#00ffcc";
                ctx.beginPath(); ctx.arc(player.x, player.y, 15, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
        }

        function drawCar(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.angle);
            
            // Тень
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(-40, -20, 80, 40);
            
            // Кузов
            ctx.fillStyle = c.color;
            ctx.fillRect(-35, -18, 70, 36);
            
            // Крыша
            ctx.fillStyle = c.isPolice ? "white" : "rgba(0,0,0,0.4)";
            ctx.fillRect(-15, -14, 30, 28);
            
            // Мигалки для копов
            if (c.isPolice) {
                if (Math.floor(Date.now()/200) % 2 === 0) {
                    ctx.fillStyle = "red"; ctx.fillRect(-5, -10, 10, 20);
                } else {
                    ctx.fillStyle = "blue"; ctx.fillRect(-5, -10, 10, 20);
                }
            }
            
            // Фары
            ctx.fillStyle = "yellow";
            ctx.fillRect(30, -12, 5, 6); ctx.fillRect(30, 6, 5, 6);
            
            ctx.restore();
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

        updateUI();
        showMsg("Добро пожаловать в город!", "#00ffcc");
        setTimeout(spawnQuest, 3000);
        gameLoop();
    </script>
</body>
</html>
