
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 2.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:10px;left:10px;z-index:2;pointer-events:none;text-shadow:1px 2px #000;font-weight:bold}
#title{font-size:19px;color:#7cff8a}
#stats{font-size:14px;margin-top:5px;line-height:1.6}
#hint{font-size:12px;color:#ddd;margin-top:4px}
#joy{position:fixed;left:20px;bottom:25px;width:140px;height:140px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff66;z-index:5;touch-action:none}
#knob{position:absolute;width:56px;height:56px;left:39px;top:39px;border-radius:50%;background:#ffffffaa;border:3px solid white;pointer-events:none}
.action{position:fixed;right:20px;width:78px;height:65px;border-radius:18px;background:#202c38dd;border:2px solid #ffffff77;color:white;font-size:12px;font-weight:bold;z-index:5;touch-action:none}
#enter{bottom:35px}
#mission{bottom:110px}
#map{position:fixed;right:10px;top:10px;width:120px;height:90px;border:2px solid #ffffff99;border-radius:8px;background:#15202acc;z-index:2}
#toast{position:fixed;top:42%;width:100%;text-align:center;font-size:20px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none}
@media(min-width:800px){
#joy{width:120px;height:120px;left:25px;bottom:20px}
#knob{left:29px;top:29px}
.action{width:100px;height:55px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="title">GOB CITY 2.0</div>
  <div id="stats"></div>
  <div id="hint">Исследуй город и найди тачку!</div>
</div>
<canvas id="map"></canvas>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button class="action" id="mission">ЗАДАНИЕ</button>
<button class="action" id="enter">В / ВЫЙТИ</button>

<script>
(() => {
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const map=document.querySelector('#map'),mc=map.getContext('2d');
const stats=document.querySelector('#stats'),toast=document.querySelector('#toast');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 map.width=240;map.height=180;
}
addEventListener('resize',resize);resize();

const world={w:3200,h:2400};
const player={x:400,y:400,r:12,speed:190,angle:0};
let cash=0,wanted=0,inCar=null,missionDone=false;
const cars=[],buildings=[],gangs=[];
const roadsX=[],roadsY=[];
for(let x=100;x<world.w;x+=400)roadsX.push(x);
for(let y=100;y<world.h;y+=400)roadsY.push(y);

// Generate city blocks between the roads.
let seed=12345;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let bx=0;bx<world.w;bx+=400){
 for(let by=0;by<world.h;by+=400){
  for(let k=0;k<4;k++){
   let x=bx+45+rand()*210,y=by+45+rand()*210;
   let w=55+rand()*95,h=55+rand()*95;
   buildings.push({x,y,w,h,c:['#59616b','#77675c','#4c6971','#6c687c'][Math.floor(rand()*4)]});
  }
 }
}
const carColors=['#e74c3c','#3498db','#f1c40f','#eeeeee','#9b59b6','#27ae60'];
for(let i=0;i<34;i++){
 let horizontal=rand()>.5;
 let x=100+rand()*(world.w-200),y=100+rand()*(world.h-200);
 if(horizontal)y=roadsY[Math.floor(rand()*roadsY.length)]+(rand()>.5?22:-22);
 else x=roadsX[Math.floor(rand()*roadsX.length)]+(rand()>.5?22:-22);
 cars.push({x,y,angle:horizontal?0:Math.PI/2,speed:0,color:carColors[i%carColors.length],r:18});
}
for(let i=0;i<18;i++){
 gangs.push({x:250+rand()*(world.w-500),y:250+rand()*(world.h-500),r:11,alive:true});
}
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let joy={x:0,y:0,active:false};
const joyEl=document.querySelector('#joy'),knob=document.querySelector('#knob');
function moveJoy(e){
 const r=joyEl.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=r.width*.31,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy.x=dx/max;joy.y=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown',e=>{
 joy.active=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e);
});
joyEl.addEventListener('pointermove',e=>{if(joy.active)moveJoy(e)});
function stopJoy(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',stopJoy);
joyEl.addEventListener('pointercancel',stopJoy);

function say(t){toast.textContent=t;clearTimeout(say.timer);say.timer=setTimeout(()=>toast.textContent='',1800)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function obstacles(x,y,r){
 if(x<r||y<r||x>world.w-r||y>world.h-r)return true;
 for(const b of buildings){
  if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
 }
 return false;
}
function moveEntity(obj,dx,dy,r){
 if(!obstacles(obj.x+dx,obj.y,r))obj.x+=dx;
 if(!obstacles(obj.x,obj.y+dy,r))obj.y+=dy;
}
function nearestCar(){
 let best=null,dist=60;
 for(const c of cars){let d=Math.hypot(c.x-player.x,c.y-player.y);if(d<dist){best=c;dist=d}}
 return best;
}
function enterExit(){
 if(inCar){player.x=inCar.x+Math.cos(inCar.angle+Math.PI/2)*30;player.y=inCar.y+Math.sin(inCar.angle+Math.PI/2)*30;inCar.speed=0;inCar=null;say('Вышел из машины');return}
 let c=nearestCar();
 if(c){inCar=c;player.x=c.x;player.y=c.y;say('Погнали! 🚗')}else say('Подойди ближе к машине');
}
document.querySelector('#enter').addEventListener('pointerdown',e=>{e.preventDefault();enterExit()});
document.querySelector('#mission').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(missionDone){say('Задание уже выполнено!');return}
 let d=Math.hypot(player.x-2800,player.y-2000);
 if(d<90){cash+=500;missionDone=true;say('Задание выполнено! +$500')}else say('Доберись до жёлтого маркера!');
});
addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='e'&&!e.repeat)enterExit();
 if(e.key.toLowerCase()==='f'&&!e.repeat)document.querySelector('#mission').click();
});

let cam={x:0,y:0};
function drawCar(c){
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
 ctx.fillStyle='#0007';ctx.fillRect(-18,-10,40,24);
 ctx.fillStyle=c.color;ctx.fillRect(-20,-9,40,18);
 ctx.fillStyle='#18242e';ctx.fillRect(-7,-7,14,14);
 ctx.fillStyle='#f8f2ba';ctx.fillRect(16,-7,4,5);ctx.fillRect(16,2,4,5);
 ctx.fillStyle='#222';ctx.fillRect(-13,-12,9,4);ctx.fillRect(7,-12,9,4);ctx.fillRect(-13,8,9,4);ctx.fillRect(7,8,9,4);
 ctx.restore();
}
function drawPerson(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);
 ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(2,5,10,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f4c79b';ctx.beginPath();ctx.arc(0,-4,6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#54d96d';ctx.fillRect(-7,1,14,13);
 ctx.fillStyle='#252d36';ctx.fillRect(-6,12,5,7);ctx.fillRect(2,12,5,7);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let target=inCar||player;
 cam.x=clamp(target.x-W/2,0,world.w-W);
 cam.y=clamp(target.y-H/2,0,world.h-H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#34483d';ctx.fillRect(0,0,world.w,world.h);
 // Road grid.
 ctx.fillStyle='#343a40';
 for(const x of roadsX)ctx.fillRect(x-48,0,96,world.h);
 for(const y of roadsY)ctx.fillRect(0,y-48,world.w,96);
 ctx.strokeStyle='#c6b779';ctx.lineWidth=2;ctx.setLineDash([20,18]);
 for(const x of roadsX){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(const y of roadsY){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 ctx.setLineDash([]);
 // Buildings and parks.
 for(const b of buildings){
  ctx.fillStyle='#0005';ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
  ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#ffffff15';ctx.fillRect(b.x+5,b.y+5,b.w-10,7);
  ctx.fillStyle='#252f38';
  for(let x=b.x+12;x<b.x+b.w-8;x+=22)for(let y=b.y+20;y<b.y+b.h-8;y+=24)ctx.fillRect(x,y,8,7);
 }
 // Mission marker.
 if(!missionDone){
  ctx.strokeStyle='#ffe34d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(2800,2000,28+Math.sin(Date.now()/180)*5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#ffe34d';ctx.font='bold 17px Arial';ctx.fillText('$500',2780,1950);
 }
 for(const g of gangs)if(g.alive){
  ctx.fillStyle='#d94d63';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='white';ctx.fillRect(g.x-4,g.y-4,8,3);
 }
 for(const c of cars)drawCar(c);
 if(!inCar)drawPerson(player);
 else{
  // Driver visible through the vehicle window.
  ctx.fillStyle='#f4c79b';ctx.beginPath();ctx.arc(inCar.x,inCar.y,5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();

 // Mini-map.
 mc.clearRect(0,0,240,180);mc.fillStyle='#34483d';mc.fillRect(0,0,240,180);
 mc.fillStyle='#343a40';
 for(const x of roadsX)mc.fillRect(x/world.w*240-3,0,6,180);
 for(const y of roadsY)mc.fillRect(0,y/world.h*180-3,240,6);
 mc.fillStyle='#7c8791';
 for(const b of buildings)mc.fillRect(b.x/world.w*240,b.y/world.h*180,b.w/world.w*240,b.h/world.h*180);
 mc.fillStyle='#ffe34d';if(!missionDone)mc.fillRect(2800/world.w*240-2,2000/world.h*180-2,5,5);
 mc.fillStyle='#ff5964';for(const g of gangs)if(g.alive)mc.fillRect(g.x/world.w*240-1,g.y/world.h*180-1,3,3);
 mc.fillStyle='#ffffff';mc.beginPath();mc.arc(target.x/world.w*240,target.y/world.h*180,4,0,Math.PI*2);mc.fill();
 stats.innerHTML=`💵 $${cash} &nbsp; 🚨 ${wanted} &nbsp; ${inCar?'🚗 В машине':'🚶 Пешком'}`;
 requestAnimationFrame(draw);
}

let last=performance.now();
function update(now){
 let dt=Math.min((now-last)/1000,.04);last=now;
 let ix=joy.x,iy=joy.y;
 if(keys.w||keys.arrowup)iy-=1;
 if(keys.s||keys.arrowdown)iy+=1;
 if(keys.a||keys.arrowleft)ix-=1;
 if(keys.d||keys.arrowright)ix+=1;
 let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
 if(inCar){
  if(Math.abs(ix)+Math.abs(iy)>.05){
   inCar.angle=Math.atan2(iy,ix);
   inCar.speed=210;
  }else inCar.speed*=.91;
  let nx=inCar.x+Math.cos(inCar.angle)*inCar.speed*dt;
  let ny=inCar.y+Math.sin(inCar.angle)*inCar.speed*dt;
  if(!obstacles(nx,ny,16)){inCar.x=nx;inCar.y=ny}else inCar.speed=0;
  player.x=inCar.x;player.y=inCar.y;
 }else if(len>.05){
  player.angle=Math.atan2(iy,ix);
  moveEntity(player,ix*player.speed*dt,iy*player.speed*dt,10);
  // Gangs notice nearby player.
  for(const g of gangs)if(g.alive&&Math.hypot(g.x-player.x,g.y-player.y)<23){
   g.alive=false;wanted=Math.min(5,wanted+1);say('Банда поймала тебя на глаза!');
  }
 }
 requestAnimationFrame(update);
}
requestAnimationFrame(update);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
