<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Гравити Фолз · Дневник №3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: rgba(255,210,74,0.3); }
  html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0510; color: #fff; user-select: none; }

  /* ===== ЭКРАН МЕНЮ ===== */
  .title-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 40%, #2a1050 0%, #0a0418 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 20px;
    text-align: center;
    overflow-y: auto;
    z-index: 100;
    transition: opacity 0.3s;
  }
  .title-screen.hidden {
    display: none;
  }
  .title-screen h1 {
    font-size: 34px; letter-spacing: 3px; text-transform: uppercase;
    background: linear-gradient(135deg, #ffd24a 0%, #ff5c8a 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-bottom: 6px;
    font-weight: 900;
  }
  .title-screen .sub {
    font-size: 13px; letter-spacing: 3px; color: #a78bfa;
    margin-bottom: 24px; text-transform: uppercase;
  }
  .title-screen p {
    font-size: 13px; color: #b8b8d8; line-height: 1.6;
    max-width: 400px; margin-bottom: 12px;
  }
  .start-btn {
    display: block;
    padding: 18px 50px;
    margin-top: 24px;
    background: linear-gradient(135deg, #ffd24a, #ff5c8a);
    border: none;
    border-radius: 50px;
    color: #1a0a08;
    font-family: inherit;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 6px 0 #8a2a4a, 0 0 40px rgba(255, 92, 138, 0.4);
    position: relative;
    z-index: 101;
    touch-action: manipulation;
    -webkit-appearance: none;
  }
  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #8a2a4a;
  }

  /* ===== ИГРА ===== */
  #game {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }
  #game.show {
    display: flex;
  }
  #canvas {
    flex: 1;
    display: block;
    width: 100%;
    height: 100%;
    background: #1a0a20;
    touch-action: none;
  }

  /* HUD */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    background: linear-gradient(180deg, rgba(10,5,16,0.9) 0%, rgba(10,5,16,0) 100%);
    font-size: 12px; z-index: 10; gap: 6px; flex-wrap: wrap;
    pointer-events: none;
  }
  .hud .stat {
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.5);
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid #3a1a4a;
    font-weight: 700; letter-spacing: 0.5px;
  }
  .hud .hp { color: #ff5c8a; }
  .hud .pages { color: #5ecbff; }
  .hud .location { color: #a78bfa; }

  /* Панель оружия */
  .weapon-bar {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 6px;
    padding: 6px 10px;
    background: rgba(10, 5, 16, 0.85);
    border: 2px solid #3a1a4a;
    border-radius: 16px;
    z-index: 10;
    max-width: 95vw;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .weapon-bar::-webkit-scrollbar { display: none; }
  .weapon {
    flex-shrink: 0;
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #2a1030 0%, #1a0a20 100%);
    border: 2px solid #3a1a4a;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    touch-action: manipulation;
  }
  .weapon.selected {
    border-color: #ffd24a;
    box-shadow: 0 0 16px rgba(255,210,74,0.8);
    transform: translateY(-3px);
  }
  .weapon.locked { opacity: 0.3; cursor: not-allowed; }
  .weapon.locked::after {
    content: '🔒';
    position: absolute;
    font-size: 18px;
  }

  /* Джойстик */
  .joystick {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,210,74,0.08);
    border: 2px solid rgba(255,210,74,0.3);
    display: none;
    pointer-events: none;
    z-index: 20;
  }
  .joystick .knob {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255,210,74,0.4);
    border: 2px solid rgba(255,210,74,0.7);
  }

  /* Кнопка выстрела */
  .shoot-btn {
    position: absolute;
    bottom: 80px; right: 20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5c8a, #8a2a4a);
    border: 3px solid #ffd24a;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    z-index: 20;
    box-shadow: 0 0 30px rgba(255,92,138,0.6);
    cursor: pointer;
    touch-action: manipulation;
  }
  .shoot-btn:active { transform: scale(0.92); }

  /* Toast */
  .toast {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(20, 5, 15, 0.95);
    border: 3px solid #ffd24a;
    border-radius: 14px;
    padding: 16px 30px;
    font-size: 15px;
    font-weight: 800;
    color: #ffd24a;
    text-align: center;
    letter-spacing: 2px;
    z-index: 200;
    pointer-events: none;
    max-width: 80vw;
  }
  .toast.show { animation: toastPop 2s ease-out forwards; }
  @keyframes toastPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* Оверлей победы */
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 300;
    padding: 20px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 30px; letter-spacing: 3px; margin-bottom: 14px; color: #ffd24a; }
  .overlay h1.lose { color: #ff5c8a; }
  .overlay p { font-size: 14px; color: #c8c8dc; line-height: 1.6; max-width: 440px; margin-bottom: 20px; }
  .overlay button {
    padding: 14px 36px;
    background: linear-gradient(135deg, #ffd24a, #ff5c8a);
    border: none; border-radius: 40px;
    color: #1a0a08;
    font-family: inherit; font-size: 14px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 5px 0 #8a2a4a;
    margin: 4px;
    touch-action: manipulation;
  }
</style>
</head>
<body>

  <div class="title-screen" id="titleScreen">
    <h1>Гравити Фолз</h1>
    <div class="sub">Дневник №3</div>
    <p>Ты — Диппер Пайнс. Собирай страницы Дневника и отбивайся от монстров.</p>
    <button class="start-btn" id="startBtn" type="button">Играть</button>
  </div>

  <div id="game">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="stat hp"><span>❤️</span><span id="hudHp">100</span></div>
      <div class="stat pages"><span>📖</span><span id="hudPages">0 / 5</span></div>
      <div class="stat location"><span>📍</span><span id="hudLoc">Хижина Чудес</span></div>
    </div>
    <div class="weapon-bar" id="weaponBar"></div>
    <div class="joystick" id="joystick"><div class="knob" id="knob"></div></div>
    <button class="shoot-btn" id="shootBtn" type="button">💥</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="winOverlay">
    <h1 id="winTitle">🏆 Победа!</h1>
    <p id="winText"></p>
    <button onclick="restart()" type="button">Играть снова</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width || window.innerWidth;
      H = canvas.height = rect.height || window.innerHeight;
    }
    window.addEventListener('resize', resize);

    const WEAPONS = [
      { id: 'blaster', name: 'Бластер', emoji: '🔫', damage: 25, cooldown: 400, color: '#5ecbff', bulletSize: 5 },
      { id: 'gravity', name: 'Гравипушка', emoji: '🌀', damage: 15, cooldown: 800, color: '#a78bfa', bulletSize: 10 },
      { id: 'flame', name: 'Огнемёт', emoji: '🔥', damage: 8, cooldown: 100, color: '#ff8000', bulletSize: 6, short: true },
      { id: 'ice', name: 'Ледяная', emoji: '❄️', damage: 20, cooldown: 600, color: '#5ecbff', bulletSize: 7, slow: true },
      { id: 'rocket', name: 'Ракетница', emoji: '🚀', damage: 60, cooldown: 1200, color: '#ff5c8a', bulletSize: 12, explode: true }
    ];

    const ENEMY_TYPES = {
      gnome: { emoji: '👺', hp: 40, speed: 70, damage: 8, coins: 15, radius: 16 },
      vampire: { emoji: '🧛', hp: 80, speed: 90, damage: 12, coins: 30, radius: 18 },
      zombie: { emoji: '🧟‍♀️', hp: 120, speed: 60, damage: 15, coins: 50, radius: 20 },
      mummy: { emoji: '🧟', hp: 200, speed: 50, damage: 20, coins: 80, radius: 22 },
      water: { emoji: '🐙', hp: 350, speed: 55, damage: 25, coins: 130, radius: 26 },
      multibear: { emoji: '🐻', hp: 600, speed: 40, damage: 30, coins: 200, radius: 30 },
      gideon: { emoji: '🧙', hp: 800, speed: 50, damage: 25, coins: 300, radius: 28, isBoss: true },
      bill: { emoji: '👁️', hp: 3000, speed: 60, damage: 40, coins: 1000, radius: 36, isBoss: true }
    };

    const state = {
      player: { x: 0, y: 0, hp: 100, maxHp: 100, radius: 18, speed: 200, angle: 0 },
      enemies: [], bullets: [], pickups: [], particles: [],
      pages: 0, totalPages: 5,
      selectedWeapon: 0,
      unlocked: [true, false, false, false, false],
      keys: { w: 0, a: 0, s: 0, d: 0 },
      joystick: { active: false, cx: 0, cy: 0, dx: 0, dy: 0 },
      running: false, gameOver: false,
      lastTime: 0, lastShot: 0,
      location: 0,
      locations: [
        { name: 'Хижина Чудес', bg: '#2a1040', wall: '#4a2a6a' },
        { name: 'Тёмный лес', bg: '#0a2a0a', wall: '#1a5a1a' },
        { name: 'Озеро', bg: '#0a1a3a', wall: '#1a3a6a' },
        { name: 'Подземелье', bg: '#1a0a05', wall: '#3a1a0a' },
        { name: 'Комната Билла', bg: '#2a0000', wall: '#ff4040' }
      ],
      waveTimer: 0, waveCount: 0
    };

    function initGame() {
      setTimeout(() => {
        resize();
        state.player.x = W / 2;
        state.player.y = H / 2;
        state.player.hp = state.player.maxHp;
        state.enemies = []; state.bullets = []; state.pickups = []; state.particles = [];
        state.pages = 0;
        state.selectedWeapon = 0;
        state.unlocked = [true, false, false, false, false];
        state.location = 0;
        state.running = true;
        state.gameOver = false;
        state.lastTime = performance.now();
        state.waveTimer = 0;
        state.waveCount = 0;
        buildWeaponBar();
        updateHud();
        spawnPageOnMap();
        requestAnimationFrame(loop);
      }, 50);
    }

    function restart() {
      document.getElementById('winOverlay').classList.remove('show');
      initGame();
    }
    window.restart = restart;

    function buildWeaponBar() {
      const bar = document.getElementById('weaponBar');
      bar.innerHTML = '';
      WEAPONS.forEach((w, i) => {
        const el = document.createElement('div');
        el.className = 'weapon';
        if (!state.unlocked[i]) el.classList.add('locked');
        if (i === state.selectedWeapon) el.classList.add('selected');
        el.textContent = w.emoji;
        el.addEventListener('click', () => {
          if (!state.unlocked[i]) return;
          state.selectedWeapon = i;
          buildWeaponBar();
        });
        bar.appendChild(el);
      });
    }

    function updateHud() {
      document.getElementById('hudHp').textContent = Math.max(0, Math.round(state.player.hp));
      document.getElementById('hudPages').textContent = state.pages + ' / ' + state.totalPages;
      document.getElementById('hudLoc').textContent = state.locations[state.location].name;
    }

    function spawnEnemy(typeId) {
      const et = ENEMY_TYPES[typeId];
      let x, y;
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { x = -50; y = Math.random() * H; }
      else if (side === 1) { x = W + 50; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = -50; }
      else { x = Math.random() * W; y = H + 50; }
      state.enemies.push({
        type: typeId, x, y,
        hp: et.hp, maxHp: et.hp,
        speed: et.speed, damage: et.damage,
        radius: et.radius, coins: et.coins,
        slowUntil: 0, isBoss: !!et.isBoss, dead: false
      });
    }

    function spawnPageOnMap() {
      state.pickups.push({
        type: 'page',
        x: 80 + Math.random() * (W - 160),
        y: 80 + Math.random() * (H - 160),
        radius: 20, collected: false
      });
    }

    function spawnHealOnMap() {
      state.pickups.push({
        type: 'heal',
        x: 80 + Math.random() * (W - 160),
        y: 80 + Math.random() * (H - 160),
        radius: 18, collected: false
      });
    }

    function spawnCoinOnMap(x, y) {
      state.pickups.push({ type: 'coin', x, y, radius: 14, collected: false });
    }

    function loop(now) {
      if (!state.running) return;
      const dt = Math.min(50, now - state.lastTime) / 1000;
      state.lastTime = now;
      update(dt, now);
      draw();
      requestAnimationFrame(loop);
    }

    function update(dt, now) {
      const p = state.player;
      let dx = 0, dy = 0;
      if (state.keys.w) dy -= 1;
      if (state.keys.s) dy += 1;
      if (state.keys.a) dx -= 1;
      if (state.keys.d) dx += 1;
      if (state.joystick.active) {
        dx += state.joystick.dx;
        dy += state.joystick.dy;
      }
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      p.x += dx * p.speed * dt;
      p.y += dy * p.speed * dt;
      p.x = Math.max(p.radius, Math.min(W - p.radius, p.x));
      p.y = Math.max(p.radius, Math.min(H - p.radius, p.y));

      const nearest = findNearestEnemy();
      if (nearest) p.angle = Math.atan2(nearest.y - p.y, nearest.x - p.x);

      const w = WEAPONS[state.selectedWeapon];
      if (now - state.lastShot > w.cooldown && nearest) {
        shoot(nearest, w);
        state.lastShot = now;
      }

      state.bullets.forEach(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        for (const e of state.enemies) {
          if (e.hp <= 0) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
            e.hp -= b.damage;
            if (b.slow) e.slowUntil = now + 2000;
            if (b.explode) {
              state.enemies.forEach(e2 => {
                if (e2.hp <= 0) continue;
                if (Math.hypot(e2.x - b.x, e2.y - b.y) < 100) e2.hp -= b.damage;
              });
              for (let i = 0; i < 10; i++) {
                state.particles.push({
                  x: b.x, y: b.y,
                  vx: (Math.random() - 0.5) * 300,
                  vy: (Math.random() - 0.5) * 300,
                  life: 0.6, maxLife: 0.6, color: '#ff8000'
                });
              }
            }
            b.life = 0;
            break;
          }
        }
        if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) b.life = 0;
      });
      state.bullets = state.bullets.filter(b => b.life > 0);

      state.enemies.forEach(e => {
        if (e.hp <= 0) return;
        const dx2 = p.x - e.x;
        const dy2 = p.y - e.y;
        const d = Math.hypot(dx2, dy2);
        const slow = (e.slowUntil > now) ? 0.4 : 1;
        if (d > p.radius + e.radius - 4) {
          e.x += (dx2 / d) * e.speed * slow * dt;
          e.y += (dy2 / d) * e.speed * slow * dt;
        } else {
          p.hp -= e.damage * dt;
          if (p.hp <= 0) { p.hp = 0; updateHud(); endGame(false); return; }
        }
      });

      state.enemies.forEach(e => {
        if (e.hp <= 0 && !e.dead) {
          e.dead = true;
          if (Math.random() < 0.5) spawnCoinOnMap(e.x, e.y);
          if (e.isBoss && e.type === 'bill') { setTimeout(() => endGame(true), 100); }
        }
      });
      state.enemies = state.enemies.filter(e => !e.dead);

      state.pickups.forEach(pk => {
        if (pk.collected) return;
        if (Math.hypot(pk.x - p.x, pk.y - p.y) < p.radius + pk.radius) {
          pk.collected = true;
          if (pk.type === 'page') {
            state.pages++;
            unlockNextWeapon();
            showToast('📖 Страница ' + state.pages + ' / ' + state.totalPages);
            updateHud();
            if (state.pages < state.totalPages) {
              setTimeout(spawnPageOnMap, 500);
            } else {
              setTimeout(spawnBoss, 1500);
            }
          } else if (pk.type === 'heal') {
            p.hp = Math.min(p.maxHp, p.hp + 30);
            showToast('🍦 +30 HP!');
            updateHud();
          } else if (pk.type === 'coin') {
            showToast('🪙 +20');
          }
        }
      });
      state.pickups = state.pickups.filter(pk => !pk.collected);

      state.particles.forEach(pt => {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vx *= 0.96;
        pt.vy *= 0.96;
        pt.life -= dt;
      });
      state.particles = state.particles.filter(pt => pt.life > 0);

      state.waveTimer -= dt;
      if (state.waveTimer <= 0) {
        state.waveTimer = 3 + Math.random() * 2;
        state.waveCount++;
        const count = Math.min(3, 1 + Math.floor(state.waveCount / 5));
        for (let i = 0; i < count; i++) {
          const loc = state.location;
          let pool;
          if (loc === 0) pool = ['gnome', 'vampire'];
          else if (loc === 1) pool = ['gnome', 'vampire', 'zombie'];
          else if (loc === 2) pool = ['zombie', 'mummy', 'water'];
          else pool = ['mummy', 'water', 'multibear'];
          spawnEnemy(pool[Math.floor(Math.random() * pool.length)]);
        }
        if (Math.random() < 0.15) spawnHealOnMap();
      }
    }

    function findNearestEnemy() {
      let nearest = null, best = Infinity;
      state.enemies.forEach(e => {
        if (e.hp <= 0) return;
        const d = Math.hypot(e.x - state.player.x, e.y - state.player.y);
        if (d < best) { best = d; nearest = e; }
      });
      return nearest;
    }

    function shoot(target, w) {
      const p = state.player;
      const angle = Math.atan2(target.y - p.y, target.x - p.x);
      const speed = w.short ? 300 : 600;
      state.bullets.push({
        x: p.x, y: p.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage: w.damage,
        radius: w.bulletSize,
        color: w.color,
        slow: w.slow, explode: w.explode,
        life: w.short ? 0.3 : 1.5
      });
    }

    function unlockNextWeapon() {
      for (let i = 0; i < state.unlocked.length; i++) {
        if (!state.unlocked[i]) {
          state.unlocked[i] = true;
          showToast('🔫 Новое: ' + WEAPONS[i].name);
          buildWeaponBar();
          return;
        }
      }
    }

    function spawnBoss() {
      const loc = state.location;
      let bossType = 'gideon';
      if (loc === 3) bossType = 'multibear';
      else if (loc === 4) bossType = 'bill';
      const et = ENEMY_TYPES[bossType];
      state.enemies.push({
        type: bossType, x: W / 2, y: 80,
        hp: et.hp, maxHp: et.hp,
        speed: et.speed, damage: et.damage,
        radius: et.radius, coins: et.coins,
        slowUntil: 0, isBoss: true, dead: false
      });
      showToast('⚔️ БОСС: ' + bossType.toUpperCase() + '!');
    }

    function draw() {
      const loc = state.locations[state.location];
      ctx.fillStyle = loc.bg;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = loc.wall;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.3;
      for (let x = 0; x < W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      state.pickups.forEach(pk => {
        const bob = Math.sin(performance.now() / 200) * 3;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (pk.type === 'page') { ctx.font = '32px serif'; ctx.fillText('📖', pk.x, pk.y + bob); }
        else if (pk.type === 'heal') { ctx.font = '28px serif'; ctx.fillText('🍦', pk.x, pk.y + bob); }
        else if (pk.type === 'coin') { ctx.font = '22px serif'; ctx.fillText('🪙', pk.x, pk.y + bob); }
      });

      state.enemies.forEach(e => {
        const et = ENEMY_TYPES[e.type];
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(e.x, e.y + e.radius * 0.8, e.radius * 0.8, e.radius * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = (e.radius * 2.2) + 'px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(et.emoji, e.x, e.y);
        if (e.hp < e.maxHp) {
          const w = e.radius * 2;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(e.x - w/2, e.y - e.radius - 14, w, 6);
          ctx.fillStyle = e.isBoss ? '#ff2a6a' : '#6ee37c';
          ctx.fillRect(e.x - w/2, e.y - e.radius - 14, w * (e.hp / e.maxHp), 6);
        }
        if (e.isBoss) {
          ctx.strokeStyle = '#ffd24a';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 8, 0, Math.PI * 2); ctx.stroke();
        }
      });

      state.bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      });

      state.particles.forEach(pt => {
        ctx.globalAlpha = pt.life / pt.maxLife;
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;

      const p = state.player;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + p.radius * 0.8, p.radius * 0.9, p.radius * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '42px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🧢', p.x, p.y);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = WEAPONS[state.selectedWeapon].color;
      ctx.fillRect(10, -3, 22, 6);
      ctx.restore();
      if (p.hp < p.maxHp) {
        const w = 40;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(p.x - w/2, p.y - p.radius - 14, w, 5);
        ctx.fillStyle = '#ff5c8a';
        ctx.fillRect(p.x - w/2, p.y - p.radius - 14, w * (p.hp / p.maxHp), 5);
      }
    }

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'ц') state.keys.w = 1;
      if (k === 'a' || k === 'ф') state.keys.a = 1;
      if (k === 's' || k === 'ы') state.keys.s = 1;
      if (k === 'd' || k === 'в') state.keys.d = 1;
    });
    document.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'ц') state.keys.w = 0;
      if (k === 'a' || k === 'ф') state.keys.a = 0;
      if (k === 's' || k === 'ы') state.keys.s = 0;
      if (k === 'd' || k === 'в') state.keys.d = 0;
    });

    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('knob');

    function startJoystick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      state.joystick.active = true;
      state.joystick.cx = x;
      state.joystick.cy = y;
      state.joystick.dx = 0;
      state.joystick.dy = 0;
      joystick.style.left = (x - 60) + 'px';
      joystick.style.top = (y - 60) + 'px';
      joystick.style.display = 'block';
      knob.style.transform = 'translate(-50%, -50%)';
    }

    function moveJoystick(clientX, clientY) {
      if (!state.joystick.active) return;
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const dx = x - state.joystick.cx;
      const dy = y - state.joystick.cy;
      const len = Math.hypot(dx, dy);
      const maxLen = 50;
      const kx = len > maxLen ? (dx / len) * maxLen : dx;
      const ky = len > maxLen ? (dy / len) * maxLen : dy;
      knob.style.transform = 'translate(calc(-50% + ' + kx + 'px), calc(-50% + ' + ky + 'px))';
      state.joystick.dx = kx / maxLen;
      state.joystick.dy = ky / maxLen;
    }

    function endJoystick() {
      state.joystick.active = false;
      state.joystick.dx = 0;
      state.joystick.dy = 0;
      joystick.style.display = 'none';
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      startJoystick(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      moveJoystick(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); endJoystick(); }, { passive: false });

    canvas.addEventListener('mousedown', (e) => startJoystick(e.clientX, e.clientY));
    canvas.addEventListener('mousemove', (e) => { if (state.joystick.active) moveJoystick(e.clientX, e.clientY); });
    canvas.addEventListener('mouseup', endJoystick);
    canvas.addEventListener('mouseleave', endJoystick);

    document.getElementById('shootBtn').addEventListener('click', () => {
      const nearest = findNearestEnemy();
      if (nearest) shoot(nearest, WEAPONS[state.selectedWeapon]);
    });

    function endGame(won) {
      if (state.gameOver) return;
      state.gameOver = true;
      state.running = false;
      const overlay = document.getElementById('winOverlay');
      const title = document.getElementById('winTitle');
      const text = document.getElementById('winText');
      if (won) {
        title.textContent = '🏆 Победа!';
        title.classList.remove('lose');
        text.innerHTML = 'Ты собрал все страницы Дневника №3 и уничтожил Билла Шифра!';
      } else {
        title.textContent = '💀 Поражение';
        title.classList.add('lose');
        text.innerHTML = 'Монстры одолели Диппера.<br>Страниц собрано: ' + state.pages + ' из ' + state.totalPages;
      }
      overlay.classList.add('show');
    }

    // ===== СТАРТ ИГРЫ =====
    const startBtn = document.getElementById('startBtn');
    const titleScreen = document.getElementById('titleScreen');
    const gameEl = document.getElementById('game');

    function startGame() {
      titleScreen.classList.add('hidden');
      gameEl.classList.add('show');
      setTimeout(() => {
        resize();
        initGame();
      }, 100);
    }

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startGame();
    });

    function showToast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }
  </script>
</body>
</html>
