<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Этот тег нужен, чтобы на телефоне игра не масштабировалась криво -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хардкор: Убеги от кубов</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            touch-action: none; /* Отключаем скролл страницы при свайпах */
        }
        canvas {
            background-color: #111;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            max-width: 100%;
        }
        #game-over {
            position: absolute;
            color: red;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            display: none;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border: 2px solid red;
            border-radius: 10px;
            pointer-events: none;
        }
        
        /* Стили для кнопок на телефоне */
        #mobile-controls {
            display: none; /* По умолчанию скрыты (для компа) */
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .ctrl-btn {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background-color: rgba(255, 255, 255, 0.5);
        }

        /* Показываем кнопки, если открыто с телефона */
        @media (pointer: coarse) {
            #mobile-controls { display: flex; }
            h2 { display: none; } /* Прячем заголовок на телефоне, чтобы не мешал */
        }
    </style>
</head>
<body>

    <h2>Убегай от кубов! (Стрелочки или свайпы)</h2>
    
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div id="game-over">ТЫ ПОПАЛСЯ!<br><span style="font-size: 16px; color: white;">Нажми на экран для рестарта</span></div>

    <!-- Кнопки для телефона -->
    <div id="mobile-controls">
        <div class="ctrl-btn" id="btn-left">←</div>
        <div class="ctrl-btn" id="btn-right">→</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverText = document.getElementById('game-over');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const PLAYER_SPEED = 8;

        let player = { x: 275, y: 350, w: 50, h: 50, color: "#00ffff" };
        let enemies = [];
        let score = 0;
        let isGameOver = false;
        let moveLeft = false;
        let moveRight = false;
        let difficultyTimer = 0;

        // --- УПРАВЛЕНИЕ С КОМПЬЮТЕРА ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = true;
            if (e.key === 'ArrowRight') moveRight = true;
            if (e.key === ' ' && isGameOver) restartGame();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = false;
            if (e.key === 'ArrowRight') moveRight = false;
        });

        // --- УПРАВЛЕНИЕ НА ТЕЛЕФОНЕ (Кнопки) ---
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
        
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });

        // --- УПРАВЛЕНИЕ НА ТЕЛЕФОНЕ (Свайпы) ---
        let touchStartX = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Чтобы экран не скроллился
            let touchX = e.touches[0].clientX;
            if (touchX < touchStartX - 10) moveLeft = true; // Свайп влево
            if (touchX > touchStartX + 10) moveRight = true; // Свайп вправо
        }, {passive: false});

        canvas.addEventListener('touchend', () => {
            moveLeft = false;
            moveRight = false;
        });

        // Рестарт по тапу на экран (для телефона)
        canvas.addEventListener('click', () => {
            if (isGameOver) restartGame();
        });

        // --- ЛОГИКА ИГРЫ ---
        function spawnEnemy() {
            let sizeType = Math.random() < 0.5 ? 0 : 1; 
            let size = sizeType === 0 ? 25 : 60;
            let speed = sizeType === 0 ? Math.random() * 3 + 6 : Math.random() * 2 + 3;
            speed += (score * 0.2); 
            let x = Math.random() * (WIDTH - size);
            let y = -size;
            let color = sizeType === 0 ? "#ff3333" : "#ff8800";
            enemies.push({ x: x, y: y, w: size, h: size, speed: speed, color: color });
        }

        function update() {
            if (isGameOver) return;

            if (moveLeft && player.x > 0) player.x -= PLAYER_SPEED;
            if (moveRight && player.x < WIDTH - player.w) player.x += PLAYER_SPEED;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                if (e.y > HEIGHT) {
                    enemies.splice(i, 1);
                    score++;
                }
                else if (player.x < e.x + e.w && player.x + player.w > e.x &&
                         player.y < e.y + e.h && player.y + player.h > e.y) {
                    isGameOver = true;
                    gameOverText.style.display = 'block';
                    return;
                }
            }

            difficultyTimer++;
            if (difficultyTimer > 30) {
                difficultyTimer = 0;
                let spawnChance = 0.4 + (score * 0.03);
                if (Math.random() < spawnChance) {
                    spawnEnemy();
                    if (score > 10 && Math.random() < 0.3) spawnEnemy();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);

            for (let e of enemies) {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
            }

            ctx.fillStyle = "white";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Счет: " + score, 20, 30);
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            player = { x: 275, y: 350, w: 50, h: 50, color: "#00ffff" };
            enemies = [];
            score = 0;
            isGameOver = false;
            difficultyTimer = 0;
            gameOverText.style.display = 'none';
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
