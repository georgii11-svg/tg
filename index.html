<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 5.8</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18232a;font-family:Arial,sans-serif;color:white;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:10px;z-index:3;background:#101820d9;padding:10px 12px;border:1px solid #ffffff35;border-radius:12px;font-size:14px;line-height:1.6;min-width:145px}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:4;background:#101820e8;padding:10px 15px;border-radius:10px;text-align:center;max-width:85%;font-weight:bold;pointer-events:none}
#hint{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:3;background:#101820c9;padding:8px 12px;border-radius:9px;text-align:center;font-size:12px;max-width:90%;pointer-events:none}
#controls{position:fixed;inset:0;z-index:2;pointer-events:none}
#joy{position:absolute;left:22px;bottom:20px;width:112px;height:112px;border-radius:50%;border:2px solid #ffffff66;background:#10182055;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#ffffff99;border:2px solid #fff}
#buttons{position:absolute;right:12px;bottom:15px;display:grid;grid-template-columns:repeat(2,78px);gap:8px;pointer-events:auto}
button{border:1px solid #ffffff55;border-radius:12px;background:#182a37eF;color:white;font-weight:bold;padding:12px 7px;font-size:12px;min-height:43px;touch-action:manipulation}
button:active{background:#376079}
#panel{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);max-height:80vh;overflow:auto;background:#111d27f5;border:1px solid #ffffff55;border-radius:16px;padding:17px;box-shadow:0 10px 45px #000a}
#panel h2{margin:0 0 12px}
#panel button{width:100%;margin:4px 0}
#close{background:#693a3a}
#carhud,#jailhud{display:none}
#version{position:fixed;right:8px;top:8px;color:#ffffff77;font-size:10px;z-index:1}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="version">GOB CITY 5.8</div>
<div id="hud">
  <div>💵 Деньги: $<span id="money">340</span></div>
  <div>❤️ Здоровье: <span id="hp">100</span></div>
  <div>🔫 Патроны: <span id="ammo">0</span></div>
  <div>🚨 Розыск: <span id="wanted">0</span></div>
  <div id="carhud">🚗 За рулём</div>
  <div id="jailhud">🔒 Ты в тюрьме</div>
</div>
<div id="msg">Добро пожаловать в GOB CITY!</div>
<div id="hint">WASD / стрелки — движение · E — машина · F — стрелять · M — магазин · Q — задания</div>
<div id="controls">
  <div id="joy"><div id="stick"></div></div>
  <div id="buttons">
    <button id="enter">🚗 МАШИНА</button>
    <button id="action">✊ ДЕЙСТВИЕ</button>
    <button id="shootbtn">🔫 ОГОНЬ</button>
    <button id="shopbtn">🛒 МАГАЗИН</button>
    <button id="missionbtn" style="grid-column:span 2">📋 ЗАДАНИЯ</button>
  </div>
</div>
<div id="panel">
  <h2 id="panelTitle">Магазин</h2>
  <div id="panelContent"></div>
  <button id="close">ЗАКРЫТЬ</button>
</div>

<script>
"use strict";

const cv=document.getElementById("game");
const ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);

let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
  W=innerWidth;H=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

const world={w:4800,h:4000};
const player={
  x:390,y:330,hp:100,money:340,ammo:0,
  gun:false,lockpick:false,car:null,dir:0
};
const shop={x:1350,y:1280,w:180,h:150};
const station={x:4200,y:300,w:240,h:180};
const prison={x:4000,y:3250,w:350,h:300};

let wanted=0,policeAlert=false,jailed=false,escapeProgress=0;
let people=[],cars=[],cops=[],gang=[],bullets=[],keys={};
let joy={x:0,y:0,on:false},mission=null,trafficTime=0;
let msgTime=4,last=performance.now(),damageTimer=0,crashCooldown=0;
let camera={x:0,y:0};

function say(s){$("msg").textContent=s;msgTime=4}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function near(a,b,r){return dist(a,b)<r}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rectContains(x,y,b,p=0){
  return x>b.x-p&&x<b.x+b.w+p&&y>b.y-p&&y<b.y+b.h+p;
}
function circleRect(x,y,r,b){
  const px=clamp(x,b.x,b.x+b.w);
  const py=clamp(y,b.y,b.y+b.h);
  return Math.hypot(x-px,y-py)<r;
}

const roads=[];
for(let y=300;y<world.h;y+=400)
  roads.push({x:0,y,w:world.w,h:100,dir:"h"});
for(let x=350;x<world.w;x+=400)
  roads.push({x,y:0,w:100,h:world.h,dir:"v"});

const buildings=[];
for(let x=50;x<world.w-200;x+=400){
  for(let y=50;y<world.h-200;y+=400){
    if(Math.random()<.15)continue;
    const b={
      x:x+20,y:y+20,w:170,h:175,
      color:["#b7a58a","#9babb0","#b8ad9c","#a1aa8b"][Math.floor(Math.random()*4)]
    };
    if(near({x:b.x+b.w/2,y:b.y+b.h/2},{x:shop.x,y:shop.y},250))continue;
    if(near({x:b.x+b.w/2,y:b.y+b.h/2},{x:prison.x,y:prison.y},280))continue;
    buildings.push(b);
  }
}

function blocked(x,y){
  if(x<12||y<12||x>world.w-12||y>world.h-12)return true;
  if(jailed){
    return x<prison.x+14||x>prison.x+prison.w-14||
           y<prison.y+14||y>prison.y+prison.h-14;
  }
  if(buildings.some(b=>circleRect(x,y,12,b)))return true;
  if(rectContains(x,y,shop,4))return true;
  return false;
}

const lights=[];
for(let x=400;x<world.w;x+=400){
  for(let y=300;y<world.h;y+=400){
    lights.push({x:x+50,y:y+50,phase:Math.random()*7.5});
  }
}

for(let i=0;i<65;i++){
  const p={x:Math.random()*world.w,y:Math.random()*world.h};
  if(!roads.some(r=>rectContains(p.x,p.y,r))&&
     !buildings.some(b=>rectContains(p.x,p.y,b))&&
     !rectContains(p.x,p.y,shop)&&
     !rectContains(p.x,p.y,prison)){
    people.push({...p,hp:100,alive:true,gang:false,dir:Math.random()*6.28});
  }
}

const colors=["#db4d45","#e2bc46","#4f9ed0","#eeeeee","#59a76c","#9276bd"];
for(let i=0;i<34;i++){
  const horizontal=Math.random()<.55;
  const lanes=roads.filter(r=>r.dir===(horizontal?"h":"v"));
  const r=lanes[Math.floor(Math.random()*lanes.length)];
  cars.push({
    x:horizontal?Math.random()*world.w:r.x+25,
    y:horizontal?r.y+30+Math.random()*40:Math.random()*world.h,
    w:horizontal?46:25,h:horizontal?25:46,
    horizontal,dir:Math.random()<.5?-1:1,
    speed:65+Math.random()*45,
    color:colors[i%colors.length],
    stopped:false,occupied:false,hp:100,police:false,
    driver:true,kind:"civilian",crashWait:0
  });
}

function callPolice(reason){
  wanted=Math.min(5,wanted+1);
  if(!policeAlert){
    policeAlert=true;
    for(let i=0;i<2;i++){
      cops.push({
        x:player.x+(i?180:-180),y:player.y-180,
        w:46,h:25,horizontal:true,dir:1,speed:125,
        color:"#f0f0f0",police:true,hp:180,
        occupied:false,mode:"chase",
        officer:{hp:100,alive:true,onFoot:false,x:0,y:0},
        shootTimer:1.5,arrestTimer:0,alive:true,stopped:false,
        crashWait:0
      });
    }
    say("🚨 Полиция вызвана! "+(reason||""));
  }else{
    say("🚨 Розыск повышен! "+(reason||""));
  }
  $("wanted").textContent=wanted;
}

function nearestCar(){
  let best=null,bd=Infinity;
  for(const c of cars.concat(cops)){
    if(c.hp<=0)continue;
    const d=dist(player,c);
    if(d<bd){bd=d;best=c;}
  }
  return best?{car:best,d:bd}:null;
}
function nearestPerson(){
  let best=null,bd=Infinity;
  for(const p of people.concat(gang)){
    if(!p.alive)continue;
    const d=dist(player,p);
    if(d<bd){bd=d;best=p;}
  }
  return best?{person:best,d:bd}:null;
}

function openPanel(title,html){
  $("panelTitle").textContent=title;
  $("panelContent").innerHTML=html;
  $("panel").style.display="block";
}
function closePanel(){$("panel").style.display="none"}
$("close").addEventListener("click",closePanel);

function shopOpen(){
  openPanel("🛒 Магазин",`
    <button data-buy="gun">🔫 Купить пистолет — $250</button>
    <button data-buy="ammo">📦 Купить 12 патронов — $90</button>
    <button data-buy="med">❤️ Аптечка (+40 HP) — $80</button>
    <button data-buy="lockpick">🔑 Отмычка — $160</button>
  `);
  $("panelContent").querySelectorAll("[data-buy]").forEach(b=>{
    b.addEventListener("click",()=>{
      const type=b.dataset.buy;
      if(type==="gun"){
        if(player.gun){say("Пистолет уже куплен.");return;}
        if(player.money<250){say("Не хватает денег!");return;}
        player.money-=250;player.gun=true;
        say("Пистолет куплен!");
      }else if(type==="ammo"){
        if(player.money<90){say("Не хватает денег!");return;}
        player.money-=90;player.ammo+=12;
        say("Куплено 12 патронов.");
      }else if(type==="med"){
        if(player.money<80){say("Не хватает денег!");return;}
        if(player.hp>=100){say("Здоровье уже полное.");return;}
        player.money-=80;player.hp=Math.min(100,player.hp+40);
        say("Здоровье восстановлено.");
      }else if(type==="lockpick"){
        if(player.lockpick){say("Отмычка уже есть.");return;}
        if(player.money<160){say("Не хватает денег!");return;}
        player.money-=160;player.lockpick=true;
        say("Отмычка куплена. Она поможет сбежать из тюрьмы.");
      }
      hud();
    });
  });
}

function enterExit(){
  if(jailed){say("Сначала выберись из тюрьмы!");return;}
  if(player.car){
    const c=player.car;
    c.occupied=false;c.stopped=true;
    player.x=c.x+24;player.y=c.y+18;
    player.car=null;
    say("Ты вышел из машины.");
    hud();
    return;
  }
  if(near(player,{x:shop.x+shop.w/2,y:shop.y+shop.h/2},180)){
    say("Ты рядом с магазином. Нажми МАГАЗИН.");
    return;
  }
  const n=nearestCar();
  if(!n||n.d>70){say("Рядом нет машины.");return;}
  const c=n.car;
  if(c.police&&c.hp>0){say("Нельзя сесть в полицейскую машину!");return;}
  if(c.hp<=0){say("Машина разбита.");return;}
  if(c.stopped===false){
    c.stopped=true;
    say("Машина остановлена. Нажми МАШИНА ещё раз.");
    return;
  }
  if(c.driver){
    callPolice("Угон автомобиля!");
    c.driver=false;
  }
  c.occupied=true;
  player.car=c;
  player.x=c.x+c.w/2;player.y=c.y+c.h/2;
  say("Ты за рулём!");
  hud();
}

function tryEscape(){
  if(!near(player,{x:prison.x+prison.w/2,y:prison.y+prison.h-5},85)){
    say("Подойди к воротам тюрьмы.");
    return;
  }
  if(!player.lockpick){say("Нужна отмычка из магазина!");return;}
  escapeProgress++;
  say("Вскрываешь замок: "+escapeProgress+"/3");
  if(escapeProgress>=3){
    jailed=false;escapeProgress=0;
    player.x=prison.x+prison.w/2;
    player.y=prison.y+prison.h+35;
    wanted=Math.max(1,wanted);
    policeAlert=false;
    callPolice("Побег из тюрьмы!");
    hud();
  }
}

function action(){
  if(jailed){tryEscape();return;}
  const n=nearestPerson();
  if(n&&n.d<55){
    const p=n.person;
    if(p.gang){
      p.hp-=35;
      if(p.hp<=0){
        p.alive=false;player.money+=25;
        say("Бандит побеждён! +$25");
      }else say("Ты ударил бандита!");
    }else{
      say("Прохожий испугался и убежал.");
      p.dir=Math.random()*6.28;
    }
    hud();
    return;
  }
  if(near(player,{x:shop.x+shop.w/2,y:shop.y+shop.h/2},220)){
    shopOpen();return;
  }
  say("Здесь нечего делать.");
}

function shoot(){
  if(jailed){say("В тюрьме нельзя стрелять.");return;}
  if(!player.gun){say("Сначала купи пистолет в магазине.");return;}
  if(player.ammo<=0){say("Нет патронов!");return;}
  player.ammo--;
  const targets=people.concat(gang).filter(p=>p.alive)
    .concat(cops.filter(c=>c.hp>0))
    .concat(cops.map(c=>c.officer).filter(o=>o.alive&&o.onFoot))
    .concat(cars.filter(c=>c.hp>0&&!c.police));
  let target=null,bd=300;
  for(const t of targets){
    const d=dist(player,t);
    if(d<bd){bd=d;target=t;}
  }
  if(!target){say("Никого в радиусе выстрела.");hud();return;}
  if(target.officer!==undefined){
    target.hp-=55;
    callPolice("Нападение на полицию!");
    if(target.hp<=0){target.alive=false;say("Офицер выведен из строя!");}
  }else if(target.police!==undefined&&target.police){
    target.hp-=55;
    callPolice("Стрельба по полиции!");
    if(target.hp<=0){
      target.alive=false;
      if(target.officer)target.officer.alive=false;
      say("Полицейская машина разбита!");
    }
  }else if(target.gang!==undefined){
    target.hp-=55;
    if(target.hp<=0){
      target.alive=false;player.money+=25;
      say("Бандит устранён! +$25");
    }else say("Попадание!");
  }else if(target.kind==="civilian"){
    target.hp-=55;
    callPolice("Стрельба по автомобилю!");
    if(target.hp<=0){
      target.stopped=true;target.driver=false;
      say("Машина разбита!");
    }else say("Попадание по машине!");
  }else{
    target.hp-=55;
    callPolice("Нападение на прохожего!");
    if(target.hp<=0){target.alive=false;say("Цель повержена.");}
  }
  hud();
}

function arrestPlayer(){
  jailed=true;player.car=null;
  cops=[];wanted=0;policeAlert=false;
  player.x=prison.x+prison.w/2;
  player.y=prison.y+prison.h/2;
  player.hp=Math.max(40,player.hp);
  say("Тебя арестовали! Чтобы сбежать, нужна отмычка.");
  hud();
}

function startMission(){
  openPanel("📋 Задания",`
    <button data-mission="delivery">📦 Доставка — награда $150</button>
    <button data-mission="gang">👊 Разобраться с бандой — $250</button>
    <button data-mission="drive">🚗 Проехать дистанцию — $120</button>
  `);
  $("panelContent").querySelectorAll("[data-mission]").forEach(b=>{
    b.addEventListener("click",()=>missionStart(b.dataset.mission));
  });
}

function missionStart(type){
  closePanel();
  if(mission){say("Сначала закончи текущее задание!");return;}
  if(type==="delivery"){
    mission={type,target:{x:station.x+120,y:station.y+100},reward:150};
    say("Доставка: доберись до полицейского участка.");
  }else if(type==="gang"){
    const target={x:clamp(player.x+300,200,world.w-200),y:clamp(player.y+200,200,world.h-200)};
    for(let i=0;i<5;i++){
      gang.push({
        x:target.x+Math.random()*100-50,
        y:target.y+Math.random()*100-50,
        hp:100,alive:true,gang:true,dir:0
      });
    }
    mission={type,target,reward:250};
    say("Задание: победи пятерых бандитов.");
  }else if(type==="drive"){
    mission={type,target:{x:player.x,y:player.y},reward:120,distance:0};
    say("Задание: проедь 1200 метров на машине.");
  }
}

function checkMission(){
  if(!mission)return;
  if(mission.type==="delivery"&&near(player,mission.target,55)){
    finishMission("Доставка выполнена!");
  }else if(mission.type==="gang"&&gang.filter(p=>p.alive).length===0){
    finishMission("Банда побеждена!");
  }else if(mission.type==="drive"&&mission.distance>=1200){
    finishMission("Дистанция пройдена!");
  }
}
function finishMission(text){
  player.money+=mission.reward;
  say(text+" +$"+mission.reward);
  mission=null;hud();
}

function update(dt){
  trafficTime+=dt;
  crashCooldown=Math.max(0,crashCooldown-dt);
  if(msgTime>0)msgTime-=dt;
  $("msg").style.opacity=msgTime>0?"1":"0.5";

  let mx=0,my=0;
  if(keys["w"]||keys["arrowup"])my--;
  if(keys["s"]||keys["arrowdown"])my++;
  if(keys["a"]||keys["arrowleft"])mx--;
  if(keys["d"]||keys["arrowright"])mx++;
  mx+=joy.x;my+=joy.y;
  const len=Math.hypot(mx,my);
  if(len>1){mx/=len;my/=len;}

  if(player.car){
    const c=player.car;
    if(!jailed){
      const speed=235;
      const nx=c.x+mx*speed*dt;
      const ny=c.y+my*speed*dt;
      c.horizontal=Math.abs(mx)>=Math.abs(my);
      if(c.horizontal){
        if(!blocked(nx+c.w/2,c.y+c.h/2))c.x=clamp(nx,0,world.w-c.w);
      }else{
        if(!blocked(c.x+c.w/2,ny+c.h/2))c.y=clamp(ny,0,world.h-c.h);
      }
      player.x=c.x+c.w/2;player.y=c.y+c.h/2;
      if(mission&&mission.type==="drive"&&len>0){
        mission.distance+=speed*dt;
      }

      // Авария: столкновение машины игрока с другими машинами.
      if(len>0&&crashCooldown<=0){
        for(const other of cars.concat(cops)){
          if(other===c||other.hp<=0)continue;
          const ax=c.x+c.w/2,ay=c.y+c.h/2;
          const bx=other.x+other.w/2,by=other.y+other.h/2;
          const hit=Math.abs(ax-bx)<(c.w+other.w)/2-3&&
                    Math.abs(ay-by)<(c.h+other.h)/2-3;
          if(hit){
            c.hp=Math.max(0,c.hp-20);
            other.hp=Math.max(0,other.hp-25);
            c.stopped=true;other.stopped=true;
            c.crashWait=1.2;other.crashWait=1.2;
            crashCooldown=1.5;
            say("💥 АВАРИЯ! Машины столкнулись!");
            if(c.hp<=0){
              c.occupied=false;player.car=null;
              player.x=c.x+c.w+10;player.y=c.y+c.h+10;
              say("💥 Твоя машина разбита!");
            }
            break;
          }
        }
      }
    }
  }else{
    const speed=175;
    const nx=player.x+mx*speed*dt;
    const ny=player.y+my*speed*dt;
    if(!blocked(nx,player.y))player.x=clamp(nx,12,world.w-12);
    if(!blocked(player.x,ny))player.y=clamp(ny,12,world.h-12);
    if(len>0)player.dir=Math.atan2(my,mx);
  }

  if(jailed){
    player.x=clamp(player.x,prison.x+14,prison.x+prison.w-14);
    player.y=clamp(player.y,prison.y+14,prison.y+prison.h-14);
  }

  for(const c of cars){
    c.crashWait=Math.max(0,(c.crashWait||0)-dt);
    if(c.hp<=0||c.occupied||c.stopped)continue;
    if(c.horizontal)c.x+=c.dir*c.speed*dt;
    else c.y+=c.dir*c.speed*dt;
    if(c.x>world.w+60)c.x=-60;
    if(c.x<-60)c.x=world.w+60;
    if(c.y>world.h+60)c.y=-60;
    if(c.y<-60)c.y=world.h+60;
  }

  for(const p of people){
    if(!p.alive)continue;
    p.x+=Math.cos(p.dir)*18*dt;
    p.y+=Math.sin(p.dir)*18*dt;
    if(Math.random()<.01)p.dir=Math.random()*Math.PI*2;
    p.x=clamp(p.x,20,world.w-20);
    p.y=clamp(p.y,20,world.h-20);
  }

  for(const p of gang){
    if(!p.alive)continue;
    const d=dist(p,player);
    if(d<350){
      const a=Math.atan2(player.y-p.y,player.x-p.x);
      p.x+=Math.cos(a)*65*dt;
      p.y+=Math.sin(a)*65*dt;
      if(d<35&&damageTimer<=0){
        player.hp-=5;damageTimer=.8;
        say("Бандит атакует!");
      }
    }
  }
  damageTimer=Math.max(0,damageTimer-dt);

  for(const c of cops){
    if(c.hp<=0||!c.alive)continue;
    c.crashWait=Math.max(0,(c.crashWait||0)-dt);
    if(c.mode==="chase"){
      const d=dist(c,player);
      const a=Math.atan2(player.y-c.y,player.x-c.x);
      c.x+=Math.cos(a)*c.speed*dt;
      c.y+=Math.sin(a)*c.speed*dt;
      c.horizontal=Math.abs(Math.cos(a))>=Math.abs(Math.sin(a));
      if(d<48){
        c.mode="arrest";
        c.officer.x=c.x;c.officer.y=c.y+20;
        c.officer.onFoot=true;
        c.arrestTimer=0;
      }
      c.shootTimer-=dt;
      if(d<270&&c.shootTimer<=0){
        player.hp-=4;c.shootTimer=2;
        say("Полиция стреляет!");
      }
    }else if(c.mode==="arrest"&&c.officer.alive){
      const o=c.officer;
      const d=dist(o,player);
      const a=Math.atan2(player.y-o.y,player.x-o.x);
      o.x+=Math.cos(a)*95*dt;
      o.y+=Math.sin(a)*95*dt;
      if(d<25)c.arrestTimer+=dt;
      else c.arrestTimer=0;
      if(c.arrestTimer>1.8){arrestPlayer();break;}
    }
  }

  if(player.hp<=0)arrestPlayer();
  checkMission();

  if(player.car){
    $("carhud").style.display="block";
  }else{
    $("carhud").style.display="none";
  }
  $("jailhud").style.display=jailed?"block":"none";
  hud();
}

function drawWorld(){
  ctx.fillStyle="#657b58";
  ctx.fillRect(0,0,world.w,world.h);

  for(let i=0;i<world.w;i+=100){
    for(let j=0;j<world.h;j+=100){
      ctx.fillStyle=((i+j)/100)%2===0?"#687e5b":"#637856";
      ctx.fillRect(i,j,100,100);
    }
  }

  for(const r of roads){
    ctx.fillStyle="#42484b";
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle="#d7cda0";
    if(r.dir==="h"){
      for(let x=r.x;x<r.x+r.w;x+=60)ctx.fillRect(x,r.y+r.h/2-2,30,4);
    }else{
      for(let y=r.y;y<r.y+r.h;y+=60)ctx.fillRect(r.x+r.w/2-2,y,4,30);
    }
  }

  for(const b of buildings){
    ctx.fillStyle="#0003";
    ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="#747c80";
    ctx.fillRect(b.x,b.y,b.w,9);
    for(let wx=b.x+14;wx<b.x+b.w-12;wx+=35){
      for(let wy=b.y+22;wy<b.y+b.h-12;wy+=35){
        ctx.fillStyle="#455c67";
        ctx.fillRect(wx,wy,17,19);
        ctx.fillStyle="#9ec5cc";
        ctx.fillRect(wx+2,wy+2,13,3);
      }
    }
  }

  // Магазин
  ctx.fillStyle="#6e5039";
  ctx.fillRect(shop.x,shop.y,shop.w,shop.h);
  ctx.fillStyle="#f3d55b";
  ctx.fillRect(shop.x-5,shop.y-14,shop.w+10,22);
  ctx.fillStyle="#242424";
  ctx.font="bold 19px Arial";
  ctx.textAlign="center";
  ctx.fillText("МАГАЗИН",shop.x+shop.w/2,shop.y+2);
  ctx.fillStyle="#8cc4d2";
  ctx.fillRect(shop.x+20,shop.y+35,50,45);
  ctx.fillRect(shop.x+110,shop.y+35,50,45);
  ctx.fillStyle="#45392d";
  ctx.fillRect(shop.x+75,shop.y+90,32,60);

  // Полицейский участок
  ctx.fillStyle="#aeb7bd";
  ctx.fillRect(station.x,station.y,station.w,station.h);
  ctx.fillStyle="#435563";
  ctx.fillRect(station.x+12,station.y+12,station.w-24,35);
  ctx.fillStyle="#e7e7e7";
  ctx.font="bold 17px Arial";
  ctx.fillText("POLICE",station.x+station.w/2,station.y+36);
  ctx.fillStyle="#597d91";
  ctx.fillRect(station.x+20,station.y+65,55,55);
  ctx.fillRect(station.x+160,station.y+65,55,55);
  ctx.fillStyle="#544c42";
  ctx.fillRect(station.x+100,station.y+110,40,70);

  // Тюрьма
  ctx.fillStyle="#777b7d";
  ctx.fillRect(prison.x,prison.y,prison.w,prison.h);
  ctx.fillStyle="#4b5155";
  ctx.fillRect(prison.x+15,prison.y+15,prison.w-30,prison.h-30);
  ctx.fillStyle="#aeb4b7";
  for(let x=prison.x+30;x<prison.x+prison.w-15;x+=25){
    ctx.fillRect(x,prison.y+30,5,prison.h-60);
  }
  ctx.fillStyle="#e0d6b7";
  ctx.font="bold 18px Arial";
  ctx.fillText("ТЮРЬМА",prison.x+prison.w/2,prison.y-10);
  ctx.fillStyle="#aeb4b7";
  ctx.fillRect(prison.x+prison.w/2-30,prison.y+prison.h-15,60,20);

  // Светофоры: форма и графика прежние, активный сигнал яркий.
  for(const l of lights){
    const phase=((trafficTime+l.phase)%7.5);
    const active=phase<3?"red":phase<4.5?"yellow":"green";

    ctx.fillStyle="#343a3d";
    ctx.fillRect(l.x-4,l.y-15,13,35);
    ctx.fillStyle="#25292b";
    ctx.fillRect(l.x-2,l.y-13,9,30);

    ctx.fillStyle=active==="red"?"#ff3939":"#632c2c";
    ctx.beginPath();
    ctx.arc(l.x+2,l.y-8,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=active==="yellow"?"#ffdb35":"#66572a";
    ctx.beginPath();
    ctx.arc(l.x+2,l.y,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=active==="green"?"#3fff78":"#294b35";
    ctx.beginPath();
    ctx.arc(l.x+2,l.y+8,3,0,Math.PI*2);
    ctx.fill();
  }
}

function drawCar(c){
  ctx.save();
  ctx.translate(c.x+c.w/2,c.y+c.h/2);
  if(!c.horizontal)ctx.rotate(Math.PI/2);
  ctx.fillStyle="#0005";
  ctx.fillRect(-c.w/2+2,-c.h/2+3,c.w,c.h);
  ctx.fillStyle=c.police?"#f0f0f0":c.color;
  ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
  ctx.fillStyle="#252d33";
  ctx.fillRect(-c.w/2+9,-c.h/2+3,c.w-18,c.h-6);
  ctx.fillStyle="#91c2d0";
  ctx.fillRect(-c.w/2+12,-c.h/2+4,8,c.h-8);
  ctx.fillRect(c.w/2-20,-c.h/2+4,8,c.h-8);
  ctx.fillStyle="#16191b";
  ctx.fillRect(-c.w/2+5,-c.h/2-2,8,4);
  ctx.fillRect(c.w/2-13,-c.h/2-2,8,4);
  ctx.fillRect(-c.w/2+5,c.h/2-2,8,4);
  ctx.fillRect(c.w/2-13,c.h/2-2,8,4);
  if(c.police){
    ctx.fillStyle="#287bff";
    ctx.fillRect(-5,-c.h/2-2,8,4);
    ctx.fillStyle="#ff3333";
    ctx.fillRect(3,-c.h/2-2,8,4);
  }
  if(c.hp<=0){
    ctx.fillStyle="#292929";
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.fillStyle="#555";
    ctx.fillRect(-c.w/2+5,-c.h/2+4,c.w-10,c.h-8);
  }
  ctx.restore();
}

function drawPerson(p){
  if(!p.alive)return;
  ctx.fillStyle=p.gang?"#a22d35":"#e0b18a";
  ctx.beginPath();
  ctx.arc(p.x,p.y,8,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle=p.gang?"#35222a":"#3d6480";
  ctx.fillRect(p.x-6,p.y+6,12,13);
}

function drawOfficer(o){
  if(!o.alive||!o.onFoot)return;
  ctx.fillStyle="#233f77";
  ctx.beginPath();ctx.arc(o.x,o.y,8,0,Math.PI*2);ctx.fill();
  ctx.fillRect(o.x-6,o.y+6,12,13);
}

function drawPlayer(){
  if(player.car)return;
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.dir);
  ctx.fillStyle="#0005";
  ctx.beginPath();ctx.ellipse(2,5,10,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f0c59c";
  ctx.beginPath();ctx.arc(0,-4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#397fc0";
  ctx.fillRect(-7,2,14,15);
  ctx.fillStyle="#20242a";
  ctx.fillRect(-6,15,5,7);ctx.fillRect(2,15,5,7);
  ctx.restore();
}

function drawMission(){
  if(!mission)return;
  const t=mission.target;
  ctx.strokeStyle="#ffe34e";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(t.x,t.y,22+Math.sin(trafficTime*4)*4,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle="#ffe34e";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText("ЦЕЛЬ",t.x,t.y-30);
}

function drawMinimap(){
  const mw=125,mh=100,x=W-mw-10,y=45;
  ctx.fillStyle="#101820c9";
  ctx.fillRect(x,y,mw,mh);
  ctx.strokeStyle="#ffffff55";
  ctx.strokeRect(x,y,mw,mh);

  ctx.fillStyle="#555d60";
  for(const r of roads){
    if(r.dir==="h")ctx.fillRect(x,y+r.y/world.h*mh,mw,3);
    else ctx.fillRect(x+r.x/world.w*mw,y,3,mh);
  }

  ctx.fillStyle="#ffe34e";
  ctx.beginPath();
  ctx.arc(x+player.x/world.w*mw,y+player.y/world.h*mh,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#e34b4b";
  for(const c of cops){
    if(c.hp<=0)continue;
    ctx.fillRect(x+c.x/world.w*mw-2,y+c.y/world.h*mh-2,4,4);
  }

  if(mission){
    ctx.fillStyle="#4cff9b";
    ctx.fillRect(
      x+mission.target.x/world.w*mw-2,
      y+mission.target.y/world.h*mh-2,
      5,5
    );
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  camera.x=clamp(player.x-W/2,0,world.w-W);
  camera.y=clamp(player.y-H/2,0,world.h-H);

  ctx.save();
  ctx.translate(-camera.x,-camera.y);
  drawWorld();

  for(const c of cars)drawCar(c);
  for(const c of cops)if(c.hp>0)drawCar(c);
  for(const p of people)drawPerson(p);
  for(const p of gang)drawPerson(p);
  for(const c of cops)if(c.officer)drawOfficer(c.officer);
  drawMission();
  drawPlayer();

  ctx.restore();
  drawMinimap();
}

function hud(){
  $("money").textContent=player.money;
  $("hp").textContent=Math.max(0,Math.round(player.hp));
  $("ammo").textContent=player.ammo;
  $("wanted").textContent=wanted;
  $("carhud").style.display=player.car?"block":"none";
  $("jailhud").style.display=jailed?"block":"none";
}

function loop(now){
  const dt=Math.min((now-last)/1000,.04);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

$("enter").addEventListener("click",enterExit);
$("action").addEventListener("click",action);
$("shootbtn").addEventListener("click",shoot);

// Магазин доступен кнопкой в любое время, чтобы не искать его по всему городу.
$("shopbtn").addEventListener("click",shopOpen);
$("missionbtn").addEventListener("click",startMission);

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  if(k==="e")enterExit();
  if(k===" " )action();
  if(k==="f")shoot();
  if(k==="m")shopOpen();
  if(k==="q")startMission();
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

const joyEl=$("joy"),stick=$("stick");
function updateJoy(e){
  const r=joyEl.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=37,l=Math.hypot(dx,dy);
  if(l>max){dx=dx/l*max;dy=dy/l*max;}
  joy.x=dx/max;joy.y=dy/max;
  stick.style.left=(34+dx)+"px";
  stick.style.top=(34+dy)+"px";
}
joyEl.addEventListener("pointerdown",e=>{
  joy.on=true;
  joyEl.setPointerCapture(e.pointerId);
  updateJoy(e);
});
joyEl.addEventListener("pointermove",e=>{if(joy.on)updateJoy(e)});
function endJoy(){
  joy.on=false;joy.x=0;joy.y=0;
  stick.style.left="34px";stick.style.top="34px";
}
joyEl.addEventListener("pointerup",endJoy);
joyEl.addEventListener("pointercancel",endJoy);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){keys={};endJoy();}
});

hud();
requestAnimationFrame(loop);
</script>
</body>
