<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dox Terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: "SF Mono", "Consolas", "Monaco", "Courier New", monospace;
    color: #33ff66;
    font-size: 14px;
    line-height: 1.6;
    padding: 20px;
    text-shadow: 0 0 6px rgba(51, 255, 102, 0.5);
  }
  #terminal {
    white-space: pre-wrap;
    word-break: break-all;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #33ff66;
    vertical-align: middle;
    animation: blink 0.7s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #final {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #final.show { display: flex; opacity: 1; }
  .card {
    max-width: 360px;
    width: 100%;
    border: 1px solid #ff2a2a;
    padding: 28px 20px;
    background: rgba(255, 42, 42, 0.04);
    box-shadow: 0 0 30px rgba(255, 42, 42, 0.25);
  }
  .skull {
    font-size: 48px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 10px #ff2a2a);
  }
  .card h1 {
    color: #ff2a2a;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .card .line {
    color: #ff8080;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .card .num {
    color: #ff2a2a;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 14px 0;
    border: 1px dashed #ff2a2a;
    padding: 10px;
  }
  .card .stolen {
    color: #fff;
    background: #ff2a2a;
    display: inline-block;
    padding: 6px 14px;
    margin-top: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 13px;
  }
  .glitch {
    animation: glitch 0.15s linear infinite alternate;
  }
  @keyframes glitch {
    from { transform: translate(0, 0); }
    to { transform: translate(-1px, 1px); }
  }
</style>
</head>
<body>
  <div id="terminal"><span class="cursor"></span></div>

  <div id="final">
    <div class="card">
      <div class="skull">☠️</div>
      <h1>Dox Complete</h1>
      <div class="line">Данные отправлены пользователю</div>
      <div class="num">8 999 762 1* 9*</div>
      <div class="line">Профиль скомпрометирован</div>
      <div class="stolen">ВАШИ ДАННЫЕ УКРАДЕНЫ</div>
    </div>
  </div>

  <script>
    const lines = [
      "[*] Инициализация соединения...",
      "[*] Подключение к серверу 185.***.***.42 — OK",
      "[+] Обход шифрования... OK",
      "[+] Чтение локального хранилища... OK",
      "[+] Получение MAC-адреса устройства... OK",
      "[+] Сбор cookies и сессий... OK",
      "[+] Парсинг геолокации... OK",
      "[+] Извлечение контактов... OK",
      "[+] Чтение списка чатов... OK",
      "[+] Дешифровка сообщений... OK",
      "[+] Формирование профиля... 87%",
      "[+] Формирование профиля... 94%",
      "[+] Формирование профиля... 100%",
      "[✓] ДЕАНОН ВЫПОЛНЕН",
      "[✓] Пакет данных сформирован (2.4 MB)",
      "[→] Отправка на номер 8 999 762 1* 9*...",
      "[→] Передача данных... 100%",
      "[✓] ДАННЫЕ УСПЕШНО ОТПРАВЛЕНЫ",
      "[✓] ИНИЦИАЛИЗАЦИЯ ДОКСА ЗАВЕРШЕНА",
    ];

    const term = document.getElementById('terminal');
    const final = document.getElementById('final');
    const cursor = '<span class="cursor"></span>';
    let i = 0;

    function typeLine(text, done) {
      let j = 0;
      const speed = 18 + Math.random() * 25;
      function tick() {
        if (j <= text.length) {
          term.innerHTML = lines.slice(0, i).join('\n') +
            (i > 0 ? '\n' : '') + text.slice(0, j) + cursor;
          j++;
          setTimeout(tick, speed);
        } else {
          i++;
          setTimeout(done, 180 + Math.random() * 250);
        }
      }
      tick();
    }

    function run() {
      if (i >= lines.length) {
        setTimeout(() => {
          final.classList.add('show');
          document.querySelector('.card').classList.add('glitch');
        }, 600);
        return;
      }
      typeLine(lines[i], run);
    }

    setTimeout(run, 400);
  </script>
</body>
</html>
