
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 3.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:8px;left:9px;z-index:3;pointer-events:none;text-shadow:1px 2px #000;font-weight:bold}
#title{font-size:19px;color:#85ff91}
#stats{font-size:13px;line-height:1.65;margin-top:4px}
#hint{font-size:12px;color:#fff;margin-top:4px;max-width:235px}
#map{position:fixed;right:9px;top:9px;width:112px;height:84px;border:2px solid #ffffff99;border-radius:8px;background:#15202acc;z-index:2}
#joy{position:fixed;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#ffffff25;border:3px solid #ffffff77;z-index:5;touch-action:none}
#knob{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:#ffffffbb;border:3px solid white;pointer-events:none}
.btn{position:fixed;right:13px;z-index:5;width:91px;min-height:49px;border:2px solid #ffffff77;border-radius:14px;background:#202c38ed;color:white;font-size:12px;font-weight:bold;touch-action:none}
#interact{bottom:17px}
#fire{bottom:74px;background:#853c42ed}
#shopBtn{bottom:131px;background:#247447ed}
#missionBtn{bottom:188px;background:#8c7130ed}
#toast{position:fixed;top:43%;left:5%;width:90%;text-align:center;font-size:19px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none;z-index:4}
#shop{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);max-height:82vh;overflow:auto;background:#17232a;border:2px solid #91ffa0;border-radius:18px;padding:17px;box-shadow:0 0 30px #000b}
#shop h2{margin:0 0 6px;color:#91ffa0}
#shop p{font-size:13px;color:#ddd}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffffff12;border-radius:10px;padding:10px;margin:8px 0}
.item button,#closeShop{background:#287b43;color:white;border:0;border-radius:8px;padding:10px;font-weight:bold}
#closeShop{width:100%;background:#495660;margin-top:8px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="map"></canvas>
<div id="hud">
 <div id="title">GOB CITY 3.0</div>
 <div id="stats"></div>
 <div id="hint">Найди зелёный магазин или жёлтый маркер задания.</div>
</div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="interact">В / ВЫЙТИ</button>
<button class="btn" id="fire">ДЕЙСТВИЕ</button>
<button class="btn" id="shopBtn">МАГАЗИН</button>
<button class="btn" id="missionBtn">ЗАДАНИЕ</button>
<div id="shop">
 <h2>🏪 GOB MART</h2>
 <p>Покупай вещи за заработанные деньги.</p>
 <div id="shopItems"></div>
 <button id="closeShop">ЗАКРЫТЬ</button>
</div>
<script>
(()=>{
const cv=document.querySelector('#game'),ctx=cv.getContext('2d');
const map=document.querySelector('#map'),mc=map.getContext('2d');
const joyEl=document.querySelector('#joy'),knob=document.querySelector('#knob');
const stats=document.querySelector('#stats'),toast=document.querySelector('#toast');
const shop=document.querySelector('#shop'),shopItems=document.querySelector('#shopItems');
let W,H,D;
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 map.width=224;map.height=168;
}
addEventListener('resize',resize);resize();
const world={w:3200,h:2400};
const player={x:400,y:400,angle:0,speed:185,hp:100,maxHp:100,money:300,food:0,ammo:0,gun:false};
let car=null,wanted=0,mission=0,missionCount=0,missionDone=0,policeTimer=0;
const cars=[],buildings=[],people=[],cops=[],bullets=[],roadsX=[],roadsY=[];
let seed=91823;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
for(let x=100;x<world.w;x+=400)roadsX.push(x);
for(let y=100;y<world.h;y+=400)roadsY.push(y);
for(let bx=0;bx<world.w;bx+=400)for(let by=0;by<world.h;by+=400){
 for(let i=0;i<4;i++){
  let x=bx+45+rand()*215,y=by+45+rand()*215;
  buildings.push({x,y,w:55+rand()*95,h:55+rand()*95,c:['#59616b','#77675c','#4c6971','#6c687c'][i]});
 }
}
const colors=['#e74c3c','#3498db','#f1c40f','#eeeeee','#9b59b6','#27ae60'];
for(let i=0;i<35;i++){
 let horizontal=rand()>.5;
 let x=100+rand()*(world.w-200),y=100+rand()*(world.h-200);
 if(horizontal)y=roadsY[Math.floor(rand()*roadsY.length)]+(rand()>.5?23:-23);
 else x=roadsX[Math.floor(rand()*roadsX.length)]+(rand()>.5?23:-23);
 cars.push({x,y,angle:horizontal?0:Math.PI/2,speed:0,color:colors[i%colors.length]});
}
function freePoint(){
 for(let i=0;i<100;i++){
  let p={x:60+rand()*(world.w-120),y:60+rand()*(world.h-120)};
  if(!blocked(p.x,p.y,14))return p;
 }
 return {x:500,y:500};
}
for(let i=0;i<52;i++){
 let p=freePoint();
 people.push({...p,angle:rand()*6.28,walk:20+rand()*30,alive:true,panic:0,color:colors[i%colors.length]});
}
const shopSpot={x:450,y:160};
const missionSpot={x:2800,y:2000};
let cam={x:0,y:0},joy={x:0,y:0,active:false};
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function moveJoy(e){
 const r=joyEl.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 const max=r.width*.31,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown',e=>{joy.active=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joy.active)moveJoy(e)});
function stopJoy(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',stopJoy);joyEl.addEventListener('pointercancel',stopJoy);

function say(s){toast.textContent=s;clearTimeout(say.timer);say.timer=setTimeout(()=>toast.textContent='',1900)}
function blocked(x,y,r){
 if(x<r||y<r||x>world.w-r||y>world.h-r)return true;
 for(const b of buildings)if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
 return false;
}
function moveObj(o,dx,dy,r){
 if(!blocked(o.x+dx,o.y,r))o.x+=dx;
 if(!blocked(o.x,o.y+dy,r))o.y+=dy;
}
function nearShop(){return Math.hypot(player.x-shopSpot.x,player.y-shopSpot.y)<105}
function nearestCar(){
 let best=null,d=55;
 for(const c of cars){let n=dist(c,player);if(n<d){d=n;best=c}}
 return best;
}
function enterExit(){
 if(car){
  player.x=car.x+Math.cos(car.angle+Math.PI/2)*30;
  player.y=car.y+Math.sin(car.angle+Math.PI/2)*30;
  car.speed=0;car=null;say('Ты вышел из машины');return;
 }
 let c=nearestCar();
 if(c){car=c;player.x=c.x;player.y=c.y;say('Поехали! 🚗')}
 else say('Подойди ближе к машине');
}
function showShop(){
 if(!nearShop()&&!shop.style.display.includes('block')){
  say('Подойди к зелёному магазину на карте');return;
 }
 shop.style.display='block';renderShop();
}
function renderShop(){
 const items=[
  ['🍔 Бургер','Еда восстанавливает 30 здоровья',50,()=>{player.food++;}],
  ['🩹 Аптечка','Восстанавливает 50 здоровья',100,()=>{player.hp=Math.min(player.maxHp,player.hp+50)}],
  ['🔫 Бластер','Игровое дальнобойное снаряжение',250,()=>{player.gun=true;player.ammo+=12;}],
  ['📦 Патроны','12 зарядов для игрового бластера',80,()=>{if(!player.gun)player.gun=true;player.ammo+=12;}],
  ['🚗 Турбо','Улучшает скорость машины на время',120,()=>{if(car)car.boost=15;else say('Сначала сядь в машину!');}]
 ];
 shopItems.innerHTML='';
 for(const [name,desc,cost,buy] of items){
  const row=document.createElement('div');row.className='item';
  const info=document.createElement('div');
  info.innerHTML='<b>'+name+'</b><br><small>'+desc+'</small><br><small>💵 $'+cost+'</small>';
  const button=document.createElement('button');button.textContent='КУПИТЬ';
  button.onclick=()=>{
   if(player.money<cost){say('Не хватает денег!');return}
   if(name==='🚗 Турбо'&&!car){say('Сначала сядь в машину!');return}
   player.money-=cost;buy();say('Куплено: '+name);renderShop();
  };
  row.append(info,button);shopItems.append(row);
 }
}
document.querySelector('#closeShop').onclick=()=>shop.style.display='none';
document.querySelector('#shopBtn').addEventListener('pointerdown',e=>{e.preventDefault();showShop()});
document.querySelector('#interact').addEventListener('pointerdown',e=>{e.preventDefault();enterExit()});
document.querySelector('#missionBtn').addEventListener('pointerdown',e=>{
 e.preventDefault();
 const target=car||player;
 if(Math.hypot(target.x-missionSpot.x,target.y-missionSpot.y)<95){
  player.money+=missionReward();missionCount++;missionDone++;
  missionSpot.x=250+rand()*(world.w-500);missionSpot.y=250+rand()*(world.h-500);
  say('Задание выполнено! Награда получена 💵');
 }else say('Найди жёлтый маркер на карте!');
});
function missionReward(){return 200+missionCount*75}
addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.key.toLowerCase()==='e')enterExit();
 if(e.key.toLowerCase()==='f')showShop();
 if(e.key===' ')action();
 if(e.key.toLowerCase()==='q'&&player.food>0){player.food--;player.hp=Math.min(player.maxHp,player.hp+30);say('Перекус! +30 здоровья')}
});
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();action()});
function action(){
 if(shop.style.display==='block'){shop.style.display='none';return}
 if(!player.gun){say('В магазине можно купить игровой бластер');return}
 if(player.ammo<=0){say('Заряды закончились!');return}
 player.ammo--;
 const origin=car||player;
 let target=null,best=350;
 for(const p of [...people.filter(x=>x.alive),...cops.filter(x=>x.alive)]){
  let d=dist(origin,p);
  if(d<best){best=d;target=p}
 }
 if(!target){say('Рядом нет цели');return}
 target.alive=false;
 if(cops.includes(target)){wanted=Math.min(5,wanted+1);say('Полицейский выбыл! Розыск растёт!')}
 else{wanted=Math.min(5,wanted+1);say('Житель испугался! Розыск растёт!')}
 if(wanted>0)policeTimer=0;
}
function spawnCop(){
 let p=freePoint();
 cops.push({...p,alive:true,angle:0,speed:75});
}
function wantedStars(){return '★'.repeat(wanted)+'☆'.repeat(5-wanted)}
function update(dt){
 let ix=joy.x,iy=joy.y;
 if(keys.w||keys.arrowup)iy-=1;
 if(keys.s||keys.arrowdown)iy+=1;
 if(keys.a||keys.arrowleft)ix-=1;
 if(keys.d||keys.arrowright)ix+=1;
 let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
 if(car){
  if(len>.05){
   car.angle=Math.atan2(iy,ix);car.speed=210*(car.boost>0?1.45:1);
  }else car.speed*=.91;
  moveObj(car,Math.cos(car.angle)*car.speed*dt,Math.sin(car.angle)*car.speed*dt,16);
  player.x=car.x;player.y=car.y;
  if(car.boost>0)car.boost-=dt;
 }else if(len>.05){
  player.angle=Math.atan2(iy,ix);moveObj(player,ix*player.speed*dt,iy*player.speed*dt,10);
 }
 // Civilians stroll and flee from nearby police/player.
 for(const p of people)if(p.alive){
  p.panic=Math.max(0,(p.panic||0)-dt);
  if(!car&&dist(p,player)<65&&wanted>0){p.panic=2;p.angle=Math.atan2(p.y-player.y,p.x-player.x)}
  if(p.panic>0){
   moveObj(p,Math.cos(p.angle)*90*dt,Math.sin(p.angle)*90*dt,8);
  }else{
   p.walk-=dt;
   if(p.walk<=0){p.angle=rand()*Math.PI*2;p.walk=2+rand()*4}
   moveObj(p,Math.cos(p.angle)*20*dt,Math.sin(p.angle)*20*dt,8);
  }
 }
 // Police appear and chase while wanted.
 policeTimer+=dt;
 if(wanted>0&&policeTimer>Math.max(1.6,5-wanted*.6)&&cops.filter(c=>c.alive).length<wanted+1){spawnCop();policeTimer=0}
 for(const c of cops)if(c.alive&&wanted>0){
  const t=car||player,dx=t.x-c.x,dy=t.y-c.y,d=Math.hypot(dx,dy)||1;
  c.angle=Math.atan2(dy,dx);
  moveObj(c,dx/d*c.speed*dt,dy/d*c.speed*dt,10);
  if(d<24){
   player.hp-=8*dt;
   if(player.hp<=0){
    player.hp=player.maxHp;player.money=Math.max(0,player.money-100);
    player.x=400;player.y=400;car=null;wanted=0;
    for(const cop of cops)cop.alive=false;
    say('Тебя задержали! Потеряно $100');
   }
  }
 }
 if(wanted===0)for(const c of cops)c.alive=false;
}
function drawCar(c){
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
 ctx.fillStyle='#0007';ctx.fillRect(-18,-10,40,24);
 ctx.fillStyle=c.color;ctx.fillRect(-20,-9,40,18);
 ctx.fillStyle='#18242e';ctx.fillRect(-7,-7,14,14);
 ctx.fillStyle='#f8f2ba';ctx.fillRect(16,-7,4,5);ctx.fillRect(16,2,4,5);
 ctx.fillStyle='#222';ctx.fillRect(-13,-12,9,4);ctx.fillRect(7,-12,9,4);ctx.fillRect(-13,8,9,4);ctx.fillRect(7,8,9,4);
 ctx.restore();
}
function drawPerson(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);
 ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(2,5,10,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f4c79b';ctx.beginPath();ctx.arc(0,-4,6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=p.color||'#54d96d';ctx.fillRect(-7,1,14,13);
 ctx.fillStyle='#252d36';ctx.fillRect(-6,12,5,7);ctx.fillRect(2,12,5,7);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const target=car||player;
 cam.x=clamp(target.x-W/2,0,world.w-W);cam.y=clamp(target.y-H/2,0,world.h-H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#34483d';ctx.fillRect(0,0,world.w,world.h);
 ctx.fillStyle='#343a40';
 for(const x of roadsX)ctx.fillRect(x-48,0,96,world.h);
 for(const y of roadsY)ctx.fillRect(0,y-48,world.w,96);
 ctx.strokeStyle='#c6b779';ctx.lineWidth=2;ctx.setLineDash([20,18]);
 for(const x of roadsX){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(const y of roadsY){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 ctx.setLineDash([]);
 for(const b of buildings){
  ctx.fillStyle='#0005';ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
  ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#ffffff15';ctx.fillRect(b.x+5,b.y+5,b.w-10,7);
  ctx.fillStyle='#252f38';
  for(let x=b.x+12;x<b.x+b.w-8;x+=22)for(let y=b.y+20;y<b.y+b.h-8;y+=24)ctx.fillRect(x,y,8,7);
 }
 // Store marker.
 ctx.fillStyle='#4cfa85';ctx.fillRect(shopSpot.x-22,shopSpot.y-22,44,44);
 ctx.fillStyle='#133b25';ctx.font='bold 23px Arial';ctx.fillText('$',shopSpot.x-7,shopSpot.y+8);
 ctx.fillStyle='white';ctx.font='bold 13px Arial';ctx.fillText('МАГАЗИН',shopSpot.x-34,shopSpot.y-30);
 // Mission marker.
 ctx.strokeStyle='#ffe34d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(missionSpot.x,missionSpot.y,25+Math.sin(Date.now()/180)*5,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#ffe34d';ctx.font='bold 17px Arial';ctx.fillText('$'+missionReward(),missionSpot.x-24,missionSpot.y-38);
 for(const p of people)if(p.alive)drawPerson(p);
 for(const c of cars)drawCar(c);
 for(const c of cops)if(c.alive){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
  ctx.fillStyle='#101e2c';ctx.fillRect(-10,-8,20,16);
  ctx.fillStyle='#b9e6ff';ctx.fillRect(-6,-6,12,12);
  ctx.fillStyle='#ff4343';ctx.fillRect(-4,-10,5,3);
  ctx.fillStyle='#4b9dff';ctx.fillRect(2,-10,5,3);
  ctx.restore();
 }
 if(!car)drawPerson({...player,color:'#54ff79'});
 else{
  // Player remains visible as a small driver marker.
  ctx.fillStyle='#ffd2a0';ctx.beginPath();ctx.arc(car.x,car.y,5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
 mc.clearRect(0,0,224,168);mc.fillStyle='#34483d';mc.fillRect(0,0,224,168);
 mc.fillStyle='#343a40';
 for(const x of roadsX)mc.fillRect(x/world.w*224-3,0,6,168);
 for(const y of roadsY)mc.fillRect(0,y/world.h*168-3,224,6);
 mc.fillStyle='#5b656e';
 for(const b of buildings)mc.fillRect(b.x/world.w*224,b.y/world.h*168,b.w/world.w*224,b.h/world.h*168);
 mc.fillStyle='#4cfa85';mc.fillRect(shopSpot.x/world.w*224-3,shopSpot.y/world.h*168-3,6,6);
 mc.fillStyle='#ffe34d';mc.fillRect(missionSpot.x/world.w*224-3,missionSpot.y/world.h*168-3,6,6);
 mc.fillStyle='#f7b8b8';for(const p of people)if(p.alive)mc.fillRect(p.x/world.w*224-1,p.y/world.h*168-1,2,2);
 mc.fillStyle='#5da8ff';for(const c of cops)if(c.alive)mc.fillRect(c.x/world.w*224-2,c.y/world.h*168-2,4,4);
 mc.fillStyle='white';const t=car||player;mc.beginPath();mc.arc(t.x/world.w*224,t.y/world.h*168,4,0,Math.PI*2);mc.fill();
 stats.innerHTML=`💵 $${player.money} · ❤️ ${Math.ceil(player.hp)} · 🔫 ${player.ammo}<br>🚨 <span style="color:#ffce62">${wantedStars()}</span> · 🍔 ${player.food} · ${car?'🚗 В машине':'🚶 Пешком'}`;
 requestAnimationFrame(draw);
}
let last=performance.now();
function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;update(dt);requestAnimationFrame(loop)}
requestAnimationFrame(draw);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
