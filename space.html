<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Космический мусорщик</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    background: #05050a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 12px 20px;
    display: flex; justify-content: space-between;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    pointer-events: none; z-index: 10;
    text-shadow: 0 0 10px rgba(94, 203, 255, 0.7);
  }
  .score { color: #5ecbff; }
  .best { color: #ffd24a; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; z-index: 100;
  }
  .overlay h1 {
    font-size: 32px; color: #5ecbff; margin-bottom: 10px;
    letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 0 20px rgba(94, 203, 255, 0.8);
  }
  .overlay p { font-size: 14px; color: #a0a0c0; margin-bottom: 24px; }
  .overlay button {
    padding: 14px 40px; background: transparent;
    border: 2px solid #5ecbff; border-radius: 30px;
    color: #5ecbff; font-family: inherit;
    font-size: 16px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; touch-action: manipulation;
    box-shadow: 0 0 15px rgba(94, 203, 255, 0.4);
    transition: all 0.2s;
  }
  .overlay button:active {
    background: rgba(94, 203, 255, 0.2);
    transform: scale(0.95);
  }
</style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="score">СЧЕТ: <span id="scoreVal">0</span></div>
    <div class="best">РЕКОРД: <span id="bestVal">0</span></div>
  </div>

  <div class="overlay" id="menu">
    <h1>Мусорщик</h1>
    <p>Управляй кораблём. Собирай кристаллы.<br>Не врезайся в астероиды.</p>
    <button id="startBtn">Играть</button>
  </div>

  <div class="overlay" id="gameOver" style="display: none;">
    <h1 style="color: #ff5c8a; text-shadow: 0 0 20px rgba(255, 92, 138, 0.8);">Корабль уничтожен</h1>
    <p id="finalScoreText">Твой счёт: 0</p>
    <button id="restartBtn" style="border-color: #ff5c8a; color: #ff5c8a; box-shadow: 0 0 15px rgba(255, 92, 138, 0.4);">Заново</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Звёзды на фоне
    const stars = [];
    for (let i = 0; i < 100; i++) {
      stars.push({
        x: Math.random() * 2000,
        y: Math.random() * 2000,
        z: Math.random() * 2 + 0.5,
        size: Math.random() * 2 + 1
      });
    }

    // Состояние игры
    let score = 0;
    let best = parseInt(localStorage.getItem('space_best')) || 0;
    document.getElementById('bestVal').textContent = best;

    let gameState = 'menu'; // 'menu', 'playing', 'over'
    let lastTime = 0;
    let spawnTimer = 0;
    let enemyTimer = 0;

    const player = { x: W / 2, y: H - 100, radius: 15, speed: 400 };
    let asteroids = [];
    let crystals = [];
    let enemies = [];
    let bullets = [];

    // Управление
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };
    let touchTarget = null;

    window.addEventListener('keydown', e => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
    });
    window.addEventListener('keyup', e => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
    });

    // Тач
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchTarget = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      touchTarget = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      touchTarget = null;
    }, { passive: false });

    // Кнопки меню
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('menu').style.display = 'none';
      startGame();
    });
    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('gameOver').style.display = 'none';
      startGame();
    });

    function startGame() {
      score = 0;
      document.getElementById('scoreVal').textContent = score;
      player.x = W / 2;
      player.y = H - 100;
      asteroids = [];
      crystals = [];
      enemies = [];
      bullets = [];
      spawnTimer = 0;
      enemyTimer = 0;
      gameState = 'playing';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function spawnAsteroid() {
      asteroids.push({
        x: Math.random() * W,
        y: -50,
        radius: Math.random() * 25 + 15,
        speed: Math.random() * 100 + 100,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 2,
        vertices: Array.from({ length: 8 }, () => Math.random() * 0.4 + 0.8)
      });
    }

    function spawnCrystal() {
      crystals.push({
        x: Math.random() * (W - 40) + 20,
        y: -30,
        speed: Math.random() * 80 + 80,
        size: 12,
        pulse: 0
      });
    }

    function spawnEnemy() {
      enemies.push({
        x: Math.random() * (W - 100) + 50,
        y: -50,
        radius: 20,
        speed: Math.random() * 60 + 80,
        angle: 0,
        shootTimer: 0
      });
    }

    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        if (type === 'shoot') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.03, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        } else if (type === 'crystal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        } else if (type === 'explode') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        }
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    function loop(now) {
      if (gameState !== 'playing') return;
      const dt = Math.min(50, now - lastTime) / 1000;
      lastTime = now;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    function update(dt) {
      // Движение игрока
      let dx = 0, dy = 0;
      if (keys.ArrowLeft || keys.a) dx -= 1;
      if (keys.ArrowRight || keys.d) dx += 1;
      if (keys.ArrowUp || keys.w) dy -= 1;
      if (keys.ArrowDown || keys.s) dy += 1;
      if (touchTarget) {
        const tdx = touchTarget.x - player.x;
        const tdy = touchTarget.y - player.y;
        const len = Math.hypot(tdx, tdy);
        if (len > 5) {
          dx = tdx / len;
          dy = tdy / len;
        }
      }
      player.x += dx * player.speed * dt;
      player.y += dy * player.speed * dt;
      player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

      // Стрельба игрока (авто)
      if (!update.lastShot || Date.now() - update.lastShot > 150) {
        bullets.push({ x: player.x, y: player.y - 20, vy: -800, enemy: false });
        update.lastShot = Date.now();
        playSound('shoot');
      }

      // Спавн объектов
      spawnTimer += dt;
      enemyTimer += dt;
      if (spawnTimer > 0.8) {
        spawnTimer = 0;
        if (Math.random() < 0.7) spawnAsteroid();
        if (Math.random() < 0.4) spawnCrystal();
      }
      if (enemyTimer > 3) {
        enemyTimer = 0;
        spawnEnemy();
      }

      // Обновление пуль
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy * dt;
        let hit = false;

        // Попадание в астероид
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
            asteroids.splice(j, 1);
            hit = true;
            break;
          }
        }
        // Попадание во врага
        if (!hit && !b.enemy) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius) {
              enemies.splice(j, 1);
              score += 50;
              document.getElementById('scoreVal').textContent = score;
              playSound('explode');
              hit = true;
              break;
            }
          }
        }
        if (hit || b.y < -20 || b.y > H + 20) {
          bullets.splice(i, 1);
        }
      }

      // Обновление астероидов
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.y += a.speed * dt;
        a.rot += a.rotSpeed * dt;
        if (a.y > H + 50) {
          asteroids.splice(i, 1);
        } else if (Math.hypot(player.x - a.x, player.y - a.y) < player.radius + a.radius) {
          endGame();
          return;
        }
      }

      // Обновление кристаллов
      for (let i = crystals.length - 1; i >= 0; i--) {
        const c = crystals[i];
        c.y += c.speed * dt;
        c.pulse += dt * 5;
        if (c.y > H + 30) {
          crystals.splice(i, 1);
        } else if (Math.hypot(player.x - c.x, player.y - c.y) < player.radius + c.size) {
          crystals.splice(i, 1);
          score += 10;
          document.getElementById('scoreVal').textContent = score;
          playSound('crystal');
        }
      }

      // Обновление врагов
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * dt;
        e.angle += dt;
        e.shootTimer += dt;

        // Стрельба врага
        if (e.shootTimer > 1.5) {
          e.shootTimer = 0;
          bullets.push({ x: e.x, y: e.y + 20, vy: 400, enemy: true });
        }

        if (e.y > H + 50) {
          enemies.splice(i, 1);
        } else if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          endGame();
          return;
        }
      }

      // Попадание вражеских пуль в игрока
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.enemy && Math.hypot(player.x - b.x, player.y - b.y) < player.radius) {
          endGame();
          return;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#05050a';
      ctx.fillRect(0, 0, W, H);

      // Звёзды
      ctx.fillStyle = '#fff';
      stars.forEach(s => {
        s.y += 30 * s.z * 0.016;
        if (s.y > H) s.y = 0;
        ctx.globalAlpha = s.z / 3;
        ctx.fillRect(s.x % W, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      // Астероиды
      asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.beginPath();
        ctx.fillStyle = '#4a4a55';
        ctx.strokeStyle = '#7a7a88';
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const r = a.radius * a.vertices[i];
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Кристаллы
      crystals.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        const scale = 1 + Math.sin(c.pulse) * 0.1;
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 15;
        ctx.moveTo(0, -c.size);
        ctx.lineTo(c.size * 0.8, 0);
        ctx.lineTo(0, c.size);
        ctx.lineTo(-c.size * 0.8, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Враги
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(Math.sin(e.angle) * 0.2);
        ctx.beginPath();
        ctx.fillStyle = '#ff2a6a';
        ctx.shadowColor = '#ff2a6a';
        ctx.shadowBlur = 15;
        ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
        ctx.fill();
        // Глаз
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Пули
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.fillStyle = b.enemy ? '#ff2a6a' : '#5ecbff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Игрок
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.beginPath();
      ctx.fillStyle = '#5ecbff';
      ctx.shadowColor = '#5ecbff';
      ctx.shadowBlur = 20;
      ctx.moveTo(0, -player.radius);
      ctx.lineTo(player.radius, player.radius);
      ctx.lineTo(0, player.radius * 0.5);
      ctx.lineTo(-player.radius, player.radius);
      ctx.closePath();
      ctx.fill();
      // Сопла двигателя
      ctx.fillStyle = '#ffb800';
      ctx.beginPath();
      ctx.moveTo(-5, player.radius * 0.5);
      ctx.lineTo(0, player.radius + Math.random() * 10);
      ctx.lineTo(5, player.radius * 0.5);
      ctx.fill();
      ctx.restore();
    }

    function endGame() {
      gameState = 'over';
      playSound('explode');
      if (navigator.vibrate) navigator.vibrate(200);
      
      if (score > best) {
        best = score;
        localStorage.setItem('space_best', best);
        document.getElementById('bestVal').textContent = best;
      }
      
      document.getElementById('finalScoreText').textContent = 'Твой счёт: ' + score;
      document.getElementById('gameOver').style.display = 'flex';
    }
  </script>
</body>
</html>
