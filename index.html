
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOB CITY 4.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:8px;left:9px;z-index:2;pointer-events:none;text-shadow:1px 2px #000;font-weight:bold}
#title{color:#85ff91;font-size:19px}
#stats{font-size:12px;line-height:1.6;margin-top:4px}
#hint{font-size:12px;max-width:235px;margin-top:3px}
#map{position:fixed;right:9px;top:9px;width:112px;height:84px;border:2px solid #ffffff99;border-radius:8px;z-index:2}
#joy{position:fixed;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#ffffff25;border:3px solid #ffffff77;z-index:5;touch-action:none}
#knob{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:#ffffffbb;border:3px solid white;pointer-events:none}
.btn{position:fixed;right:12px;z-index:5;width:91px;min-height:46px;border:2px solid #ffffff77;border-radius:13px;background:#202c38ed;color:white;font-size:11px;font-weight:bold;touch-action:none}
#use{bottom:15px}#action{bottom:68px;background:#853c42ed}
#shopBtn{bottom:121px;background:#247447ed}#job{bottom:174px;background:#8c7130ed}
#toast{position:fixed;top:42%;left:5%;width:90%;text-align:center;font-size:19px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none;z-index:4}
#panel{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);max-height:80vh;overflow:auto;background:#17232a;border:2px solid #91ffa0;border-radius:18px;padding:16px}
#panel h2{margin:0;color:#91ffa0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff12;border-radius:10px;padding:9px;margin:7px 0}
.item button,#close{background:#287b43;color:white;border:0;border-radius:8px;padding:9px;font-weight:bold}
#close{width:100%;margin-top:8px;background:#495660}
</style>
</head>
<body>
<canvas id="game"></canvas><canvas id="map"></canvas>
<div id="hud"><div id="title">GOB CITY 4.0</div><div id="stats"></div><div id="hint"></div></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="use">В / ВЫЙТИ</button>
<button class="btn" id="action">ДЕЙСТВИЕ</button>
<button class="btn" id="shopBtn">МАГАЗИН</button>
<button class="btn" id="job">ЗАДАНИЕ</button>
<div id="panel"><h2 id="panelTitle">GOB CITY</h2><p id="panelText"></p><div id="items"></div><button id="close">ЗАКРЫТЬ</button></div>
<script>
(()=>{
const cv=document.querySelector('#game'),ctx=cv.getContext('2d');
const map=document.querySelector('#map'),mc=map.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,D;
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 map.width=224;map.height=168;
}
addEventListener('resize',resize);resize();

const world={w:3200,h:2400};
let seed=5172;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const player={x:400,y:100,angle:0,speed:180,hp:100,maxHp:100,money:180,food:0,gun:false,ammo:0};
let car=null,wanted=0,crime=0,missionCount=0,missionDone=false,arrested=false,won=false;
let cam={x:0,y:0},joy={x:0,y:0,active:false};
const keys={},buildings=[],cars=[],people=[],cops=[];
const roadsX=[],roadsY=[];
for(let x=100;x<world.w;x+=400)roadsX.push(x);
for(let y=100;y<world.h;y+=400)roadsY.push(y);

const prison={x:2600,y:200,w:400,h:250,gateX:2800,gateY:450};
function inPrison(x,y){return x>prison.x-35&&x<prison.x+prison.w+35&&y>prison.y-35&&y<prison.y+prison.h+35}
for(let bx=150;bx<world.w-70;bx+=400){
 for(let by=150;by<world.h-70;by+=400){
  for(let i=0;i<3;i++){
   let b={x:bx+rand()*125,y:by+rand()*125,w:65+rand()*100,h:65+rand()*100,c:['#59616b','#77675c','#4c6971','#6c687c'][Math.floor(rand()*4)]};
   if(!inPrison(b.x+b.w/2,b.y+b.h/2))buildings.push(b);
  }
 }
}
function blocked(x,y,r=8){
 if(x<r||y<r||x>world.w-r||y>world.h-r)return true;
 if(inPrison(x,y)&&!arrested)return false;
 for(const b of buildings)if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
 return false;
}
function moveObj(o,dx,dy,r=9){
 if(!blocked(o.x+dx,o.y,r))o.x+=dx;
 if(!blocked(o.x,o.y+dy,r))o.y+=dy;
}
function roadPoint(){
 // Vehicles spawn on road lanes, away from buildings.
 const horizontal=rand()>.45;
 if(horizontal){
  const y=roadsY[Math.floor(rand()*roadsY.length)]+(rand()>.5?23:-23);
  return {x:120+rand()*(world.w-240),y,angle:rand()>.5?0:Math.PI};
 }
 const x=roadsX[Math.floor(rand()*roadsX.length)]+(rand()>.5?23:-23);
 return {x,y:120+rand()*(world.h-240),angle:rand()>.5?Math.PI/2:-Math.PI/2};
}
const carColors=['#e74c3c','#3498db','#f1c40f','#eee','#9b59b6','#27ae60'];
for(let i=0;i<32;i++){
 let p=roadPoint();
 cars.push({...p,color:carColors[i%carColors.length],speed:0,boost:0,police:false});
}
function freePoint(){
 for(let i=0;i<200;i++){
  let p=roadPoint();
  if(!blocked(p.x,p.y,12)&&!inPrison(p.x,p.y))return p;
 }
 return {x:600,y:100};
}
for(let i=0;i<45;i++){
 let p=freePoint();
 people.push({...p,alive:true,angle:rand()*6.28,turn:2+rand()*4,panic:0,color:carColors[i%carColors.length]});
}
const store={x:500,y:100};
let job={x:2800,y:1900};
function say(t){$('toast').textContent=t;clearTimeout(say.timer);say.timer=setTimeout(()=>$('toast').textContent='',2200)}
function stars(){return '★'.repeat(wanted)+'☆'.repeat(5-wanted)}
function addCrime(n){
 if(won)return;
 crime+=n;
 const thresholds=[0,5,13,25,42,65];
 while(wanted<5&&crime>=thresholds[wanted+1])wanted++;
 if(wanted>=5){wanted=5;won=true;arrested=false;car=null;say('🏆 ПЯТЬ ЗВЁЗД! ТЫ ПРОШЁЛ GOB CITY!');}
}
function enterExit(){
 if(arrested||won)return;
 if(car){
  player.x=car.x+Math.cos(car.angle+Math.PI/2)*28;
  player.y=car.y+Math.sin(car.angle+Math.PI/2)*28;
  car.speed=0;car=null;say('Вышел из машины');return;
 }
 let best=null,d=52;
 for(const c of cars){let n=dist(c,player);if(n<d){d=n;best=c}}
 if(best){car=best;player.x=car.x;player.y=car.y;addCrime(1);say('Машина угнана! Розыск может вырасти.')}
 else if(arrested)say('Ищи подсказки, чтобы сбежать!');
 else say('Подойди ближе к машине');
}
function openPanel(title,description,items=[]){
 $('panelTitle').textContent=title;$('panelText').textContent=description;
 $('items').innerHTML='';$('panel').style.display='block';
 for(const item of items){
  let row=document.createElement('div');row.className='item';
  let label=document.createElement('span');label.textContent=item.name+' — $'+item.price;
  let btn=document.createElement('button');btn.textContent='КУПИТЬ';
  btn.onclick=()=>{
   if(player.money<item.price){say('Не хватает денег!');return}
   if(item.buy()===false)return;
   player.money-=item.price;say('Покупка совершена');openShop();
  };
  row.append(label,btn);$('items').append(row);
 }
}
function openShop(){
 if(dist(player,store)>100&&!car){say('Подойди к зелёному магазину');return}
 openPanel('🏪 GOB MART','Покупай вещи за заработанные деньги',[
  {name:'🍔 Еда (+30 HP)',price:45,buy(){player.hp=Math.min(player.maxHp,player.hp+30)}},
  {name:'🩹 Аптечка (+50 HP)',price:90,buy(){player.hp=Math.min(player.maxHp,player.hp+50)}},
  {name:'🔫 Игровой бластер',price:220,buy(){player.gun=true;player.ammo+=5}},
  {name:'📦 5 зарядов',price:75,buy(){if(!player.gun){say('Сначала купи бластер');return false}player.ammo+=5}},
  {name:'🚗 Турбо машины',price:100,buy(){if(!car){say('Сначала сядь в машину');return false}car.boost=15}}
 ]);
}
$('close').onclick=()=>$('panel').style.display='none';
$('shopBtn').addEventListener('pointerdown',e=>{e.preventDefault();openShop()});
$('use').addEventListener('pointerdown',e=>{e.preventDefault();enterExit()});
$('job').addEventListener('pointerdown',e=>{
 e.preventDefault();
 const t=car||player;
 if(dist(t,job)<85){
  player.money+=35+Math.min(missionCount,4)*5;missionCount++;
  job=freePoint();say('Доставка выполнена! Награда получена.');
 }else say('Доберись до жёлтого маркера задания!');
});
function action(){
 if($('panel').style.display==='block'){$('panel').style.display='none';return}
 if(arrested){
  if(Math.hypot(player.x-prison.gateX,player.y-prison.gateY)<38){
   arrested=false;wanted=0;crime=0;player.x=prison.gateX;player.y=prison.gateY+55;say('ПОБЕГ УДАЛСЯ! Не попадись снова!');
  }else say('Подсказка: найди слабое место ограды и двигайся к воротам.');
  return;
 }
 if(!player.gun){say('Купи игровой бластер в магазине');return}
 if(player.ammo<=0){say('Заряды закончились');return}
 player.ammo--;
 const origin=car||player;
 let target=null,best=260;
 for(const p of [...people.filter(p=>p.alive),...cops.filter(c=>c.alive)]){
  let d=dist(origin,p);if(d<best){best=d;target=p}
 }
 if(!target){say('Рядом нет цели');return}
 target.alive=false;addCrime(cops.includes(target)?5:3);
 say('Выстрел! Розыск растёт.');
}
$('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.repeat)return;
 if(e.key.toLowerCase()==='e')enterExit();
 if(e.key.toLowerCase()==='f')openShop();
 if(e.key===' ')action();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function moveJoy(e){
 let r=$('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 let max=r.width*.31,l=Math.hypot(dx,dy);
 if(l>max){dx=dx/l*max;dy=dy/l*max}
 joy.x=dx/max;joy.y=dy/max;$('knob').style.transform=`translate(${dx}px,${dy}px)`;
}
$('joy').addEventListener('pointerdown',e=>{joy.active=true;$('joy').setPointerCapture(e.pointerId);moveJoy(e)});
$('joy').addEventListener('pointermove',e=>{if(joy.active)moveJoy(e)});
function stopJoy(){joy.active=false;joy.x=joy.y=0;$('knob').style.transform='translate(0,0)'}
$('joy').addEventListener('pointerup',stopJoy);$('joy').addEventListener('pointercancel',stopJoy);

// Find a walkable waypoint around the nearest blocking building.
function waypointAround(c,target){
 const dx=target.x-c.x,dy=target.y-c.y,len=Math.hypot(dx,dy)||1;
 const ax=c.x+dx/len*30,ay=c.y+dy/len*30;
 if(!blocked(ax,ay,10))return {x:target.x,y:target.y};
 let b=buildings.find(b=>ax+10>b.x&&ax-10<b.x+b.w&&ay+10>b.y&&ay-10<b.y+b.h);
 if(!b)return {x:target.x,y:target.y};
 const pad=22;
 const options=[
  {x:b.x-pad,y:b.y-pad},{x:b.x+b.w+pad,y:b.y-pad},
  {x:b.x-pad,y:b.y+b.h+pad},{x:b.x+b.w+pad,y:b.y+b.h+pad},
  {x:b.x+b.w/2,y:b.y-pad},{x:b.x+b.w/2,y:b.y+b.h+pad},
  {x:b.x-pad,y:b.y+b.h/2},{x:b.x+b.w+pad,y:b.y+b.h/2}
 ].filter(p=>!blocked(p.x,p.y,9));
 options.sort((a,b)=>dist(a,c)+dist(a,target)-dist(b,c)-dist(b,target));
 return options[0]||{x:c.x,y:c.y};
}
function spawnCop(){
 let p=roadPoint();
 const c={...p,alive:true,mode:'car',speed:235,vehicle:{x:p.x,y:p.y,angle:p.angle,color:'#234e7c',speed:0,police:true},replan:0,wp:null};
 cops.push(c);cars.push(c.vehicle);c.vehicle.owner=c;
}
function arrest(){
 arrested=true;car=null;wanted=0;crime=0;player.hp=player.maxHp;
 player.money=Math.max(0,player.money-60);
 player.x=prison.x+prison.w/2;player.y=prison.y+prison.h/2;
 for(const c of cops){if(c.vehicle)c.vehicle.speed=0;c.alive=false}
 say('ТЕБЯ АРЕСТОВАЛИ! Найди выход из тюрьмы.');
}
function update(dt){
 if(won)return;
 if(arrested){
  let ix=joy.x,iy=joy.y;
  if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
  if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  let l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
  moveObj(player,ix*player.speed*.7*dt,iy*player.speed*.7*dt,9);
  // The prison gate is the escape point.
  if(Math.hypot(player.x-prison.gateX,player.y-prison.gateY)<28){
   $('hint').textContent='Подсказка: нажми ДЕЙСТВИЕ у ворот, чтобы сбежать.';
  }else $('hint').textContent='ТЮРЬМА: найди ворота внизу ограды. Джойстик — движение.';
  return;
 }
 let ix=joy.x,iy=joy.y;
 if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
 if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
 let l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
 if(car){
  if(l>.05){car.angle=Math.atan2(iy,ix);car.speed=220*(car.boost>0?1.4:1)}
  else car.speed*=.9;
  let nx=car.x+Math.cos(car.angle)*car.speed*dt,ny=car.y+Math.sin(car.angle)*car.speed*dt;
  if(!blocked(nx,ny,15)){car.x=nx;car.y=ny}else car.speed=0;
  player.x=car.x;player.y=car.y;if(car.boost>0)car.boost-=dt;
 }else if(l>.05){player.angle=Math.atan2(iy,ix);moveObj(player,ix*player.speed*dt,iy*player.speed*dt,9)}
 // Civilians wander and run from nearby trouble.
 for(const p of people)if(p.alive){
  if(wanted>0&&dist(p,player)<90){p.angle=Math.atan2(p.y-player.y,p.x-player.x);p.panic=2}
  p.panic=Math.max(0,p.panic-dt);
  if(p.panic>0)moveObj(p,Math.cos(p.angle)*90*dt,Math.sin(p.angle)*90*dt,7);
  else{p.turn-=dt;if(p.turn<=0){p.angle=rand()*Math.PI*2;p.turn=2+rand()*4}moveObj(p,Math.cos(p.angle)*17*dt,Math.sin(p.angle)*17*dt,7)}
 }
 // Police vehicles arrive when wanted rises.
 if(wanted>0&&cops.filter(c=>c.alive).length<wanted+1&&rand()<dt*.22)spawnCop();
 for(const c of cops)if(c.alive){
  const target=car||player;
  const d=dist(c,target);
  if(c.mode==='car'){
   const v=c.vehicle;
   // Drive toward a safe waypoint instead of pushing into a building.
   c.replan-=dt;
   if(c.replan<=0){c.wp=waypointAround(v,target);c.replan=.45}
   let a=Math.atan2(c.wp.y-v.y,c.wp.x-v.x);
   v.angle=a;
   const speed=260+wanted*10;
   let nx=v.x+Math.cos(a)*speed*dt,ny=v.y+Math.sin(a)*speed*dt;
   if(!blocked(nx,ny,15)){v.x=nx;v.y=ny}
   else{
    c.replan=0;
    const around=waypointAround(v,target);
    v.angle=Math.atan2(around.y-v.y,around.x-v.x);
    // Small sideways avoidance helps free the patrol car.
    const side=v.angle+Math.PI/2;
    if(!blocked(v.x+Math.cos(side)*70*dt,v.y+Math.sin(side)*70*dt,15)){
     v.x+=Math.cos(side)*70*dt;v.y+=Math.sin(side)*70*dt;
    }
   }
   c.x=v.x;c.y=v.y;
   // Police stop nearby and get out to arrest the player.
   if(d<95){
    c.mode='foot';c.x=v.x+25;c.y=v.y+18;
    if(!blocked(c.x,c.y,8)){c.vehicle.x=-500;c.vehicle.y=-500}
    else{c.x=v.x-25;c.y=v.y-18}
    say('Полицейский выходит из машины!');
   }
  }else{
   // Foot officers also steer around walls.
   c.replan-=dt;
   if(c.replan<=0){c.wp=waypointAround(c,target);c.replan=.3}
   const a=Math.atan2(c.wp.y-c.y,c.wp.x-c.x);
   moveObj(c,Math.cos(a)*(115+wanted*8)*dt,Math.sin(a)*(115+wanted*8)*dt,8);
   if(d<23){arrest();return}
  }
 }
 // Remove dead officers and their vehicles from the world.
 for(let i=cops.length-1;i>=0;i--){
  const c=cops[i];
  if(!c.alive){if(c.vehicle){let k=cars.indexOf(c.vehicle);if(k>=0)cars.splice(k,1)}cops.splice(i,1)}
 }
}
function drawPerson(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);
 ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(2,5,10,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f4c79b';ctx.beginPath();ctx.arc(0,-4,6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=p.color||'#54d96d';ctx.fillRect(-7,1,14,13);
 ctx.fillStyle='#252d36';ctx.fillRect(-6,12,5,7);ctx.fillRect(2,12,5,7);ctx.restore();
}
function drawCar(c){
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
 ctx.fillStyle='#0007';ctx.fillRect(-18,-10,40,24);
 ctx.fillStyle=c.police?'#234e7c':c.color;ctx.fillRect(-20,-9,40,18);
 ctx.fillStyle='#18242e';ctx.fillRect(-7,-7,14,14);
 if(c.police){ctx.fillStyle='#ff4141';ctx.fillRect(-4,-11,7,4);ctx.fillStyle='#59a7ff';ctx.fillRect(3,-11,7,4)}
 else{ctx.fillStyle='#fff3ad';ctx.fillRect(16,-7,4,5);ctx.fillRect(16,2,4,5)}
 ctx.fillStyle='#222';ctx.fillRect(-13,-12,9,4);ctx.fillRect(7,-12,9,4);ctx.fillRect(-13,8,9,4);ctx.fillRect(7,8,9,4);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const target=car||player;
 cam.x=clamp(target.x-W/2,0,world.w-W);cam.y=clamp(target.y-H/2,0,world.h-H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#34483d';ctx.fillRect(0,0,world.w,world.h);
 ctx.fillStyle='#343a40';
 for(const x of roadsX)ctx.fillRect(x-48,0,96,world.h);
 for(const y of roadsY)ctx.fillRect(0,y-48,world.w,96);
 ctx.strokeStyle='#c6b779';ctx.lineWidth=2;ctx.setLineDash([20,18]);
 for(const x of roadsX){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(const y of roadsY){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 ctx.setLineDash([]);
 for(const b of buildings){
  ctx.fillStyle='#0005';ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
  ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#252f38';
  for(let x=b.x+12;x<b.x+b.w-8;x+=22)for(let y=b.y+20;y<b.y+b.h-8;y+=24)ctx.fillRect(x,y,8,7);
 }
 // Prison yard and fence, visible as a distinct location.
 ctx.fillStyle='#6c777a';ctx.fillRect(prison.x,prison.y,prison.w,prison.h);
 ctx.fillStyle='#48545a';ctx.fillRect(prison.x+25,prison.y+25,prison.w-50,prison.h-50);
 ctx.strokeStyle='#d7dce0';ctx.lineWidth=5;ctx.strokeRect(prison.x,prison.y,prison.w,prison.h);
 // Gate opening.
 ctx.strokeStyle='#6c777a';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(prison.gateX-24,prison.gateY);ctx.lineTo(prison.gateX+24,prison.gateY);ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.fillText('ТЮРЬМА',prison.x+135,prison.y+18);
 ctx.fillStyle='#252d33';ctx.fillRect(prison.x+100,prison.y+75,200,90);
 ctx.fillStyle='#aab8c0';ctx.fillRect(prison.x+115,prison.y+85,170,5);
 ctx.fillStyle='#4cfa85';ctx.fillRect(store.x-20,store.y-20,40,40);
 ctx.fillStyle='#143b25';ctx.font='bold 22px Arial';ctx.fillText('$',store.x-7,store.y+8);
 ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.fillText('МАГАЗИН',store.x-35,store.y-28);
 ctx.strokeStyle='#ffe34d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(job.x,job.y,25+Math.sin(Date.now()/180)*5,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#ffe34d';ctx.font='bold 16px Arial';ctx.fillText('$35',job.x-17,job.y-37);
 for(const p of people)if(p.alive)drawPerson(p);
 for(const c of cars)if(c.x>-100&&c.y>-100)drawCar(c);
 for(const c of cops)if(c.alive&&c.mode==='foot')drawPerson({...c,color:'#65a9ff'});
 if(!car)drawPerson({...player,color:'#54ff79'});
 else{ctx.fillStyle='#ffd2a0';ctx.beginPath();ctx.arc(car.x,car.y,5,0,Math.PI*2);ctx.fill()}
 ctx.restore();
 mc.clearRect(0,0,224,168);mc.fillStyle='#34483d';mc.fillRect(0,0,224,168);
 mc.fillStyle='#343a40';for(const x of roadsX)mc.fillRect(x/world.w*224-3,0,6,168);for(const y of roadsY)mc.fillRect(0,y/world.h*168-3,224,6);
 mc.fillStyle='#68727a';for(const b of buildings)mc.fillRect(b.x/world.w*224,b.y/world.h*168,b.w/world.w*224,b.h/world.h*168);
 mc.fillStyle='#aab1b8';mc.fillRect(prison.x/world.w*224,prison.y/world.h*168,prison.w/world.w*224,prison.h/world.h*168);
 mc.fillStyle='#4cfa85';mc.fillRect(store.x/world.w*224-3,store.y/world.h*168-3,6,6);
 mc.fillStyle='#ffe34d';mc.fillRect(job.x/world.w*224-3,job.y/world.h*168-3,6,6);
 mc.fillStyle='#ff9e9e';for(const p of people)if(p.alive)mc.fillRect(p.x/world.w*224-1,p.y/world.h*168-1,2,2);
 mc.fillStyle='#60b4ff';for(const c of cops)if(c.alive)mc.fillRect(c.x/world.w*224-2,c.y/world.h*168-2,4,4);
 mc.fillStyle='white';mc.beginPath();mc.arc(target.x/world.w*224,target.y/world.h*168,4,0,Math.PI*2);mc.fill();
 $('stats').innerHTML=`💵 $${player.money} · ❤️ ${Math.ceil(player.hp)} · 🔫 ${player.ammo}<br>🚨 <span style="color:#ffce62">${stars()}</span> · ${car?'🚗 Машина':'🚶 Пешком'}`;
 if(won)$('hint').textContent='🏆 ПОБЕДА! Пять звёзд розыска достигнуты.';
 else if(arrested)$('hint').textContent='ТЮРЬМА: найди ворота внизу ограды и нажми ДЕЙСТВИЕ.';
 else $('hint').textContent='Зелёный — магазин. Жёлтый — задание. E — машина, F — магазин, пробел — действие.';
 requestAnimationFrame(draw);
}
let last=performance.now();
function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;update(dt);requestAnimationFrame(loop)}
requestAnimationFrame(draw);requestAnimationFrame(loop);
})();
