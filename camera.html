<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>● REC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    color: #fff;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* фейковая картинка с камеры — чёрный шум */
  #feed {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 40%, #1a1a1a 0%, #000 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
    filter: contrast(1.1) brightness(0.9);
  }
  #feed::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0 2px, transparent 2px 4px);
    animation: scan 6s linear infinite;
  }
  @keyframes scan {
    from { background-position: 0 0; }
    to { background-position: 0 100vh; }
  }

  /* верхний HUD */
  .hud-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    letter-spacing: 1px;
    z-index: 5;
  }
  .rec {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ff2a2a;
    font-weight: 700;
  }
  .rec .dot {
    width: 12px; height: 12px;
    background: #ff2a2a;
    border-radius: 50%;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 10px #ff2a2a;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .timer { color: #fff; font-variant-numeric: tabular-nums; }
  .cam-id { color: #888; font-size: 11px; }

  /* нижний HUD */
  .hud-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 22px 34px;
    text-align: center;
    z-index: 5;
  }
  .status {
    font-size: 13px;
    color: #ff8080;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 11px;
    color: #666;
    letter-spacing: 1px;
  }

  /* рамки-уголки */
  .corner {
    position: absolute;
    width: 32px; height: 32px;
    border: 2px solid rgba(255,255,255,0.25);
    z-index: 4;
  }
  .corner.tl { top: 70px; left: 22px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 70px; right: 22px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 90px; left: 22px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 90px; right: 22px; border-left: 0; border-top: 0; }

  /* финальный экран */
  #final {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #final.show { display: flex; opacity: 1; }
  .card {
    max-width: 360px;
    width: 100%;
    border: 1px solid #ff2a2a;
    padding: 28px 22px;
    background: rgba(255,42,42,0.05);
    box-shadow: 0 0 40px rgba(255,42,42,0.3);
  }
  .card .icon {
    font-size: 52px;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 12px #ff2a2a);
  }
  .card h1 {
    color: #ff2a2a;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .card p {
    color: #ccc;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .card .meta {
    color: #ff8080;
    font-size: 12px;
    margin: 14px 0 6px;
    letter-spacing: 1px;
  }
  .card .stamp {
    display: inline-block;
    background: #ff2a2a;
    color: #fff;
    padding: 7px 16px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.5px;
    margin-top: 16px;
  }

  /* звуковая волна */
  .wave {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 30px;
    z-index: 5;
  }
  .wave span {
    width: 3px;
    background: #ff2a2a;
    opacity: 0.7;
    animation: pulse 0.9s ease-in-out infinite;
  }
  .wave span:nth-child(1) { animation-delay: 0s; }
  .wave span:nth-child(2) { animation-delay: 0.1s; }
  .wave span:nth-child(3) { animation-delay: 0.2s; }
  .wave span:nth-child(4) { animation-delay: 0.3s; }
  .wave span:nth-child(5) { animation-delay: 0.4s; }
  .wave span:nth-child(6) { animation-delay: 0.5s; }
  .wave span:nth-child(7) { animation-delay: 0.4s; }
  .wave span:nth-child(8) { animation-delay: 0.3s; }
  .wave span:nth-child(9) { animation-delay: 0.2s; }
  .wave span:nth-child(10) { animation-delay: 0.1s; }
  @keyframes pulse {
    0%, 100% { height: 6px; }
    50% { height: 26px; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="feed"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="hud-top">
      <div class="rec"><span class="dot"></span> REC</div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <div class="wave">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="hud-bottom">
      <div class="status">Камера активирована</div>
      <div class="sub" id="substatus">Запись видео · канал 1 · 1080p</div>
    </div>
  </div>

  <div id="final">
    <div class="card">
      <div class="icon">📹</div>
      <h1>Запись завершена</h1>
      <p>Видеофайл сформирован и передан на удалённый сервер.</p>
      <div class="meta">Длительность: 8 сек · Размер: 14.7 MB</div>
      <div class="meta">Получатель: заказчик №4***</div>
      <span class="stamp">ВАШЕ ВИДЕО ОТПРАВЛЕНО</span>
    </div>
  </div>

  <script>
    const timerEl = document.getElementById('timer');
    const subEl = document.getElementById('substatus');
    const finalEl = document.getElementById('final');

    // таймер записи
    let t = 0;
    const interval = setInterval(() => {
      t++;
      const m = String(Math.floor(t / 60)).padStart(2, '0');
      const s = String(t % 60).padStart(2, '0');
      timerEl.textContent = m + ':' + s;
    }, 1000);

    // смена подписи внизу
    const captions = [
      'Запись видео · канал 1 · 1080p',
      'Запись видео · канал 1 · 1080p',
      'Захват аудио · микрофон активен',
      'Захват аудио · микрофон активен',
      'Передача потока · шифрование AES-256',
      'Передача потока · шифрование AES-256',
      'Сохранение фрагментов · 40%',
      'Сохранение фрагментов · 100%'
    ];
    let ci = 0;
    setInterval(() => {
      ci = (ci + 1) % captions.length;
      subEl.textContent = captions[ci];
    }, 1500);

    // финал через 8 секунд
    setTimeout(() => {
      clearInterval(interval);
      finalEl.classList.add('show');
    }, 8000);
  </script>
</body>
</html>
